      - "/_health (app/handlers/common.go) runs dbx.Ping() and answers {\"status\":\"Healthy\"} — a 200 proves the PostgreSQL connection. /signup (single-host mode, no tenant yet) dispatches query.GetFirstTenant against the tenants table and renders the sign-up page."
      - "Campaign 2026-09-18: replaces pgweb (repo-090) in eu-west-1 after pgweb's Dockerfile `COPY .git/ .` failed against the tarball source (DEPLOY-031); pgweb itself replaced outline (repo-016)."
