    notes:
      - "Go single binary; the Dockerfile ENTRYPOINT binds 0.0.0.0:8081 (EXPOSE 8081). Reads DATABASE_URL (pkg/command/options.go:88, PGWEB_DATABASE_URL first) and connects BEFORE it listens (pkg/cli/cli.go:58-72, --open-retry 0): an unreachable database exits the process. lib/pq honours sslmode=require without CA verification. No migrations, no required env."
