    - {path: docker/docker-compose.yml, line: 55, quote: "AUTH_JWT_SECRET: ${JWT_SECRET}"}
    - {path: docker/docker-compose.yml, line: 42, quote: "PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}"}
    - {path: apps/studio/lib/api/self-hosted/constants.ts, line: 7, quote: "process.env.PG_META_CRYPTO_KEY || 'SAMPLE_KEY'"}
    - {path: apps/studio/lib/api/self-hosted/constants.ts, line: 20, quote: "process.env.AUTH_JWT_SECRET || DEFAULT_AUTH_JWT_SECRET"}
    - {path: apps/studio/.env, line: 4, quote: "POSTGRES_PASSWORD=your-super-secret-and-long-postgres-password"}
blockers:
  expected:
    - "Studio needs the separate postgres-meta service (STUDIO_PG_META_URL) and a Supabase Postgres plus gateway; Deployz runs one application container."
    - "The self-host stack (docker/docker-compose.yml) has many required service containers (gateway, auth, rest, realtime, storage, meta, functions, db, supavisor); none is part of this one image."
  mustNot:
    - "Do not report a missing Dockerfile: apps/studio/Dockerfile builds from source."
    - "Do not require Redis or a worker: Studio has none."
    - "Do not report the docs, www or examples apps as separate required services."
vendorQuestions:
  legitimate:
    - "Where does postgres-meta run, and which gateway and Supabase Postgres does Studio use? Deployz cannot host them."
  unnecessary:
    - "Which port? (3000 in the image)"
    - "Health path? (/api/platform/profile)"
    - "Which Dockerfile? (apps/studio/Dockerfile; the last stage production is built by default)"
    - "Who runs migrations? (Studio has none)"
traps:
  - "docker/docker-compose.yml suggests a stack to deploy -> it is the multi-container self-host platform, not one app (docker/docker-compose.yml:13)"
  - "compose uses the prebuilt image supabase/studio -> the repo Dockerfile builds the same app from source (docker/docker-compose.yml:17, apps/studio/Dockerfile:94)"
  - "ARG STUDIO_FRAMEWORK=next selects the build -> default next is correct; tanstack is an alternative build (apps/studio/Dockerfile:18)"
  - "ENTRYPOINT docker-entrypoint.sh -> the entrypoint of the node base image, found on PATH; apps/studio/docker-entrypoint.sh is not copied (apps/studio/Dockerfile:100)"
  - "dev stage (line 55) is not the last stage -> production is the last stage (apps/studio/Dockerfile:94), so no --target is needed; the usage comment still names --target production"
  - "apps/studio/.env holds demo keys and a localhost PG meta URL -> build defaults only, not production values (apps/studio/.env:3)"
  - "Dashboard login (DASHBOARD_USERNAME) is enforced by the Envoy or Kong gateway, not by Studio -> Studio alone has no login (docker/docker-compose.yml:105)"
openQuestions:
  - "Whether a vendor would accept a Studio-only deploy pointed at an outside postgres-meta; the outcome keeps NOT_DEPLOYABLE because the required service is not in the repo image."
crossReview:
  - {field: dockerfile.target, change: "production -> null; production (line 94) is the last FROM, so a plain build gives it. The usage comment still names --target production, which is harmless", evidence: "apps/studio/Dockerfile:94 FROM base AS production; stages at lines 20, 40, 46, 55, 62, 75, 91, 94"}
  - {field: env.required HOSTNAME, change: "moved to optional; Next standalone reads HOSTNAME, and Docker or Fargate always sets it to the container hostname, which resolves to the task IP, so the load balancer reaches the server. Compose sets 0.0.0.0 only so the localhost in-container health check works", evidence: "docker/docker-compose.yml:30-31 comment 'Listen on all IPv4 interfaces'; apps/studio/Dockerfile:101 health check uses localhost"}
  - {field: database, change: "none: status required and deployzEngine null kept. Studio opens no database socket (no pg import in apps/studio/lib or pages; POSTGRES_* only feed the connection sent to postgres-meta), and the scorer expects no provisioned database when deployzEngine is null. Added a comment that null is deliberate", evidence: "apps/studio/lib/api/self-hosted/constants.ts:8-12; docker/docker-compose.yml:33"}
  - {field: traps / vendorQuestions, change: "reworded the dev-stage trap and the Dockerfile question to match target null", evidence: "apps/studio/Dockerfile:55,94"}
  - {field: healthPath, change: "none: /api/platform/profile returns 200 with no auth in self-host mode; apiWrapper checks auth only when IS_PLATFORM is true", evidence: "apps/studio/lib/api/apiWrapper.ts:42; apps/studio/lib/constants/index.ts:5; apps/studio/pages/api/platform/profile/index.ts:38"}
  - {field: outcome / dockerfile.accept / port / startCommand, change: "none: NOT_DEPLOYABLE kept (postgres-meta is a required second container); all COPY sources are in git (patches/react-data-grid.patch tracked, apps/studio/.env tracked, docker-entrypoint.sh comes from the node base image); lite-studio and other Dockerfiles are not Supabase Studio", evidence: "apps/studio/Dockerfile:41-49,98-102"}
  - {field: all, change: verified, evidence: "28 citations checked"}
  - {field: outcome (orchestrator), change: "[NOT_DEPLOYABLE] -> [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES], the same policy reading as new-45 and new-47", evidence: "packages/analysis/src/readiness-report.ts FIX_CLASSES (unsupported-multi-service is CODE_CHANGE)"}
