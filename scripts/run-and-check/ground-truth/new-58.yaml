id: new-58
repository: supabase/supabase
commit: 564d724ed79adc62e0e571881e898663b00d1f43
summary: >
  Supabase monorepo (pnpm, turbo). The only app Dockerfile that builds from source is apps/studio/Dockerfile, the
  Studio dashboard (Next.js standalone, port 3000). Studio is a UI only. It has no database of its own. It calls a
  separate postgres-meta service (STUDIO_PG_META_URL), a gateway (Envoy or Kong) and a Supabase Postgres image. The
  official self-host stack is a docker/docker-compose.yml of about ten containers. A vendor who imports this repo
  gets a dashboard that cannot work alone.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  # judgement call: NOT_DEPLOYABLE is primary (Studio needs postgres-meta and the Supabase stack as other containers). DEPLOYABLE_WITH_CHANGES is accepted as the alternative reading under the Deployz readiness policy, which classes extra compose services as a repository change (the gate still blocks the deployment).
  reason: >
    Studio needs a second required service container (supabase/postgres-meta) plus the gateway, auth and
    Supabase Postgres (roles, extensions and schemas that RDS does not give). Deployz runs one application
    container, so the dashboard starts but every database feature fails. The full platform is a multi-container compose stack.
dockerfile:
  accept: [apps/studio/Dockerfile]
  reject:
    - {path: apps/lite-studio/Dockerfile, reason: "separate small app (npm ci, package-lock.json), not the Supabase dashboard"}
    - {path: packages/pg-meta/test/db/Dockerfile, reason: "test database image for pg-meta tests"}
    - {path: .agents/skills/test-the-docs/sandbox/Dockerfile, reason: "agent sandbox tooling"}
  target: null
  context: .
  evidence:
    - {path: apps/studio/Dockerfile, line: 4, quote: "docker build . -f apps/studio/Dockerfile --target production"}
    - {path: apps/studio/Dockerfile, line: 94, quote: "FROM base AS production"}
    - {path: apps/studio/Dockerfile, line: 43, quote: "pnpm dlx turbo@2.9.14 prune studio --docker"}
    - {path: apps/studio/Dockerfile, line: 49, quote: "COPY ./patches/ ./patches"}
runtime: {accept: [node]}
port:
  accept: [3000]
  evidence:
    - {path: apps/studio/Dockerfile, line: 98, quote: "ENV PORT=3000"}
    - {path: apps/studio/Dockerfile, line: 99, quote: "EXPOSE 3000"}
startCommand:
  source: image
  accept: ["node apps/studio/server.js"]
healthPath:
  accept: ["/api/platform/profile"]
  # The Dockerfile and the compose file use this path as the health check. It returns 200 JSON without a login in self-host mode.
  # "/" redirects to the project page, so it is not a safe health path.
  evidence:
    - {path: apps/studio/Dockerfile, line: 101, quote: "fetch('http://localhost:3000/api/platform/profile')"}
    - {path: docker/docker-compose.yml, line: 23, quote: "http://localhost:3000/api/platform/profile"}
    - {path: apps/studio/pages/api/platform/profile/index.ts, line: 38, quote: "return res.status(200).json(response)"}
database:
  status: required
  engines: [postgres]
  default: postgres
  deployzEngine: null
  selectBy: {}
  # Studio has no database connection of its own. It reaches Supabase Postgres only through postgres-meta over HTTP.
  # deployzEngine is null on purpose: a correct analysis provisions no RDS database, because the Studio process never opens a database socket.
  # The Postgres must be the supabase/postgres image (supabase_admin and other roles), which RDS cannot give.
  connectionVars: [STUDIO_PG_META_URL, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_PASSWORD]
  evidence:
    - {path: apps/studio/lib/constants/index.ts, line: 50, quote: "process.env.STUDIO_PG_META_URL"}
    - {path: docker/docker-compose.yml, line: 33, quote: "STUDIO_PG_META_URL: http://meta:8080"}
    - {path: docker/docker-compose.yml, line: 419, quote: "image: supabase/postgres-meta:v0.100.0"}
    - {path: docker/docker-compose.yml, line: 480, quote: "image: supabase/postgres:17.6.1.136"}
    - {path: apps/studio/lib/api/self-hosted/constants.ts, line: 12, quote: "process.env.POSTGRES_USER_READ_WRITE || 'supabase_admin'"}
