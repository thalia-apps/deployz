env:
  required:
    - {name: STUDIO_PG_META_URL, secret: false, buildTime: false, note: "URL of a postgres-meta service; Deployz cannot run it, so this must point to an outside host"}
    - {name: POSTGRES_PASSWORD, secret: true, buildTime: false, note: "password of the Supabase Postgres; used for pg-meta calls and SQL"}
    - {name: SUPABASE_URL, secret: false, buildTime: false, note: "internal URL of the API gateway"}
    - {name: SUPABASE_PUBLIC_URL, secret: false, buildTime: false, note: "public URL of the API gateway"}
    - {name: SUPABASE_ANON_KEY, secret: true, buildTime: false, note: "anon JWT; the repo .env holds a demo key that must not be used"}
    - {name: SUPABASE_SERVICE_KEY, secret: true, buildTime: false, note: "service_role JWT"}
    - {name: AUTH_JWT_SECRET, secret: true, buildTime: false, note: "JWT secret; the code falls back to a public default"}
    - {name: PG_META_CRYPTO_KEY, secret: true, buildTime: false, note: "encryption key shared with postgres-meta; falls back to SAMPLE_KEY"}
  optional: [HOSTNAME, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER_READ_WRITE, PGRST_DB_SCHEMAS, PGRST_DB_MAX_ROWS, PGRST_DB_EXTRA_SEARCH_PATH, DEFAULT_ORGANIZATION_NAME, DEFAULT_PROJECT_NAME, OPENAI_API_KEY, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY, SNIPPETS_MANAGEMENT_FOLDER, EDGE_FUNCTIONS_MANAGEMENT_FOLDER, ENABLED_FEATURES_LOGS_ALL, NEXT_PUBLIC_BASE_PATH]
  buildTime: []
  evidence:
