id: new-220
repository: Chocobozzz/PeerTube
commit: 6b3fcdcf8a704ea1215fd106435eaa63e881dde1
summary: >
  PeerTube is a federated video platform: a Node.js (TypeScript, Express) server plus an Angular client, with ffmpeg
  transcoding inside the server process. support/docker/production/Dockerfile builds the whole application from the
  repository source into one image that serves the API, the client and video files on port 9000. PostgreSQL (with the
  pg_trgm and unaccent extensions) and Redis are required. By default all video files are written to the local /data
  volume; object storage (S3) can hold videos, captions, images and torrents when enabled by environment variables. The
  RTMP live-streaming server on port 1935 is off by default.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    The production Dockerfile, PostgreSQL, Redis and the web port all fit the MVP, and migrations run at start. The open
    point is storage. Without object storage, every video, thumbnail and avatar is written to /data, which Fargate does
    not keep, so S3 must be enabled (PEERTUBE_OBJECT_STORAGE_*). The upstream default expects public-read object ACLs and
    a publicly readable bucket (or a CDN base_url) for public videos, which the single private Deployz bucket may not
    give. Uploads and transcoding also use /data/tmp on local disk, so a task stop loses jobs in progress. RTMP live
    streaming (raw TCP 1935) cannot run behind the HTTPS-only ALB; it is disabled unless live.enabled is set, so it is
    a disabled feature and not a blocker. DEPLOYABLE_WITH_CHANGES applies when S3 is used with settings only;
    NOT_DEPLOYABLE applies if the private bucket cannot serve public video files.
dockerfile:
  accept: [support/docker/production/Dockerfile]
  reject:
    - {path: support/docker/production/Dockerfile.nginx, reason: "optional nginx reverse proxy image (nginx:alpine plus an entrypoint); not the application"}
    - {path: support/docker/gitpod/Dockerfile, reason: "Gitpod development environment image"}
  target: null
  context: .
  evidence:
    - {path: support/docker/production/Dockerfile, line: 1, quote: "FROM node:22-trixie-slim"}
    - {path: support/docker/production/Dockerfile, line: 27, quote: "COPY --chown=peertube:peertube . /app"}
    - {path: support/docker/production/Dockerfile, line: 35, quote: "&& npm run build; \\"}
    - {path: support/docker/production/Dockerfile.nginx, line: 1, quote: "FROM nginx:alpine"}
runtime: {accept: [node]}
