database:
  status: required
  engines: [mysql, postgres]
  default: mysql
  deployzEngine: postgres
  selectBy: {KIWI_DB_ENGINE: django.db.backends.postgresql, KIWI_DB_HOST: "<host>", KIWI_DB_PORT: "5432", KIWI_DB_NAME: "<db>", KIWI_DB_USER: "<user>", KIWI_DB_PASSWORD: "<password>"}
  connectionVars: [KIWI_DB_ENGINE, KIWI_DB_HOST, KIWI_DB_PORT, KIWI_DB_NAME, KIWI_DB_USER, KIWI_DB_PASSWORD]
  evidence:
    - {path: tcms/settings/common.py, line: 30, quote: "\"ENGINE\": get_secret(\"KIWI_DB_ENGINE\", \"django.db.backends.mysql\"),"}
    - {path: tcms/settings/common.py, line: 34, quote: "\"HOST\": get_secret(\"KIWI_DB_HOST\", \"\"),"}
    - {path: docker-compose.postgres, line: 25, quote: "KIWI_DB_ENGINE: django.db.backends.postgresql"}
