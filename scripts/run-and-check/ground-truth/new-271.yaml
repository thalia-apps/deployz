  # 8443 is the TLS listener that serves the application; 8080 only redirects to https.
  evidence:
    - {path: Dockerfile, line: 48, quote: "EXPOSE 8080"}
    - {path: Dockerfile, line: 49, quote: "EXPOSE 8443"}
    - {path: etc/nginx.conf, line: 74, quote: "return 301 https://$host$request_uri;"}
    - {path: etc/nginx.conf, line: 79, quote: "listen       8443 ssl;"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: etc/nginx.conf, line: 69, quote: "listen       8080;"}
    - {path: etc/nginx.conf, line: 79, quote: "listen       8443 ssl;"}
startCommand:
