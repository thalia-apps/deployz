id: new-271
repository: kiwitcms/Kiwi
commit: a4f43aa6436e1c67036b2db5eadc7dc6c16a59a1
summary: >
  Kiwi TCMS is an open-source test case management system (Django, Python 3.12, a webpack bundle). The root Dockerfile
  builds the package from source (webpack bundle, python sdist, pip install), then the `kiwitcms` stage generates a
  self-signed certificate, runs collectstatic and starts /httpd-foreground. That script starts nginx in the background
  (daemon on) and then uWSGI in the foreground. nginx listens on 8080 (a 301 redirect to https) and on 8443 with TLS, and
  it alone serves /static/ and, through X-Accel, the uploaded files. uWSGI listens on a unix socket only. The database
  is MariaDB/MySQL by default; KIWI_DB_ENGINE selects PostgreSQL. Uploads go to /Kiwi/uploads on local disk with no S3
  option. The first setup is the command `manage.py initial_setup`. SECRET_KEY is a constant committed in the settings.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    The application fits in shape (one web service, PostgreSQL, no Redis). But the image runs two long-running servers
    from one start script (nginx in the background and uWSGI), the only HTTP listeners are an nginx redirect on 8080 and
    TLS with a self-signed certificate on 8443, uWSGI has no HTTP port, and static files exist only behind nginx. A
    Deployz load balancer needs plain HTTP on one container port. The vendor must change the image to serve HTTP from a
    single process (uWSGI with an http port and static file serving) and move the hard-coded SECRET_KEY to an
    environment variable; attachments stay on local disk because the storage backend is the file system only. This is
    a repository change (DEPLOYABLE_WITH_CHANGES); a strict read of the several-servers and local-disk non-goals gives
    NOT_DEPLOYABLE.
dockerfile:
  accept: [Dockerfile]
  reject: []
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 25, quote: "COPY . /Kiwi/"}
    - {path: Dockerfile, line: 44, quote: "FROM runtime-base AS kiwitcms"}
    - {path: Dockerfile, line: 52, quote: "CMD /httpd-foreground"}
    - {path: Dockerfile, line: 80, quote: "RUN /Kiwi/manage.py collectstatic --noinput --link && \\"}
runtime: {accept: [python]}
port:
