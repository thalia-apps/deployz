    - {path: tcms/settings/common.py, line: 32, quote: "\"USER\": get_secret(\"KIWI_DB_USER\", \"kiwi\"),"}
    - {path: tcms/settings/common.py, line: 33, quote: "\"PASSWORD\": get_secret(\"KIWI_DB_PASSWORD\", \"kiwi\"),"}
    - {path: tcms/settings/common.py, line: 35, quote: "\"PORT\": get_secret(\"KIWI_DB_PORT\", \"\"),"}
blockers:
  expected:
    - "The start script runs nginx in the background and uWSGI in the foreground: two long-running servers in one image (httpd-foreground:12,14)"
    - "No plain-HTTP application listener: port 8080 only redirects to https and port 8443 uses a self-signed certificate; uWSGI listens on a unix socket (etc/nginx.conf:74,79; etc/uwsgi.conf:6)"
    - "Static files are served only by nginx (location /static/), so uWSGI alone returns no CSS or JavaScript (etc/nginx.conf:101-103)"
    - "SECRET_KEY is a constant in tcms/settings/common.py; a different value needs a settings file in the image (tcms/settings/common.py:24)"
    - "Attachments are stored on local disk with no S3 option (tcms/settings/common.py:283)"
  mustNot:
    - "MariaDB must not block: KIWI_DB_ENGINE selects PostgreSQL and requirements/postgres.txt is installed in the image"
    - "Redis must not be required: the cache is local memory"
    - "docker-compose.yml (mariadb, web, a test-only nginx proxy) must not be read as an application with several services"
vendorQuestions:
  legitimate:
    - "How is the first setup run? (manage.py initial_setup creates the schema, the super-user and the site; it needs input)"
    - "Which HTTP port and TLS mode should the image use behind the load balancer? (the stock image serves HTTPS with a self-signed certificate on 8443)"
    - "Are attachments used? (they stay on local disk and are lost with the task)"
  unnecessary:
    - "Which database? (PostgreSQL through KIWI_DB_ENGINE)"
    - "Is Redis needed? (no)"
traps:
  - "nginx is started with daemon on and not supervised; if it dies, the container keeps running on uWSGI alone (httpd-foreground:12, etc/nginx.conf:4)"
  - "The image HEALTHCHECK calls https://127.0.0.1:8443 with -k; a plain-HTTP probe on 8080 gets a 301 to https (Dockerfile:46, etc/nginx.conf:74)"
  - "manage.py is edited at build time with sed to use tcms.settings.product, so the repository file alone runs the devel settings (Dockerfile:31, :75)"
  - "The default database engine is MySQL and the default password is kiwi (tcms/settings/common.py:30,33)"
  - "The self-signed certificate is generated in the image, so every image has the same certificate (Dockerfile:67)"
openQuestions:
  - "Whether a Deployz target group with HTTPS to a self-signed certificate on 8443 would be accepted; the MVP scope names plain container ports, so the outcome treats it as a repository change"
crossReview:
  - {field: dockerfile, change: 'none: the root Dockerfile has a pkg-dist stage that exports sdist files and the final kiwitcms stage; the final stage is the last stage so no target is needed', evidence: 'Dockerfile:40-44'}
  - {field: port, change: 'none: 8080 is only a redirect, 8443 is the TLS listener that serves the app', evidence: 'etc/nginx.conf:69-79'}
  - {field: outcome, change: 'none: two accepted outcomes; two servers in one start script and a local upload directory are named MVP non-goals, while a vendor change to one HTTP uWSGI process is small', evidence: 'httpd-foreground:12-14; tcms/settings/common.py:173,283'}
  - {field: all, change: verified, evidence: 31 citations checked}
