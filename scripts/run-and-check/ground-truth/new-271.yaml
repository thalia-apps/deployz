  evidence:
    - {path: docs/source/installing_docker.rst, line: 118, quote: "docker exec -it kiwi_web /Kiwi/manage.py initial_setup"}
    - {path: httpd-foreground, line: 14, quote: "/venv/bin/uwsgi --ini /Kiwi/etc/uwsgi.conf"}
