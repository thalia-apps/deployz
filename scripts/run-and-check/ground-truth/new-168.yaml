  accept: [5005]
  evidence:
    - {path: Dockerfile, line: 46, quote: "EXPOSE 5005"}
    - {path: rasa/core/constants.py, line: 1, quote: "DEFAULT_SERVER_PORT = 5005"}
bindAllInterfaces:
