blockers:
  expected:
    - "The repo is the Rasa framework and CLI: no assistant project, no trained model, and the Dockerfile default command is `rasa --help`"
    - "The Dockerfile needs CI-built base images (IMAGE_BASE_NAME and hash build arguments)"
  mustNot:
    - "Port 5005 and the Sanic server must not make it a deployable app: the server needs a trained model that the repo does not provide"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (5005)"
traps:
  - "Dockerfile has EXPOSE 5005 and a real Python server behind it -> it is the framework image with CMD --help (Dockerfile:46-48)"
  - "FROM uses build arguments with no defaults -> a plain docker build fails (Dockerfile:2-6)"
  - "docker/ holds ten Dockerfile variants (spacy, mitie, base) -> CI image layers"
  - "examples/ and data/ hold sample assistants and test data, not a product (examples, data/)"
  - "Branch 3.6.x is a maintenance-mode release branch; the README points to Hello Rasa and CALM (README.md:17-19)"
crossReview:
