id: new-168
repository: RasaHQ/rasa
commit: 60a3cff9c08183760355b07bd60f5223d8916d6b
summary: >
  Rasa Open Source 3.6.x (maintenance mode) is a Python framework for building conversational assistants. The
  package `rasa` (poetry, CLI `rasa`) has a Sanic HTTP server (`rasa run`, default port 5005) but the server needs a
  trained model and the developer's own project (config, domain, data). The root Dockerfile is a release image: it
  needs registry base images selected by build arguments (IMAGE_BASE_NAME, BASE_IMAGE_HASH), installs the built
  wheel, uses ENTRYPOINT rasa and CMD --help, and contains no assistant project.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    A framework and CLI, not an application: there is no assistant, model or project in the repo to serve. The
    Dockerfile cannot build from the repo alone (the base image tags come from build arguments that CI sets) and
    its default command is `rasa --help`. Serving needs `rasa train` output and often a separate action server
    and a tracker store; the training step needs a vendor project.
dockerfile:
  accept: []
  reject:
    - {path: Dockerfile, reason: "framework release image: FROM ${IMAGE_BASE_NAME}:base-builder-${BASE_BUILDER_IMAGE_HASH} (CI-built base images), ENTRYPOINT rasa, CMD --help; holds no assistant project or model"}
    - {path: docker/Dockerfile.full, reason: "variant with MITIE data, same base-image arguments"}
    - {path: docker/Dockerfile.base, reason: "ubuntu base image for CI"}
    - {path: .devcontainer/Dockerfile, reason: "development container"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 6, quote: "FROM ${IMAGE_BASE_NAME}:base-builder-${BASE_BUILDER_IMAGE_HASH} as builder"}
    - {path: Dockerfile, line: 46, quote: "EXPOSE 5005"}
    - {path: Dockerfile, line: 47, quote: "ENTRYPOINT [\"rasa\"]"}
    - {path: Dockerfile, line: 48, quote: "CMD [\"--help\"]"}
    - {path: pyproject.toml, line: 231, quote: "rasa = \"rasa.__main__:main\""}
    - {path: README.md, line: 17, quote: "Note: Maintenance Mode"}
runtime: {accept: [python]}
