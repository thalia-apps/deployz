workers:
  status: embedded
  commands: []
  # Default WORKER_AND_APP runs API and worker as two node processes in one container; the worker talks to the API on 127.0.0.1.
  # Optional separate worker services run the same image with AP_CONTAINER_TYPE=WORKER (needs AP_FRONTEND_URL and AP_WORKER_TOKEN or AP_JWT_SECRET).
  evidence:
    - {path: docker-entrypoint.sh, line: 7, quote: "export AP_CONTAINER_TYPE=\"${AP_CONTAINER_TYPE:-WORKER_AND_APP}\""}
    - {path: docker-entrypoint.sh, line: 41, quote: "AP_CONTAINER_TYPE=APP node --enable-source-maps \"$APP_SCRIPT\" &"}
    - {path: docker-entrypoint.sh, line: 43, quote: "node --enable-source-maps \"$WORKER_SCRIPT\" &"}
    - {path: packages/server/worker/src/lib/config/configs.ts, line: 11, quote: "return `http://127.0.0.1:${port}/api/`"}
