    - {path: packages/server/api/src/app/database/postgres-connection.ts, line: 967, quote: "const url = system.get(AppSystemProp.POSTGRES_URL)"}
    - {path: packages/server/api/src/app/database/postgres-connection.ts, line: 980, quote: "const database = system.getOrThrow(AppSystemProp.POSTGRES_DATABASE)"}
