    - {path: packages/server/api/src/app/file/s3-helper.ts, line: 196, quote: "const useIRSA = system.getBoolean(AppSystemProp.S3_USE_IRSA)"}
    - {path: packages/server/api/src/app/file/s3-helper.ts, line: 213, quote: "if (!useIRSA) {"}
