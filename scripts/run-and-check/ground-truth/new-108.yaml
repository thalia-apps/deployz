id: new-108
repository: activepieces/activepieces
commit: 280f6bb396f1fa55aed9267ca022429fd138a461
summary: >
  Activepieces workflow automation (Node.js 24, Fastify API, React web app, bun/turbo monorepo). The root
  Dockerfile builds one image holding the API, the built web app (served by the API) and the worker. The entrypoint
  runs API and worker in one container by default (AP_CONTAINER_TYPE=WORKER_AND_APP). It needs PostgreSQL and Redis
  (BullMQ queues); files go to the database by default and can go to S3 with the task role.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    One image, one HTTP port, API plus embedded worker, migrations run at boot. A deploy must set PostgreSQL, Redis,
    AP_ENCRYPTION_KEY, AP_JWT_SECRET and AP_FRONTEND_URL. Nothing blocks. S3 is optional (AP_S3_USE_IRSA=true uses the
    task role). The change count is small, so both DEPLOYABLE and DEPLOYABLE_WITH_CHANGES are fair.
dockerfile:
  accept: [Dockerfile]
  reject:
    - {path: Dockerfile.worker, reason: "worker-only image (AP_CONTAINER_TYPE=WORKER, no HTTP server); the main Dockerfile already runs the worker in the same container or with AP_CONTAINER_TYPE=WORKER"}
    - {path: .devcontainer/Dockerfile, reason: "development container, not the production app image"}
    - {path: docker-compose.yml, reason: "compose file, not a Dockerfile; it only wires the published image with Postgres and Redis"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 127, quote: "FROM base AS run"}
    - {path: Dockerfile, line: 163, quote: "ENTRYPOINT [\"tini\", \"--\", \"./docker-entrypoint.sh\"]"}
    - {path: Dockerfile, line: 91, quote: "RUN NODE_OPTIONS=--max-old-space-size=4096 npx turbo run build --filter=web --filter=@activepieces/engine --filter=api --filter=worker"}
    - {path: Dockerfile.worker, line: 68, quote: "ENV AP_CONTAINER_TYPE=WORKER"}
runtime: {accept: [node]}
