  # "/" also returns 200 (static index.html), but it does not test the app.
  evidence:
    - {path: packages/server/api/src/app/health/health.module.ts, line: 9, quote: "await app.register(healthController, { prefix: '/v1/health' })"}
    - {path: packages/server/api/src/app/health/health.module.ts, line: 17, quote: "security: securityAccess.public(),"}
    - {path: packages/server/api/src/app/health/health.module.ts, line: 23, quote: "StatusCodes.SERVICE_UNAVAILABLE"}
    - {path: Dockerfile, line: 161, quote: "curl -fsS \"http://localhost:${AP_PORT:-80}/api/v1/health\""}
