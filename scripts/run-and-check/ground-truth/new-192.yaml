    - {path: Dockerfile, line: 87, quote: "ARG AIRFLOW_SOURCES_FROM=\"Dockerfile\""}
    - {path: Dockerfile, line: 51, quote: "ARG AIRFLOW_VERSION=\"3.3.2\""}
    - {path: Dockerfile, line: 2339, quote: "FROM ${BASE_IMAGE} as main"}
    - {path: Dockerfile, line: 2489, quote: "EXPOSE 8080"}
