database:
  status: required
  engines: [postgres, mysql]
  default: postgres
  deployzEngine: postgres
  selectBy: {AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: url}
  connectionVars: [AIRFLOW__DATABASE__SQL_ALCHEMY_CONN]
  # The built-in default is SQLite on local disk, which is development only and cannot be shared by several processes.
  evidence:
    - {path: airflow-core/src/airflow/config_templates/config.yml, line: 622, quote: "default: \"sqlite:///{AIRFLOW_HOME}/airflow.db\""}
    - {path: airflow-core/docs/howto/set-up-database.rst, line: 31, quote: "By default, Airflow uses **SQLite**"}
    - {path: airflow-core/docs/howto/set-up-database.rst, line: 35, quote: "* PostgreSQL: 14, 15, 16, 17, 18"}
    - {path: airflow-core/docs/howto/docker-compose/docker-compose.yaml, line: 60, quote: "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow"}
migrations:
