    - {name: AIRFLOW__API_AUTH__JWT_SECRET, secret: true, buildTime: false, note: "must be the same in api-server and scheduler"}
  optional: [AIRFLOW__CORE__EXECUTOR, AIRFLOW__CELERY__BROKER_URL, AIRFLOW__CORE__LOAD_EXAMPLES, _AIRFLOW_DB_MIGRATE, _AIRFLOW_WWW_USER_CREATE]
  buildTime: [AIRFLOW_VERSION, AIRFLOW_INSTALLATION_METHOD, AIRFLOW_SOURCES_FROM, AIRFLOW_SOURCES_TO]
  evidence:
    - {path: airflow-core/docs/howto/docker-compose/docker-compose.yaml, line: 67, quote: "AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}"}
blockers:
  expected:
    - "No Dockerfile builds Airflow from the repository source: the root Dockerfile installs the released apache-airflow package from PyPI with default arguments"
    - "Airflow is several processes (api-server, scheduler, dag-processor, triggerer, optional Celery workers) that share DAG files, logs and a JWT secret; a single web service and one start command do not describe it"
    - "The repository is the orchestrator platform, not a customer web application; DAGs and task logs live on local disk"
  mustNot:
    - "Port 8080 and /api/v2/monitor/health must not be treated as the blocker; the blocker is the source build and the multi-process layout"
    - "Redis must not be reported as required: it is only the Celery broker, and the default executor is LocalExecutor"
    - "SQLite must not be accepted as the production database"
    - "Dockerfile.ci and the docker-stack-docs examples must not be treated as the application image"
vendorQuestions:
  legitimate:
    - "Is the goal to run the Airflow platform from this repository source, or to run a customer DAG project on the released Airflow image?"
    - "Where do DAG files come from (baked into the image, a Git bundle, or a shared volume)?"
  unnecessary:
    - "Which port? (8080)"
    - "Which health path? (/api/v2/monitor/health)"
    - "Which database engine? (PostgreSQL or MySQL; SQLite is development only)"
traps:
  - "The root Dockerfile looks like a source build but installs from PyPI by default (Dockerfile:2197); AIRFLOW_VERSION is a fixed released version (Dockerfile:51)"
  - "The Dockerfile has CMD [] and the entrypoint runs the airflow CLI; with no argument nothing serves HTTP (Dockerfile:2525)"
  - "The old /health path is a 404 in Airflow 3; the health route is /api/v2/monitor/health (api_fastapi/core_api/app.py:200)"
  - "The docker-compose.yaml is documentation for the released apache/airflow image (docker-compose.yaml:52), not a repo-source stack"
  - "providers/amazon .../executors/Dockerfile starts FROM apache/airflow:latest and is an executor example"
openQuestions:
  - "Whether a repo-source build with AIRFLOW_INSTALLATION_METHOD=. works without a separate package and UI build step was not checked"
  - "Whether a LocalExecutor layout (api-server plus scheduler plus dag-processor with DAGs baked into the image) would run correctly on Fargate was not tested"
