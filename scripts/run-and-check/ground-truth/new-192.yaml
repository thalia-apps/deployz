id: new-192
repository: apache/airflow
commit: 24f3370758227ce1bb13e5df251d26a9271ceeee
summary: >
  Apache Airflow is a Python workflow orchestrator, a monorepo of airflow-core plus 100+ provider packages. It runs as
  several long-lived processes: api-server (HTTP, 8080), scheduler, dag-processor, triggerer, and optionally Celery
  workers. The root Dockerfile is the official production image, but with its default build arguments it installs the
  released apache-airflow package from PyPI (AIRFLOW_INSTALLATION_METHOD="apache-airflow") and does not copy the
  repository source (AIRFLOW_SOURCES_FROM defaults to the Dockerfile itself). A build from repo source needs non-default
  build arguments and a prior build of the packages. Airflow needs PostgreSQL or MySQL (SQLite is development only) and a
  shared JWT secret across components.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    The repository is the Airflow platform itself, not a customer web application. No Dockerfile builds the server from
    the repository source with default settings: the root Dockerfile downloads the released distribution from PyPI, and
    the other Dockerfiles are CI, extension-example or sidecar images. A working site needs at least four cooperating
    processes (api-server, scheduler, dag-processor, triggerer) that share the same DAG files, logs and JWT secret.
    Task logs and DAG bundles are local files, and a repository build of the UI and packages is not a small safe
    Dockerfile change. DEPLOYABLE_WITH_CHANGES is not accepted because the change is a custom source build, not a small
    edit.
dockerfile:
  accept: []
  reject:
    - {path: Dockerfile, reason: "official production image; with default arguments it installs apache-airflow from PyPI and copies no repo source; repo-source install needs AIRFLOW_INSTALLATION_METHOD, AIRFLOW_SOURCES_FROM and AIRFLOW_SOURCES_TO overrides"}
    - {path: Dockerfile.ci, reason: "CI and development image for tests and Breeze"}
    - {path: providers/amazon/src/airflow/providers/amazon/aws/executors/Dockerfile, reason: "example image for the AWS ECS executor; starts FROM apache/airflow:latest"}
    - {path: providers/amazon/src/airflow/providers/amazon/aws/executors/aws_lambda/docker/Dockerfile, reason: "image for the AWS Lambda executor"}
    - {path: chart/dockerfiles/pgbouncer/Dockerfile, reason: "PgBouncer sidecar image for the Helm chart"}
    - {path: chart/dockerfiles/pgbouncer-exporter/Dockerfile, reason: "PgBouncer metrics exporter image for the Helm chart"}
    - {path: providers/informatica/dev/informatica_simulator/Dockerfile, reason: "development simulator for a provider"}
    - {path: scripts/ci/dockerfiles/apache-rat/Dockerfile, reason: "CI license check tool"}
    - {path: scripts/ci/dockerfiles/krb5-kdc-server/Dockerfile, reason: "CI test server"}
    - {path: scripts/ci/dockerfiles/stress/Dockerfile, reason: "CI test tool"}
    - {path: scripts/ci/dockerfiles/trino/Dockerfile, reason: "CI test server"}
    - {path: docker-stack-docs/docker-examples/extending/add-providers/Dockerfile, reason: "documentation example that extends the published image (all docker-stack-docs/** Dockerfiles are examples)"}
  target: null
  context: .
  evidence:
