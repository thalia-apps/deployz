    - {path: backend/Dockerfile, line: 65, quote: "CMD [\"fastapi\", \"run\", \"--workers\", \"4\"]"}
    - {path: compose.yml, line: 74, quote: "context: ."}
    - {path: compose.yml, line: 75, quote: "dockerfile: backend/Dockerfile"}
