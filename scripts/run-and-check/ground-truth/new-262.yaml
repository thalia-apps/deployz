    - {name: SECRET_KEY, secret: true, buildTime: false, note: "JWT signing key; the app refuses the value changethis outside development"}
    - {name: PROJECT_NAME, secret: false, buildTime: false, note: "required setting with no default"}
    - {name: FIRST_SUPERUSER, secret: false, buildTime: false, note: "e-mail of the first admin, created by prestart.sh"}
    - {name: FIRST_SUPERUSER_PASSWORD, secret: true, buildTime: false, note: "password of the first admin; changethis is refused"}
    - {name: FRONTEND_HOST, secret: false, buildTime: false, note: "public HTTPS URL; used for CORS and e-mail links; the default is http://localhost:5173"}
