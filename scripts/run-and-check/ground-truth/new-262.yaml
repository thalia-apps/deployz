id: new-262
repository: fastapi/full-stack-fastapi-template
commit: f4bcfaba7c85be3c6332cc74a20819f586dcdbc6
summary: >
  The Full Stack FastAPI Template is a FastAPI back end (SQLModel, Alembic, PostgreSQL) with a React and Vite front end.
  The only production image is backend/Dockerfile, built with the repository root as context: its first stage builds the
  front end with Bun into backend/app/frontend, and the Python stage serves both the API (/api/v1) and the static front
  end from one FastAPI process (`fastapi run --workers 4`) on port 8000. PostgreSQL is required through DATABASE_URL.
  Migrations and the first superuser come from backend/scripts/prestart.sh, which the compose and CI flows run as a
  one-off step. Traefik, Adminer and Mailcatcher in compose are helpers, not part of the app.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    One image from backend/Dockerfile (context is the repository root) builds the front end and back end from source and
    serves both on one HTTP port, 8000, with /api/v1/utils/health-check/. Only settings are needed: DATABASE_URL to RDS
    PostgreSQL, SECRET_KEY, PROJECT_NAME, FIRST_SUPERUSER, FIRST_SUPERUSER_PASSWORD, FRONTEND_HOST, and the migration
    command `bash scripts/prestart.sh`. No Redis, no worker, no local disk state (as new-1).
