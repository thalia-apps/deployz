blockers:
  expected: []
  mustNot:
    - "Two images must not be reported: the front end is built into backend/Dockerfile and served by FastAPI"
    - "The missing root Dockerfile must not block: backend/Dockerfile with the root context is the production image"
    - "Traefik, Adminer, Mailcatcher and the Docker socket mount in compose must not block: they are helpers, not the app"
    - "Redis, a worker or S3 must not be required"
vendorQuestions:
  legitimate:
    - "Which SMTP server sends password-reset e-mails? (optional; e-mail is off without SMTP_HOST and EMAILS_FROM_EMAIL)"
  unnecessary:
    - "Which port? (8000)"
    - "Health path? (/api/v1/utils/health-check/)"
    - "Which database? (PostgreSQL through DATABASE_URL)"
    - "Where is the front end? (built into the same image)"
traps:
  - "The Dockerfile is in backend/ but its context is the repository root; building it with backend/ as context fails (compose.yml:74-75, backend/Dockerfile:5)"
  - "Migrations are not run at start; prestart.sh must run as a one-off command before the first start (backend/scripts/prestart.sh:7)"
  - "The committed .env sets FASTAPI_ENV=development and changethis secrets; outside development the app raises an error on changethis (.env:2, backend/app/core/config.py:69-77)"
  - "frontend/.env sets VITE_API_URL=http://localhost:8000; the Dockerfile ARG VITE_API_URL= overrides it with an empty value so the front end uses the same origin (frontend/.env:1, backend/Dockerfile:14)"
  - "CMD starts four worker processes, which is heavy for the Small size (backend/Dockerfile:65)"
  - "compose.yml mounts the Docker socket only for Traefik, which is not part of the app (compose.yml:7)"
  - "deploy.yml deploys to FastAPI Cloud and is skipped in the template repository itself (.github/workflows/deploy.yml:17, :51)"
openQuestions: []
crossReview:
