  - {field: migrations.accept, change: "none: WORKDIR is /app/backend, so bash scripts/prestart.sh runs alembic upgrade head and initial_data.py; nothing runs it at start", evidence: "backend/Dockerfile:63-65; backend/scripts/prestart.sh:7,10"}
  - {field: all, change: verified, evidence: "24 citations checked"}
