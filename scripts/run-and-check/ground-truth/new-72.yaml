env:
  required:
    - {name: PENPOT_PUBLIC_URI, secret: false, buildTime: false, note: "public HTTPS URL; required by config, default http://localhost:3449"}
    - {name: PENPOT_SECRET_KEY, secret: true, buildTime: false, note: "master key for sessions and tokens; compose sample uses an insecure placeholder"}
    - {name: PENPOT_DATABASE_URI, secret: false, buildTime: false, note: "PostgreSQL URI, with PENPOT_DATABASE_USERNAME and secret PENPOT_DATABASE_PASSWORD"}
    - {name: PENPOT_REDIS_URI, secret: false, buildTime: false, note: "Valkey/Redis URI for the backend and exporter"}
    - {name: PENPOT_OBJECTS_STORAGE_BACKEND, secret: false, buildTime: false, note: "s3 with PENPOT_OBJECTS_STORAGE_S3_BUCKET and region; default fs is ephemeral"}
  optional: [PENPOT_FLAGS, PENPOT_OBJECTS_STORAGE_S3_REGION, PENPOT_OBJECTS_STORAGE_S3_ENDPOINT, PENPOT_SMTP_HOST, PENPOT_TELEMETRY_ENABLED, PENPOT_HTTP_SERVER_MAX_BODY_SIZE, PENPOT_BACKEND_URI, PENPOT_EXPORTER_URI, PENPOT_ADMIN_CONSOLE_URI, JVM_OPTS]
  buildTime: []
  evidence:
    - {path: backend/src/app/config.clj, line: 139, quote: "[:public-uri {:optional false} ::sm/uri]"}
    - {path: backend/src/app/config.clj, line: 135, quote: "[:secret-key {:optional true} :string]"}
    - {path: docker/images/docker-compose.yaml, line: 49, quote: "PENPOT_SECRET_KEY: change-this-insecure-key"}
    - {path: docker/images/files/nginx-entrypoint.sh, line: 71, quote: "export PENPOT_BACKEND_URI=${PENPOT_BACKEND_URI:-http://penpot-backend:6060}"}
blockers:
  expected:
    - "No Dockerfile builds the app from the repo archive: docker/images Dockerfiles COPY prebuilt bundle-* directories produced by manage.sh build-bundle (CI), not available in the archive"
    - "Needs at least two application images (nginx frontend and Java backend), plus a Node exporter image for export; Deployz runs one image per deploy"
  mustNot:
    - "S3 must not block: the backend uses the AWS default credential chain, so the ECS task role works"
    - "PostgreSQL and Valkey/Redis must not block: both are supported managed services"
    - "Local disk /opt/data/assets must not block: S3 backend is native"
    - "Migrations must not need a separate command: they run at backend start"
vendorQuestions:
  legitimate:
    - "Can the prebuilt images (penpotapp/backend, frontend, exporter) be used? They would be several images, not built from the repo"
  unnecessary:
    - "Which port? (6060 backend, 8080 frontend, 6061 exporter)"
    - "Who runs migrations? (backend at startup)"
    - "Which database? (PostgreSQL only)"
traps:
  - "docker/images/docker-compose.yaml looks like a one-file deploy -> it pulls published penpotapp/* images and has Mailpit, Postgres, Valkey, a mcp and an admin console service (docker/images/docker-compose.yaml:91-310)"
  - "Dockerfile.backend looks like a source build -> it only copies ./bundle-backend/ (docker/images/Dockerfile.backend:113-114)"
  - "base images come from dhi.io -> registry that needs entitlement (docker/images/Dockerfile.backend:1)"
  - "docker/devenv/Dockerfile and docker-compose.main.yml -> developer environment, not production"
  - "/dbg/health -> needs authorization; use /readyz (backend/src/app/http/debug.clj:987)"
  - "compose sets AWS_ACCESS_KEY_ID in a comment for S3 -> static keys are not required, DefaultCredentialsProvider is used (backend/src/app/storage/s3.clj:38)"
openQuestions:
  - "Whether a single-image deploy could be assembled by the vendor (backend plus nginx frontend in one image) is a vendor decision, not in the repo"
crossReview:
  - {field: dockerfile.reject, change: "added docker/images/Dockerfile.media-processor (another separate dhi.io image in git); docker/imagemagick/Dockerfile is a build helper and is not an app image", evidence: "docker/images/Dockerfile.media-processor:2 FROM dhi.io/node"}
  - {field: outcome / dockerfile.accept, change: "none: git ls-files lists only docker/devenv, gitpod, imagemagick and docker/images Dockerfiles; backend and frontend both COPY prebuilt bundles and are two different images, so NOT_DEPLOYABLE stands", evidence: "docker/images/Dockerfile.backend:114; docker/images/Dockerfile.frontend:23"}
  - {field: healthPath, change: "none: /readyz returns 200 OK from a DB query, 503 otherwise, no auth", evidence: "backend/src/app/http/debug.clj:868"}
  - {field: all, change: verified, evidence: "36 citations checked"}
