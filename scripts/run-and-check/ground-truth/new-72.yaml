    - {path: docker/images/Dockerfile.frontend, line: 52, quote: "CMD [\"nginx\", \"-g\", \"daemon off;\"]"}
    - {path: docker/images/Dockerfile.exporter, line: 129, quote: "CMD [\"node\", \"app.js\"]"}
healthPath:
  accept: ["/readyz"]
  # Backend /readyz runs a DB query and returns 200 OK, 503 when offline or DB fails. Nginx frontend proxies /readyz to the backend.
  # /dbg/health needs authorization. / on the frontend is the SPA (also 200 but not a dependency check).
  evidence:
    - {path: backend/src/app/http/debug.clj, line: 987, quote: "[[\"/readyz\" {:handler (partial health-handler cfg)}]"}
    - {path: backend/src/app/http/debug.clj, line: 868, quote: "(db/exec-one! pool [\"select count(*) as count from server_prop;\"])"}
    - {path: docker/images/files/nginx.conf.template, line: 169, quote: "location /readyz {"}
