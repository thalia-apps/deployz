    - {path: backend/src/app/config.clj, line: 336, quote: "[:objects-storage-s3-bucket {:optional true} :string]"}
    - {path: backend/src/app/storage/s3.clj, line: 38, quote: "software.amazon.awssdk.auth.credentials.DefaultCredentialsProvider"}
    - {path: backend/src/app/storage/s3.clj, line: 280, quote: "(.credentialsProvider ^S3AsyncClientBuilder builder creds-provider)"}
