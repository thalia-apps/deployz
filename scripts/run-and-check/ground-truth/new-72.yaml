    - {path: backend/src/app/config.clj, line: 224, quote: "[:database-uri {:optional true} ::sm/uri]"}
    - {path: docker/images/docker-compose.yaml, line: 54, quote: "PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot"}
