id: new-72
repository: penpot/penpot
commit: 112e6dedd7b10e5818d31f7ce6302f85d9168e26
summary: >
  Penpot design platform. Production topology is several images: backend (Clojure/JVM, port 6060), frontend (nginx
  with static bundle, port 8080, proxies /api to backend and /api/export to exporter), exporter (Node, port 6061),
  plus optional mcp and admin-console images, with PostgreSQL and Valkey/Redis. The production Dockerfiles in
  docker/images only COPY bundles that manage.sh builds outside Docker, so no Dockerfile builds the app from the repo
  archive. The frontend and backend are two different images.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    No single Dockerfile builds the app from source: docker/images/Dockerfile.backend, .frontend, .exporter and .mcp
    copy prebuilt bundle-* directories (made by ./manage.sh build-bundle). The app also needs at least a separate
    frontend (nginx) image and a backend image, which Deployz cannot run together (one app image per deploy). The
    backend itself is fine for Postgres, Redis and S3 task-role storage, but it does not serve the web UI.
dockerfile:
  accept: []
  reject:
    - {path: docker/images/Dockerfile.backend, reason: "copies prebuilt bundle-backend (ARG BUNDLE_PATH) made outside Docker; base image from dhi.io registry; backend only, no UI"}
    - {path: docker/images/Dockerfile.frontend, reason: "copies prebuilt bundle-frontend; nginx image from dhi.io; needs backend and exporter as separate services"}
    - {path: docker/images/Dockerfile.exporter, reason: "copies prebuilt bundle-exporter; second image"}
    - {path: docker/images/Dockerfile.mcp, reason: "copies prebuilt bundle-mcp; optional extra image"}
    - {path: docker/devenv/Dockerfile, reason: "developer environment image, not the production app"}
    - {path: docker/gitpod/Dockerfile, reason: "Gitpod dev image"}
    - {path: docker/images/Dockerfile.media-processor, reason: "Node media-processor service image (dhi.io base); another separate image, not the app"}
    - {path: docker/images/Dockerfile.storybook, reason: "storybook, not the app"}
  target: null
  context: docker/images
  evidence:
    - {path: docker/images/Dockerfile.backend, line: 113, quote: "ARG BUNDLE_PATH=\"./bundle-backend/\""}
    - {path: docker/images/Dockerfile.backend, line: 114, quote: "COPY --chown=penpot:penpot $BUNDLE_PATH /opt/penpot/backend/"}
    - {path: docker/images/Dockerfile.frontend, line: 23, quote: "COPY $BUNDLE_PATH /var/www/app/"}
    - {path: docker/images/Dockerfile.exporter, line: 90, quote: "COPY --chown=penpot:penpot $BUNDLE_PATH /opt/penpot/exporter/"}
    - {path: docker/images/Dockerfile.mcp, line: 7, quote: "COPY $BUNDLE_PATH /opt/penpot/mcp/"}
    - {path: manage.sh, line: 1327, quote: "function build-backend-bundle {"}
runtime: {accept: [java]}
port:
  accept: [6060, 8080]
  evidence:
    - {path: backend/src/app/http.clj, line: 49, quote: "{::port 6060"}
    - {path: docker/images/files/nginx.conf.template, line: 92, quote: "listen 8080 default_server"}
    - {path: exporter/src/app/config.cljs, line: 29, quote: ":http-server-port 6061"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: backend/src/app/http.clj, line: 50, quote: "::host \"0.0.0.0\""}
startCommand:
