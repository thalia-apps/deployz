id: new-81
repository: Mintplex-Labs/anything-llm
commit: 9b1fcab141000eaba9f78ed131151de04904454b
summary: >
  AnythingLLM document-chat app (Node.js, Express server serving a Vite/React frontend, plus a separate collector
  process, Prisma). One image from docker/Dockerfile; its entrypoint runs the server and the collector in the same
  container. All durable state is a SQLite file and local disk under STORAGE_DIR (documents, LanceDB vectors). The Prisma
  datasource is fixed to sqlite with SQLite-only migrations, and there is no S3 storage, so no Deployz managed service can hold the data.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The system database is SQLite (server/prisma/schema.prisma, provider fixed, migration_lock.toml = sqlite, SQL migrations
    use SQLite syntax). Postgres needs a manual edit of the schema file and new migrations; it is not an env switch. Uploaded documents,
    parsed document JSON and the default LanceDB vectors are on the local disk (STORAGE_DIR). Fargate disk is ephemeral and no
    volume is available. VECTOR_DB=pgvector would move only vectors to Postgres; settings, users, workspaces, chats and documents stay local.
