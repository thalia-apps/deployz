blockers:
  expected:
    - "SQLite is the only configured system database; the Prisma provider is fixed in schema.prisma and the migrations are SQLite SQL, so Postgres needs a source change, not an env switch"
    - "Documents, direct uploads, vector cache and LanceDB vectors are on the local disk (STORAGE_DIR) with no S3 option; Fargate disk is ephemeral and Deployz has no volume"
  mustNot:
    - "Many LLM provider variables in .env.example must not be required: all are optional and commented out (LLM and embedding can be set in the UI)"
    - "The collector must not count as a second image or service: the same image starts it in the same container"
    - "pgvector support must not turn this into a Postgres app: it stores only vectors"
    - "Redis must not be reported as required: the app does not use it"
    - "Port 8888 (collector) must not be the web port: it is internal"
vendorQuestions:
  legitimate:
    - "Is there a supported way to run the system database on PostgreSQL and keep documents in S3, without editing schema.prisma?"
  unnecessary:
    - "Which port? (3001 in .env.example and the healthcheck)"
    - "Who runs migrations? (the entrypoint runs prisma migrate deploy on every start)"
    - "Health path? (/api/ping)"
    - "Is a worker process needed? (the collector starts in the same container)"
traps:
  - "Commented PostgreSQL datasource in schema.prisma -> not active; the active datasource is sqlite and the migrations are SQLite-only (server/prisma/schema.prisma:5-16, server/prisma/migrations/migration_lock.toml:3)"
  - "VECTOR_DB=pgvector -> only vectors move to Postgres; the SQLite DB and documents stay on local disk (docker/.env.example:306)"
  - "Dockerfile has several FROM stages (build-arm64, build-amd64, build, frontend-build, backend-build) -> the last stage production-build is the app; no --target needed (docker/Dockerfile:171)"
  - "docker-compose mounts ../server/storage as a volume -> the app needs a persistent volume that Deployz cannot give (docker/docker-compose.yml:20)"
  - "Image HEALTHCHECK uses SERVER_PORT and /api/ping -> / is the SPA, not a health endpoint (docker/docker-healthcheck.sh:5, docker/Dockerfile:181)"
  - "The entrypoint starts server and collector with & and wait -n -> two processes in one container, not two services (docker/docker-entrypoint.sh:27-28)"
  - "The SQLite file path is fixed in schema.prisma (file:../storage/anythingllm.db, i.e. /app/server/storage), so STORAGE_DIR does not move it; both are local disk anyway (server/prisma/schema.prisma:15)"
openQuestions:
  - "Whether a patched fork with Postgres in schema.prisma would count as deployable: out of scope for the repo as given"
crossReview:
  - {field: healthPath.evidence, change: "docker-healthcheck.sh line 6 -> 5 (also in the trap text, plus the Dockerfile HEALTHCHECK at line 181)", evidence: "docker/docker-healthcheck.sh:5; docker/Dockerfile:181"}
  - {field: traps, change: "added the fixed SQLite file path (relative url in schema.prisma, independent of STORAGE_DIR); added it to storage evidence", evidence: "server/prisma/schema.prisma:15"}
  - {field: outcome / database / storage / dockerfile, change: "none: NOT_DEPLOYABLE kept (datasource provider fixed to sqlite, the postgres block is commented out and migrations are SQLite SQL, no S3 option for documents or LanceDB); the last stage production-build needs no --target; all COPY sources exist in git; /api/ping returns 200 and is unauthenticated", evidence: "server/prisma/schema.prisma:5-16; docker/Dockerfile:51-173; server/endpoints/system.js:84"}
  - {field: all, change: verified, evidence: "30 citations checked (1 line fixed)"}
