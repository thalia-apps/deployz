blockers:
  expected:
    - "The repository has no Dockerfile; the profile builds a war and the run path is mvn jetty:run"
    - "The schema is a set of ddl.sql files that nothing applies at start"
  mustNot:
    - "The Maven multi-module layout must not be read as several application services: the one deployable is profiles/killbill"
    - "Kaui, the OSGi payment plugins and the killpay profile are not required to run the API"
    - "Notification and bus queues are in the process and must not be read as a worker or a broker"
vendorQuestions:
  legitimate:
    - "Which payment plugins are installed? (OSGi bundles directory, optional)"
  unnecessary:
    - "Which database? (MySQL or PostgreSQL by org.killbill.dao.url)"
    - "Is Redis or a broker needed? (no)"
traps:
  - "The shipped properties file points to a local MySQL as root with password root (killbill-server.properties:26-28)"
  - "The PostgreSQL DDL exists as a util-only extra file that defines MySQL type names as domains; other modules use MySQL syntax in ddl.sql (ddl-postgresql.sql:3, account ddl.sql:1)"
  - "The profiles/killpay directory is a second profile with its own web.xml; it is not the main server"
  - "The README documents only the hosted getting-started guide; there is no Docker instruction in the repository"
openQuestions: []
crossReview:
