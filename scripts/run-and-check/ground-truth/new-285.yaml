id: new-285
repository: killbill/killbill
commit: 52e2f55f103baf0703ddee71e10a7036595fc851
summary: >
  Kill Bill is a subscription billing and payments platform written in Java (Maven multi-module, about 25 modules). The
  deployable profile is profiles/killbill, which has packaging war and a web.xml with a Guice listener. The repository
  has no Dockerfile. The documented developer start is bin/start-server, which runs `mvn jetty:run` on port 8080. The
  database is MySQL or PostgreSQL (org.killbill.dao.url, user, password; the PostgreSQL DDL for the util module is
  ddl-postgresql.sql). The schema comes from a set of ddl.sql files in the modules and is not applied by the server at
  start. Notification and bus queues run inside the one process. No Redis. Payment gateways are OSGi plugins that load
  from a bundles directory on disk. The admin UI (Kaui) is another project.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]
  reason: >
    The war is the one HTTP application and the database engines are supported, so the app fits the one-image model.
    But the repository has no Dockerfile and the only run path is a Maven `jetty:run` developer script. A contained
    change is needed: a Dockerfile that builds the profile war (mvn package) and runs it in Jetty or Tomcat, with the
    database properties passed as system properties, and a step that loads the ddl.sql files into the database before
    the first start. No second application service is needed.
