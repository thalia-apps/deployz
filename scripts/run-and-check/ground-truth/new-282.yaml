  - {field: dockerfile / startCommand, change: "none: find over the file list shows no Dockerfile; the AppHost is the only run definition", evidence: "src/eShop.AppHost/AppHost.cs:7; README.md:3"}
  - {field: workers, change: "none: independent, the two processors are separate projects started beside the APIs", evidence: "src/eShop.AppHost/AppHost.cs:48,53"}
  - {field: all, change: verified, evidence: "23 citations checked against the pinned commit by script (path, line, quote)"}
