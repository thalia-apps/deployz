env:
  required:
    - {name: ConnectionStrings__eventbus, secret: true, buildTime: false, note: "RabbitMQ connection string; every service except Identity uses it"}
    - {name: ConnectionStrings__catalogdb, secret: true, buildTime: false, note: "PostgreSQL with pgvector"}
    - {name: ConnectionStrings__redis, secret: true, buildTime: false, note: "Basket.API"}
    - {name: Identity__Url, secret: false, buildTime: false, note: "URL of Identity.API, set by the AppHost for Basket, Ordering and Webhooks"}
  optional: [ESHOP_USE_HTTP_ENDPOINTS, UseFoundry]
  buildTime: []
  evidence:
    - {path: src/eShop.AppHost/AppHost.cs, line: 10, quote: "var rabbitMq = builder.AddRabbitMQ(\"eventbus\")"}
    - {path: src/eShop.AppHost/AppHost.cs, line: 35, quote: ".WithEnvironment(\"Identity__Url\", identityEndpoint);"}
    - {path: src/Basket.API/Extensions/Extensions.cs, line: 18, quote: "builder.AddRabbitMqEventBus(\"eventbus\")"}
blockers:
  expected:
    - "About ten application services (identity, basket, catalog, ordering, order processor, payment processor, webhooks, web app, BFF) must run together; Deployz runs one web container plus workers from one image"
    - "RabbitMQ is the event bus for basket, catalog, ordering, the processors, webhooks and the web app; Deployz supports SQS Standard only"
    - "No Dockerfile exists, and each service is its own project, so no single image holds the application"
  mustNot:
    - "A missing Dockerfile alone must not produce DEPLOYABLE_WITH_CHANGES: the real blocker is the multi-service architecture and RabbitMQ"
    - "Redis and PostgreSQL must not be the main blockers: both are supported"
    - "The Azure Container Apps environment in the AppHost must not be read as a requirement to run on Azure for the application code itself"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (set by the AppHost per service)"
    - "Which database? (PostgreSQL)"
traps:
  - "The AppHost is a local orchestrator and deployment model (Aspire), not an application: running it needs a container runtime for Redis, RabbitMQ and PostgreSQL (README.md:26)"
  - "The WebApp is the visible storefront, but it calls Basket, Catalog and Ordering APIs and Identity.API for sign-in, so it cannot run alone (src/eShop.AppHost/AppHost.cs:71-79)"
  - "Health endpoints are mapped only in the Development environment (src/eShop.ServiceDefaults/Extensions.cs:115)"
  - "Catalog.API needs the pgvector extension; the AppHost chooses the ankane/pgvector image for this (src/eShop.AppHost/AppHost.cs:13)"
  - "README marks the Azure deployment as evaluation and demonstration, not production data (README.md:118)"
openQuestions: []
