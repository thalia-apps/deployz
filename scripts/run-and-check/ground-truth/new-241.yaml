  required: []
  optional: [PUBLIC_GOOGLE_SITE_VERIFICATION]
  buildTime: [PUBLIC_GOOGLE_SITE_VERIFICATION]
  evidence:
    - {path: astro.config.ts, line: 74, quote: "PUBLIC_GOOGLE_SITE_VERIFICATION: envField.string({"}
    - {path: astro.config.ts, line: 77, quote: "optional: true,"}
blockers:
  expected: []
  mustNot:
    - "A static site must not be rejected as having no server: nginx serves it"
    - "Missing database, Redis, workers or S3 must not be reported: the site is static"
    - "compose.yaml (dev server on 4321) must not set the port or the start command"
    - "The .dockerignore line *.astro must not be read as excluding the source: a Docker pattern without **/ matches only the context root, and no .astro file is at the root"
vendorQuestions:
  legitimate:
    - "The site URL is fixed in astro-paper.config.ts (https://astro-paper.pages.dev/) and goes into the sitemap, RSS and canonical links; should it be changed to the deployment URL? (a repository edit, not a runtime setting)"
  unnecessary:
    - "Which port? (80)"
    - "Health path? (/)"
    - "Database, Redis, worker or storage? (none)"
traps:
  - "package.json has dev and preview scripts on 4321 and no start script, so a detector may label it a Node server; the image is nginx on 80 (package.json:9, Dockerfile:15)"
  - ".dockerignore has *.astro, which looks like it removes all pages; in Docker it only matches the root (.dockerignore:2)"
  - "The site URL is compiled in at build time from astro-paper.config.ts:5, not read from the environment"
  - "The build fetches Google fonts and installs pnpm@latest through corepack, so it needs network access and may drift (astro.config.ts:65, Dockerfile:6)"
openQuestions: []
crossReview:
  - {field: "outcome.accept", change: "none: a static site built by a multi-stage Dockerfile and served by nginx, as new-141 and new-142", evidence: "Dockerfile:2-17; reasons.txt new-141, new-142"}
  - {field: "dockerfile.accept", change: "none: .dockerignore *.astro matches only the context root; node:lts is Node 26 since 2026-10-28, and the build depends on corepack in that image (still bundled in Node 25.6), so this is not a clear build failure", evidence: "Dockerfile:2,6; .dockerignore:2"}
  - {field: "all", change: "verified", evidence: "11 citations checked"}
