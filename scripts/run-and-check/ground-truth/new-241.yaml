id: new-241
repository: satnaing/astro-paper
commit: 74edd257819b2f09778012dff8d8bd745b5e3de2
summary: >
  AstroPaper is an Astro blog theme with sample posts. `pnpm run build` runs astro check, astro build (static output to
  dist/) and Pagefind indexing. The root Dockerfile is multi-stage: node:lts installs with pnpm and builds, and
  nginx:mainline-alpine-slim serves dist/ on port 80 with the nginx image default CMD. compose.yaml runs only the Astro
  dev server on 4321 with the source mounted. There is no server code, database, cache, worker or storage.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    A static site built from the repo source and served by nginx is a deployable web app, as new-141 and new-142. The
    multi-stage Dockerfile builds with pnpm, the nginx stage listens on 80, and / returns the generated index.html with 200.
dockerfile:
  accept: [Dockerfile]
  reject:
    - {path: compose.yaml, reason: "development: runs `pnpm run dev --host 0.0.0.0` on 4321 with the source bind-mounted"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 9, quote: "RUN pnpm install --frozen-lockfile"}
    - {path: Dockerfile, line: 12, quote: "RUN pnpm run build"}
    - {path: Dockerfile, line: 16, quote: "COPY --from=base /app/dist /usr/share/nginx/html"}
    - {path: compose.yaml, line: 12, quote: "&& pnpm run dev --host 0.0.0.0\""}
runtime: {accept: [node, static]}
port:
  accept: [80]
  evidence:
    - {path: Dockerfile, line: 17, quote: "EXPOSE 80"}
bindAllInterfaces:
  value: true
  # The nginx image default server listens on port 80 on all interfaces.
  evidence:
    - {path: Dockerfile, line: 15, quote: "FROM nginx:mainline-alpine-slim AS runtime"}
startCommand:
  source: image
  accept: ["nginx -g daemon off;"]
  # The Dockerfile sets no CMD; the nginx base image CMD starts nginx.
  evidence:
    - {path: Dockerfile, line: 15, quote: "FROM nginx:mainline-alpine-slim AS runtime"}
healthPath:
  accept: ["/", "/index.html"]
  evidence:
    - {path: src/pages/index.astro, line: 1, quote: "---"}
    - {path: Dockerfile, line: 16, quote: "COPY --from=base /app/dist /usr/share/nginx/html"}
