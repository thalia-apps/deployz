id: new-163
repository: superagent-ai/superagent
commit: c9e646271bf15cf7ea7b8e2de9de98008ea1099d
summary: >
  Superagent is now an open-source SDK for AI agent safety (guard, redact, scan, red team), not the earlier agent
  platform. The repo has a TypeScript SDK (sdk/typescript, npm package safety-agent), a Python SDK (sdk/python,
  hatchling wheel safety-agent), a CLI (cli, bin superagent), a stdio MCP server (mcp, bin superagent-mcp) and a
  Next.js documentation site (docs, private). There is no Dockerfile, no compose file and no server entrypoint for
  a product. The only web app is the documentation site.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    A library, a CLI and a stdio MCP server that developers install from npm or PyPI. The MCP server uses stdio
    transport, not HTTP. The docs/ Next.js site is documentation, not the product, and has no Dockerfile.
