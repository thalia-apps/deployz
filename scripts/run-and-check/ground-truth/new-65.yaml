id: new-65
repository: baserow/baserow
commit: 7e1eca2ea879a32bdd5e4e75134f35d9b6e476d4
summary: >
  Baserow no-code database (Django/ASGI backend, Nuxt SSR web-frontend, Celery workers and beat, Redis, PostgreSQL).
  The repo has two source Dockerfiles (backend/Dockerfile, web-frontend/Dockerfile), one image each. The
  deploy/all-in-one/Dockerfile does not build from source: it starts FROM the published baserow/backend and
  baserow/web-frontend registry images (ARG BACKEND_IMAGE, WEBFRONTEND_IMAGE) and adds Caddy and supervisord.
  So no single Dockerfile in the repo builds the whole app from the repo archive alone.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    The full app needs two application images (backend and web-frontend) behind a router, or the all-in-one image,
    which copies from pre-built registry application images and so cannot be built from the repo archive.
    NOT_DEPLOYABLE is the direct result for the repo as given. DEPLOYABLE_WITH_CHANGES is a valid judgement call only
    if the customer writes a new single Dockerfile that builds both parts from source and runs Caddy, Nuxt, gunicorn
    and Celery with supervisord; the app itself then works with external PostgreSQL, Redis and S3 (task role).
dockerfile:
  accept: []
  reject:
    - {path: deploy/all-in-one/Dockerfile, reason: "FROM ${BACKEND_IMAGE} and ${WEBFRONTEND_IMAGE} (default baserow/backend, baserow/web-frontend) pull pre-built application images from a registry and copy /baserow out of them; not buildable from the repo archive alone"}
    - {path: backend/Dockerfile, reason: "builds only the Django backend and Celery image (CMD gunicorn); no web-frontend, no router; the UI needs the second image"}
    - {path: web-frontend/Dockerfile, reason: "builds only the Nuxt web-frontend (port 3000); no backend API"}
    - {path: deploy/render/Dockerfile, reason: "FROM the published registry image baserow/baserow (ARG FROM_IMAGE) plus one env file; a platform wrapper, builds nothing from source"}
    - {path: deploy/cloudron/Dockerfile, reason: "FROM the published registry image baserow/baserow (ARG FROM_IMAGE) plus one env file; a platform wrapper, builds nothing from source"}
    - {path: heroku.Dockerfile, reason: "FROM the published registry image baserow/baserow (ARG FROM_IMAGE) plus one env file; a platform wrapper, builds nothing from source"}
    - {path: embeddings/Dockerfile, reason: "separate helper image that downloads an embedding model; not the app"}
    - {path: formula/Dockerfile, reason: "separate helper image (openjdk base); not the app"}
    - {path: deploy/apache/recommended/Dockerfile, reason: "reverse proxy variant, not the app"}
  target: null
  context: .
  evidence:
    - {path: deploy/all-in-one/Dockerfile, line: 4, quote: "ARG BACKEND_IMAGE=baserow/backend"}
    - {path: deploy/all-in-one/Dockerfile, line: 8, quote: "FROM ${BACKEND_IMAGE} AS backend_image"}
    - {path: deploy/all-in-one/Dockerfile, line: 10, quote: "FROM ${WEBFRONTEND_IMAGE} AS web_frontend_image"}
    - {path: deploy/all-in-one/Dockerfile, line: 98, quote: "COPY --chown=$UID:$GID --from=web_frontend_image /baserow/web-frontend /baserow/web-frontend"}
    - {path: deploy/all-in-one/Dockerfile, line: 101, quote: "COPY --chown=$UID:$GID --from=backend_image /baserow/backend /baserow/backend"}
    - {path: deploy/render/Dockerfile, line: 1, quote: "ARG FROM_IMAGE=baserow/baserow:2.4.1"}
    - {path: heroku.Dockerfile, line: 1, quote: "ARG FROM_IMAGE=baserow/baserow:2.4.1"}
    - {path: backend/Dockerfile, line: 502, quote: "CMD [\"gunicorn\"]"}
    - {path: web-frontend/Dockerfile, line: 286, quote: "ENTRYPOINT [\"/baserow/web-frontend/docker/docker-entrypoint.sh\"]"}
runtime: {accept: [python, node]}
port:
  accept: [80]
  evidence:
    - {path: deploy/all-in-one/Dockerfile, line: 116, quote: "EXPOSE 80"}
    - {path: deploy/all-in-one/supervisor/default_baserow_env.sh, line: 36, quote: "BASEROW_CADDY_ADDRESSES=\"${BASEROW_CADDY_ADDRESSES:-\":80\"}\""}
    - {path: deploy/all-in-one/supervisor/default_baserow_env.sh, line: 39, quote: "PRIVATE_BACKEND_URL='http://localhost:8000'"}
    - {path: deploy/all-in-one/supervisor/default_baserow_env.sh, line: 44, quote: "PRIVATE_WEB_FRONTEND_URL='http://localhost:3000'"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: deploy/all-in-one/supervisor/default_baserow_env.sh, line: 36, quote: "BASEROW_CADDY_ADDRESSES"}
    - {path: deploy/all-in-one/supervisor/default_baserow_env.sh, line: 45, quote: "BASEROW_BACKEND_BIND_ADDRESS=127.0.0.1"}
