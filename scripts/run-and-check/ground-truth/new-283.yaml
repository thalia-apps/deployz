id: new-283
repository: Ombi-app/Ombi
commit: 697d35647bf8cef8e11f334e0d4e775e1f9f30b0
summary: >
  Ombi is a media request manager written in ASP.NET Core 8 with an Angular client. The Dockerfile is src/dockerfile
  (build context src): a three-stage build with yarn for the client and dotnet publish for the server, ENTRYPOINT
  dotnet Ombi.dll on port 5000 (default URL http://*:5000). The database engine is chosen only by a database.json file
  in the storage path (Sqlite default, MySQL or Postgres); the setup wizard writes that file. No environment variable
  selects the engine. Quartz jobs run inside the web process. No Redis, no S3.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]
  reason: >
    The app builds and listens on 0.0.0.0:5000 from a Dockerfile, and Postgres is supported, but the engine is read
    only from database.json on local disk. Without that file the app uses SQLite files in the storage path. The wizard
    writes database.json to the container disk, which is lost at each restart or task replacement, so the app falls back
    to an empty SQLite database. A contained repository change is needed (read the engine and connection string from
    environment values, or an entrypoint that writes database.json). The migrations also need a separate
    `dotnet Ombi.dll --migrate` run.
