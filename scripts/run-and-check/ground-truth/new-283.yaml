blockers:
  expected:
    - "The database engine is chosen only by database.json on local disk; no environment value selects PostgreSQL"
  mustNot:
    - "The SQLite default must not alone be read as not deployable: PostgreSQL is supported"
    - "The Quartz jobs are in-process; they must not be read as a worker or an EventBridge schedule"
    - "The build context is src, not the repository root"
vendorQuestions:
  legitimate:
    - "Which media servers (Plex, Emby, Jellyfin) and request sources should Ombi use? (set in the web wizard)"
  unnecessary:
    - "Which port? (5000)"
    - "Is Redis or S3 needed? (no)"
traps:
  - "The Dockerfile is src/dockerfile (lower case) and COPY paths assume the context src (src/dockerfile:14)"
  - "database.json is written by the setup wizard to the container disk; it is lost when the task is replaced (src/Ombi.Core/Services/DatabaseConfigurationService.cs:35)"
  - "Migrations are not applied at a normal start; the --migrate option runs them and exits (src/Ombi/Program.cs:77)"
  - "The client is served by the same ASP.NET process from ClientApp/dist, so no separate static server is needed (src/Ombi/Startup.cs:113)"
