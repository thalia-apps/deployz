blockers:
  expected:
    - "SpiceDB/AuthZed is a required separate gRPC service for all permission checks (AUTHZED_ENABLED=true cannot be disabled); it also needs a one-time schema prepare (formbricks-authzed upgrade prepare) that the app does not run"
    - "Hub (ghcr.io/formbricks/hub, API plus hub-worker) is a documented required separate Go service; the app needs HUB_API_URL and HUB_API_KEY at boot (only Unify-feedback features use it)"
    - "Cube (ghcr.io/formbricks/cube) is a documented required separate analytics service; the app needs CUBEJS_API_URL and CUBEJS_API_SECRET at boot (only analysis features use it)"
  mustNot:
    - "PostgreSQL: supported (RDS Postgres with pgvector); not a blocker"
    - "Redis: required but ElastiCache/Valkey is provided by Deployz; not a blocker"
    - "Local uploads volume: S3 is native and no code writes uploads to disk, so it is not a persistent-volume blocker"
    - "BullMQ worker: runs inside the web process, no separate worker service needed"
    - "Migrations: run at container start; no separate migration job needed"
    - "vLLM/Qwen GPU and taxonomy services: optional AI profiles, not part of the baseline"
vendorQuestions:
  legitimate:
    - "Are external Hub, Cube and AuthZed endpoints available (AuthZed also with its schema prepared)? The repo cannot say what the operator runs elsewhere"
    - "Is AUTHZED_INSECURE=false needed? Depends on whether the vendor's AuthZed endpoint uses TLS (docs: false for AuthZed Cloud)"
  unnecessary:
    - "Which port or health path (3000 and /health are in the Dockerfile and routes)"
    - "Whether to run migrations manually (start.sh does it)"
    - "Whether a worker process is needed (embedded BullMQ)"
    - "Which database engine (Postgres only)"
    - "Whether Redis is optional (REDIS_URL is required)"
traps:
  - "docker-compose.yml shows one formbricks service -> it needs hub, hub-worker, cube, spicedb siblings; not single-container (docker/docker-compose.yml:265-420)"
  - "formbricks-migrate/authzed-initialize one-shot services -> same image; the image start script also migrates unless SKIP_STARTUP_MIGRATION=true (docker/docker-compose.yml:349, apps/web/scripts/docker/next-start.sh:54)"
  - "/health/ready (DB query, 503 when not ready) -> use /health for the load balancer, it is static 200 (apps/web/app/health/route.ts:2)"
  - "build secrets database_url etc. look required at build -> read-secrets.sh falls back to placeholders, plain docker build works (apps/web/scripts/docker/read-secrets.sh:7)"
  - "NEXTAUTH_* in docs/compose -> legacy aliases; BETTER_AUTH_SECRET/URL are the current names (apps/web/lib/env.ts:679)"
  - ".env.example SpiceDB comments mention the dev stack -> v6 requires it in production (apps/web/lib/env.ts:992)"
  - "/health does not touch SpiceDB, Hub or Cube -> a green health check does not prove authorization works (docs/self-hosting/configuration/authzed-operations.mdx)"
  - "Compose gives its one-shot containers placeholder HUB/CUBEJS values (docker/docker-compose.yml:404-407) -> boot only checks that they are present and valid"
  - "docker/cube-image/Dockerfile and docker-compose.dev.yml -> not the app image"
  - "Dockerfile builds Node 24 from source in a stage -> long build; the last stage runner is the app, no --target needed (apps/web/Dockerfile:14,137)"
openQuestions:
  - "Not every Hub/Cube call site was traced; the response pipeline catches Hub errors (process-response-pipeline-job.ts:653-663) and Hub/Cube code sits in Unify-feedback and analysis modules, but no page needing them was exercised."
