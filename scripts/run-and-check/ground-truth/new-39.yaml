id: new-39
repository: formbricks/formbricks
commit: f684d12b411ba67c87ac849c430117a66726e47b
summary: >-
  Formbricks v6 is an open-source survey/experience-management platform (Next.js 16 standalone, Node 24, Prisma,
  pnpm/turbo monorepo). The documented self-hosting stack is several services: the Formbricks app plus the Hub
  (Go API and worker), Cube, SpiceDB, PostgreSQL with pgvector and Redis/Valkey. The app image alone is not enough.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >-
    The app refuses to serve without SpiceDB (AUTHZED_ENABLED=true, v6 has no fallback). It also requires
    HUB_API_URL/HUB_API_KEY (Hub image) and CUBEJS_API_URL/CUBEJS_API_SECRET (Cube image). Hub, hub-worker, Cube
    and SpiceDB are separate application services with their own images; Deployz hosts one Dockerfile image plus
    same-image workers. NOT_DEPLOYABLE is the best answer. DEPLOYABLE_WITH_CHANGES is acceptable only when the
    vendor supplies external Hub, Cube and AuthZed endpoints (app + RDS Postgres/pgvector + ElastiCache + S3).
