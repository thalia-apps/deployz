id: new-39
repository: formbricks/formbricks
commit: f684d12b411ba67c87ac849c430117a66726e47b
summary: >-
  Formbricks v6 is an open-source survey/experience-management platform (Next.js 16 standalone, Node 24, Prisma,
  pnpm/turbo monorepo). The documented self-hosting stack is several services: the Formbricks app plus the Hub
  (Go API and worker), Cube, SpiceDB, PostgreSQL with pgvector and Redis/Valkey. The app image alone is not enough.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >-
    The app refuses to start without SpiceDB settings (AUTHZED_ENABLED=true, v6 has no fallback) and all
    authorization goes through SpiceDB, which also needs a one-time schema preparation. It also needs
    HUB_API_URL/HUB_API_KEY (Hub image) and CUBEJS_API_URL/CUBEJS_API_SECRET (Cube image) at boot. Hub, hub-worker,
    Cube and SpiceDB are separate services with their own images; Deployz hosts one Dockerfile image plus same-image
    workers. The deployment docs list all of them as "Always" required, so NOT_DEPLOYABLE is a defensible answer.
    Judgement call: the app only validates the Hub/Cube env values at boot (compose passes placeholder
    http://localhost values to its own one-shot containers, and the response pipeline catches Hub errors), so
    surveys work without them and only Unify-feedback and analysis features degrade. DEPLOYABLE_WITH_CHANGES is
    therefore acceptable when the vendor supplies an external AuthZed endpoint (docs name "An external AuthZed
    endpoint" as the option) plus Hub and Cube endpoints or placeholders (app + RDS Postgres/pgvector +
    ElastiCache + S3). SpiceDB is the hard dependency and cannot be disabled.
