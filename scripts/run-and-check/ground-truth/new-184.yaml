    - {path: zproject/default_settings.py, line: 187, quote: "LOCAL_UPLOADS_DIR: str | None = None"}
env:
  required: []
  optional: []
  buildTime: []
  evidence: []
blockers:
  expected:
    - "RabbitMQ is a required message broker (USING_RABBITMQ = True, RABBITMQ_HOST defaults to 127.0.0.1); it is outside the MVP"
    - "memcached is a required cache (SingletonBMemcached); it is not part of the MVP datastores"
    - "No Dockerfile in the repository builds Zulip; the installer expects a dedicated machine and runs nginx, uwsgi, Tornado and supervisor-managed workers together"
  mustNot:
    - "PostgreSQL and Redis must not be blockers by themselves: both are in the MVP"
    - "Dockerfile-postgresql must not be chosen as the application Dockerfile"
    - "Port 9800 (Tornado) must not be the app port: nginx fronts Django and Tornado on 80 and 443"
vendorQuestions:
  legitimate:
    - "Where do RabbitMQ and memcached run? Deployz cannot provide them"
    - "Is there a Dockerfile that builds the application? The Docker image is in the separate zulip/docker-zulip repository"
  unnecessary:
    - "Which database? (PostgreSQL)"
    - "Is Redis needed? (yes, required)"
traps:
  - "Dockerfile-postgresql is a database image, not the app (Dockerfile-postgresql:17)"
  - "Settings in zproject/default_settings.py point every service at 127.0.0.1, so the app expects all dependencies on one host"
  - "The Docker docs (docs/production/docker.md:3) describe an image that lives in a different repository"
  - "Zulip nginx terminates TLS itself and proxies Django (uwsgi) and Tornado (9800); a single HTTP port behind an ALB does not match the shipped topology"
crossReview:
  - {field: outcome.accept, change: "none: NOT_DEPLOYABLE confirmed (RabbitMQ, memcached, multi-process host install, no app Dockerfile)", evidence: "computed_settings.py:410 USING_RABBITMQ = True; :423 SingletonBMemcached"}
  - {field: dockerfile.reject, change: "added tools/ci/Dockerfile.prod and tools/setup/dev-vagrant-docker/Dockerfile (the only other Dockerfiles)", evidence: "git ls-tree: Dockerfile-postgresql, tools/ci/Dockerfile, tools/ci/Dockerfile.prod, tools/setup/dev-vagrant-docker/Dockerfile"}
  - {field: port/healthPath/database/redis/workers/storage, change: "none", evidence: "zulip-enterprise.template.erb:16; urls.py:1030; computed_settings.py:357; default_settings.py:239,171,187"}
  - {field: all, change: verified, evidence: "12 citations checked"}
