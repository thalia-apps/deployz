id: new-184
repository: zulip/zulip
commit: 3cfe56fa781acdcebb3f5a5669e7c3d18dfae90c
summary: >
  Zulip is a Django (Python) and Tornado team-chat server with a TypeScript web front end. Production is installed on a
  dedicated Debian or Ubuntu machine by scripts/setup/install, which uses Puppet to set up nginx, uwsgi (Django), a
  Tornado process on 9800, supervisor-managed queue workers, PostgreSQL (with PGroonga), Redis, RabbitMQ and memcached
  on the same host. The repository has no application Dockerfile: the Docker image is a separate project (zulip/docker-zulip).
  Dockerfile-postgresql builds only a database image and tools/ci/Dockerfile is a CI base image.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    RabbitMQ is a required message broker (USING_RABBITMQ = True) and memcached is a required cache; both are outside the
    MVP datastores. The product also needs nginx, uwsgi, a Tornado process and many queue worker processes managed by
    supervisor on one host, and no Dockerfile in the repository builds the application.
dockerfile:
  accept: []
  reject:
    - {path: Dockerfile-postgresql, reason: "PostgreSQL image with PGroonga; not the application"}
    - {path: tools/ci/Dockerfile, reason: "generic Debian or Ubuntu CI base image"}
    - {path: tools/ci/Dockerfile.prod, reason: "CI image that installs a released Zulip tarball for upgrade tests; not a build from source"}
    - {path: tools/setup/dev-vagrant-docker/Dockerfile, reason: "development environment image"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile-postgresql, line: 17, quote: "FROM groonga/pgroonga:$PGROONGA_VERSION-alpine-$POSTGRESQL_VERSION-slim"}
    - {path: tools/ci/Dockerfile, line: 1, quote: "# Dockerfile for a generic Debian/Ubuntu image with just the basics we"}
    - {path: tools/ci/Dockerfile.prod, line: 15, quote: "ADD Docker-prod-8.0.diff /tmp"}
    - {path: docs/production/docker.md, line: 3, quote: "Zulip provides an {doc}`official Docker image <docker:index>` for"}
runtime: {accept: [python]}
port:
  accept: [80]
  evidence:
