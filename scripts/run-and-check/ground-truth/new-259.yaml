id: new-259
repository: janeczku/calibre-web
commit: 6e840acbda8d62fdd159bf3855c01872d629a914
summary: >
  Calibre-Web is a Python (Flask, gevent) web app to browse, read and download e-books from an existing Calibre library.
  The library is a folder on local disk: the Calibre SQLite database metadata.db plus the book files. The app keeps its own
  settings and users in a second SQLite file (app.db in CALIBRE_DBPATH). It listens on 8083 and is started with
  `python cps.py` or the `cps` console script from PyPI. The repository has no Dockerfile; the README points to the
  external LinuxServer image.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    Both databases are SQLite files on local disk (the Calibre metadata.db and the app.db settings file), and the e-book
    files sit in the library folder next to metadata.db. There is no PostgreSQL, MySQL or S3 option. Deployz does not
    support SQLite and Fargate disk is ephemeral, so the library, users and settings would be lost at each restart. There
    is also no Dockerfile in the repository. This is the same case as new-144 (Grocy).
dockerfile:
  accept: []
  reject: []
  target: null
  context: .
  evidence:
    - {path: README.md, line: 127, quote: "- **Docker Hub**: [linuxserver/calibre-web](https://hub.docker.com/r/linuxserver/calibre-web)"}
    - {path: README.md, line: 72, quote: "pip install calibreweb"}
runtime: {accept: [python]}
port:
  accept: [8083]
  evidence:
    - {path: cps/constants.py, line: 141, quote: "DEFAULT_PORT        = 8083"}
    - {path: cps/constants.py, line: 142, quote: "env_CALIBRE_PORT = os.environ.get(\"CALIBRE_PORT\", DEFAULT_PORT)"}
bindAllInterfaces:
  value: true
  # With no listen address set, the server binds the IPv6 wildcard '::' (dual stack).
  evidence:
    - {path: cps/server.py, line: 142, quote: "address = ('::', self.listen_port)"}
startCommand:
  source: explicit
  accept: ["python cps.py", "python3 cps.py", "cps"]
  evidence:
    - {path: pyproject.toml, line: 124, quote: "cps = \"calibreweb.__main__:main\""}
    - {path: cps.py, line: 52, quote: "main()"}
healthPath:
