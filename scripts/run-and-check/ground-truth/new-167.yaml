id: new-167
repository: agno-agi/agno
commit: e8d7de8b300b62f109e3e272bf8011ad1268cd37
summary: >
  Agno is a Python agent framework and SDK (setuptools package `agno` in libs/agno, with a CLI `agno` from
  agnoctl, and agno-infra helpers). AgentOS is a FastAPI runtime that the developer builds from their own agent
  code with the library; the repo has no ready application to run. The only Dockerfiles are a sandbox runtime image
  in a cookbook folder and four system-test images in libs/agno/tests/system. The repo is a library monorepo.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    A framework and SDK published to PyPI (libs/agno, libs/agnoctl, libs/agno_infra). No Dockerfile at the repo root
    or in libs builds a product. The cookbook sandbox Dockerfile is a code-execution sandbox image for AgentCore or
    Docker, and the tests/system Dockerfiles wrap test scripts (gateway_server.py).
dockerfile:
  accept: []
  reject:
    - {path: cookbook/frameworks/sandbox/Dockerfile, reason: "sandbox runtime image for agent code execution (AgentCore server, port 8080, ARM64); an example, not an app"}
