id: new-147
repository: bluewave-labs/Checkmate
commit: 47bde889f685dfaee46fe01d0fcd9b29a5447748
summary: >
  Checkmate is an uptime and infrastructure monitoring tool: a React client and a Node/Express server in one
  multi-stage docker/Dockerfile that builds both from repo source and serves the client from the server on port
  52345. The only supported database is MongoDB (DB_TYPE enum has the single value mongodb; mongoose). Job
  scheduling runs in the same process by default (QUEUE_MODE primary).
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    MongoDB is the only database, and Deployz supports only RDS PostgreSQL and MySQL. The Dockerfile itself is a
    clean source build of one process, so the only blocker is the database.
