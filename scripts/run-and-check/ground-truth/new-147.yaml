blockers:
  expected:
    - "MongoDB is the only database (DbTypes is [\"mongodb\"]); Deployz supports PostgreSQL and MySQL only"
  mustNot:
    - "The second port 52346 must not count as the app port or block: it is a health listener for the worker (/livez, /readyz)"
    - "Missing Redis must not be reported as required"
    - "Dockerfile must not be reported as missing or broken: docker/Dockerfile builds client and server from source"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (52345)"
    - "Health path? (/api/v1/health)"
traps:
  - "docker/Dockerfile is at docker/ and uses the repo root as context (COPY client, COPY server)"
  - "Two ports are exposed: 52345 (API and UI) and 52346 (health server with /livez and /readyz, not on the app port)"
  - "A QUEUE_MODE=worker mode exists for scale-out, but the default runs the worker embedded"
  - "Checkmate is the server only; the Capture agent for remote hosts is a separate repository"
  - "Database must not be guessed from a PostgreSQL or MySQL-like driver: only mongoose is present"
crossReview:
