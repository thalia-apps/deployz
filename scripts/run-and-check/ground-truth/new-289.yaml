id: new-289
repository: thelounge/thelounge
commit: 70db8bcb6faf98e9c2a09018e26c28ae3eaa0b09
summary: >
  The Lounge is a self-hosted web IRC client written in TypeScript (Node 22 or later, Express and socket.io, a Vue
  client built by Vite). The package is started with `node index start` (npm script start). All state lives in one
  home directory (THELOUNGE_HOME, default ~/.thelounge): config.js, one JSON file per user in users/ that holds the
  user's IRC networks and password hash, per-user SQLite or text chat logs in logs/, and uploads. There is no
  PostgreSQL or MySQL option and no S3 option. The repository has no Dockerfile (the Docker image lives in the separate
  thelounge-docker repository).
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The core data (user accounts, their IRC network settings and the chat history) is written only to JSON and SQLite
    files in the local home directory, with no remote database or object-storage backend. A container with no persistent
    volume loses all accounts and networks at each task replacement. Settings are read from a config.js file in that
    directory and not from environment values. The public mode that keeps no users is also set only in config.js.
