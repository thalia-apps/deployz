blockers:
  expected:
    - "The repository is a meta-repository: core, server, sdkjs, web-apps and the other components are git submodules, not files in the tree"
    - "No Dockerfile exists in the repository; the Docker image is built from a different repository"
    - "No application source, package manifest or start command is present to build"
  mustNot:
    - "A port, database, Redis or start command must not be invented: nothing in this tree defines them"
    - "The Docker-DocumentServer repository must not be treated as part of this repository"
    - "The result must not be DEPLOYABLE or DEPLOYABLE_WITH_CHANGES: adding a Dockerfile cannot supply the missing submodule source"
vendorQuestions:
  legitimate:
    - "Which repository holds the Dockerfile for ONLYOFFICE Docs? (ONLYOFFICE/Docker-DocumentServer) Is that the repository to deploy?"
  unnecessary:
    - "Which port, health path or database engine? (the repository has none of these files)"
traps:
  - ".gitmodules lists core, core-fonts, dictionaries, sdkjs, server, web-apps and the plugin repositories with relative URLs (../core.git); the tree entries are gitlinks (mode 160000) with no files"
  - "The Readme describes a rich product (editors, collaboration, plugins) and a Docker install, which can look like a deployable web app, but the Docker image source is another repository (Readme.md:163)"
  - ".mrconfig and mr-update.sh are helper files for the mr (myrepos) tool to check out the sub-repositories"
openQuestions:
  - "Whether the customer wants the Docker-DocumentServer repository analysed instead; it was not read here"
