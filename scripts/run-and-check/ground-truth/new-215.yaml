id: new-215
repository: ONLYOFFICE/DocumentServer
commit: c4ad98db9f0dd84a9949566de399fc79698acd46
summary: >
  ONLYOFFICE/DocumentServer is a meta-repository. The tree holds only a Readme, a changelog, a roadmap, an .mrconfig
  helper and git submodule pointers (core, core-fonts, dictionaries, document-formats, document-templates, sdkjs,
  server, web-apps). It has no application source, no Dockerfile, no package manifest and no start command. The real
  source is in the submodule repositories, and the Readme points to a separate repository (Docker-DocumentServer) for
  the Docker image.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository contains no buildable code. All components are git submodules (.gitmodules) that a plain clone or
    GitHub archive does not include, and there is no Dockerfile. The Readme says the Docker image comes from another
    repository (ONLYOFFICE/Docker-DocumentServer) and that building from source follows a separate Help Center guide
    (C++ core, Node.js server, many components). Deployz needs a Dockerfile in the repository.
