blockers:
  expected:
    - "ClickHouse is a required analytics store (CLICKHOUSE_HOST and CLICKHOUSE_CREDS) and is outside the MVP datastores"
    - "The product is separate services with separate images: Next.js web (3000), Jawn API (8585) and the proxy worker; the browser calls Jawn directly"
    - "The root Dockerfile bundles PostgreSQL, ClickHouse and MinIO with local-disk data in one container, which is not a stateless web service"
  mustNot:
    - "PostgreSQL, Redis and S3 must not block by themselves: all are supported MVP resources"
    - "MinIO in docker-compose.yml must not block: S3 is supported"
    - "Mailhog (SMTP 1025, UI 8025) must not be treated as required: development mail catcher"
    - "The root Dockerfile must not be accepted as the production image only because it builds from source"
    - "Kafka and ZooKeeper in docker-compose.yml must not be reported as required: Jawn consumers run only when KAFKA_ENABLED is true, and it defaults to false"
vendorQuestions:
  legitimate:
    - "Can ClickHouse run outside Deployz (managed ClickHouse)?"
    - "Where is the Jawn API hosted, given the web app needs its public URL (NEXT_PUBLIC_HELICONE_JAWN_SERVICE)?"
  unnecessary:
    - "Which database for relational data? (PostgreSQL)"
    - "Is Redis needed? (optional)"
traps:
  - "The root Dockerfile looks like the single production image, but its first stage is the ClickHouse server image with PostgreSQL 17 and MinIO installed and supervisord as the process manager (Dockerfile:1-16,164)"
  - "The root Dockerfile and supervisord.conf set dummy keys and NODE_ENV=development for Jawn (supervisord.conf:44)"
  - "Redis appears in docker-compose.yml but Jawn only reads it when REDIS_HOST is set (valhalla/jawn/src/lib/clients/redisClient.ts:3)"
  - "docker/dockerfiles/dockerfile_worker runs wrangler dev --local, a Cloudflare Workers emulator, not a production Node server"
  - "docker-compose.yml also defines zookeeper and kafka services, but Kafka is off by default (valhalla/jawn/src/lib/clients/kafkaConsumers/KafkaConsumer.ts:16)"
crossReview:
  - {field: outcome.accept, change: "none: NOT_DEPLOYABLE confirmed", evidence: "ClickhouseWrapper.ts:13 CLICKHOUSE_HOST is a required string; root Dockerfile:1 and supervisord.conf:25 bundle ClickHouse"}
  - {field: blockers.mustNot, change: "added: Kafka and ZooKeeper in docker-compose.yml must not count as required", evidence: "docker/docker-compose.yml:426,438 services; KafkaConsumer.ts:16 KAFKA_ENABLED defaults to false"}
  - {field: traps, change: "added the optional Kafka trap", evidence: "KafkaConsumer.ts:16"}
  - {field: dockerfile/port/healthPath/redis/workers/storage, change: "none: confirmed", evidence: "valhalla/jawn/src/index.ts:144,254; redisClient.ts:3"}
  - {field: all, change: verified, evidence: "22 citations checked"}
