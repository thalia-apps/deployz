id: new-173
repository: Helicone/helicone
commit: 7720d286110391c3e3776bb46a18fb2a13f7567c
summary: >
  Helicone is an LLM observability and gateway platform made of a Next.js web app (web, port 3000), a TypeScript API
  server called Jawn (valhalla/jawn, port 8585), and a Cloudflare-Workers-style proxy worker. It stores relational data in
  PostgreSQL, request analytics in ClickHouse (required), request and response bodies in S3-compatible storage (MinIO in
  compose), and uses Redis for caching and limits. The root Dockerfile is an all-in-one bundle that installs PostgreSQL
  17, ClickHouse and MinIO in one container under supervisord. The split compose file is docker/docker-compose.yml.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    ClickHouse is a required analytics store (CLICKHOUSE_HOST and CLICKHOUSE_CREDS in Jawn and web) and is outside the MVP.
    The product is also several services with distinct images (web, Jawn, worker). The root Dockerfile does build from
    source, but it packs PostgreSQL, ClickHouse and MinIO into one image with data on local disk, which is not a
    deployable single web service.
dockerfile:
  accept: []
  reject:
    - {path: Dockerfile, reason: "all-in-one image: PostgreSQL 17, ClickHouse, MinIO, Jawn and web under supervisord with local-disk data; a local test bundle, not a service image"}
    - {path: docker/dockerfiles/dockerfile_web, reason: "web UI image only (port 3000); needs the separate Jawn API and ClickHouse"}
    - {path: valhalla/dockerfile, reason: "Jawn API image; the product also needs the web image and ClickHouse"}
    - {path: docker/dockerfiles/dockerfile_worker, reason: "wrangler dev --local proxy worker for local use"}
    - {path: valhalla/dockerfile_dev, reason: "development image"}
    - {path: docker/dockerfiles/dockerfile_migrations, reason: "separate migration runner image"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 1, quote: "FROM clickhouse/clickhouse-server:24.3.13.40 AS database-stage"}
    - {path: Dockerfile, line: 164, quote: "CMD [\"/usr/bin/supervisord\", \"-c\", \"/etc/supervisor/conf.d/supervisord.conf\"]"}
    - {path: docker/docker-compose.yml, line: 135, quote: "dockerfile: valhalla/dockerfile"}
    - {path: docker/docker-compose.yml, line: 177, quote: "dockerfile: docker/dockerfiles/dockerfile_web"}
