id: new-263
repository: ChatGPTNextWeb/NextChat
commit: 1d3dc331512929a4b1d3e82354e72acce33b5c7a
summary: >
  NextChat (ChatGPT Next Web) is a Next.js 14 web client for many LLM providers (OpenAI, Gemini, Anthropic, DeepSeek and
  others). Chat history stays in the browser; the Next.js server only proxies model API calls with keys from environment
  variables, checks an optional access code (CODE) and offers WebDAV and Upstash sync proxies. The root Dockerfile is a
  multi-stage build (yarn install, yarn build with output standalone) that runs `node server.js` on port 3000. No
  database, no Redis, no queue, no worker. An optional MCP feature writes app/mcp/mcp_config.json.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    The root Dockerfile builds the application from source and runs one standalone Next.js process on port 3000. The
    app needs no database, Redis, S3 or worker: the provider API keys, CODE and BASE_URL are environment variables, and
    the chat state is in the browser. Only Deployz settings are needed.
