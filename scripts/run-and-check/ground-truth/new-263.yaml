blockers:
  expected: []
  mustNot:
    - "Vercel and Tauri (src-tauri) files must not block: the Docker image is a plain Next.js server"
    - "The Upstash and WebDAV sync options must not be read as required datastores: they are optional external HTTP services"
    - "docker-compose.yml (the published image, two profiles of the same service) must not be read as several services"
    - "No database, Redis or S3 may be reported as required"
vendorQuestions:
  legitimate:
    - "Which model provider keys to set, and a CODE access password? (a public instance without CODE lets anyone spend the provider keys)"
  unnecessary:
    - "Which database? (none)"
    - "Is a worker or Redis needed? (no)"
    - "Which port? (3000)"
traps:
  - "The Dockerfile sets the yarn registry to registry.npmmirror.com (Dockerfile:11); it works from AWS but is an unusual mirror"
  - "HOSTNAME is set to 0.0.0.0 only in the PROXY_URL branch of the CMD (Dockerfile:50); the plain branch relies on the Next.js default"
  - "The Dockerfile declares empty ENV values for OPENAI_API_KEY, GOOGLE_API_KEY and CODE at build time (Dockerfile:18-20); they are runtime settings, not build inputs"
  - "An empty CODE means no access password: the server then spends the provider keys for any visitor (app/config/server.ts:104)"
  - "The MCP feature writes app/mcp/mcp_config.json at runtime and is off unless ENABLE_MCP=true (app/mcp/actions.ts:22)"
  - "package.json start is `next start`, but the image starts the standalone server with node server.js (package.json:10, Dockerfile:67)"
openQuestions: []
