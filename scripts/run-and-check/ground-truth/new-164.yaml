id: new-164
repository: QuivrHQ/quivr
commit: 1f72133e27e1cc0a7a05fb35a93df0f9e33136c4
summary: >
  The repository is now "Quivr V2", a Go search and monitoring engine (module github.com/The-Vibe-Company/quivr),
  not the old Python RAG app. One `quivr` binary has the commands api, worker and migrate. A working stack needs
  PostgreSQL 17, Temporal, S3-compatible storage (SeaweedFS), Weaviate, a TEI embedding server and a first-party
  plugin process, plus an optional Node UI (quivr-search). The README says it is in evaluation stage and must not be
  run in production.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The core API cannot run alone: it needs Temporal, Weaviate and a TEI embedding service next to PostgreSQL and
    S3. Deployz has no Temporal, Weaviate or embedding service, and runs one container with one ALB port. The engine
    has a REST API with no end-user UI in the core (quivr-search is a demo UI that calls it). The health probes are
    on a second port (8081).
dockerfile:
  accept: [deploy/images/quivr.Dockerfile]
  reject:
    - {path: cmd/quivr-autoscaler/Dockerfile, reason: "autoscaler helper binary, not the product"}
    - {path: deploy/mlflow/Dockerfile, reason: "MLflow tracking server for evaluation runs"}
    - {path: deploy/railway/core.Dockerfile, reason: "Railway all-in-one core entrypoint with plugins and tokenizer; Railway specific"}
    - {path: deploy/railway/web.Dockerfile, reason: "Node demo UI (quivr-search), a second service"}
    - {path: deploy/railway/temporal.Dockerfile, reason: "Temporal service image"}
    - {path: deploy/railway/postgres.Dockerfile, reason: "PostgreSQL service image"}
    - {path: deploy/railway/seaweed.Dockerfile, reason: "SeaweedFS (S3) service image"}
    - {path: deploy/railway/tei.Dockerfile, reason: "embedding server image"}
    - {path: deploy/cpu/embeddings.Dockerfile, reason: "embedding server image"}
    - {path: deploy/images/plugin.Dockerfile, reason: "plugin runtime image, a second process"}
  target: null
  context: .
  evidence:
    - {path: deploy/images/quivr.Dockerfile, line: 13, quote: "-o /out/quivr ./cmd/quivr"}
    - {path: deploy/images/quivr.Dockerfile, line: 35, quote: "EXPOSE 8080 8081"}
    - {path: deploy/images/quivr.Dockerfile, line: 37, quote: "CMD [\"api\"]"}
    - {path: README.md, line: 12, quote: "> **Status: evaluation stage.**"}
    - {path: README.md, line: 48, quote: "A single `quivr` binary provides the `api`, `worker` and `migrate` commands."}
