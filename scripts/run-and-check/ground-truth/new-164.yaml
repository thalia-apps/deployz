blockers:
  expected:
    - "Temporal, Weaviate and a TEI embedding server are required runtime services; Deployz provides none of them"
    - "The README says evaluation stage, API v0, not for production"
    - "Separate worker process and plugin processes beside the API"
  mustNot:
    - "PostgreSQL and S3 alone must not be called enough: Weaviate and Temporal are also required"
    - "The probe port 8081 must not be treated as the app port"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which Dockerfile? (several; none gives a complete product)"
    - "Which database? (PostgreSQL)"
traps:
  - "The repository name QuivrHQ/quivr suggests the old Python RAG chat app -> the current tree is a Go engine rewrite"
  - "deploy/images/quivr.Dockerfile builds from source and looks deployable -> it is only the API/worker binary, it needs five other services"
  - "Many deploy/railway Dockerfiles look like a full production topology -> they are separate services for Railway"
  - "Probes /healthz and /readyz are on port 8081, EXPOSE lists 8080 and 8081 (quivr.Dockerfile:35)"
  - "Default listen addresses are 127.0.0.1 (internal/app/run.go:468)"
  - "Image is FROM scratch with USER 10001 and no shell (quivr.Dockerfile:20, :34)"
