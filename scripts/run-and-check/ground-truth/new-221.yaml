id: new-221
repository: postgres/postgres
commit: 27c844034f827b3910bc8a358780c6609ba87a41
summary: >
  PostgreSQL is a C relational database server (autoconf and Meson builds). It is a datastore, not a web application.
  The postmaster speaks the PostgreSQL wire protocol on TCP 5432 and keeps data in a data directory (-D). The only
  Dockerfile is src/tools/oss-scanner/Dockerfile, a security-scanner CI build that runs the test suite; it is not a
  production server image.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository is the database engine itself. Clients use the PostgreSQL wire protocol on 5432, which is not HTTP,
    and the server needs a durable data directory that Fargate does not provide. The single Dockerfile builds and tests
    PostgreSQL for a scanner and does not produce a runnable server image. Deployz provides RDS PostgreSQL for apps
    that need a database; it does not host the engine.
dockerfile:
  accept: []
  reject:
    - {path: src/tools/oss-scanner/Dockerfile, reason: "OSS scanner CI image: builds PostgreSQL with Meson and runs meson test; has a $CONTAINER_REPO base and no server start"}
  target: null
  context: .
  evidence:
    - {path: src/tools/oss-scanner/Dockerfile, line: 28, quote: "FROM $CONTAINER_REPO/$CONTAINER_LINUX_CI"}
    - {path: src/tools/oss-scanner/Dockerfile, line: 58, quote: "RUN meson setup \\"}
    - {path: src/tools/oss-scanner/Dockerfile, line: 67, quote: "RUN meson test $MTEST_ARGS --suite setup --logbase setup"}
runtime: {accept: [c]}
port:
  accept: [5432]
  evidence:
    - {path: meson_options.txt, line: 33, quote: "option('pgport', type: 'integer', value: 5432,"}
    - {path: src/backend/utils/misc/postgresql.conf.sample, line: 66, quote: "#port = 5432                            # (change requires restart)"}
bindAllInterfaces:
  # The default listen_addresses is localhost.
  value: false
  evidence:
    - {path: src/backend/utils/misc/postgresql.conf.sample, line: 62, quote: "#listen_addresses = 'localhost'         # what IP address(es) to listen on;"}
