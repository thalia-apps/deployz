  evidence:
    - {path: src/backend/utils/misc/guc_parameters.dat, line: 585, quote: "{ name => 'data_directory', type => 'string', context => 'PGC_POSTMASTER', group => 'FILE_LOCATIONS',"}
env:
  required: []
  optional: []
  buildTime: []
  evidence: []
blockers:
  expected:
    - "The repository is the PostgreSQL database engine; clients use the PostgreSQL wire protocol on 5432, not HTTP"
    - "The server needs a durable data directory; Fargate task storage is ephemeral"
    - "The only Dockerfile is a scanner CI build and test image, not a server image"
  mustNot:
    - "RDS PostgreSQL 16 must not be offered as a way to deploy this repository: the repository is the engine itself"
    - "src/tools/oss-scanner/Dockerfile must not be accepted as the app Dockerfile"
vendorQuestions:
  legitimate:
    - "Is PostgreSQL being deployed as a database for another app? Use the managed RDS PostgreSQL in Deployz instead"
  unnecessary:
    - "Which port? (5432)"
    - "Which health path? (the server has no HTTP endpoint)"
traps:
  - "The oss-scanner Dockerfile looks like a build image but runs the tests and takes a base image from $CONTAINER_REPO (src/tools/oss-scanner/Dockerfile:28)"
  - "The default port is a build option (pgport), not a constant in a single source file (meson_options.txt:33)"
openQuestions:
  - "None that change the outcome"
