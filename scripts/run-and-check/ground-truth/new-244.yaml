id: new-244
repository: nextjs/saas-starter
commit: 6e33e58b1e553a41fe22e6b941a7229a002de361
summary: >
  Next.js SaaS Starter is a Next.js 15 (canary) template with email and password auth (JWT cookie signed with
  AUTH_SECRET), PostgreSQL through Drizzle ORM (POSTGRES_URL) and Stripe subscriptions (checkout, customer portal and
  a webhook route). The repository has no Dockerfile; the README deploys to Vercel. Migrations are Drizzle SQL files run
  with `drizzle-kit migrate`, and an optional seed creates a test user and two Stripe products. No Redis, no worker,
  no file storage.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]
  reason: >
    The architecture fits Deployz (one Next.js web process on port 3000, PostgreSQL, no Redis, no worker, no local
    data). But the full file list has no Dockerfile, so the vendor must add one (pnpm install, next build, next start).
    That is the "no Dockerfile" repository change, as new-156. The build also needs POSTGRES_URL and STRIPE_SECRET_KEY,
    because the root layout imports the database module (it throws when POSTGRES_URL is not set) and the pricing page is
    prerendered with Stripe API calls.
