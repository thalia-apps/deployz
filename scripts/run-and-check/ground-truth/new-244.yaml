env:
  required:
    - {name: POSTGRES_URL, secret: true, buildTime: true, note: "PostgreSQL URL; lib/db/drizzle.ts throws at import when it is missing, and the root layout imports it, so next build needs it too"}
    - {name: AUTH_SECRET, secret: true, buildTime: false, note: "HS256 key for the session JWT; with no value the key is empty"}
    - {name: STRIPE_SECRET_KEY, secret: true, buildTime: true, note: "Stripe API key; the pricing page lists Stripe prices and products when it is prerendered at build and every hour"}
    - {name: STRIPE_WEBHOOK_SECRET, secret: true, buildTime: false, note: "signing secret of the Stripe webhook that points to /api/stripe/webhook"}
    - {name: BASE_URL, secret: false, buildTime: false, note: "public HTTPS URL; used in Stripe checkout and portal return URLs"}
  optional: []
  buildTime: [POSTGRES_URL, STRIPE_SECRET_KEY]
