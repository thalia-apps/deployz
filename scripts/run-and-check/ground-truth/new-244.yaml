  - {field: outcome, change: 'none: one Next.js process with PostgreSQL and no other datastore; only the missing Dockerfile needs a change; analog new-156 (no Dockerfile at all, DWC only)', evidence: 'package.json:5-6; drizzle.config.ts:6'}
  - {field: all, change: verified, evidence: 25 citations checked}
