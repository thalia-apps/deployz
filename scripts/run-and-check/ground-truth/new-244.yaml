    - {path: .env.example, line: 6, quote: "BASE_URL=http://localhost:3000"}
    - {path: .env.example, line: 7, quote: "AUTH_SECRET=***"}
    - {path: lib/auth/session.ts, line: 6, quote: "const key = new TextEncoder().encode(process.env.AUTH_SECRET);"}
    - {path: lib/payments/stripe.ts, line: 10, quote: "export const stripe = new Stripe(process.env.STRIPE_SECRET_KEY!, {"}
    - {path: app/(dashboard)/pricing/page.tsx, line: 7, quote: "export const revalidate = 3600;"}
    - {path: app/layout.tsx, line: 4, quote: "import { getUser, getTeamForUser } from '@/lib/db/queries';"}
blockers:
  expected:
    - "No Dockerfile: the vendor must add a production Dockerfile (pnpm install, next build, next start on port 3000)"
  mustNot:
    - "Vercel deployment instructions must not block: the app is a normal Next.js server"
    - "Stripe must not block: it is an external API reached with keys"
    - "Redis, workers or S3 must not be required"
vendorQuestions:
  legitimate:
    - "How does the image get POSTGRES_URL and STRIPE_SECRET_KEY at build time? (next build imports the database module and prerenders the pricing page with Stripe calls)"
    - "Run the seed? (pnpm db:seed creates the user test@test.com with password admin123 and Stripe products)"
  unnecessary:
    - "Which database? (PostgreSQL only)"
    - "Is a worker or Redis needed? (no)"
traps:
  - "lib/db/setup.ts is an interactive local setup script (Stripe CLI login, local Docker Postgres) that writes .env; it is not a migration or start step (lib/db/setup.ts:42)"
  - "The seed creates a known login test@test.com / admin123; a public instance must not keep it (lib/db/seed.ts:43, :44)"
  - "next is a canary version (15.6.0-canary.59) with experimental ppr; the build can depend on that exact version (package.json:27, next.config.ts:5)"
  - "next build needs a reachable Stripe key and a POSTGRES_URL value; an empty build environment fails"
  - "drizzle-kit is in dependencies, so the runtime image can run the migration if node_modules is kept"
openQuestions: []
crossReview:
