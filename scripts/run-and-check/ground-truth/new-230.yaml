id: new-230
repository: requarks/wiki
commit: 0cc3ce1f8fef88457bd3a0dc222b1bad417ccc88
summary: >
  The default branch (scarlett) is the Wiki.js 3.0 beta: a Node.js 26 backend (Fastify, Drizzle) in backend/, a Vue and
  Vite frontend in frontend/, and page blocks in blocks/. It stores everything in PostgreSQL by default, runs
  migrations at startup, serves HTTP on 3000 and needs a config.yml file. The only image Dockerfile, dev/build/Dockerfile,
  does not build from source: it copies assets/ and blocks/compiled/, which are built by the CI workflow before docker
  build and are not in the repository. The README says this is a beta that is not for production. The backend refuses
  to start on PostgreSQL older than 17.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The backend exits at startup when PostgreSQL is older than 17 ("Requires >= 17"), and Deployz offers RDS PostgreSQL
    16 only. In addition, dev/build/Dockerfile cannot build from a plain clone: its COPY ./assets and
    ./blocks/compiled sources are generated by npm run build in frontend/ and blocks/ in the CI workflow, and /assets
    is git-ignored. A repository change (a multi-stage Dockerfile) would be needed on top of the database version limit.
    The PostgreSQL 17 requirement is the decisive blocker; the app is also a beta marked not for production.
dockerfile:
  accept: []
  reject:
    - {path: dev/build/Dockerfile, reason: "release image, but not buildable from the repository alone: it copies ./assets and ./blocks/compiled that the CI workflow builds before docker build"}
    - {path: .devcontainer/Dockerfile, reason: "development container image"}
  target: null
  context: .
  evidence:
    - {path: dev/build/Dockerfile, line: 23, quote: "COPY --chown=node:node ./assets ./assets"}
    - {path: dev/build/Dockerfile, line: 24, quote: "COPY --chown=node:node ./blocks/compiled ./blocks/compiled"}
    - {path: .github/workflows/build.yml, line: 147, quote: "file: dev/build/Dockerfile"}
    - {path: .gitignore, line: 21, quote: "/assets"}
runtime: {accept: [node]}
port:
  accept: [3000]
  evidence:
    - {path: dev/build/config.yml, line: 1, quote: "port: 3000"}
    - {path: dev/build/Dockerfile, line: 114, quote: "EXPOSE 3000"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: dev/build/config.yml, line: 2, quote: "bindIP: 0.0.0.0"}
startCommand:
  source: image
  accept: ["node --no-experimental-webstorage backend"]
  evidence:
    - {path: dev/build/Dockerfile, line: 136, quote: "CMD [\"node\", \"--no-experimental-webstorage\", \"backend\"]"}
    - {path: backend/package.json, line: 28, quote: "\"start\": \"cd .. && node --no-experimental-webstorage backend\","}
healthPath:
  accept: ["/_live", "/_ready"]
  evidence:
    - {path: backend/index.ts, line: 331, quote: "livenessEndpoint: '/_live',"}
    - {path: backend/index.ts, line: 332, quote: "readinessEndpoint: '/_ready',"}
database:
  status: required
  engines: [postgres]
  default: postgres
  deployzEngine: postgres
  selectBy: {}
  connectionVars: [DB_HOST, DB_PORT, DB_USER, DB_PASS, DB_NAME, DB_SCHEMA, DB_SSL]
  # PostgreSQL 17 or later is required; the backend exits on 16. Extensions ltree and pg_trgm are created at start.
  evidence:
    - {path: backend/core/db.ts, line: 185, quote: "if (dbVersion.major < 17) {"}
    - {path: backend/core/db.ts, line: 187, quote: "is too old and unsupported by Wiki.js. Requires >= 17. Exiting..."}
    - {path: config.sample.yml, line: 16, quote: "# PostgreSQL 17 or later required"}
    - {path: dev/build/config.yml, line: 4, quote: "host: '$(DB_HOST)'"}
migrations:
  mode: startup
  accept: []
  evidence:
    - {path: backend/core/db.ts, line: 352, quote: "WIKI.logger.info('Ensuring DB migrations have been applied...')"}
redis:
  status: none
  selectBy: {}
  evidence: []
workers:
  status: embedded
  commands: []
  # The scheduler runs jobs in worker threads of the same process (scheduler.workers: auto).
  evidence:
    - {path: dev/build/config.yml, line: 15, quote: "workers: auto"}
scheduledJobs:
  status: none
  items: []
  evidence: []
storage:
  local: conditional
  paths: [/wiki/data/content, /wiki/data/repo]
  s3: native
  s3SelectBy: {}
  # The db storage target is always on and keeps asset bytes in PostgreSQL. disk, git and sftp targets use local disk; s3, azure and gcs targets are optional and can use the task role.
  evidence:
    - {path: .claude/rules/storage.md, line: 21, quote: "| `db` | Enabled on every site and impossible to turn off — bytes in the asset's own row |"}
    - {path: .claude/rules/storage.md, line: 24, quote: "| `s3` | Amazon S3 **and anything speaking its API** — R2, Spaces, B2, Wasabi, MinIO |"}
    - {path: dev/build/Dockerfile, line: 111, quote: "VOLUME [\"/wiki/data/content\"]"}
env:
  required:
    - {name: DB_HOST, secret: false, buildTime: false, note: "read by the image config.yml; PostgreSQL 17 or later"}
    - {name: DB_USER, secret: false, buildTime: false, note: "database user"}
    - {name: DB_PASS, secret: true, buildTime: false, note: "database password (or DB_PASS_FILE)"}
    - {name: DB_NAME, secret: false, buildTime: false, note: "database name"}
    - {name: DB_SSL, secret: false, buildTime: false, note: "no default in config.yml; set true or false"}
  optional: [DB_PORT, DB_SCHEMA, LOG_LEVEL, LOG_FORMAT, WIKI_PORT, DB_PASS_FILE]
  buildTime: []
  evidence:
    - {path: dev/build/config.yml, line: 7, quote: "pass: '$(DB_PASS)'"}
    - {path: dev/build/config.yml, line: 10, quote: "ssl: $(DB_SSL)"}
    - {path: backend/core/config.ts, line: 76, quote: "if (process.env.DB_PASS_FILE) {"}
blockers:
  expected:
    - "The backend requires PostgreSQL 17 or later and exits on 16; Deployz provides PostgreSQL 16"
    - "No Dockerfile builds the app from the repository: dev/build/Dockerfile needs ./assets and ./blocks/compiled that are built outside docker"
    - "README marks the 3.0 branch as BETA, not for production use"
  mustNot:
    - "Redis must not be reported as required: the repository does not use it"
    - "Durable local disk must not be reported as required: assets default to PostgreSQL (db target)"
    - "The 2.x stable release (requarks/wiki-v2) must not be confused with this branch"
    - "MySQL, MariaDB, MSSQL and SQLite must not be expected: Wiki.js 3 supports PostgreSQL only"
vendorQuestions:
  legitimate:
    - "Is the Wiki.js 2.x stable repository (requarks/wiki-v2) wanted instead of this 3.0 beta branch?"
  unnecessary:
    - "Which port? (3000)"
    - "Is Redis needed? (no)"
    - "Is a worker service needed? (no, embedded)"
traps:
  - "dev/build/Dockerfile looks like the production Dockerfile but is a packaging step after a CI build: no stage compiles the frontend or blocks (dev/build/Dockerfile:23)"
  - "config.yml is git-ignored and required; without it the process exits (backend/core/config.ts:50); the image ships dev/build/config.yml that reads DB_* variables"
  - "The image runs npm ci for the backend but also installs Puppeteer with a headless Chrome at build time, which makes the image large and the build long (dev/build/Dockerfile:59)"
  - "The backend needs Node 26 or later (backend/package.json:116)"
  - "The README caution says this branch is a beta (README.md:22); the stable 2.x code is in requarks/wiki-v2"
  - "WebSocket upgrades are used for collaborative editing; they pass an ALB without extra setup"
openQuestions:
  - "Whether Deployz would accept a PostgreSQL 17 database in a later MVP version; today only 16 is offered"
