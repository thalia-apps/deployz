id: new-284
repository: usertour/usertour
commit: 156c0b0bcd4bc8f1c22a7c7eb72881d418a96ee9
summary: >
  Usertour is a product-onboarding (user tour) platform: a React web app and an SDK built to static files, and a NestJS
  server with Prisma on PostgreSQL, Redis (BullMQ queues, locks, socket adapter) and an optional S3 bucket. The root
  Dockerfile builds everything and runs scripts/start.sh as CMD. That script starts nginx (static web app and SDK, proxy
  to the Nest server) on PORT 80, runs `prisma migrate deploy` and `prisma db seed`, then `exec node dist/main` on
  port 3000. The queue processors run inside the Nest process.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    One image with a start script that fronts the Nest server with nginx on port 80. DATABASE_URL selects PostgreSQL
    (the only engine), the Redis_* values select Redis, and migrations run at start. S3 is optional (a guard rejects
    only the upload routes). nginx is the static file server for the web app and the proxy for the API in the same
    container, so no repository change is needed. The vendor types JWT_SECRET, API_URL and the optional email and
    S3 values.
