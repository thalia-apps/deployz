blockers:
  expected: []
  mustNot:
    - "nginx in the image must not be read as a second application service: it is the static file server and proxy started by the CMD script"
    - "docker-compose.yml (app, postgres, redis) must not be read as a multi-service app: postgres and redis are the datastores Deployz provides"
    - "S3 must not be read as required: the guard fails only the upload routes"
    - "The BullMQ queue processors are in the Nest process and must not be read as a separate worker"
vendorQuestions:
  legitimate:
    - "What is the public URL of the instance? (API_URL)"
    - "Which mail server sends invitations? (EMAIL_HOST and related, optional)"
    - "Is a bucket for uploads wanted? (AWS_S3_*, optional)"
  unnecessary:
    - "Which database? (PostgreSQL only)"
    - "Which port? (80)"
    - "Is a migration command needed? (start.sh runs prisma migrate deploy)"
traps:
  - "The Redis variables are spelled Redis_HOST, Redis_PORT, Redis_PASS (mixed case), not REDIS_URL (apps/server/src/modules/common/config/config.ts:39)"
  - "JWT_SECRET defaults to the public string 'test' (config.ts:104)"
  - "start.sh runs nginx in the background, then migrations and seed, then Node; if migration fails the container exits (scripts/start.sh:44-46)"
  - "The web config.js is generated from the VITE_ names in apps/web/.env.example and filled by envsubst at start (Dockerfile:25, scripts/start.sh:4)"
  - "The deploy-time health check should use /api/health; /api/health/ready also needs Redis and PostgreSQL (health.controller.ts:36)"
openQuestions: []
