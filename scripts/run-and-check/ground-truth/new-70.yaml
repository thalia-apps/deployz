    - {path: internal/config/config_db.go, line: 727, quote: 'const PostgresMinVersion = "v16"'}
    - {path: internal/config/config_db.go, line: 679, quote: 'case !c.IsDatabaseVersion("v10.0.0"):'}
    - {path: internal/config/config_db.go, line: 680, quote: 'MySQL %s is not supported'}
    - {path: pkg/dsn/driver.go, line: 45, quote: 'DriverPostgres: "sslmode=disable TimeZone=UTC",'}
    - {path: internal/config/config_db.go, line: 184, quote: "return c.options.DatabaseDSN"}
