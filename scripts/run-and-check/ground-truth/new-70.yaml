blockers:
  expected:
    - "Photo originals, import and storage folders are local-disk only; there is no S3 or object-store driver, and Deployz has no persistent volume (EFS), so the library is lost at each task restart or deploy"
    - "The source build (make all install -> scripts/build.sh) runs git describe under set -e and fails in a repo archive without .git"
  mustNot:
    - "SQLite default must not block by itself: PostgreSQL 16 can be selected with PHOTOPRISM_DATABASE_DRIVER=postgres (experimental)"
    - "Redis, a queue or a separate worker must not be required: workers and the auto-indexer run inside the web process"
    - "Port 2342 and 0.0.0.0 binding must not be raised as problems: they are the image defaults"
    - "The root Dockerfile being a development image is not itself the blocker; the production Dockerfiles live under docker/photoprism"
    - "TensorFlow and ONNX model downloads at build time must not be called a prebuilt app artifact: they are dependencies fetched by the build"
vendorQuestions:
  legitimate:
    - "Is losing uploads and originals at every redeploy acceptable (demo only), or does the user have an external durable storage plan?"
    - "Which public URL (PHOTOPRISM_SITE_URL) and which admin password should be used?"
  unnecessary:
    - "Which port? (2342 in the image and defaults)"
    - "Who runs migrations? (the app migrates its schema at start)"
    - "Is a worker process needed? (embedded)"
    - "Is Redis needed? (no Redis support)"
    - "Health path? (/api/v1/status, /livez)"
traps:
  - "Root Dockerfile -> a development image (FROM photoprism/develop, DOCKER_ENV=develop), not the production build; compose.yaml is marked test and development only (Dockerfile:2, compose.yaml:1)"
  - "docker/photoprism/resolute, questing, plucky, oracular and jammy Dockerfiles end after COPY --from=build with no ENTRYPOINT or CMD; noble and bookworm have CMD photoprism start (docker/photoprism/resolute/Dockerfile:106, docker/photoprism/noble/Dockerfile:110)"
  - "compose.mysql.yaml uses mysql:8 for tests, but the app refuses MySQL below 10.0.0 in its version check (internal/config/config_db.go:679)"
  - "PHOTOPRISM_DATABASE_SERVER/NAME/USER/PASSWORD for postgres build a DSN with sslmode=disable (pkg/dsn/driver.go:45); RDS needs a custom DSN with sslmode=require"
  - "PHOTOPRISM_INIT=https in the image is a first-start init target, not an HTTPS listener; the listener stays HTTP without certificate files and a https site URL (internal/config/config_tls.go:124)"
  - "A site URL with https:// plus PHOTOPRISM_TLS_EMAIL turns on Let's Encrypt on 443 inside the container; leave it unset behind the ALB (internal/server/autotls.go:27)"
  - "/ serves the SPA and may redirect to the login page, so it is not a good health path; use /api/v1/status or /livez (internal/server/routes.go:231)"
  - "make all install downloads TensorFlow, models and images from dl.photoprism.app, cdn.photoprism.app and Hugging Face during the build (scripts/dist/install-tensorflow.sh:107, Makefile:358)"
openQuestions:
  - "Whether a read-only or demo deployment with ephemeral originals should count as DEPLOYABLE_WITH_CHANGES; chosen NOT_DEPLOYABLE because durable storage of photos is the core function"
  - "Whether a Dockerfile that adds git init (or sets a fake describe) before make install would make the build work; not verified"
crossReview:
  - {field: dockerfile, change: "none: noble and bookworm are the production Dockerfiles that build from source (COPY . ., make all install) and have a CMD; the root Dockerfile has no ENTRYPOINT or CMD and is a develop image; the other distro files end without a CMD", evidence: "docker/photoprism/noble/Dockerfile:16,19,110; docker/photoprism/bookworm/Dockerfile:109; Dockerfile:2"}
  - {field: blockers (.git), change: "none: confirmed; scripts/build.sh runs BUILD_VERSION=$(git describe --always) under set -e, and make install calls it for the prod build", evidence: "scripts/build.sh:8,13; Makefile:356"}
  - {field: healthPath, change: "none: /livez, /health, /healthz and /api/v1/status return 200 JSON; no redirect middleware runs before them (the Security middleware only sets headers)", evidence: "internal/server/start.go:194-201; internal/server/security.go"}
  - {field: database, change: "none: MySQL 8 is refused (below v10.0.0); PostgreSQL 16+ is accepted as experimental", evidence: "internal/config/config_db.go:679-680,698"}
  - {field: all, change: verified, evidence: "47 citations checked"}
