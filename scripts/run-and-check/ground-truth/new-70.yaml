id: new-70
repository: photoprism/photoprism
commit: 014f1ca99ea6adbac697b0bc458cd2de81013949
summary: >
  PhotoPrism photo management app (Go single binary with built-in web server, Vue frontend, TensorFlow/ONNX models).
  One process serves UI, API, WebDAV and runs the background workers. It stores the photo library (originals,
  import, sidecar, cache) on a local folder and has no S3 support. The root Dockerfile is a development image
  (FROM photoprism/develop, DOCKER_ENV=develop). Production images are docker/photoprism/<distro>/Dockerfile and
  build the app from source with `make all install`. The index database is SQLite by default; PostgreSQL 16+
  (experimental) or MariaDB 10.5.12+ can be selected. MySQL 8 is refused by the version check.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The product is a photo library whose originals are written only to a local folder (PHOTOPRISM_ORIGINALS_PATH,
    default /photoprism/originals) and the storage folder (sidecar, cache, thumbnails, backups). There is no S3 or
    object-store driver, so on Fargate with ephemeral disk every upload and import is lost at the next deploy or
    task restart, even with an external PostgreSQL. Additional problems: the source build runs
    scripts/build.sh which calls git describe under set -e (fails in a repo archive without .git), PostgreSQL is
    experimental and the generated DSN uses sslmode=disable (RDS forces TLS), and MySQL 8 is refused.
