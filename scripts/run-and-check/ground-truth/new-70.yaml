database:
  status: required
  engines: [sqlite, mysql, mariadb, postgres]
  default: sqlite
  deployzEngine: postgres
  selectBy: {PHOTOPRISM_DATABASE_DRIVER: postgres}
  connectionVars: [PHOTOPRISM_DATABASE_DSN, PHOTOPRISM_DATABASE_SERVER, PHOTOPRISM_DATABASE_NAME, PHOTOPRISM_DATABASE_USER, PHOTOPRISM_DATABASE_PASSWORD]
  # PostgreSQL 16+ is accepted but marked experimental. Without a DSN the app builds a URI with sslmode=disable, so
  # RDS PostgreSQL (TLS forced) needs PHOTOPRISM_DATABASE_DSN as a postgres:// URI with sslmode=require.
  # MySQL 8 reports v8.x, which is below the v10.0.0 floor of the version check, so it fails at start.
  evidence:
    - {path: internal/config/flags.go, line: 1044, quote: 'database `DRIVER` (sqlite, mysql, postgres)'}
    - {path: internal/config/flags.go, line: 1045, quote: 'Value:   "sqlite",'}
