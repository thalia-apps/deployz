id: new-265
repository: vercel/chatbot
commit: c2f8235e1f3ea903ad8b7f61447c4f74164b5c58
summary: >
  Chatbot (formerly ai-chatbot) is the Vercel AI chat template: a Next.js 16 app (next-auth with guest and credentials
  login, Drizzle ORM on PostgreSQL through POSTGRES_URL, the AI SDK with the Vercel AI Gateway). The repository has no
  Dockerfile, compose file or Procfile of any kind. `pnpm build` runs the Drizzle migration (skipped when POSTGRES_URL
  is not set) and then `next build`; `pnpm start` is `next start`. REDIS_URL is optional (rate limit and resumable
  streams). Image uploads call Vercel Blob (BLOB_READ_WRITE_TOKEN), which is not S3. The README deploys to Vercel.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]
  reason: >
    The architecture fits Deployz: one Next.js web process on port 3000, PostgreSQL, optional Redis, no worker and no
    local data. The full file list has no Dockerfile, so the vendor must add one (pnpm install, next build, next
    start). That is the "no Dockerfile" repository change, as new-244 and new-156. File upload uses Vercel Blob, so
    uploads need a code change to S3; the chat itself works without it.
dockerfile:
  accept: []
  reject: []
  target: null
  context: .
  evidence:
