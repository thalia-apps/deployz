  evidence:
    - {path: backend/src/lib/config/env.ts, line: 164, quote: "OBJECT_STORAGE_S3_BUCKET: zpStr("}
env:
  required:
    - {name: ENCRYPTION_KEY, secret: true, buildTime: false, note: "root encryption key; documented as 16-byte hex (openssl rand -hex 16); losing it makes stored secrets unreadable"}
    - {name: AUTH_SECRET, secret: true, buildTime: false, note: "JWT signing secret"}
    - {name: DB_CONNECTION_URI, secret: true, buildTime: false, note: "PostgreSQL connection string"}
    - {name: REDIS_URL, secret: false, buildTime: false, note: "Redis or Valkey URL"}
    - {name: SITE_URL, secret: false, buildTime: false, note: "public https URL; used for links in email and redirects"}
  optional: [PORT, HOST, DB_READ_REPLICAS, SMTP_HOST, SMTP_PORT, TELEMETRY_ENABLED, INFISICAL_RUN_MODES, OBJECT_STORAGE_S3_BUCKET, OBJECT_STORAGE_S3_REGION, REDIS_SENTINEL_HOSTS]
  buildTime: [INFISICAL_CLI_VERSION, INFISICAL_PLATFORM_VERSION, POSTHOG_API_KEY]
  evidence:
    - {path: docs/self-hosting/configuration/envars.mdx, line: 7, quote: "at least `ENCRYPTION_KEY`, `AUTH_SECRET`, `DB_CONNECTION_URI`, and `REDIS_URL` must be defined."}
    - {path: backend/src/lib/config/env.ts, line: 414, quote: "SITE_URL: zpStr(z.string().transform((val) => (val ? removeTrailingSlash(val) : val))).optional(),"}
    - {path: Dockerfile.standalone-infisical, line: 5, quote: "ARG INFISICAL_CLI_VERSION=0.44.6"}
blockers:
  expected:
    - "PostgreSQL and Redis are both required; the process exits at start when REDIS_URL (or sentinel or cluster hosts) is missing"
    - "ENCRYPTION_KEY and AUTH_SECRET must be set once and kept; no safe default exists"
  mustNot:
    - "Port must not be reported as 4000: that is backend/Dockerfile (API only); the standalone image uses 8080"
    - "The FIPS Dockerfile must not be the default image"
    - "MySQL must not be expected: PostgreSQL only"
    - "A separate worker service must not be required: queues run in the web process by default"
    - "Durable local disk must not be reported: no volume is needed"
vendorQuestions:
  legitimate:
    - "Which public URL (SITE_URL) will the site use, and who sets the first admin account?"
    - "Where are ENCRYPTION_KEY and AUTH_SECRET stored so they survive redeploys?"
  unnecessary:
    - "Which Dockerfile? (Dockerfile.standalone-infisical)"
    - "Is Redis needed? (yes)"
    - "Is a worker service needed? (no, embedded by default)"
traps:
  - "backend/Dockerfile looks like the production backend image but has no frontend and listens on 4000 (backend/Dockerfile:112)"
  - "The standalone build sets NODE_OPTIONS --max-old-space-size=8192 for the frontend and backend builds, so the build host needs several GB of memory (Dockerfile.standalone-infisical:41)"
  - "The build downloads the Oracle Instant Client and installs the infisical CLI from artifacts-cli.infisical.com, so it needs outbound internet (Dockerfile.standalone-infisical:74, :207)"
  - "The entrypoint runs update-ca-certificates; the image runs as UID 1001 and chowns /etc/ssl/certs for that reason (standalone-entrypoint.sh:3)"
  - "DB_CONNECTION_URI defaults to a string built from DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME (env.ts:259)"
  - "docker-compose.prod.yml maps host port 80 to 8080 and uses postgres:14 (docker-compose.prod.yml:16)"
openQuestions:
  - "Whether the Deployz build host has enough memory for the 8 GB Node heap setting of the standalone build"
crossReview:
  - {field: outcome.accept, change: "none: [DEPLOYABLE] confirmed against docs/product/mvp-scope.md and the fix-class policy", evidence: "summary and blockers.expected of this file"}
  - {field: all, change: verified, evidence: "22 citations checked against the pinned commit by script (path, line, quote)"}
