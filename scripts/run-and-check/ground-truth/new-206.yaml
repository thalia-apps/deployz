id: new-206
repository: Infisical/infisical
commit: f943528f8f51d469fa6ef4ccb62d84d14b291cb8
summary: >
  Infisical is a secrets management platform: a Fastify and TypeScript backend plus a Vite React frontend. The root
  Dockerfile.standalone-infisical builds both from source into one image where the backend serves the built frontend on
  port 8080. PostgreSQL and Redis are required. The backend runs database migrations at startup and runs background
  queues (BullMQ) in the same process by default. Docker Compose, Kubernetes and an ECS guide are in docs/.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    One image from a repository Dockerfile serves the whole product (API and UI) on one HTTP port, with a health route
    that needs no login. It needs only PostgreSQL, Redis and four secrets (ENCRYPTION_KEY, AUTH_SECRET,
    DB_CONNECTION_URI, REDIS_URL). Migrations and queue workers run inside the web process. No durable local disk is
    used. Docs include an AWS ECS guide that uses the same image and /api/status.
dockerfile:
  accept: [Dockerfile.standalone-infisical]
  reject:
    - {path: backend/Dockerfile, reason: "backend API only: no frontend, listens on 4000; the standalone image is the full product"}
    - {path: Dockerfile.fips.standalone-infisical, reason: "FIPS variant of the standalone image with a different crypto stack; the plain standalone image is the default"}
    - {path: backend/Dockerfile.dev, reason: "development image"}
    - {path: backend/Dockerfile.dev.fips, reason: "FIPS development image"}
    - {path: backend/Dockerfile.fips-toolchain, reason: "build toolchain image for FIPS"}
    - {path: backend-go/Dockerfile.dev, reason: "development image for the Go helper service"}
    - {path: backend-go/Dockerfile.dev.fips, reason: "FIPS development image for the Go helper service"}
    - {path: backend-go/docker-test/Dockerfile, reason: "test image"}
    - {path: frontend/Dockerfile.dev, reason: "development image"}
    - {path: docs/Dockerfile, reason: "documentation site image"}
    - {path: tests/cmd/fakenet/Dockerfile, reason: "test helper image"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile.standalone-infisical, line: 189, quote: "FROM base AS production"}
    - {path: Dockerfile.standalone-infisical, line: 276, quote: "COPY --from=frontend-runner /app ./backend/frontend-build"}
    - {path: .github/workflows/release-standalone-docker-img-postgres-offical.yml, line: 85, quote: "file: Dockerfile.standalone-infisical"}
    - {path: backend/Dockerfile, line: 112, quote: "EXPOSE 4000"}
