env:
  required:
    - {name: DATABASE_URL, secret: true, buildTime: false, note: "Postgres connection string with the password; the image sets DATABASE_DRIVER=node"}
    - {name: KEY_VAULTS_SECRET, secret: true, buildTime: false, note: "server throws without it; generate with openssl rand -base64 32"}
    - {name: AUTH_SECRET, secret: true, buildTime: false, note: "Better Auth secret; the Docker build and docs require it in server DB mode"}
    - {name: APP_URL, secret: false, buildTime: false, note: "public HTTPS URL; used as Better Auth baseURL and trusted origin; default is http://localhost:3210"}
    - {name: FTS_SEARCH_PROVIDER, secret: false, buildTime: false, note: "set to pg_like; the default pg_search needs the ParadeDB extension, which RDS lacks, and the migration step then exits with an error"}
  optional: [REDIS_URL, REDIS_TLS, REDIS_PREFIX, S3_BUCKET, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_REGION, S3_ENABLE_PATH_STYLE, S3_PUBLIC_DOMAIN, S3_SET_ACL, OPENAI_API_KEY, ANTHROPIC_API_KEY, AUTH_SSO_PROVIDERS, AUTH_EMAIL_VERIFICATION, AUTH_DISABLE_EMAIL_PASSWORD, AUTH_ALLOWED_EMAILS, JWKS_KEY, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM, RESEND_API_KEY, QSTASH_TOKEN, ENABLE_AGENT_GATEWAY, AGENT_GATEWAY_URL, PROXY_URL, SEARXNG_URL, FEATURE_FLAGS, DATABASE_STATEMENT_TIMEOUT]
  buildTime: []
  evidence:
    - {path: scripts/dockerPrebuild.mts, line: 29, quote: "if (!process.env.AUTH_SECRET) {"}
    - {path: scripts/dockerPrebuild.mts, line: 33, quote: "if (!process.env.KEY_VAULTS_SECRET) {"}
    - {path: Dockerfile, line: 47, quote: "AUTH_SECRET=\"use-for-build\""}
    - {path: packages/database/src/core/web-server.ts, line: 16, quote: "if (!serverDBEnv.KEY_VAULTS_SECRET) {"}
    - {path: src/libs/better-auth/define-config.ts, line: 140, quote: "baseURL: appEnv.APP_URL,"}
    - {path: packages/env/src/auth.ts, line: 296, quote: "ENABLE_OIDC: !!process.env.JWKS_KEY,"}
blockers:
  expected: []
  mustNot:
    - "pgvector must not block: RDS PostgreSQL 16 supports the vector extension and the migration creates it"
    - "Redis must not be required: agent runtime falls back to in-memory managers"
    - "S3 must not be required: only file upload to the server is off without static S3 keys"
    - "The many provider API keys in Dockerfile ENV, .env.example and the compose file must not be required: users add them in the UI or env"
    - "Elasticsearch, searxng, rustfs and the lobehub-gateway image in the compose file must not be blockers: all optional, not needed for the app"
    - "Build-time Dockerfile ENV placeholders (DATABASE_URL, AUTH_SECRET) must not count as required runtime values"
vendorQuestions:
  legitimate:
    - "Is server file upload needed? It requires static S3 keys and an endpoint, which Deployz cannot give with the bucket task role"
    - "Which model provider keys (OPENAI_API_KEY and others) should be preset? The app runs without them; users can add keys in the UI"
  unnecessary:
    - "Which port? (3210 in the Dockerfile)"
    - "Who runs migrations? (the launcher runs docker.cjs on every start)"
    - "Is pgvector needed on RDS? (available on RDS PostgreSQL 16, the migration creates it)"
    - "Is a worker or scheduler needed? (none in the web image; QStash is optional)"
traps:
  - "docker-compose/deploy lists paradedb, redis, rustfs, elasticsearch, searxng and a lobehub-gateway image -> self-host stack, only Postgres is needed (docker-compose/deploy/docker-compose.yml:58-74)"
  - "Default FTS provider pg_search needs the ParadeDB extension -> the migration step exits on RDS unless FTS_SEARCH_PROVIDER=pg_like (scripts/migrateServerDB/pgSearchGuard.js:13, :102)"
  - "Dockerfile builds extra esbuild bundles (elasticsearch sync, reindex, cleanup) -> optional one-off tools, not services (Dockerfile:100-103)"
  - "Final stage is FROM scratch with ENTRYPOINT /bin/node -> a normal image, CMD runs startServer.js (Dockerfile:152, :371)"
  - "Build needs NODE_OPTIONS max-old-space-size=8192 and a full pnpm install of the monorepo -> the build needs much memory (Dockerfile:60)"
  - "/ is rewritten or redirected by the locale/auth proxy -> use /api/version for the health check (src/proxy.ts:8)"
openQuestions:
  - "Whether the Deployz DATABASE_URL with sslmode=require works with node-postgres and the RDS CA in this image (NODE_EXTRA_CA_CERTS is empty, --use-openssl-ca is set)"
  - "Whether chat works well for users without S3 (avatars and file attachments are limited)"
