id: new-80
repository: lobehub/lobehub
commit: b144f3f4c88c8962d9ef32ecd12d2c33e5dc9430
summary: >
  LobeHub (LobeChat) AI chat workspace: Next.js standalone server plus Vite SPAs, built by the root Dockerfile.
  Server DB mode: one Node web process on port 3210 with PostgreSQL (needs the pgvector extension). The image launcher
  runs the Drizzle migration on every start, then the server. Redis, S3, Elasticsearch, QStash and the gateway
  container are optional. The default full-text search needs the ParadeDB pg_search extension, which RDS does not
  have, so FTS_SEARCH_PROVIDER=pg_like must be set. The S3 client needs static keys and an endpoint, so the
  Deployz bucket (task role) cannot be used; file upload to the server is then off.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    One image, one HTTP port, Postgres and startup migration fit Deployz. Required changes are env only:
    DATABASE_URL, KEY_VAULTS_SECRET, AUTH_SECRET, APP_URL and FTS_SEARCH_PROVIDER=pg_like (default pg_search fails the
    start on RDS). S3 uploads cannot be enabled (static keys required), a degraded but non-core feature. Redis is
    optional; agent runs use in-memory state without it. Gateway Mode needs a second image and stays off.
