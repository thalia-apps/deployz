storage:
  local: none
  paths: []
  s3: native
  s3SelectBy: {S3_BUCKET: bucket, S3_ENDPOINT: "https://s3.region.amazonaws.com", S3_ACCESS_KEY_ID: key, S3_SECRET_ACCESS_KEY: secret}
