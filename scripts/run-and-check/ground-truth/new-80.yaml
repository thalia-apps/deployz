healthPath:
  accept: ["/api/version"]
  # /api/version is a public route and the proxy matcher skips /api, so it is not redirected to /signin and returns JSON 200
  # with no DB check. "/" is rewritten/redirected by the locale and auth proxy.
  evidence:
