  reject:
    - {path: docker-compose/deploy/docker-compose.yml, reason: "self-host compose with paradedb, redis, rustfs, searxng, elasticsearch and a separate gateway image; not a Dockerfile"}
    - {path: docker-compose/dev/docker-compose.yml, reason: "dev dependencies compose, not a Dockerfile"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 152, quote: "FROM scratch"}
    - {path: Dockerfile, line: 371, quote: "ENTRYPOINT [\"/bin/node\"]"}
    - {path: Dockerfile, line: 373, quote: "CMD [\"/app/startServer.js\"]"}
    - {path: Dockerfile, line: 99, quote: "RUN npm run build:docker"}
runtime: {accept: [node]}
port:
