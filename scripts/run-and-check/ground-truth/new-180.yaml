id: new-180
repository: AppFlowy-IO/AppFlowy
commit: 8fcee27d9bd93aad4ee0191d5d8d915d6a9a4e93
summary: >
  AppFlowy is the Flutter (Dart) and Rust client for a Notion-like workspace. It ships as a desktop app (macOS, Windows,
  Linux) and mobile apps. This repository has no server: the cloud back end (AppFlowy-Cloud) is a separate project.
  The only Dockerfile compiles the Linux desktop app and starts the GUI binary (./AppFlowy) on an X11 display, so it is
  not a web service. There is no HTTP port, no health path and no database in this repository.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository is a desktop and mobile application, not a web service. The one Dockerfile builds a Flutter Linux
    desktop bundle and runs a GUI that needs a DISPLAY, so there is nothing to put behind an HTTPS ALB. The server side
    (AppFlowy-Cloud) is not in this repository.
