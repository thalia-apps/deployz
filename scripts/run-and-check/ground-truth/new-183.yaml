id: new-183
repository: RocketChat/Rocket.Chat
commit: 7a174fd05604dac39af95f76ea9db73db2b3ca5f
summary: >
  Rocket.Chat is a Meteor (Node.js, TypeScript) team-chat server in a Yarn monorepo (apps/meteor, ee/apps, packages). The
  server listens on port 3000 and answers /livez, /readyz and the deprecated /health. It requires MongoDB (MONGO_URL,
  a replica set with oplog tailing). The official images (apps/meteor/.docker/Dockerfile.debian and Dockerfile.alpine)
  only copy a Meteor bundle that CI builds (meteor build), so no Dockerfile builds from source. Uploads default to GridFS
  (inside MongoDB); an AmazonS3 storage type is available. Enterprise microservices (ee/apps) use NATS but are optional.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    MongoDB is a required datastore outside the MVP (PostgreSQL, MySQL, Redis, S3 only). The Rocket.Chat server cannot run
    on PostgreSQL or MySQL. In addition, no Dockerfile builds the app from the repository: both official Dockerfiles copy a
    pre-built Meteor bundle (/app/bundle).
dockerfile:
  accept: []
  reject:
    - {path: apps/meteor/.docker/Dockerfile.debian, reason: "ADD . /app of a CI-built Meteor bundle; only npm install of server dependencies, no meteor build"}
    - {path: apps/meteor/.docker/Dockerfile.alpine, reason: "COPY . /app of a CI-built Meteor bundle; same pattern on Alpine, with a FIPS variant"}
    - {path: .devcontainer/Dockerfile, reason: "development container"}
    - {path: ee/apps/Dockerfile, reason: "enterprise microservices image, not the main server"}
  target: null
  context: apps/meteor/.docker
  evidence:
    - {path: apps/meteor/.docker/Dockerfile.debian, line: 20, quote: "ADD --chown=rocketchat:rocketchat . /app"}
    - {path: apps/meteor/.docker/Dockerfile.debian, line: 38, quote: "RUN cd /app/bundle/programs/server \\"}
    - {path: apps/meteor/.docker/Dockerfile.alpine, line: 7, quote: "COPY . /app"}
runtime: {accept: [node]}
port:
  accept: [3000]
  evidence:
    - {path: apps/meteor/.docker/Dockerfile.debian, line: 27, quote: "PORT=3000 \\"}
    - {path: apps/meteor/.docker/Dockerfile.debian, line: 69, quote: "EXPOSE 3000"}
bindAllInterfaces:
