    - {path: docker-compose-ci.yml, line: 18, quote: "- MONGO_URL=mongodb://mongo:27017/rocketchat?replicaSet=rs0"}
migrations:
  mode: startup
  accept: []
  evidence: []
redis:
  status: none
  selectBy: {}
  evidence: []
workers:
  status: embedded
  commands: []
  # The monolith runs all services in process; ee/apps microservices with NATS are an optional enterprise topology.
  evidence:
    - {path: docker-compose-local.yml, line: 126, quote: "image: nats:2.6-alpine"}
scheduledJobs:
  status: none
  items: []
  evidence: []
storage:
  local: conditional
  paths: [/app/uploads]
  s3: native
  s3SelectBy: {}
  # FileUpload_Storage_Type defaults to GridFS (stored in MongoDB); AmazonS3 and FileSystem are the other types.
  evidence:
    - {path: apps/meteor/server/settings/file-upload.ts, line: 89, quote: "await this.add('FileUpload_Storage_Type', 'GridFS', {"}
    - {path: apps/meteor/.docker/Dockerfile.debian, line: 65, quote: "VOLUME /app/uploads"}
env:
  required:
    - {name: MONGO_URL, secret: true, buildTime: false, note: "MongoDB connection string; replica set recommended"}
    - {name: ROOT_URL, secret: false, buildTime: false, note: "public URL; the image default is http://localhost:3000"}
  optional: [PORT, MONGO_OPLOG_URL, TRANSPORTER, ROCKETCHAT_LICENSE, Accounts_AvatarStorePath]
  buildTime: []
  evidence:
    - {path: apps/meteor/.docker/Dockerfile.debian, line: 28, quote: "ROOT_URL=http://localhost:3000 \\"}
blockers:
  expected:
    - "MongoDB is required (MONGO_URL, replica set); it is outside the MVP datastores"
    - "No Dockerfile builds from the repository: the official Dockerfiles copy a CI-built Meteor bundle"
  mustNot:
    - "Missing PostgreSQL or Redis must not be a blocker: the app uses MongoDB and no Redis"
    - "NATS and the ee/apps microservices must not count as required services: the monolith runs by itself"
    - "Local /app/uploads must not be a blocker: GridFS or S3 can hold uploads"
vendorQuestions:
  legitimate:
    - "Where does MongoDB run? Deployz cannot provide it"
    - "How is the Meteor bundle built? The repository has no Dockerfile that runs meteor build"
  unnecessary:
    - "Which port? (3000)"
    - "Health path? (/livez, /readyz)"
    - "Is Redis needed? (no)"
traps:
  - "Dockerfile.debian and Dockerfile.alpine look like production images but ADD a pre-built bundle (apps/meteor/.docker/Dockerfile.debian:20)"
  - "docker-compose-local.yml and docker-compose-ci.yml list traefik, NATS and many ee services; they are test stacks, not the product topology"
  - "/health is marked deprecated in favour of /livez and /readyz (apps/meteor/server/routes/health.ts:25)"
  - "The image sets MONGO_URL to mongodb://mongo:27017, a link alias that does not exist outside docker-compose"
crossReview:
  - {field: outcome.accept, change: "none: NOT_DEPLOYABLE confirmed (MongoDB required; Dockerfiles copy a CI-built bundle)", evidence: "Dockerfile.debian:25 MONGO_URL; :20 ADD . /app"}
  - {field: dockerfile/port/startCommand/healthPath, change: "none", evidence: "Dockerfile.debian:27,71; health.ts:27,120,138"}
  - {field: redis/workers/storage, change: "none: no Redis; GridFS default", evidence: "file-upload.ts:89; docker-compose-local.yml:126 nats only in test stack"}
  - {field: all, change: verified, evidence: "13 citations checked"}
