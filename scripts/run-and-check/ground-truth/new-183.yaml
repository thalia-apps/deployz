    - {path: apps/meteor/server/routes/health.ts, line: 120, quote: "WebApp.rawHandlers.use('/livez', async (_req: IncomingMessage, res: ServerResponse) => {"}
    - {path: apps/meteor/server/routes/health.ts, line: 138, quote: "WebApp.rawHandlers.use('/readyz', async (_req: IncomingMessage, res: ServerResponse) => {"}
database:
