id: new-166
repository: crewAIInc/crewAI
commit: b95aa8bbdea6bc02b465a35fa8da54fecf82f528
summary: >
  CrewAI is a Python framework for multi-agent orchestration, published as wheels from a uv workspace (lib/crewai,
  lib/cli, lib/crewai-core, lib/crewai-files, lib/crewai-tools, lib/devtools). The only entrypoint is the `crewai`
  CLI (project scaffolding, run, deploy to the vendor cloud). There is no Dockerfile, no compose file and no server
  entrypoint in the repo. The developer imports the library into their own project.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    A framework and library with a CLI, packaged with hatchling for PyPI. The repo contains no application, no
    Dockerfile and no web server to run.
