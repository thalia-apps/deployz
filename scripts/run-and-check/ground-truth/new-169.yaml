id: new-169
repository: OpenInterpreter/open-interpreter
commit: ac1fcc8fe57aba51fcc3c79afd57a0883237fe87
summary: >
  The repository is now Open Interpreter as a Rust terminal coding agent: a fork of OpenAI Codex (workspace
  codex-rs with the `codex` binary in codex-rs/cli, npm wrapper codex-cli, Bazel build). It is installed with a
  curl or PowerShell installer and runs in the user's terminal. The old Python library is gone. There is no
  application Dockerfile: the only Dockerfile is a CI Bazel toolchain image. The app-server and acp-server crates
  are protocol servers for IDE or client integrations, not a web UI.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    A local command-line coding agent. It executes commands and edits files on the user's machine and needs local
    sandboxing (bwrap). No Dockerfile builds a service, and there is no browser UI or HTTP application for end users.
