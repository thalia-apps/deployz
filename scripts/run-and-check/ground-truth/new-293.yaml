id: new-293
repository: allinurl/goaccess
commit: 0dda4e3cb0b3f38e43ec1f2e6dce18e2bbfb5956
summary: >
  GoAccess is a C command-line web-log analyzer. It reads an access log (a file or standard input), prints a terminal
  dashboard or writes a report file (HTML, JSON, CSV), and with --real-time-html it also runs a small WebSocket server
  (default port 7890) that updates the HTML report. The root Dockerfile builds the binary with autotools in an Alpine
  stage and sets ENTRYPOINT /usr/bin/goaccess with CMD --help. The container serves no HTTP page: the report is a file
  that a separate web server must serve, and the log is piped in from outside (`tail -F access.log | docker run -i`).
  There is no database, no Redis, no worker.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    GoAccess is a command-line log analyzer and not an HTTP web application. The image starts with --help and exits; the
    useful run needs a log piped in on standard input and a separate web server that serves the generated report.html
    (the WebSocket server on 7890 only pushes updates to that page). Deployz runs one long-lived HTTP web process behind
    an HTTPS load balancer, so there is no web process to deploy and no repository change turns this tool into one.
