blockers:
  expected:
    - "No Dockerfile builds the server from source: docker/deployment.Dockerfile copies a pre-built typesense-server binary and the others are build toolchains"
    - "The server needs a durable data directory (--data-dir, RocksDB); Fargate task storage is ephemeral"
    - "The repository is a search engine (a datastore), not a web application; it is the kind of service that other apps depend on"
  mustNot:
    - "Port 8108 must not be treated as a failure: it is the server API port, only the build and storage block deployment"
    - "A database or Redis must not be reported as required: Typesense embeds its storage"
    - "docker/bazel.Dockerfile and docker/development.Dockerfile must not be treated as application images"
vendorQuestions:
  legitimate:
    - "Is Typesense being deployed as the search backend for another application? A Typesense server needs durable disk and is better run as a managed search service"
  unnecessary:
    - "Which port? (8108)"
    - "Which health path? (/health)"
    - "Is a database needed? (no, embedded RocksDB)"
traps:
  - "docker/deployment.Dockerfile looks like the production Dockerfile but copies a pre-built binary (docker/deployment.Dockerfile:6)"
  - "docker-build.sh and ci_build.sh build with CMake or Bazel inside dev images; none yields a one-stage application Dockerfile"
  - "--data-dir and --api-key are required server options with no default, so a plain start fails (src/typesense_server_utils.cpp:84)"
  - "The README docker run example mounts a host volume for data (README.md:149)"
openQuestions:
  - "The TYPESENSE_* environment names come from the server's option-to-environment mapping, not read in detail here"
