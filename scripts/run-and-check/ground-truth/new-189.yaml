id: new-189
repository: typesense/typesense
commit: f1cfbab919d63db8adbb350d1d097356ffbab6c2
summary: >
  Typesense is a C++ search engine server (RocksDB storage, Raft clustering) built with CMake and Bazel. It is a
  datastore, not a web application. The server needs --data-dir and --api-key on the command line, listens on 8108, and
  keeps all data in the data directory on durable disk. The only Dockerfile that packages the server is
  docker/deployment.Dockerfile, which copies a pre-built typesense-server binary; the other Dockerfiles in docker/ are
  build toolchains (bazel, development, packager, debugger).
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository is a search-engine database server, not a web application with a database behind it. It needs
    durable local disk for --data-dir (RocksDB), which Fargate does not give a task, and no Dockerfile builds the server
    from the repo source: deployment.Dockerfile copies a pre-built binary, and the others are build or dev environments.
    A C++ build with Bazel or CMake is outside a simple one-image build. A Typesense server is a self-hosted search
    backend that would itself be a required dependency of other apps.
