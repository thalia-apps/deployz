blockers:
  expected:
    - "Durable local filesystem state: all data is JSON files in /datastore, no DB or S3 alternative. A Fargate task loses it."
  mustNot:
    - "Missing database: the app has none by design; do not ask for DATABASE_URL."
    - "Missing Redis: not used at all."
    - "Worker/scheduler needs a separate service: workers and scheduler are threads inside the web process."
    - "Playwright/Selenium sidecar as blocker: optional; the default requests fetcher works without it."
    - "Missing required env var: none is required to start."
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which database to use (none exists)."
    - "Which port (5000 in Dockerfile and default) and bind address (0.0.0.0 default)."
    - "Which start command (image CMD is correct)."
    - "Whether migrations are needed (done at startup inside the store)."
traps:
  - "docker-compose.yml commented sockpuppet/selenium chrome services -> optional browser sidecars, not required app services (docker-compose.yml:129-153)"
  - "docker-compose.yml image ghcr.io/dgtlmoon/changedetection.io -> prebuilt image; the repo Dockerfile builds from source (docker-compose.yml:3)"
  - "Dockerfile playwright / opencv installs with '|| echo WARN' -> optional, failure is tolerated (Dockerfile:73,86)"
  - "Dockerfile ARG LOGGER_LEVEL, DEPS_REFRESH_DATE -> test/CI args, not needed (Dockerfile:46,172)"
  - 'ENTRYPOINT is docker-entrypoint.sh with exec "$@" -> do not replace it; start command must stay image CMD (docker-entrypoint.sh:21-24 installs EXTRA_PACKAGES then exec "$@")'
  - "-C flag creates the datastore dir; Dockerfile already creates /datastore so it is not needed (changedetectionio/__init__.py:328,390)"
  - "/worker-health looks like a health route but is behind login_optionally_required (flask_app.py:1424-1426)"
  - "Default no-password mode exposes the UI to the internet; SALTED_PASS or a UI password is a security matter, not a start blocker (auth_decorator.py:30)"
openQuestions:
  - "Whether a Deployz outcome of DEPLOYABLE_WITH_CHANGES is acceptable for ephemeral demo use: the repo gives no durable alternative, so NOT_DEPLOYABLE is the ground truth for supported use."
  - "Exact Dockerfile line numbers are approximate (+-2) for lines past the first 60; the quotes are exact."
