id: new-45
repository: dgtlmoon/changedetection.io
commit: 9e24b537c0016d8a4313f19ff8a55a2a8af01076
summary: >-
  Self-hosted web page change monitor (Python, Flask + socketio, in-process fetch workers).
  Meant to run as one Docker container with a /datastore volume; all state is JSON files on
  local disk. There is no database option and no S3 option; browser fetching uses an optional separate
  Chrome sidecar (Playwright protocol or Selenium) reached by URL.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  # judgement call: NOT_DEPLOYABLE is the primary reading (all user data is durable local state, no DB/S3 backend in code; only a large code change adding a backend could move it). DEPLOYABLE_WITH_CHANGES is accepted as the alternative reading under Deployz policy for durable local state.
  reason: >-
    All durable state (settings, watches, snapshots, history) is written as JSON/text files under the
    datastore dir (/datastore). The code has no SQL driver, no Redis and no S3 support, so the data cannot move
    to RDS or S3. On Fargate without a persistent volume the data is lost on each new task. Deployz
    cannot host this durably (EFS/persistent volumes are unsupported). The app itself starts fine
    and could run as a throw-away demo, but not as a supported deployment.
