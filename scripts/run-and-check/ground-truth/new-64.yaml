  - {field: dockerfile.evidence, change: "added proof that the Dockerfiles exist only outside the tree: .patches/.gitkeep names private Dockerfile-on-prem and Dockerfile-cloud, and pnpm-workspace.yaml says Dockerfiles copy only packages/nocodb. git ls-files shows no Dockerfile anywhere", evidence: "packages/nocodb/.patches/.gitkeep:2; packages/nocodb/pnpm-workspace.yaml:2"}
  - {field: traps (start script), change: "package.json:31 -> :25; the start script is line 25 ('pnpm run watch:run'), line 31 is watch:run itself", evidence: "packages/nocodb/package.json:25"}
  - {field: outcome.accept, change: "none: both NOT_DEPLOYABLE and DEPLOYABLE_WITH_CHANGES kept; no Dockerfile, no build-local-docker-image script, no packages/nocodb/Dockerfile* in git (packages/nocodb/docker holds only start.sh, start-litestream.sh, litestream.yml)", evidence: "git ls-files -> no Dockerfile; packages/nocodb/docker/start.sh"}
  - {field: redis / healthPath / storage, change: "none: Redis optional confirmed (worker mode only throws without a URL); /api/v1/health has no guard and returns JSON; S3 uses the default credential chain without both keys", evidence: "packages/nocodb/src/Noco.ts:197-199; packages/nocodb/src/controllers/utils.controller.ts:222-225; packages/nocodb/src/plugins/s3/S3.ts:55"}
  - {field: all, change: verified, evidence: "36 citations checked"}
