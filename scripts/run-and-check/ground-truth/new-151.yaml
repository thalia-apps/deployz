blockers:
  expected: []
  mustNot:
    - "Redis must not be reported as required"
    - "A separate worker process must not be required: scheduler jobs run in the API process"
    - "PostgreSQL must not block: it is the supported database"
    - "docker/local-postgres/Dockerfile must not be accepted as the app image"
vendorQuestions:
  legitimate:
    - "Which admin password and API tokens should be set? Without UNLEASH_DEFAULT_ADMIN_PASSWORD the first admin has the public default password"
  unnecessary:
    - "Which port? (4242)"
    - "Health path? (/health)"
    - "Who runs migrations? (the server at start)"
traps:
  - "docker-compose.yml, docker-compose.postgres.yml and docker-compose-enterprise.yml use the published unleashorg image and a demo database; they are not deployment config (docker-compose.yml:1-14)"
  - "Default admin login is admin with password unleash4all unless UNLEASH_DEFAULT_ADMIN_USERNAME and PASSWORD are set (user-service.ts:197)"
  - "pnpm workspace: the frontend/ package is built through build:frontend:if-needed inside the Dockerfile"
  - "RDS PostgreSQL 15 and later reject non-TLS connections; the default DATABASE_SSL is off"
  - "UNLEASH_URL defaults to http://localhost:4242 (create-config.ts:344) and must be set to the public URL for links"
crossReview:
