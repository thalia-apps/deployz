id: new-151
repository: Unleash/unleash
commit: 09f7e52c6d20b12408b9985e0cd6baa1597d26ae
summary: >
  Unleash is a Node.js (TypeScript) feature-flag server with an embedded React admin UI. The root Dockerfile builds
  the backend and frontend from repo source with pnpm (multi-stage) and runs `node dist/server.js` on port 4242.
  PostgreSQL is required (DATABASE_URL). The server runs its migrations at start and its scheduler jobs in the same
  process. No Redis, no separate worker.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    One web process, root Dockerfile builds from source, PostgreSQL through DATABASE_URL, port 4242, /health, startup
    migrations, no local disk state. Only configuration is needed: the database URL, TLS for RDS and an admin password.
