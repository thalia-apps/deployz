healthPath:
  accept: ["/health"]
  # Backend rest_server: GET /health (needs the database). Frontend: route /health under the (platform) group.
  evidence:
    - {path: autogpt_platform/backend/backend/api/rest_api.py, line: 611, quote: "@app.get(path=\"/health\", tags=[\"health\"], dependencies=[])"}
database:
  status: required
  engines: [postgres]
  default: postgres
  deployzEngine: postgres
  selectBy: {}
  connectionVars: [DATABASE_URL]
  # Prisma schema uses the pgvector extension and an Unsupported("vector(1536)") column. RDS PostgreSQL can enable pgvector, but Deployz does not manage extensions.
  evidence:
    - {path: autogpt_platform/backend/schema.prisma, line: 2, quote: "provider   = \"postgresql\""}
    - {path: autogpt_platform/backend/schema.prisma, line: 5, quote: "extensions = [pgvector(map: \"vector\")]"}
    - {path: autogpt_platform/docker-compose.yml, line: 156, quote: "image: pgvector/pgvector:pg15"}
