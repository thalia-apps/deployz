blockers:
  expected:
    - "About ten backend processes plus RabbitMQ, Redis, FalkorDB and ClamAV; one Deployz container and one ALB port cannot host them"
    - "No plain docker build produces the single-container appliance (Docker Bake named contexts); the backend and frontend are separate images"
    - "pgvector extension and FalkorDB graph store are not Deployz managed services"
  mustNot:
    - "The old Supabase stack must not be reported: auth is Better Auth in the Next.js server and the database is PostgreSQL"
    - "The frontend Dockerfile alone must not be called the product: it needs the backend over AGPT_SERVER_URL"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (3000 frontend, 8006 REST, 8001 WebSocket)"
    - "Which Dockerfile? (none is the whole product)"
traps:
  - "Three Dockerfiles build from repo source and look deployable (backend, frontend, single-container) -> each is one part or needs Bake"
  - "single-container/Dockerfile exposes only 3000 and looks like the one-image answer -> it embeds PostgreSQL, RabbitMQ, Valkey and FalkorDB in the container with local data (single-container/Dockerfile:98-140, :276)"
  - "single-container FROM autogpt-backend and autogpt-backend-base are not registry images (single-container/Dockerfile:55, :64)"
  - "classic/ holds the legacy CLI agent with its own Dockerfile.autogpt and forge/Dockerfile -> not the platform"
  - "The backend Dockerfile default CMD is rest only; the other processes use the same image with another command (docker-compose.platform.yml:326, :407)"
  - "docker-compose.yml publishes loopback ports for infrastructure only (docker-compose.platform.yml:142-258)"
openQuestions:
  - "Whether a vendor-written wrapper that runs all processes in one container with RDS and ElastiCache would be accepted (not supported by the MVP topology)"
crossReview:
  - {field: outcome, change: "accept [NOT_DEPLOYABLE] -> [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]: the reviewer reasons include a multi-process image and Dockerfiles that do not build alone (CODE_CHANGE under the fix-class policy); RabbitMQ and FalkorDB remain a capability gap so NOT_DEPLOYABLE stays primary", evidence: "autogpt_platform/single-container/Dockerfile:55; autogpt_platform/single-container/Dockerfile:64"}
  - {field: "dockerfile, port, healthPath, redis", change: "none: backend, frontend and single-container Dockerfiles exist and none is the whole product", evidence: "autogpt_platform/backend/Dockerfile; autogpt_platform/frontend/Dockerfile; autogpt_platform/single-container/Dockerfile"}
  - {field: all, change: verified, evidence: "30 citations checked"}
  - {field: outcome, change: "integrator: back to [NOT_DEPLOYABLE]; the CODE_CHANGE items do not lower the capability gap, the worst required item sets the outcome", evidence: "docs/ai-analysis.md Compatibility findings"}
