id: new-165
repository: Significant-Gravitas/AutoGPT
commit: e2316d032883070a2e9aded36d2eb38b8e3a03df
summary: >
  AutoGPT is a monorepo. The product is autogpt_platform: a Next.js frontend (port 3000, Better Auth embedded) and a
  Python backend that runs as many separate processes (rest_server 8006, websocket_server 8001, executor,
  copilot_executor, database_manager, scheduler_server, notification_server, platform_linking_manager), with
  PostgreSQL 15 plus pgvector, Redis, RabbitMQ, FalkorDB and ClamAV. The repo also has a single-container "appliance"
  Dockerfile that runs PostgreSQL, Valkey, RabbitMQ, FalkorDB, nginx and every service under supervisord, but it needs
  Docker Bake named contexts and keeps its data on local volumes. The classic/ folder is the legacy CLI agent.
outcome:
  # The worst required item sets the outcome (docs/ai-analysis.md): the capability gap makes it NOT_DEPLOYABLE.
  accept: [NOT_DEPLOYABLE]
  reason: >
    The real deployment is about ten processes plus RabbitMQ, Redis, FalkorDB and pgvector. Deployz serves one
    container on one ALB port with RDS PostgreSQL (no pgvector claim), optional Redis and S3. No single image builds
    from the repo with a plain docker build: the backend and frontend images are separate, and the appliance image
    embeds its own PostgreSQL and message broker on local disk and needs Bake named contexts.
dockerfile:
  accept: []
  reject:
    - {path: autogpt_platform/backend/Dockerfile, reason: "backend only; target server runs one process per container (CMD rest); needs the other backend services, RabbitMQ, Redis and PostgreSQL"}
    - {path: autogpt_platform/frontend/Dockerfile, reason: "frontend only (node server.js); calls the backend over AGPT_SERVER_URL"}
    - {path: autogpt_platform/single-container/Dockerfile, reason: "appliance with embedded PostgreSQL, Valkey, RabbitMQ and FalkorDB under supervisord; FROM autogpt-backend and autogpt-backend-base are Docker Bake named contexts, not images; data on local volumes"}
    - {path: classic/Dockerfile.autogpt, reason: "legacy classic CLI agent image, not the platform"}
    - {path: autogpt_platform/scripted_model/Dockerfile, reason: "test helper"}
    - {path: autogpt_platform/swap_proxy/Dockerfile, reason: "helper proxy"}
  target: null
  context: .
  evidence:
    - {path: autogpt_platform/backend/Dockerfile, line: 196, quote: "FROM server-base AS server"}
    - {path: autogpt_platform/backend/Dockerfile, line: 217, quote: "CMD [\"rest\"]"}
    - {path: autogpt_platform/frontend/Dockerfile, line: 64, quote: "CMD [\"node\", \"server.js\"]"}
    - {path: autogpt_platform/single-container/Dockerfile, line: 55, quote: "FROM autogpt-backend AS backend-code"}
    - {path: autogpt_platform/single-container/Dockerfile, line: 282, quote: "CMD [\"/usr/bin/supervisord\", \"-n\", \"-c\""}
    - {path: autogpt_platform/docker-compose.platform.yml, line: 287, quote: "rest_server:"}
