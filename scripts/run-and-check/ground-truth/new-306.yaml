traps:
  - "The docker entrypoint exports SYNCIN_APPLICATIONS_FILES_DATAPATH=/app/data, so the data path is a fixed local directory in the image (scripts/docker-entrypoint.sh:23)"
  - "The first start (no .init file) waits for the database, runs the migration and may create the admin user; the .init marker is a file in /app, which is lost with the task (scripts/docker-sync-in-server.sh:4,35,48)"
  - "Database and secrets are set by a YAML file or by SYNCIN_* variables, not by one DATABASE_URL (backend/src/configuration/config.loader.ts:65)"
