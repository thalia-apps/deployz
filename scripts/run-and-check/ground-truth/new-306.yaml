blockers:
  expected:
    - "All user files are stored on the local file system in dataPath (/app/data); there is no S3 or object-store option and Fargate task storage is ephemeral"
  mustNot:
    - "MariaDB or MySQL must not be reported as the blocker: Deployz provides MySQL 8"
    - "The optional document editors (Collabora, OnlyOffice, Euro-Office, draw.io) must not be read as required services"
    - "docker/docker-compose.yaml (the app plus MariaDB) must not be read as several application services"
vendorQuestions:
