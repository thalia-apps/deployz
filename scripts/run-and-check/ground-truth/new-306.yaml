id: new-306
repository: Sync-in/server
commit: 00b22a44ca492ffbcdb480948398184414163cf9
summary: >
  Sync-in is a self-hosted file storage, synchronization and collaboration platform (NestJS backend, Angular frontend,
  WebDAV, sync clients). The root Dockerfile builds the app from source with npm and runs it on port 8080 through an
  entrypoint that waits for the database, runs the migrations and then starts `node server/main.js`. The database is
  MySQL or MariaDB (mysql.url, required); the example compose file uses MariaDB 11. All user files are stored as normal
  files in applications.files.dataPath, which the image sets to /app/data. There is no S3 or other object-store option.
  Optional document editors (Collabora, OnlyOffice, Euro-Office, draw.io) are separate containers.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The product is a file platform whose core data (the files of the users, with quotas, trash and indexes) lives on the
    local file system in dataPath. The README says it keeps files readable on the filesystem. The configuration has no S3
    or object-store option, Deployz has no persistent volume, and Fargate task storage is ephemeral. The MySQL database
    alone holds only the metadata. Core data only on local disk makes the repository not deployable, even though the
    database part fits Deployz.
