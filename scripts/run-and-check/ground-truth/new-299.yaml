  - {field: storage, change: 'none: gocloud blob connection string; s3:// moves attachments to a bucket', evidence: 'storage.mdx:28; Dockerfile:71'}
  - {field: outcome, change: 'none: DEPLOYABLE with settings only', evidence: 'backend/app/api/main.go:121; backend/app/api/recurring.go:20,34'}
  - {field: all, change: verified, evidence: 29 citations checked}
