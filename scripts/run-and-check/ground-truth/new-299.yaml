  connectionVars: [HBOX_DATABASE_DRIVER, HBOX_DATABASE_HOST, HBOX_DATABASE_PORT, HBOX_DATABASE_USERNAME, HBOX_DATABASE_PASSWORD, HBOX_DATABASE_DATABASE, HBOX_DATABASE_SSL_MODE]
