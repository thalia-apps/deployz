id: new-299
repository: sysadminsmedia/homebox
commit: 6255a24111cdc32e1f93ac41b3b56703a836256a
summary: >
  Homebox is a self-hosted home inventory manager written in Go with a Nuxt frontend that is embedded in the binary. The
  root Dockerfile builds the Nuxt UI with pnpm, builds the Go API (CGO off) and runs /app/api from an Alpine image on
  port 7745. The image defaults to SQLite in /data and file storage in /data; the same binary supports PostgreSQL
  (HBOX_DATABASE_DRIVER=postgres with HBOX_DATABASE_HOST, _PORT, _USERNAME, _PASSWORD, _DATABASE, _SSL_MODE) and an
  S3 bucket for attachments (HBOX_STORAGE_CONN_STRING=s3://bucket?region=...). Goose migrations run at start. The event
  bus, the purge task and the scheduled jobs run inside the one process. No Redis. The binary refuses to start without
  HBOX_AUTH_API_KEY_PEPPER of at least 32 bytes.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    One Go web process from the root Dockerfile. Settings pick PostgreSQL (HBOX_DATABASE_DRIVER=postgres plus the
    connection parts), S3 for attachments (HBOX_STORAGE_CONN_STRING) and the required pepper secret. Migrations run at
    start, background jobs are goroutines of the web process, there is no Redis and no worker. With PostgreSQL and S3
    selected the container keeps no durable local state, so no repository change is needed. SQLite and the /data volume
    are only the image defaults.
