scheduledJobs:
  status: none
  items: []
  evidence: []
storage:
  local: conditional
  paths: [/data]
  s3: native
  s3SelectBy: {HBOX_STORAGE_CONN_STRING: "s3://<bucket>?region=<region>"}
  # Attachments use gocloud blob storage. The image default is the local /data folder; the S3 connection string moves them to a bucket. AWS credentials come from the SDK default chain (task role) or AWS_ACCESS_KEY_ID.
  evidence:
    - {path: Dockerfile, line: 71, quote: "ENV HBOX_STORAGE_CONN_STRING=file:///?no_tmp_dir=true"}
    - {path: Dockerfile, line: 97, quote: "VOLUME [ \"/data\" ]"}
    - {path: docs/src/content/docs/en/quick-start/configure/storage.mdx, line: 28, quote: "You can use S3 storage by setting the `HBOX_STORAGE_CONN_STRING` to `s3://my-bucket?region=region-name`."}
    - {path: backend/internal/sys/config/conf_database.go, line: 13, quote: "ConnString string `yaml:\"conn_string\" conf:\"default:file:///./\"`"}
env:
  required:
    - {name: HBOX_AUTH_API_KEY_PEPPER, secret: true, buildTime: false, note: "random secret of at least 32 bytes, fixed across restarts; the binary refuses to start without it"}
    - {name: HBOX_DATABASE_DRIVER, secret: false, buildTime: false, note: "postgres; the default is sqlite3"}
    - {name: HBOX_DATABASE_HOST, secret: false, buildTime: false, note: "PostgreSQL host"}
    - {name: HBOX_DATABASE_PORT, secret: false, buildTime: false, note: "5432"}
    - {name: HBOX_DATABASE_USERNAME, secret: false, buildTime: false, note: "database user"}
    - {name: HBOX_DATABASE_PASSWORD, secret: true, buildTime: false, note: "database password"}
    - {name: HBOX_DATABASE_DATABASE, secret: false, buildTime: false, note: "database name"}
    - {name: HBOX_STORAGE_CONN_STRING, secret: false, buildTime: false, note: "s3://bucket?region=...; the image default is a local folder under /data"}
  optional: [HBOX_DATABASE_SSL_MODE, HBOX_STORAGE_PREFIX_PATH, HBOX_OPTIONS_ALLOW_REGISTRATION, HBOX_LOG_LEVEL, HBOX_WEB_MAX_UPLOAD_SIZE, HBOX_MAILER_HOST]
  buildTime: []
  evidence:
    - {path: backend/app/api/main.go, line: 121, quote: "if len(cfg.Auth.APIKeyPepper) < 32 {"}
    - {path: docs/src/content/docs/en/quick-start/configure/index.mdx, line: 54, quote: "HBOX_AUTH_API_KEY_PEPPER"}
    - {path: docs/src/content/docs/en/quick-start/configure/index.mdx, line: 41, quote: "HBOX_OPTIONS_ALLOW_REGISTRATION"}
blockers:
  expected: []
  mustNot:
    - "The SQLite default and the /data volume must not block: HBOX_DATABASE_DRIVER=postgres and the S3 connection string replace them"
    - "The embedded event bus and recurring tasks must not be read as a worker or an EventBridge schedule"
    - "Dockerfile.hardened, Dockerfile.rootless and the dev docker-compose.yml must not be read as extra services"
    - "The mem:// pub/sub default must not be read as a missing broker"
vendorQuestions:
  legitimate:
    - "Should self-registration stay open? (HBOX_OPTIONS_ALLOW_REGISTRATION defaults to true)"
  unnecessary:
    - "Which database? (HBOX_DATABASE_DRIVER=postgres with the connection parts)"
    - "Is Redis or a worker needed? (no)"
    - "Which port? (7745)"
traps:
  - "HBOX_AUTH_API_KEY_PEPPER is required: the binary stops at start when it is shorter than 32 bytes, and the dev compose file uses a dev-only value (backend/app/api/main.go:121; docker-compose.yml:17)"
  - "The database is set by separate HBOX_DATABASE_* parts, not by one URL; the SSL mode defaults to require (backend/internal/sys/config/conf_database.go:30)"
  - "The image sets HBOX_DATABASE_SQLITE_PATH and HBOX_STORAGE_CONN_STRING to /data values; with PostgreSQL the sqlite path is unused, but the storage string must be replaced for S3 (Dockerfile:71,73)"
  - "The CMD passes /data/config.yml, a path that need not exist; the settings come from HBOX_* environment variables (Dockerfile:101)"
  - "The storage prefix path (HBOX_STORAGE_PREFIX_PATH=data in the image) comes after the bucket name in an S3 string (Dockerfile:72; storage.mdx:30)"
openQuestions: []
