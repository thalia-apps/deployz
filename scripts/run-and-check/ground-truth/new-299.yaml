    - {path: Dockerfile, line: 73, quote: "ENV HBOX_DATABASE_SQLITE_PATH=/data/homebox.db?_pragma=busy_timeout=2000&_pragma=journal_mode=WAL&_fk=1&_time_format=sqlite"}
    - {path: docs/src/content/docs/en/quick-start/configure/database.mdx, line: 45, quote: "- `HBOX_DATABASE_DRIVER=postgres`"}
