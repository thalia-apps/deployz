    - {path: backend/internal/sys/config/conf_database.go, line: 30, quote: "SslMode          string `yaml:\"ssl_mode\"           conf:\"default:require\"`"}
    - {path: backend/app/api/setup.go, line: 75, quote: "case config.DriverPostgres:"}
