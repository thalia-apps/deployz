  paths: []
  s3: native
  s3SelectBy: {}
  # Product images go to MinIO (S3 API) or Aliyun OSS with the vendor's endpoint and keys.
  evidence:
    - {path: mall-admin/src/main/resources/application-prod.yml, line: 23, quote: "minio:"}
    - {path: mall-admin/src/main/resources/application-prod.yml, line: 24, quote: "endpoint: http://192.168.3.101:9090 #MinIO服务所在地址"}
env:
  required:
    - {name: SPRING_DATASOURCE_URL, secret: false, buildTime: false, note: "JDBC URL of MySQL; the prod profile points to host db"}
    - {name: SPRING_DATASOURCE_PASSWORD, secret: true, buildTime: false, note: "the prod profile has the literal password 123456"}
    - {name: SPRING_DATA_MONGODB_HOST, secret: false, buildTime: false, note: "MongoDB host for mall-portal; Deployz cannot provide MongoDB"}
    - {name: SPRING_RABBITMQ_HOST, secret: false, buildTime: false, note: "RabbitMQ host for mall-portal; Deployz cannot provide RabbitMQ"}
    - {name: SPRING_ELASTICSEARCH_URIS, secret: false, buildTime: false, note: "Elasticsearch for mall-search; Deployz cannot provide Elasticsearch"}
  optional: [SPRING_PROFILES_ACTIVE, MINIO_ENDPOINT, MINIO_ACCESSKEY, MINIO_SECRETKEY, JWT_SECRET]
  buildTime: []
  evidence:
    - {path: mall-admin/src/main/resources/application-prod.yml, line: 5, quote: "password: 123456"}
    - {path: mall-portal/src/main/resources/application-prod.yml, line: 30, quote: "host: rabbit"}
blockers:
  expected:
    - "The product is three application services that run together (mall-admin, mall-portal, mall-search); Deployz runs one web service and workers from one image"
    - "mall-portal needs MongoDB and RabbitMQ, and mall-search needs Elasticsearch; all three are outside the MVP"
    - "The only Dockerfile adds a prebuilt mall-admin jar; no Dockerfile builds the code"
  mustNot:
    - "MySQL and Redis support must not hide the MongoDB, RabbitMQ and Elasticsearch requirements"
    - "document/docker/docker-compose-env.yml must not be read as a deploy recipe for Deployz: it lists Logstash, Kibana and Nginx as part of the environment"
    - "mall-admin must not be chosen as the whole product without noting that the storefront (mall-portal) and search are missing"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port or health path? (not useful: three services with three ports)"
traps:
  - "mall-admin alone needs only MySQL and Redis (README.md:185), which makes it look deployable; the storefront is mall-portal and needs MongoDB and RabbitMQ (mall-portal/src/main/resources/application-prod.yml:19, :30)"
  - "The admin web UI is another repository (mall-admin-web) (README.md:37)"
  - "document/sh/Dockerfile ADDs a prebuilt jar and is for mall-admin only (document/sh/Dockerfile:4)"
  - "The prod profiles hold literal passwords (123456) and MinIO keys (mall-admin/src/main/resources/application-prod.yml:5, :26)"
  - "The MySQL schema comes from document/sql/mall.sql that a person imports; no migration tool exists"
openQuestions: []
crossReview:
  - {field: dockerfile, change: 'none: the only Dockerfile ADDs a prebuilt mall-admin jar and serves one of three services', evidence: 'document/sh/Dockerfile:4,6,8'}
  - {field: database, change: 'none: MySQL fits, but MongoDB (portal) and Elasticsearch (search) are also required', evidence: 'mall-portal/src/main/resources/application-prod.yml:19; mall-search/src/main/resources/application-prod.yml:20'}
  - {field: outcome, change: 'none: three services, RabbitMQ, MongoDB and Elasticsearch are outside the MVP; mall-admin alone is not the product', evidence: 'document/docker/docker-compose-app.yml:4,16,29; README.md:185'}
  - {field: all, change: verified, evidence: 21 citations checked}
