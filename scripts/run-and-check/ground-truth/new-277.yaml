id: new-277
repository: macrozheng/mall
commit: dcaa93b3150352e5044708d7211b5bed0af4509f
summary: >
  mall is an e-commerce system (Spring Boot, MyBatis, Spring Security) split into three runnable Maven modules:
  mall-admin (admin API, port 8080), mall-search (product search on Elasticsearch, port 8081) and mall-portal (shop API,
  port 8085), plus shared modules (mall-common, mall-mbg, mall-security) and a demo module. The admin web UI is a separate
  repository (mall-admin-web). The environment needs MySQL 5.7, Redis, MongoDB, RabbitMQ, Elasticsearch, Logstash, Kibana,
  Nginx and MinIO (document/docker/docker-compose-env.yml). The only Dockerfile (document/sh/Dockerfile) ADDs a prebuilt
  mall-admin jar and builds nothing. The schema is a SQL file (document/sql/mall.sql) that a person imports.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The shop needs several application services that run together (mall-admin, mall-portal, mall-search), and the portal
    requires MongoDB and RabbitMQ and the search service requires Elasticsearch; all of these are outside the MVP
    (non-goals: MongoDB, Elasticsearch, RabbitMQ, extra long-running application services). A single mall-admin could
    run with MySQL and Redis (the README says so), but then the product has no storefront or search.
dockerfile:
  accept: []
  reject:
    - {path: document/sh/Dockerfile, reason: "runtime image for mall-admin only; it ADDs a prebuilt mall-admin-1.0-SNAPSHOT.jar that the repository does not contain and builds no code"}
  target: null
  context: .
  evidence:
    - {path: document/sh/Dockerfile, line: 4, quote: "ADD mall-admin-1.0-SNAPSHOT.jar /mall-admin-1.0-SNAPSHOT.jar"}
    - {path: document/sh/Dockerfile, line: 6, quote: "EXPOSE 8080"}
runtime: {accept: [java]}
port:
  accept: []
  # Each module has its own port: mall-admin 8080, mall-search 8081, mall-portal 8085.
  evidence:
    - {path: document/docker/docker-compose-app.yml, line: 7, quote: "- 8080:8080"}
    - {path: document/docker/docker-compose-app.yml, line: 19, quote: "- 8081:8081"}
    - {path: document/docker/docker-compose-app.yml, line: 32, quote: "- 8085:8085"}
bindAllInterfaces:
  value: null
  evidence: []
startCommand:
  source: image
  accept: []
  evidence:
    - {path: document/sh/Dockerfile, line: 8, quote: "ENTRYPOINT [\"java\", \"-jar\",\"/mall-admin-1.0-SNAPSHOT.jar\"]"}
healthPath:
  accept: []
  evidence: []
database:
  status: required
  engines: [mysql, mongodb, elasticsearch]
  default: mysql
  deployzEngine: mysql
  selectBy: {SPRING_DATASOURCE_URL: "jdbc:mysql://<host>:3306/mall"}
  connectionVars: [SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD]
  # MySQL alone fits, but MongoDB (portal) and Elasticsearch (search) are also required and are outside the MVP.
  evidence:
    - {path: mall-admin/src/main/resources/application-prod.yml, line: 3, quote: "url: jdbc:mysql://db:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false"}
    - {path: mall-portal/src/main/resources/application-prod.yml, line: 19, quote: "mongodb:"}
    - {path: mall-search/src/main/resources/application-prod.yml, line: 20, quote: "uris: es:9200"}
    - {path: document/docker/docker-compose-env.yml, line: 4, quote: "image: mysql:5.7"}
    - {path: document/docker/docker-compose-env.yml, line: 42, quote: "image: elasticsearch:7.17.3"}
    - {path: document/docker/docker-compose-env.yml, line: 82, quote: "image: mongo:4"}
migrations:
