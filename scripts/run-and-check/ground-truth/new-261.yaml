  optional: [LEMMY_INITIALIZE_WITH_DEFAULT_SETTINGS, LEMMY_DISABLE_SCHEDULED_TASKS, LEMMY_DISABLE_ACTIVITY_SENDING, RUST_LOG]
  buildTime: []
