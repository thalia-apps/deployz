  - {field: env.required, change: "none: without LEMMY_INITIALIZE_WITH_DEFAULT_SETTINGS the server reads the config file and fails when hostname is unset; no env sets the hostname", evidence: "crates/utils/src/settings/mod.rs:18-28,38-46"}
  - {field: all, change: verified, evidence: "20 citations checked"}
