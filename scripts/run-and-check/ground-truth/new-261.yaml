    - {path: crates/utils/src/settings/mod.rs, line: 39, quote: "env::var(\"LEMMY_CONFIG_LOCATION\").unwrap_or_else(|_| DEFAULT_CONFIG_FILE.to_string());"}
    - {path: crates/utils/src/settings/mod.rs, line: 43, quote: "Err(anyhow!(\"Hostname variable is not set!\").into())"}
    - {path: docker/docker-compose.yml, line: 34, quote: "- ./lemmy.hjson:/config/config.hjson:Z"}
blockers:
  expected:
    - "docker/Dockerfile cannot build from the archive: crates/email/build.rs reads translations/backend/ from the git submodule crates/email/translations"
    - "The browser UI is a second application image (lemmy-ui) and image hosting needs the separate pict-rs service"
    - "The server expects a mounted HJSON config file that sets the hostname"
  mustNot:
    - "PostgreSQL must not be a blocker: it is supported"
    - "Redis must not be required"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (8536)"
    - "Who runs migrations? (at start, in build_db_pool)"
traps:
  - "The Dockerfile looks like a clean multi-stage source build, but the email crate needs submodule files at compile time (crates/email/build.rs:6, .gitmodules:2)"
  - "The default RUST_RELEASE_MODE is debug, so a plain build gives a debug binary (docker/Dockerfile:4)"
  - "LEMMY_INITIALIZE_WITH_DEFAULT_SETTINGS skips the file, but the hostname then stays at its default 'unset' and has no env variable (crates/utils/src/settings/mod.rs:18, structs.rs:27)"
  - "This repository is the API only; compose pulls dessalines/lemmy-ui for the web UI (docker/docker-compose.yml:43)"
  - "docker/federation/ holds a multi-instance federation test setup, not a deploy recipe"
openQuestions: []
