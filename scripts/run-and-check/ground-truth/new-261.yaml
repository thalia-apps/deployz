id: new-261
repository: LemmyNet/lemmy
commit: 75a7b061d14cf7e500b94d48506b11578f0b1005
summary: >
  Lemmy is the Rust (actix-web, Diesel) back end of a federated link aggregator. It serves only the HTTP API and
  ActivityPub on port 8536; the browser UI is lemmy-ui, a separate repository and image, and image hosting is pict-rs,
  another separate service. docker/Dockerfile builds lemmy_server from source with the repository root as context, but
  crates/email/build.rs reads translations/backend/ from the git submodule crates/email/translations, which a repository
  archive does not contain. The server reads a required HJSON config file (config/config.hjson or LEMMY_CONFIG_LOCATION)
  that must set the hostname; compose mounts it into the container. PostgreSQL is required and migrations run at start.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    No Dockerfile builds the server from the repository archive: the email crate build script reads the translation
    files of a git submodule that the archive does not include (as new-114). The product also needs a second application
    image (lemmy-ui) for the browser UI and the pict-rs service for images, and the server expects a mounted HJSON config
    file with the hostname. Deployz runs one image and does not mount configuration files.
dockerfile:
  accept: []
  reject:
    - {path: docker/Dockerfile, reason: "builds from the repository root, but crates/email/build.rs reads translations/backend/ from the submodule crates/email/translations, which a repository archive does not contain; the default RUST_RELEASE_MODE is debug"}
  target: null
  context: .
  evidence:
    - {path: .gitmodules, line: 2, quote: "path = crates/email/translations"}
    - {path: crates/email/build.rs, line: 6, quote: "for path in read_dir(\"translations/backend/\")? {"}
    - {path: docker/Dockerfile, line: 4, quote: "ARG RUST_RELEASE_MODE=debug"}
    - {path: docker/docker-compose.yml, line: 27, quote: "dockerfile: docker/Dockerfile"}
runtime: {accept: [rust]}
port:
