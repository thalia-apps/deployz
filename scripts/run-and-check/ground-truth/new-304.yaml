id: new-304
repository: openhab/openhab-core
commit: 7a60c50275da3ab6d68ed76a6bee4eb0c4e89353
summary: >
  openHAB Core holds the core bundles of the openHAB smart-home runtime: a Maven multi-module build of OSGi bundles in
  bundles/, Karaf features in features/ and integration tests in itests/. The README states that it is not a product
  itself but a framework (an artifact repository of OSGi bundles) that the separate openhab-distro repository packages.
  The repository has no Dockerfile, no compose file and no start script. The REST and HTTP bundles exist, but no runnable
  application is built here.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository builds a framework of OSGi bundles, not a runnable web application. The README says the project is
    not a product and that the openHAB distribution (another repository) picks it up. No start command, port or image
    exists in this repository. A vendor would have to use another repository to run anything, so the repository is not
    an HTTP web app that Deployz can deploy.
