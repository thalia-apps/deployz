  - {field: port / healthPath / dockerfile, change: "none: /api/health is used by the image HEALTHCHECK on port 3000; aio target and /init entrypoint confirmed", evidence: "docker/Dockerfile:199 docker/Dockerfile:209"}
  - {field: all, change: "verified", evidence: "33 citations checked"}
