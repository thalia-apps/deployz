id: new-129
repository: karakeep-app/karakeep
commit: fb25e42702806d361e8fbc9a502f15d073a79372
summary: >
  Karakeep (formerly Hoarder) is a pnpm/Turbo monorepo with a Next.js web app (apps/web), a Node workers app (apps/workers),
  a CLI and an MCP server. Its only database is SQLite through better-sqlite3 and Drizzle, stored as $DATA_DIR/db.db, and
  the default job queue (liteque) and asset store are also on local disk under DATA_DIR. docker/Dockerfile builds the app from
  source with several targets; the `aio` target runs web, workers and a migration under s6-overlay in one container. The
  compose file adds a Chrome sidecar (BROWSER_WEB_URL) and Meilisearch (MEILI_ADDR) as optional services.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The database is SQLite only (no PostgreSQL or MySQL dialect in Drizzle or the schema), and the data directory
    (db.db, queue, assets) must persist on a local volume. Deployz supports only RDS PostgreSQL and MySQL and has no persistent
    volume (no EFS), so the deployment would lose all data on every task restart. The `aio` image also runs web, workers and a
    migration under s6-overlay (several supervised processes), which is a second unsupported pattern.
dockerfile:
  accept: [docker/Dockerfile]
  reject:
    - {path: docker/Dockerfile.dev, reason: "development image"}
    - {path: docker/chrome/Dockerfile, reason: "builds the separate headless Chrome sidecar image (karakeep-chrome), not the app"}
  target: aio
  context: .
  evidence:
    - {path: docker/Dockerfile, line: 71, quote: "RUN (cd apps/web && pnpm exec next build --experimental-build-mode compile)"}
    - {path: docker/Dockerfile, line: 76, quote: "RUN (cd apps/workers && pnpm --config.verify-deps-before-run=false build)"}
    - {path: docker/Dockerfile, line: 193, quote: "FROM aio_builder AS aio"}
    - {path: docker/Dockerfile, line: 189, quote: "ENTRYPOINT [\"/init\"]"}
    - {path: docker/docker-compose.build.yml, line: 6, quote: "target: aio"}
runtime: {accept: [node]}
