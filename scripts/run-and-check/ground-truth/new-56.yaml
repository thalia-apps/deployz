    - {path: src/paperless/settings/custom.py, line: 93, quote: "\"name\": \"Train the classifier\","}
    - {path: src/paperless/settings/__init__.py, line: 731, quote: "CELERY_BEAT_SCHEDULE = parse_beat_schedule()"}
