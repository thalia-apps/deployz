env:
  required:
    - {name: PAPERLESS_SECRET_KEY, secret: true, buildTime: false, note: "the app refuses to start if it is empty or 'change-me'"}
    - {name: PAPERLESS_REDIS, secret: false, buildTime: false, note: "Redis URL; the default is redis://localhost:6379 and the start-up check fails without a Redis there"}
    - {name: PAPERLESS_URL, secret: false, buildTime: false, note: "public HTTPS URL; adds the host to ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS and CORS; login POST fails behind the load balancer without it"}
    - {name: PAPERLESS_ADMIN_USER, secret: false, buildTime: false, note: "no account exists at first start; the image creates the superuser only when this is set"}
    - {name: PAPERLESS_ADMIN_PASSWORD, secret: true, buildTime: false, note: "needed with PAPERLESS_ADMIN_USER"}
    - {name: PAPERLESS_DBENGINE, secret: false, buildTime: false, note: "postgresql; the default is SQLite on local disk"}
    - {name: PAPERLESS_DBHOST, secret: false, buildTime: false, note: "database host; with PAPERLESS_DBPORT, PAPERLESS_DBNAME, PAPERLESS_DBUSER and PAPERLESS_DBPASS (secret)"}
  optional: [PAPERLESS_DBPORT, PAPERLESS_DBNAME, PAPERLESS_DBUSER, PAPERLESS_DBPASS, PAPERLESS_DBSSLMODE, PAPERLESS_ADMIN_MAIL, PAPERLESS_ALLOWED_HOSTS, PAPERLESS_CSRF_TRUSTED_ORIGINS, PAPERLESS_PROXY_SSL_HEADER, PAPERLESS_TRUSTED_PROXIES, PAPERLESS_PORT, PAPERLESS_BIND_ADDR, PAPERLESS_WEBSERVER_WORKERS, PAPERLESS_TASK_WORKERS, PAPERLESS_CONSUMER_DISABLE, PAPERLESS_ENABLE_FLOWER, PAPERLESS_OCR_LANGUAGE, PAPERLESS_TIME_ZONE, PAPERLESS_EMAIL_HOST, PAPERLESS_REDIS_PREFIX, PAPERLESS_DATA_DIR, PAPERLESS_MEDIA_ROOT, PAPERLESS_CONSUMPTION_DIR]
  buildTime: []
  evidence:
    - {path: src/paperless/settings/__init__.py, line: 501, quote: "SECRET_KEY = os.getenv(\"PAPERLESS_SECRET_KEY\")"}
    - {path: src/paperless/settings/__init__.py, line: 502, quote: "or SECRET_KEY == \"change-me\""}
    - {path: src/paperless/settings/__init__.py, line: 462, quote: "url = os.getenv(\"PAPERLESS_URL\")"}
    - {path: src/paperless/settings/__init__.py, line: 250, quote: "os.getenv(\"PAPERLESS_REDIS\", None),"}
    - {path: docker/rootfs/etc/s6-overlay/s6-rc.d/init-superuser/run, line: 6, quote: "if [[ -n \"${PAPERLESS_ADMIN_USER}\" ]]; then"}
    - {path: src/documents/management/commands/manage_superuser.py, line: 31, quote: "password = os.getenv(\"PAPERLESS_ADMIN_PASSWORD\")"}
blockers:
  expected:
    - "Durable document storage: originals, archive and thumbnails are written to the local MEDIA_ROOT (FileSystemStorage) with no S3 backend; Fargate disk is ephemeral, so documents are lost on restart"
  mustNot:
    - "Several processes (web server, Celery worker, beat, consumer) must not count as several services: s6-overlay runs them in the one image"
    - "SQLite default must not block: PostgreSQL and MariaDB are supported with PAPERLESS_DBENGINE and PAPERLESS_DBHOST"
    - "Missing Dockerfile must not be reported: the root Dockerfile builds the frontend and backend from source"
    - "The consume and export directories must not be a separate blocker: they are optional import and export paths"
vendorQuestions:
  legitimate:
    - "Where to keep documents: the app has only local file storage, so a durable volume is needed"
  unnecessary:
    - "Which port? (8000 in the image and the s6 web server script)"
    - "Who runs migrations? (init-migrations runs at each start)"
    - "Is a separate worker or scheduler needed? (s6 starts them in the same container)"
    - "Which Dockerfile? (only the root Dockerfile exists)"
traps:
  - "docker/compose files list a broker, a database, Gotenberg and Tika as services -> Redis is required; the database is optional (SQLite default); Gotenberg and Tika are optional, only for Office and email files (docker/compose/docker-compose.postgres-tika.yml); the broker service is a Redis-compatible image (docker/compose/docker-compose.postgres.yml:29)"
  - "Many s6 services (worker, scheduler, consumer, flower) -> embedded in one container; flower starts only with PAPERLESS_ENABLE_FLOWER (svc-flower/run:9)"
  - "/ looks like a health path -> it redirects to /accounts/login/ because of login_required; use /accounts/login/ (src/paperless/urls.py:423)"
  - "Web server binds to :: (IPv6 wildcard) by default -> it accepts IPv4 too on a dual-stack host; set PAPERLESS_BIND_ADDR=0.0.0.0 if the platform has no IPv6 (svc-webserver/run:7)"
  - "Dockerfile builds the frontend in a first stage -> the last stage main-app is the app, no --target needed (Dockerfile:88)"
  - "PAPERLESS_SECRET_KEY=build-time-dummy in the Dockerfile -> only for collectstatic at build; a real key is needed at run time (Dockerfile:241)"
  - "docker-compose.env sets PAPERLESS_SECRET_KEY=change-me -> the app rejects this value (src/paperless/settings/__init__.py:502)"
openQuestions:
  - "Whether a persistent shared file system (not offered by Deployz) can be used for /usr/src/paperless/media and /usr/src/paperless/data; this decides if the app can run at all"
crossReview:
