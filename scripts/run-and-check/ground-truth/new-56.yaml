    - {path: src/paperless/settings/__init__.py, line: 69, quote: "ORIGINALS_DIR = MEDIA_ROOT / \"documents\" / \"originals\""}
    - {path: src/paperless/settings/__init__.py, line: 246, quote: "\"default\": {\"BACKEND\": \"django.core.files.storage.FileSystemStorage\"},"}
    - {path: src/paperless/settings/__init__.py, line: 74, quote: "DATA_DIR = get_path_from_env("}
