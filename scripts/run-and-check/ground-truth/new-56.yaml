healthPath:
  accept: ["/accounts/login/"]
  # "/" is wrapped in login_required, so it returns a 302 redirect to /accounts/login/ without a session.
  # The image HEALTHCHECK uses curl -L, which follows the redirect. /api/ paths need authentication.
  evidence:
    - {path: src/paperless/urls.py, line: 423, quote: "login_required(ensure_csrf_cookie(IndexView.as_view()))"}
    - {path: src/paperless/urls.py, line: 346, quote: "path(\"login/\", allauth_account_views.login, name=\"account_login\"),"}
    - {path: src/paperless/settings/custom.py, line: 21, quote: "login_url = base_url + \"accounts/login/\""}
    - {path: Dockerfile, line: 254, quote: "\"-L\""}
database:
  status: optional
  engines: [sqlite, postgresql, mariadb]
  default: sqlite
  deployzEngine: postgres
  selectBy: {PAPERLESS_DBENGINE: postgresql, PAPERLESS_DBHOST: "<db host>"}
  connectionVars: [PAPERLESS_DBENGINE, PAPERLESS_DBHOST, PAPERLESS_DBPORT, PAPERLESS_DBNAME, PAPERLESS_DBUSER, PAPERLESS_DBPASS]
  evidence:
