id: new-56
repository: paperless-ngx/paperless-ngx
commit: 5f17b1a310aa011f43b56474221d97f8d6bfe689
summary: >
  Paperless-ngx is a Django and Angular document management system. The root Dockerfile builds the Angular
  frontend and the Python backend from source. The image uses s6-overlay to run the web server (granian),
  a Celery worker, Celery beat and a file consumer in one container. It needs Redis (Celery broker) and
  keeps all documents as files in a media directory. The code has no S3 storage backend.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  # judgement call: NOT_DEPLOYABLE is primary (all documents are durable local files and the code has no S3 backend; only a repository change adding one could move it). DEPLOYABLE_WITH_CHANGES is accepted as the alternative reading under the Deployz readiness policy, which classes this blocker as a repository change (the gate still blocks the deployment).
  reason: >
    Paperless stores originals, archive files and thumbnails on the local file system (MEDIA_ROOT) with the
    Django FileSystemStorage backend. There is no S3 option. Fargate disk is ephemeral, so every uploaded
    document is lost at each task restart. The app also needs Redis. The database part works (PostgreSQL or
    MariaDB), but durable document storage has no Deployz answer.
dockerfile:
  accept: [Dockerfile]
  reject: []
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 8, quote: "AS compile-frontend"}
    - {path: Dockerfile, line: 88, quote: "FROM s6-overlay-base AS main-app"}
    - {path: Dockerfile, line: 213, quote: "COPY --chown=1000:1000 ./src ./"}
    - {path: Dockerfile, line: 216, quote: "COPY --from=compile-frontend"}
    - {path: Dockerfile, line: 250, quote: "ENTRYPOINT [\"/init\"]"}
runtime: {accept: [python]}
port:
