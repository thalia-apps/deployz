  - {field: outcome, change: "none: NOT_DEPLOYABLE kept; STORAGES default is FileSystemStorage, no django-storages or boto3 in pyproject.toml, uv.lock or src, docs name only NFS-like shares for remote storage", evidence: "src/paperless/settings/__init__.py:246; grep for storages/boto3 returned no match"}
  - {field: healthPath, change: "none: / is login_required (302), /accounts/login/ is a plain allauth view without auth; ALLOWED_HOSTS defaults to * so the load balancer Host header is accepted", evidence: "src/paperless/urls.py:423; src/paperless/settings/__init__.py:454"}
