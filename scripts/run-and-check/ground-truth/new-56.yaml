    - {path: docker/rootfs/etc/s6-overlay/s6-rc.d/svc-scheduler/run, line: 9, quote: "celery --app paperless beat"}
    - {path: docker/rootfs/etc/s6-overlay/s6-rc.d/svc-consumer/run, line: 16, quote: "manage.py document_consumer"}
