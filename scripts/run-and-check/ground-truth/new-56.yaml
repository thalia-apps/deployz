    - {path: src/paperless/settings/custom.py, line: 261, quote: "\"HOST\": os.getenv(\"PAPERLESS_DBHOST\"),"}
    - {path: src/paperless/settings/custom.py, line: 264, quote: "\"PASSWORD\": os.getenv(\"PAPERLESS_DBPASS\", \"paperless\"),"}
    - {path: docs/configuration.md, line: 63, quote: "By default, Paperless uses **SQLite**"}
migrations:
