id: new-205
repository: NousResearch/hermes-agent
commit: ef75bc708867e3884cb40a91363be6dc6fddc034
summary: >
  Hermes Agent is a Python self-improving AI agent with a CLI, a messaging gateway (chat platforms such as Teams and
  Google Chat), an optional OpenAI-compatible API server (8642) and an optional web dashboard (9119). The root Dockerfile
  builds the whole app from the repository source (COPY . .) into one s6-overlay supervised image. All state (config,
  API keys in .env, the SQLite session database state.db, MEMORY.md and USER.md memory, skills, profiles) lives in the
  HERMES_HOME directory /opt/data, declared as a VOLUME. The image runs nothing web-facing by default.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    The agent keeps its memory, sessions, skills, credentials and profile definitions on a durable local data directory
    (/opt/data, SQLite state.db plus files) that the repository itself treats as a persistent volume shared by the
    gateway and dashboard services. Fargate task storage is ephemeral and EFS is not provided, so every restart would
    lose the agent state, and the dashboard and gateway are two processes that must share that directory. The gateway is
    a long-running client of chat platforms rather than an HTTP web service. The Dockerfile is buildable but does not
    start an HTTP service unless HERMES_DASHBOARD is set.
dockerfile:
  accept: [Dockerfile]
  reject:
    - {path: docker/sandbox-desktop.Dockerfile, reason: "terminal-backend sandbox image with a desktop; contains no Hermes runtime"}
    - {path: scripts/termux/termux-builder.Dockerfile, reason: "Android Termux wheel build image"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 352, quote: "FROM python_deps AS runtime"}
    - {path: Dockerfile, line: 395, quote: "COPY --link --chmod=a+rX,go-w . ."}
    - {path: Dockerfile, line: 574, quote: "ENTRYPOINT [ \"/opt/hermes/docker/entrypoint-dispatch.sh\" ]"}
    - {path: docker/sandbox-desktop.Dockerfile, line: 1, quote: "# Terminal-backend sandbox image WITH a desktop"}
runtime: {accept: [python]}
port:
  # 9119 is the dashboard (needs HERMES_DASHBOARD); 8642 is the optional OpenAI-compatible API server.
  accept: [9119, 8642]
  evidence:
    - {path: docker/s6-rc.d/dashboard/run, line: 29, quote: "dash_port=\"${HERMES_DASHBOARD_PORT:-9119}\""}
    - {path: gateway/platforms/api_server.py, line: 156, quote: "DEFAULT_PORT = 8642"}
