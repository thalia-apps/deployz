env:
  required:
    - {name: HERMES_DASHBOARD, secret: false, buildTime: false, note: "set to 1 to start the dashboard service; otherwise nothing listens"}
    - {name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME, secret: false, buildTime: false, note: "a non-loopback dashboard fails closed without an auth provider"}
    - {name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD, secret: true, buildTime: false, note: "pair of the user name"}
  optional: [HERMES_DASHBOARD_PORT, HERMES_DASHBOARD_HOST, HERMES_UID, HERMES_GID, API_SERVER_HOST, API_SERVER_KEY, API_SERVER_PORT, HERMES_DASHBOARD_OAUTH_CLIENT_ID]
  buildTime: [HERMES_BOT_DESKTOP]
  evidence:
    - {path: docker/s6-rc.d/dashboard/run, line: 34, quote: "Password: set HERMES_DASHBOARD_BASIC_AUTH_USERNAME + _PASSWORD"}
    - {path: Dockerfile, line: 95, quote: "ARG HERMES_BOT_DESKTOP=0"}
blockers:
  expected:
    - "The agent state (memory, sessions in state.db, skills, profiles, API keys) is stored in the durable data directory /opt/data; Fargate has only ephemeral task storage"
    - "The gateway and the dashboard are separate processes that share /opt/data; they need a shared durable volume"
    - "Nothing serves HTTP unless HERMES_DASHBOARD is set; the default main program is the interactive CLI"
  mustNot:
    - "A database or Redis must not be reported as required: state is SQLite and files"
    - "The image must not be treated as a failed build: the root Dockerfile builds from repo source"
    - "docker/sandbox-desktop.Dockerfile must not be treated as the application image"
vendorQuestions:
  legitimate:
    - "Is losing agent memory, sessions and configuration on every restart acceptable, or does the agent need a persistent volume?"
    - "Which chat platforms does the gateway connect to, and where are their tokens stored?"
  unnecessary:
    - "Which Dockerfile? (the root Dockerfile)"
    - "Is a database needed? (no, SQLite in HERMES_HOME)"
traps:
  - "docker-compose.yml uses network_mode host and runs gateway and dashboard as two services that mount the same ~/.hermes (docker-compose.yml:35)"
  - "The dashboard binds 127.0.0.1 in docker-compose.yml but 0.0.0.0 in the image service script (docker/s6-rc.d/dashboard/run:28)"
  - "HERMES_DASHBOARD_INSECURE is ignored; a public dashboard needs basic auth or OAuth (docker/s6-rc.d/dashboard/run:34)"
  - "The image entrypoint needs s6-overlay /init as PID 1 and fails under an arbitrary --user (docker/main-wrapper.sh)"
  - "The Dockerfile has many stages (sqlite_build, runtime_base, python_deps, icons, frontend_build, webapp_build, runtime); the last stage runtime is the application"
openQuestions:
  - "Whether the dashboard is useful without a persistent /opt/data was not tested; state would reset at each task start"
  - "Whether the CLI default main program exits at once without a TTY when no gateway command is set was not checked"
crossReview:
  - {field: outcome.accept, change: "[NOT_DEPLOYABLE] -> [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]: durable /opt/data state and two processes are CODE_CHANGE by policy (docs/ai-analysis.md fix classes; precedent new-131, new-139)", evidence: "packages/analysis/src/readiness-report.ts FIX_CLASSES"}
