    - {path: docker/main-wrapper.sh, line: 16, quote: "no args                       → exec `hermes` (the default)"}
    - {path: docker/s6-rc.d/dashboard/run, line: 9, quote: "case \"${HERMES_DASHBOARD:-}\" in"}
    - {path: docker-compose.yml, line: 61, quote: "command: [\"gateway\", \"run\"]"}
