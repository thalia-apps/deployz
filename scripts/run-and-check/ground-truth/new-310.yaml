id: new-310
repository: ente/ente
commit: 23412c64b091dafcbfb57bb1e2048a62ba7d1fd0
summary: >
  The ente/ente monorepo holds the apps of Ente (end-to-end encrypted photos, auth and others): mobile, desktop, web, CLI
  and Rust code, and the server called Museum in server/. Museum is one Go binary (server/Dockerfile, build context
  server/) that serves the API on port 8080 (/ping is the health route). It needs PostgreSQL (db.* settings; the schema is
  migrated at start with golang-migrate) and S3-compatible object storage with fixed bucket names in the config
  (b2-eu-cen, wasabi-eu-central-2-v3, scw-eu-fr-v3, and an optional derived bucket); every file the users upload is stored
  there. The image copies configurations/ (local.yaml is the default, ENVIRONMENT selects another file), and every value
  can be set with ENTE_* environment variables (viper with a "." and "-" to "_" key replacer), or with museum.yaml and
  credentials.yaml files. Cron jobs run inside the process. The web apps are a separate image (web/Dockerfile) and
  are not needed for the API; the mobile and desktop apps talk to Museum.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    One Go web process built from server/Dockerfile, PostgreSQL through ENTE_DB_* values, S3 storage through ENTE_S3_*
    values, migrations and cron jobs inside the process, no Redis, no local data. Every required value has an environment
    name, so settings alone can deploy it: DEPLOYABLE. The case is not fully clear because the S3 configuration has three
    fixed bucket names with a key, secret, endpoint, region and bucket each (the sample compose file uses a config file),
    and the default config holds public example secrets that must be replaced; a vendor who bakes a museum.yaml into the
    image would be a repository change (DEPLOYABLE_WITH_CHANGES). The web apps are optional clients, not a second service
    that must run.
dockerfile:
  accept: [server/Dockerfile]
  reject:
    - {path: web/Dockerfile, reason: "image for the web apps (static sites); a client of Museum, not the API server"}
    - {path: cli/Dockerfile, reason: "image for the ente command-line tool, not a web service"}
    - {path: infra/copycat-db/Dockerfile, reason: "database backup helper for the hosted service, not the application"}
  target: null
  context: server
  evidence:
    - {path: server/Dockerfile, line: 12, quote: "go build -trimpath -o museum cmd/museum/main.go"}
    - {path: server/Dockerfile, line: 16, quote: "COPY configurations configurations"}
    - {path: server/Dockerfile, line: 17, quote: "COPY migrations migrations"}
    - {path: server/Dockerfile, line: 24, quote: "CMD [\"./museum\"]"}
runtime: {accept: [go]}
port:
  accept: [8080]
  evidence:
    - {path: server/cmd/museum/main.go, line: 1158, quote: "port := 8080"}
    - {path: server/compose.yaml, line: 10, quote: "- 8080:8080 # API"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: server/cmd/museum/main.go, line: 1166, quote: "server.Run(fmt.Sprintf(\":%d\", port))"}
startCommand:
