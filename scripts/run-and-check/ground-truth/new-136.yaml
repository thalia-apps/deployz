    - {path: docker/Dockerfile, line: 62, quote: "ENV GOTIFY_SERVER_PORT=$GOTIFY_SERVER_EXPOSE"}
    - {path: config/config.go, line: 104, quote: "Port: 80,"}
    - {path: config/keys.go, line: 7, quote: "EnvServerPort                       = \"GOTIFY_SERVER_PORT\""}
bindAllInterfaces:
