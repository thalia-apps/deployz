id: new-136
repository: gotify/server
commit: dd06dc77190696e93d3297b9a733711516fb17d9
summary: >
  Gotify server is a Go (gin) push-notification server with a React UI (ui/, built with yarn) embedded into the
  binary. One process serves the REST API, the WebSocket stream (/stream) and the UI on one HTTP port (80 by
  default, GOTIFY_SERVER_PORT). The database is SQLite by default (data/gotify.db); MySQL and PostgreSQL are
  selected at run time by GOTIFY_DATABASE_DIALECT and GOTIFY_DATABASE_CONNECTION. docker/Dockerfile builds the
  server from the repo source, but by default it does NOT build the UI (build arg BUILD_JS=0).
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, DEPLOYABLE]
  reason: >
    Single process, one port, unauthenticated GET /health, optional PostgreSQL, no Redis and no workers. The Dockerfile
    builds from source but skips the UI unless the build argument BUILD_JS=1 is passed, and the Go package embeds
    `build/*` from ui/build, which is not in the repo. Deployz cannot pass build arguments, so a deploy needs the
    default changed to BUILD_JS=1 (DEPLOYABLE_WITH_CHANGES). A read that only looks at the runtime shape gives DEPLOYABLE.
