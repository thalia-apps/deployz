  accept: [docker/Dockerfile]
  reject: []
  target: null
  context: .
  evidence:
    - {path: docker/Dockerfile, line: 13, quote: "FROM --platform=${BUILDPLATFORM} node:24 AS js-builder"}
    - {path: docker/Dockerfile, line: 15, quote: "ARG BUILD_JS=0"}
    - {path: docker/Dockerfile, line: 42, quote: "COPY . /src/gotify"}
    - {path: docker/Dockerfile, line: 55, quote: "FROM debian:${DEBIAN}"}
    - {path: docker/Dockerfile, line: 75, quote: "COPY --from=builder /target /"}
runtime: {accept: [go]}
port:
