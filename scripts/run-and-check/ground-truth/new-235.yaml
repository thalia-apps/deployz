blockers:
  expected:
    - "No Dockerfile exists in the repository: a production Dockerfile (npm ci, prisma generate, next build, next start) must be added"
  mustNot:
    - "Redis must not be required: the app has no Redis client"
    - "SAML Jackson must not be raised as a second service: it is embedded and uses the same PostgreSQL (JACKSON_URL is optional)"
    - "Svix, Retraced, Stripe, GitHub and Google must not block: they are optional integrations"
    - "docker-compose.yml must not be read as an app topology: it only starts a local PostgreSQL"
vendorQuestions:
  legitimate:
    - "Which production image should Deployz build? The repository has no Dockerfile"
    - "Which login providers should be on? (AUTH_PROVIDERS defaults to github,credentials; GitHub needs client keys)"
    - "Which SMTP server sends verification and password reset emails?"
  unnecessary:
    - "Which database? (PostgreSQL through DATABASE_URL)"
    - "Is Redis needed? (no)"
    - "Health path? (/api/health)"
traps:
  - "The README says the Docker configuration is in the Dockerfile, but there is no Dockerfile in the tree (README.md:54)"
  - "`npm run build` runs `prisma db push`, which needs a reachable database at image build time; a Dockerfile must run `prisma generate && next build` (the build-ci script) instead (package.json:11, :24)"
  - "The npm start script pins port 4002, while the Procfile `next start` uses PORT or 3000 (package.json:12, Procfile:1)"
  - ".env.example contains a usable-looking NEXTAUTH_SECRET; it must be replaced (.env.example:4)"
  - "docker-compose.yml starts only PostgreSQL for local development (docker-compose.yml:3)"
  - "The project is called a starter kit, but it is a complete runnable app, not a scaffolding template"
openQuestions: []
