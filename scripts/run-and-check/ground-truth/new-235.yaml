id: new-235
repository: boxyhq/saas-starter-kit
commit: abc9b686823cbfb4973c79bc36fea37a3244be6c
summary: >
  The BoxyHQ SaaS Starter Kit is a runnable Next.js 15 (pages router) app with NextAuth, teams, embedded SAML Jackson
  (SSO and directory sync), webhooks (Svix), audit logs (Retraced) and Stripe payments. PostgreSQL is the only database
  (Prisma with DATABASE_URL; embedded Jackson uses the same URL). The repository has no Dockerfile: it is deployed on
  Vercel, Heroku (Procfile `next start`) or DigitalOcean App Platform (buildpacks). docker-compose.yml only starts a local
  PostgreSQL. `npm run build` runs `prisma db push`, so the stock build needs a database. No Redis, no worker, no local
  storage.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]
  reason: >
    The architecture fits Deployz (one Next.js web process, PostgreSQL through DATABASE_URL, /api/health without login,
    no Redis, no worker, no disk state). But the full file list has no Dockerfile, so a repository change is needed: a
    Dockerfile that runs npm ci, prisma generate and next build (not `npm run build`, which runs prisma db push against a
    database at build time) and starts `next start`, plus a migration command (prisma migrate deploy). As new-156 and
    new-194 (no Dockerfile for an app that otherwise fits).
