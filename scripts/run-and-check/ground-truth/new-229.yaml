  accept: ["valkey-server /path/to/valkey.conf"]
  evidence:
    - {path: src/Makefile, line: 771, quote: "# valkey-server"}
    - {path: src/server.c, line: 8165, quote: "serverLog(LL_NOTICE, \"oO0OoO0OoO0Oo Valkey is starting oO0OoO0OoO0Oo\");"}
