    - {path: valkey.conf, line: 697, quote: "dir ./"}
    - {path: valkey.conf, line: 1684, quote: "appendonly no"}
env:
  required: []
  optional: []
  buildTime: []
  evidence: []
blockers:
  expected:
    - "The repository is the Valkey server; clients use RESP on 6379, not HTTP"
    - "The tree has no Dockerfile, so no image can be built from it"
  mustNot:
    - "ElastiCache Valkey must not be offered as a way to deploy this repository: the repository is the Valkey engine itself"
    - "Local disk must not be reported as the blocker: persistence is optional"
vendorQuestions:
  legitimate:
    - "Is Valkey being deployed as the cache for another app? Use the managed ElastiCache Valkey in Deployz instead"
  unnecessary:
    - "Which port? (6379)"
    - "Which health path? (valkey-server has no HTTP endpoint)"
traps:
  - "A Valkey repository can be mistaken for a Redis client because Deployz uses ElastiCache Valkey; here Valkey is the product"
  - "The README is a make-based build guide with no container instructions (README.md:13)"
openQuestions:
  - "None that change the outcome"
