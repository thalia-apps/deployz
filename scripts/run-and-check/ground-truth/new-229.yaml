id: new-229
repository: valkey-io/valkey
commit: ffbd8481a90ca0786d1d1b63c55df695be6d08e0
summary: >
  Valkey is a C in-memory key-value server (valkey-server), a fork of Redis. It is a datastore, not a web application.
  It speaks the RESP protocol on TCP 6379 and, with the default valkey.conf, binds to loopback with protected mode on.
  The repository has no Dockerfile or compose file; the official container images are built in a separate repository.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository is a key-value server. Clients use RESP on 6379, which is not HTTP and cannot sit behind the ALB.
    The tree has no Dockerfile, so nothing builds a runnable image. Deployz already provides ElastiCache Valkey for
    apps that need Redis or Valkey; it does not host the Valkey server. Local disk (RDB and AOF) is optional, but the
    protocol decides the outcome.
dockerfile:
  accept: []
  reject: []
  target: null
  context: .
  evidence: []
runtime: {accept: [c]}
port:
  accept: [6379]
  evidence:
    - {path: valkey.conf, line: 139, quote: "port 6379"}
    - {path: src/config.c, line: 3565, quote: "createIntConfig(\"port\", NULL, MODIFIABLE_CONFIG, 0, 65535, server.port, 6379,"}
bindAllInterfaces:
  # valkey.conf binds loopback; protected-mode is on.
  value: false
  evidence:
    - {path: valkey.conf, line: 88, quote: "bind 127.0.0.1 -::1"}
    - {path: valkey.conf, line: 112, quote: "protected-mode yes"}
startCommand:
