  # /health_check probes the database and the chat cache and returns 500 if one fails. Neither needs auth.
  evidence:
    - {path: src/backend/base/langflow/api/health_check_router.py, line: 67, quote: "@health_check_router.get(\"/health\")"}
    - {path: src/backend/base/langflow/api/health_check_router.py, line: 74, quote: "@health_check_router.get(\"/health_check\")"}
