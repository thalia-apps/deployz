id: new-100
repository: langflow-ai/langflow
commit: aeb10d96bb2ea797696613af931e91ddf51f3320
summary: >
  Langflow visual AI flow builder (Python 3.14 FastAPI backend, React frontend built with npm, uv workspace).
  One production Dockerfile, docker/build_and_push.Dockerfile, builds frontend and backend from source. Its last
  stage (`full`) runs `langflow run`, which serves API and UI from one process on port 7860. SQLite is the default
  database, so a Deployz deploy must set LANGFLOW_DATABASE_URL to PostgreSQL. Auth is on (AUTO_LOGIN=false in the
  image), so LANGFLOW_SUPERUSER_PASSWORD is mandatory. Uploaded files use local disk by default; native S3 storage
  is available. Redis, Celery and separate workers are not needed for one instance.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, DEPLOYABLE]
  reason: >
    The image starts the app with no command. It needs LANGFLOW_DATABASE_URL (PostgreSQL), LANGFLOW_SUPERUSER_PASSWORD
    and LANGFLOW_SECRET_KEY. For durable uploads set LANGFLOW_STORAGE_TYPE=s3 with a bucket. Without them the app
    refuses to start (no superuser password) or keeps data on ephemeral disk (SQLite, local files).
    Redis is only needed for several workers. No second image is needed.
