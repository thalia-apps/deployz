    - {path: src/backend/base/langflow/services/database/service.py, line: 365, quote: "driver = \"postgresql+psycopg\""}
    - {path: docker/build_and_push.Dockerfile, line: 79, quote: "uv sync --frozen --extra postgresql --no-default-groups --no-install-workspace"}
