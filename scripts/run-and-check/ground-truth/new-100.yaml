    - {path: docker/build_and_push_ep.Dockerfile, reason: "legacy image with nv-ingest extra; CMD runs --backend-only, so the UI is not served"}
    - {path: docker/render.Dockerfile, reason: "FROM langflowai/langflow:latest, a pre-built registry image, not built from the repo"}
    - {path: docker_example/Dockerfile, reason: "FROM langflowai/langflow:latest, a pre-built registry image"}
    - {path: docker_example/pre.Dockerfile, reason: "wraps a pre-built registry image"}
    - {path: docker/dev.Dockerfile, reason: "development image; CMD runs docker/dev.start.sh"}
    - {path: docker/cdk.Dockerfile, reason: "CDK sample image, not the main application"}
    - {path: src/frontend/dev.Dockerfile, reason: "frontend dev server image"}
    - {path: src/lfx/docker/Dockerfile, reason: "lfx executor package image, not the Langflow app"}
    - {path: .devcontainer/Dockerfile, reason: "devcontainer, not production"}
  target: null
  context: .
  evidence:
    - {path: docker/build_and_push.Dockerfile, line: 264, quote: "FROM runtime AS full"}
    - {path: docker/build_and_push.Dockerfile, line: 261, quote: "DEFAULT IMAGE (default/final target)"}
    - {path: docker/build_and_push.Dockerfile, line: 240, quote: "CMD [\"langflow\", \"run\"]"}
    - {path: docker/build_and_push.Dockerfile, line: 94, quote: "npm run build"}
    - {path: docker/build_and_push.Dockerfile, line: 125, quote: "COPY ./.release-artifacts /tmp/release-artifacts"}
    - {path: docker/build_and_push_backend.Dockerfile, line: 130, quote: "CMD [\"python\", \"-m\", \"langflow\", \"run\", \"--backend-only\"]"}
    - {path: docker/render.Dockerfile, line: 1, quote: "FROM langflowai/langflow:latest"}
    - {path: scripts/ci/install_release_wheels.py, line: 129, quote: "if not any(artifacts_dir.rglob(\"*.whl\")):"}
