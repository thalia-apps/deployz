env:
  required:
    - {name: LANGFLOW_DATABASE_URL, secret: true, buildTime: false, note: "postgresql://user:password@host:5432/dbname; without it the app uses SQLite on ephemeral disk; contains the DB password"}
    - {name: LANGFLOW_SUPERUSER_PASSWORD, secret: true, buildTime: false, note: "startup raises an error when empty because the image sets AUTO_LOGIN=false; LANGFLOW_SUPERUSER (default langflow) is the user name"}
    - {name: LANGFLOW_SECRET_KEY, secret: true, buildTime: false, note: "JWT and stored-variable encryption key; if missing a key is generated into the config dir (ephemeral), so tokens and encrypted variables break on restart or with several tasks; use 32+ chars"}
    - {name: LANGFLOW_STORAGE_TYPE, secret: false, buildTime: false, note: "s3 for durable uploaded files; default local is ephemeral"}
    - {name: LANGFLOW_OBJECT_STORAGE_BUCKET_NAME, secret: false, buildTime: false, note: "S3 bucket; default langflow-bucket is a placeholder; credentials come from the AWS default chain (task role)"}
    - {name: AWS_DEFAULT_REGION, secret: false, buildTime: false, note: "region for the S3 client"}
  optional: [LANGFLOW_SUPERUSER, LANGFLOW_OBJECT_STORAGE_PREFIX, LANGFLOW_WORKERS, LANGFLOW_LOG_LEVEL, LANGFLOW_ENABLE_SIGNUP, LANGFLOW_ACCESS_SECURE, LANGFLOW_REFRESH_SECURE, LANGFLOW_CACHE_TYPE, LANGFLOW_REDIS_HOST, LANGFLOW_REDIS_PORT, LANGFLOW_JOB_QUEUE_TYPE, LANGFLOW_CONFIG_DIR, LANGFLOW_SAVE_DB_IN_CONFIG_DIR, LANGFLOW_DATABASE_CONNECTION_RETRY]
  buildTime: []
  evidence:
    - {path: docker/build_and_push.Dockerfile, line: 235, quote: "ENV LANGFLOW_AUTO_LOGIN=false"}
    - {path: src/backend/base/langflow/services/utils.py, line: 232, quote: "if not username or not password:"}
    - {path: src/lfx/src/lfx/services/settings/auth.py, line: 364, quote: "secret_key_path = Path(config_dir) / \"secret_key\""}
    - {path: src/lfx/src/lfx/services/settings/auth.py, line: 138, quote: "SUPERUSER: str = DEFAULT_SUPERUSER"}
    - {path: src/lfx/src/lfx/services/settings/auth.py, line: 150, quote: "ACCESS_SECURE: bool = False"}
    - {path: .env.example, line: 102, quote: "# LANGFLOW_SUPERUSER_PASSWORD must be set when AUTO_LOGIN is false."}
blockers:
  expected: []
  mustNot:
    - "SQLite default must not block: PostgreSQL is supported through LANGFLOW_DATABASE_URL and the psycopg driver is in the image"
    - "Local file and knowledge-base directories must not block: S3 file storage is native; knowledge bases are an optional feature"
    - "Redis must not be required: in-memory cache and job queue are the defaults for one worker"
    - "Celery or a worker process must not be required: celery_enabled is False and the image has no worker command"
    - "Node.js in the runtime image must not mean a second service: it is only for npx-based MCP stdio servers"
    - "deploy/docker-compose.yml (traefik, pgadmin, broker, db) must not set the topology: it is a legacy sample"
vendorQuestions:
  legitimate:
    - "Which superuser name and password should the first admin use?"
    - "Are knowledge bases or other local-disk features (MCP config, profile pictures) needed? Their data is on ephemeral disk"
  unnecessary:
    - "Which port? (7860 in image and defaults)"
    - "Who runs migrations? (the app runs alembic at startup)"
    - "Is a worker or Redis needed? (not for one instance)"
    - "Health path? (/health_check or /health)"
traps:
  - "Many Dockerfiles in docker/ -> only build_and_push.Dockerfile builds the full app from source; backend and ep variants use --backend-only; render.Dockerfile and docker_example pull langflowai/langflow:latest (docker/build_and_push_backend.Dockerfile:130, docker/render.Dockerfile:1)"
  - "Multi-stage file with base, full-bundles and full targets -> the last stage `full` is the default image; no --target needed (docker/build_and_push.Dockerfile:264)"
  - "COPY ./.release-artifacts looks like a CI artefact -> the directory is tracked in the repo (README.md) and the install step is a no-op when it has no wheels (docker/build_and_push.Dockerfile:125)"
  - "render.yaml mounts a disk at /app/data and uses SQLite -> a Render persistent-disk pattern; Deployz has no volumes, use PostgreSQL and S3 (render.yaml:14)"
  - "deploy/docker-compose.yml uses langflow-backend, broker and result_backend (Celery) -> legacy; the settings default celery_enabled to False (src/lfx/src/lfx/services/settings/groups/runtime.py:375)"
  - "/health is answered by uvicorn before the app is ready -> use /health_check which probes the database (api/health_check_router.py:63-74)"
  - "Frontend build runs npm with a 4 GB Node heap and the Python deps compile native code -> the build needs much memory and time (docker/build_and_push.Dockerfile:94)"
  - "Image sets LANGFLOW_AUTO_LOGIN=false -> without LANGFLOW_SUPERUSER_PASSWORD the app exits at startup (services/utils.py:232)"
openQuestions:
  - "Whether RDS forced TLS works with the default psycopg sslmode (prefer): expected to negotiate TLS, add ?sslmode=require to the URL to be sure"
  - "Knowledge bases and some features keep data on local disk (LANGFLOW_KNOWLEDGE_BASES_DIR); the repo does not show a full S3 route for all of them"
crossReview:
  - {field: dockerfile.evidence, change: "added evidence that the COPY ./.release-artifacts step is a no-op without wheels (the directory holds only README.md in git)", evidence: "scripts/ci/install_release_wheels.py:129; .release-artifacts/README.md"}
  - {field: dockerfile.accept, change: "none: every COPY source of the build stages exists in git (uv.lock, pyproject files, src/bundles, src/frontend, scripts/ci/*, docker/install_hardened_npm.sh, .release-artifacts); last stage full is the default", evidence: "docker/build_and_push.Dockerfile:55-70,87,125,200,264"}
  - {field: healthPath, change: "none: /health_check and /health are both unauthenticated; /health_check returns 500 when the DB or chat probe fails", evidence: "src/backend/base/langflow/api/health_check_router.py:67-85"}
  - {field: env.required LANGFLOW_SUPERUSER_PASSWORD, change: "none: image sets AUTO_LOGIN=false and startup raises ValueError without the password", evidence: "docker/build_and_push.Dockerfile:235; src/backend/base/langflow/services/utils.py:232"}
  - {field: storage / env (S3), change: "none: S3 service builds an aiobotocore session from the default credential chain, so the task role works; bucket default is a placeholder", evidence: "src/backend/base/langflow/services/storage/s3.py:81-82"}
  - {field: all, change: verified, evidence: "47 citations checked"}
