blockers:
  expected:
    - "SQLite is the only durable store: account.sqlite and one SQLite file per budget under the data dir; Deployz has no persistent volume, so data is lost on restart (packages/sync-server/src/account-db.js:19, packages/sync-server/src/util/paths.ts:33)"
    - "Budget blobs (file-<id>.blob) are written to the local user-files dir; there is no S3 or other object-store option (packages/sync-server/src/util/paths.ts:22)"
  mustNot:
    - "The root Dockerfile must not be chosen: it is a development image with the source mounted as a volume"
    - "packages/sync-server/docker/*.Dockerfile must not be chosen as buildable: they need a pre-built build directory"
    - "Redis, workers and a scheduler must not be reported as needed: there are none"
    - "The missing web-client Dockerfile must not be raised: sync-server.Dockerfile builds the web client and serves it from the same Express process"
    - "The yarn monorepo, the 8 GB NODE_OPTIONS and the git init in the build must not be reported as blockers: they are build details of a working Dockerfile"
    - "The default hostname '::' must not be reported as loopback-only: it listens on all interfaces"
vendorQuestions:
  legitimate:
    - "Is losing all budgets and accounts on every restart acceptable? (it should not be; a persistent volume is not available)"
  unnecessary:
    - "Which port? (5006 in the image and config)"
    - "Which Dockerfile? (sync-server.Dockerfile is the only one that builds from source)"
    - "Who runs migrations? (app.ts runs them before the server starts)"
    - "Health path? (/health)"
    - "Is a database or Redis needed? (no, only SQLite on disk)"
traps:
  - "Root Dockerfile -> development container, not the app image (Dockerfile:1-6, Dockerfile:8)"
  - "packages/sync-server/docker/alpine.Dockerfile and ubuntu.Dockerfile look like production images but copy a build directory that only CI produces (docker/alpine.Dockerfile:56, docker/ubuntu.Dockerfile:47)"
  - "packages/sync-server/docker-compose.yml -> uses the published image, not a build from this repo (docker-compose.yml:3)"
  - "bin/package-browser runs `git clone` of the translations repo at build time when locale is missing -> needs network at build, not a source blocker (bin/package-browser:24)"
  - "sync-server.Dockerfile seeds a throwaway git repo because lage needs `git ls-tree HEAD`; the build context has no .git, so this is needed and correct (sync-server.Dockerfile:38)"
  - "Hostname default '::' -> binds IPv6 and IPv4 (dual-stack), not loopback (load-config.js:112)"
  - "Bootstrap endpoint is unauthenticated until a password is set -> the first visitor to the public URL can claim the server (app-account.js:64)"
openQuestions:
  - "Whether a single-user instance with data lost on restart is accepted for a demo: a product choice, not an architecture fact"
