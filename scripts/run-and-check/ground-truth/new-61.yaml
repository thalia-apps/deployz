id: new-61
repository: actualbudget/actual
commit: fd08b56eef24d953e619877dee5990c560f8468e
summary: >
  Actual Budget, a local-first personal finance app (yarn monorepo, React web client, Express sync server in
  packages/sync-server). The server image is built by sync-server.Dockerfile (builds the web client and the server
  from source, runs `node build/app.js` on port 5006). All durable data is SQLite files on local disk under the
  data dir (/data): the account database (account.sqlite), one SQLite file per budget (user-files) and the
  migration state. There is no external database and no S3 support, so a Fargate deploy loses all budgets and
  accounts on every task restart.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The only durable store is SQLite plus blob files on the local disk (ACTUAL_DATA_DIR, default /data). The app
    has no PostgreSQL, MySQL or S3 option, and Deployz has no persistent volume. The image builds and starts, but
    every restart or redeploy wipes the account DB and all synced budget files, so the server is not usable as a
    sync server. The blocker is the storage model, not the build.
