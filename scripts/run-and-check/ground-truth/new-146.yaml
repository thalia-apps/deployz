  - {field: dockerfile.accept / dockerfile.reject, change: "[] -> [apps/dashboard/Dockerfile]; removed the dashboard entry from reject: it builds the product UI from source on port 3000 and is the defensible single pick, even though the other services are still needed", evidence: "apps/dashboard/Dockerfile:122 EXPOSE 3000; apps/dashboard/Dockerfile:129 CMD node server.js; docker-compose.yaml:215"}
  - {field: redis.evidence, change: "fixed line number of the upstash import 7 -> 5", evidence: "apps/dashboard/src/app/api/health/route.ts:5"}
  - {field: database / port / startCommand / healthPath, change: "none: libSQL over HTTP, 3000, node server.js, /api/health and / hold", evidence: "packages/db/src/db.ts:1; apps/dashboard/Dockerfile:122; apps/dashboard/Dockerfile:128-129"}
