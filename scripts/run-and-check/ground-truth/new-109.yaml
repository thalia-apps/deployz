storage:
  local: ephemeral
  paths: [/tmp/windmill/logs, /tmp/windmill/cache, /tmp/windmill/search]
  s3: none
  s3SelectBy: {}
  # The default Dockerfile builds with features="" (CE). Instance object storage (S3 for logs and large results) needs
  # the parquet or enterprise feature, so it is not in the default image. Job logs and data stay in PostgreSQL.
  evidence:
    - {path: Dockerfile, line: 352, quote: "mkdir -p -m 777 /tmp/windmill/logs /tmp/windmill/search /tmp/.cache"}
    - {path: Dockerfile, line: 102, quote: "ARG features=\"\""}
    - {path: backend/Cargo.toml, line: 130, quote: "parquet = [\"windmill-api/parquet\""}
env:
