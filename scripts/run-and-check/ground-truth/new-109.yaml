  reject:
    - {path: docker/DockerfileSlim, reason: "slim variant; not the main production image"}
    - {path: docker/DockerfileSlimEe, reason: "EE variant"}
    - {path: docker/DockerfileFull, reason: "extra variant; not the main production image"}
    - {path: docker/DockerfileFullEe, reason: "EE variant"}
    - {path: docker/DockerfileExtra, reason: "windmill-extra sidecar (LSP, multiplayer, debugger); a second image, optional"}
    - {path: docker/DockerfileCuda, reason: "GPU variant"}
    - {path: docker/DockerfileCli, reason: "CLI image, not the server"}
    - {path: docker/DockerfileCaddyL4, reason: "Caddy proxy image for compose, not the app"}
    - {path: docker-compose.yml, reason: "compose file, not a Dockerfile; uses a pre-built ${WM_IMAGE} from a registry"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 139, quote: "FROM ${DEBIAN_IMAGE}"}
    - {path: Dockerfile, line: 125, quote: "cargo build --release --features \"$features\""}
    - {path: Dockerfile, line: 360, quote: "CMD [\"windmill\"]"}
    - {path: Dockerfile, line: 121, quote: "COPY .git/ .git/"}
runtime: {accept: [rust]}
