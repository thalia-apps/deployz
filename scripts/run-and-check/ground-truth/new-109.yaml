id: new-109
repository: windmill-labs/windmill
commit: 8dd46a4d14ecbce4e2ee4a71561d7a5e917dfed3
summary: >
  Windmill workflow engine and internal-tool platform (Rust backend, Svelte frontend). One root Dockerfile builds
  one image (frontend + Rust binary `windmill`). Without MODE it runs in standalone mode: API server, UI and one
  worker in one process on port 8000. PostgreSQL is the only required store; migrations run at start. The Dockerfile
  has `COPY .git/ .git/`, which fails when the build context has no .git. The release build is a very long Rust compile.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    Topology fits Deployz: one image, one HTTP port, PostgreSQL via DATABASE_URL, no Redis, standalone mode embeds
    the worker. Blocker: Dockerfile line 121 copies .git, which is absent from a repo archive, so the build fails
    until that line is removed (GIT_VERSION has a fallback, so the binary does not need .git). With that one-line
    change it is DEPLOYABLE_WITH_CHANGES. NOT_DEPLOYABLE is also acceptable because the image is very heavy
    (full Rust release build plus Go, Python, Node, Bun, PowerShell, Claude CLI downloads).
