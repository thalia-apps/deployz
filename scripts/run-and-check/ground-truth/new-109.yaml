healthPath:
  accept: ["/api/version", "/api/health/status"]
  # The /api router is built in windmill-api/src/lib.rs. /version and /health/status are in the global part,
  # outside the workspace routes that need ApiAuthed. /version returns 200 with a plain string. /health/status is
  # unauthenticated, cached, and returns 503 when the status is unhealthy. "/" serves the SPA.
  evidence:
    - {path: backend/windmill-api/src/lib.rs, line: 666, quote: "\"/api\","}
    - {path: backend/windmill-api/src/lib.rs, line: 1138, quote: ".route(\"/version\", get(git_v))"}
    - {path: backend/windmill-api/src/lib.rs, line: 1139, quote: ".nest(\"/health/status\", health::status_service())"}
    - {path: backend/windmill-api/src/health.rs, line: 132, quote: "Router::new().route(\"/\", get(health_status))"}
    - {path: backend/windmill-api/src/health.rs, line: 519, quote: "StatusCode::SERVICE_UNAVAILABLE"}
