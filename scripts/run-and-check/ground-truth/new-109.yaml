  optional: [MODE, PORT, NUM_WORKERS, WORKER_GROUP, SKIP_MIGRATION, SUPERADMIN_SECRET, DISABLE_NSJAIL, SERVER_BIND_ADDR, DATABASE_URL_FILE]
  buildTime: []
  evidence:
    - {path: backend/windmill-api/src/lib.rs, line: 429, quote: "std::env::var(\"SUPERADMIN_SECRET\").ok(),"}
    - {path: backend/windmill-worker/src/worker.rs, line: 390, quote: "pub static ref DISABLE_NSJAIL: bool = std::env::var(\"DISABLE_NSJAIL\")"}
    - {path: README.md, line: 260, quote: "default credentials: `admin@windmill.dev` / `changeme`"}
blockers:
  expected:
    - "Dockerfile line 121 `COPY .git/ .git/` fails: the build context is a repo archive with no .git; the line must be removed (GIT_VERSION falls back to unknown-version)"
  mustNot:
    - "Redis must not be required: the app has no Redis dependency"
    - "Separate worker service must not be required: the default standalone mode runs server and worker in one process"
    - "nsjail or privileged mode must not block: DISABLE_NSJAIL defaults to true; privileged is only for optional PID isolation in compose"
    - "docker-compose windmill_extra (LSP, debugger) must not be a blocker: it is optional and the app works without it"
    - "The Docker client in the image must not count as Docker-in-Docker: it is only used if a docker socket is mounted, which is optional"
    - "Local disk under /tmp/windmill must not block: only caches and logs; durable data is in PostgreSQL"
vendorQuestions:
  legitimate:
    - "Is the default admin@windmill.dev / changeme login acceptable on a public URL, or must it be changed at first login?"
  unnecessary:
    - "Which port? (8000 in image and code)"
    - "Who runs migrations? (the server runs them at start)"
    - "Is a separate worker needed? (standalone mode embeds one)"
    - "Is Redis needed? (no)"
traps:
  - "docker-compose.yml lists separate server, worker, native worker, indexer and windmill_extra services -> these use the same image with MODE=..., except windmill_extra (separate optional image); default standalone mode needs none of them (docker-compose.yml:56)"
  - "docker-compose.yml worker has privileged: true -> optional PID isolation, not needed (docker-compose.yml:78)"
  - "Dockerfile copies the docker client binary -> only for the optional docker socket feature (Dockerfile:316)"
  - "/ serves the SPA; use /api/version as health path (backend/windmill-api/src/lib.rs:1138)"
  - "Dockerfile builds nsjail, DuckDB runner, Rust binary and frontend in several stages -> last stage is the app; no --target needed (Dockerfile:139)"
  - "Dockerfile needs the wasm parser pkg and docs dirs -> they are committed in the repo, not CI artefacts (Dockerfile:79-81)"
openQuestions:
  - "Whether a builder can finish the Rust release build (cargo chef, --release, frontend NODE_OPTIONS max-old-space-size=8192) within time and memory limits"
  - "Whether RDS rds_superuser can run the role migrations (CREATE ROLE windmill_user, windmill_admin WITH BYPASSRLS); migration 20220123221901 catches errors and only raises a notice"
crossReview:
  - {field: dockerfile / blockers, change: "none: COPY .git/ .git/ confirmed as a build failure for an archive without .git; git_version! has fallback unknown-version so removing the line is safe. All other COPY sources (wasm parser pkg, typescript-client/docs, python-client/docs, system_prompts/auto-generated, chat-sdk/src, docker/nsjail-patches, frontend lockfile, .sqlx offline data) are tracked in git", evidence: "Dockerfile:121; backend/windmill-common/src/utils.rs:39-40; git ls-files"}
  - {field: healthPath, change: "none: /api/version returns the plain string CE <git version> with 200 and no auth; /api/health/status is unauthenticated and 503 when unhealthy", evidence: "backend/windmill-api/src/lib.rs:1138,1378; backend/windmill-api/src/health.rs:130-133"}
  - {field: storage.s3 / redis, change: "none: default features is empty so no object-store feature in the default image; no Redis code in the backend (only a py import mapping and dbt text)", evidence: "Dockerfile:102; backend/Cargo.toml:121; grep redis backend"}
  - {field: outcome, change: "none: DEPLOYABLE_WITH_CHANGES or NOT_DEPLOYABLE both stay accepted; the one-line Dockerfile fix and the heavy build are a judgement call", evidence: "Dockerfile:121"}
  - {field: all, change: verified, evidence: "31 citations checked"}
