id: new-234
repository: spliit-app/spliit
commit: 73478ed2f67a59e83866948caeece6bf2ecb985e
summary: >
  Spliit is a Next.js 16 app (tRPC, Prisma 7) to share expenses in groups. There is no user login: groups are reached by
  their link. The root Dockerfile builds the standalone Next.js output from source and its entrypoint runs
  `prisma migrate deploy` and then `node server.js` on port 3000 (HOSTNAME=0.0.0.0). PostgreSQL is the only database
  (POSTGRES_PRISMA_URL and POSTGRES_URL_NON_POOLING). No Redis and no worker. Optional features are expense documents in
  S3 (static keys only), OpenAI receipt and category extraction, analytics, and group deletion, which needs a scheduled
  call to /api/cron/purge-deleted-groups (listed in vercel.json).
outcome:
  accept: [DEPLOYABLE]
  reason: >
    One web process from the root Dockerfile (builds from source), port 3000, /api/health/liveness and /api/health,
    migrations at start in the entrypoint, PostgreSQL through two URL variables, no Redis, no worker and no durable local
    disk. Only settings are needed (the two database URLs and BASE_URL). The optional S3 expense documents need static
    keys, but they are an opt-in feature. As new-40 (one container, PostgreSQL, startup migrations).
