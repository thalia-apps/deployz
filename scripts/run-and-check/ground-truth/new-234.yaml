blockers:
  expected: []
  mustNot:
    - "The vercel.json cron must not block or provision a schedule: group deletion is opt-in and a vendor question at most"
    - "S3 must not be required: expense documents are off by default"
    - "The scripts/build.env placeholder values (database host db, fake S3 and OpenAI keys) must not be read as runtime requirements"
    - "OpenAI must not be required: receipt and category extraction are off by default"
    - "A missing CMD must not be raised: the ENTRYPOINT starts the server"
vendorQuestions:
  legitimate:
    - "Should users be able to delete groups? It needs ENABLE_GROUP_DELETION, CRON_SECRET and a daily call to /api/cron/purge-deleted-groups"
    - "Are expense documents wanted? They need a bucket and static S3 keys (S3_UPLOAD_KEY and S3_UPLOAD_SECRET)"
  unnecessary:
    - "Which port? (3000)"
    - "Which database? (PostgreSQL)"
    - "Who runs migrations? (the entrypoint runs prisma migrate deploy)"
    - "Health path? (/api/health/liveness)"
traps:
  - "The image has ENTRYPOINT and no CMD; the start command is the entrypoint script (Dockerfile:99, scripts/container-entrypoint.sh:10)"
  - "Two database variables are needed, and the app reads POSTGRES_PRISMA_URL, not DATABASE_URL (src/lib/env.ts:38-39, src/lib/prisma.ts:14)"
  - "scripts/build.env is copied to .env only for the build and is deleted from the standalone output; its values are placeholders (Dockerfile:35, :43, scripts/build.env:1)"
  - "NEXT_PUBLIC_* flags are inlined at build time; runtime switches use the ENABLE_* and BASE_URL names (scripts/build.env:12-14, src/lib/env.ts:40-42)"
  - "The node pg driver treats sslmode=require as full certificate checking; an RDS URL may need sslmode=no-verify or the RDS CA (src/lib/prisma.ts:13-15)"
  - "The app has no login: anyone with a group link can see and change the group"
openQuestions: []
