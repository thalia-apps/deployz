env:
  required:
    - {name: DATABASE_TYPE, secret: false, buildTime: false, note: "postgres (or mysql); default sqlite is ephemeral on Fargate"}
    - {name: "DATABASE_HOST / DATABASE_PORT / DATABASE_NAME / DATABASE_USER / DATABASE_PASSWORD", secret: false, buildTime: false, note: "the password is secret"}
    - {name: DATABASE_SSL, secret: false, buildTime: false, note: "true for RDS with forced TLS; see openQuestions on the RDS CA"}
    - {name: STORAGE_TYPE, secret: false, buildTime: false, note: "s3, with S3_STORAGE_BUCKET_NAME and S3_STORAGE_REGION; S3_STORAGE_ACCESS_KEY_ID/SECRET_ACCESS_KEY are optional (both or neither), so the ECS task role works"}
    - {name: FLOWISE_SECRETKEY_OVERWRITE, secret: true, buildTime: false, note: "encryption key for stored credentials; otherwise a random key is written to local disk and lost on restart"}
    - {name: JWT_AUTH_TOKEN_SECRET, secret: true, buildTime: false, note: "else generated into a local key file (ephemeral; breaks with several tasks)"}
    - {name: JWT_REFRESH_TOKEN_SECRET, secret: true, buildTime: false, note: "same as JWT_AUTH_TOKEN_SECRET"}
    - {name: EXPRESS_SESSION_SECRET, secret: true, buildTime: false, note: "same as JWT_AUTH_TOKEN_SECRET"}
    - {name: TOKEN_HASH_SECRET, secret: true, buildTime: false, note: "same as JWT_AUTH_TOKEN_SECRET"}
    - {name: APP_URL, secret: false, buildTime: false, note: "public HTTPS URL; used for CORS, emails and secure cookie decision"}
  optional: [SECRETKEY_STORAGE_TYPE, PORT, HOST, DATABASE_PATH, DATABASE_REJECT_UNAUTHORIZED, DATABASE_SSL_KEY_BASE64, S3_STORAGE_ACCESS_KEY_ID, S3_STORAGE_SECRET_ACCESS_KEY, S3_ENDPOINT_URL, S3_FORCE_PATH_STYLE, BLOB_STORAGE_PATH, SECRETKEY_PATH, LOG_PATH, LOG_LEVEL, MODE, REDIS_URL, REDIS_HOST, REDIS_PORT, QUEUE_NAME, WORKER_CONCURRENCY, TRUST_PROXY, SECURE_COOKIES, CORS_ORIGINS, SMTP_HOST, DISABLE_FLOWISE_TELEMETRY, FLOWISE_FILE_SIZE_LIMIT]
  buildTime: []
  evidence:
    - {path: packages/server/src/utils/index.ts, line: 1554, quote: "FLOWISE_SECRETKEY_OVERWRITE !== undefined"}
    - {path: packages/server/src/utils/index.ts, line: 1698, quote: "const useEnv = envVal"}
    - {path: packages/server/src/enterprise/utils/authSecrets.ts, line: 8, quote: "JWT_AUTH_TOKEN_SECRET: 'AABBCCDDAABBCCDDAABBCCDDAABBCCDDAABBCCDD',"}
    - {path: packages/server/src/enterprise/middleware/passport/index.ts, line: 42, quote: "process.env.NODE_ENV === 'production'"}
    - {path: packages/server/src/index.ts, line: 187, quote: "// Default to trust all proxies"}
blockers:
  expected: []
  mustNot:
    - "SQLite default must not block: PostgreSQL and MySQL are supported via DATABASE_TYPE"
    - "Local ~/.flowise storage must not block: S3 storage is native and the S3 keys are optional (task role)"
    - "Redis and the worker must not be required: MODE defaults to main, with an in-process cache and node-cron"
    - "docker/Dockerfile must not be chosen: it installs flowise from npm, not from the repo source"
    - "Chromium in the image (Puppeteer document loaders) must not count as a second service"
    - "Other supported vector stores and external LLM APIs are user-configured flow nodes, not Deployz dependencies"
vendorQuestions:
  legitimate:
    - "Queue mode: whether the user wants MODE=queue with Redis and a separate worker service (optional scale-out)"
  unnecessary:
    - "Which port? (3000 in image and code)"
    - "Who runs migrations? (the app runs them at boot)"
    - "Which Dockerfile? (root Dockerfile builds from source)"
    - "Health path? (/api/v1/ping)"
traps:
  - "docker/Dockerfile -> installs the flowise npm package, not the repo source; use the root Dockerfile (docker/Dockerfile:19)"
  - "docker-compose files mount ../.flowise as a volume and set DATABASE_PATH/SECRETKEY_PATH/BLOB_STORAGE_PATH to it -> the local-disk topology is a default, S3 and Postgres replace it (docker/docker-compose-queue-source.yml:21-34)"
  - "docker-compose-queue-prebuilt.yml and docker/worker use prebuilt flowiseai/* images -> not usable by Deployz; the root image runs the worker command (docker/docker-compose-queue-prebuilt.yml:184)"
  - "Root Dockerfile build sets NODE_OPTIONS max-old-space-size=8192 and runs a full turbo build -> the build needs much memory (Dockerfile:26)"
  - "Missing auth secrets are generated into key files on local disk -> on Fargate they are lost on restart; set them by env (packages/server/src/utils/index.ts:1735)"
  - "Dockerfile comment says node:20-alpine but the base is node:24-alpine (Dockerfile:40, Dockerfile:7)"
openQuestions:
  - "RDS TLS: DATABASE_SSL=true passes ssl:true to the driver, which verifies the server certificate; the RDS CA is not in the Node trust store, so the CA may need DATABASE_SSL_KEY_BASE64 with DATABASE_REJECT_UNAUTHORIZED, or a platform CA bundle"
  - "First visit to a fresh instance lets the visitor create the owner account (no admin env var found): a vendor and operator choice"
crossReview:
 - {field: env.optional, change: "added SECRETKEY_STORAGE_TYPE (aws moves the secrets to AWS Secrets Manager; this needs IAM rights and creates secrets, so env secrets stay the simple path)", evidence: "packages/server/src/utils/index.ts:76,1559-1575"}
 - {field: dockerfile / database / storage.s3 / workers / healthPath, change: "none: root Dockerfile builds from source (COPY . . then pnpm build:docker, CMD pnpm start); DATABASE_TYPE selects sqlite|mysql|mariadb|postgres with sqlite as default; S3 credentials are added only when both keys are set, so the task role works; the worker is optional queue mode; /api/v1/ping is in the auth whitelist and returns 200 pong", evidence: "Dockerfile:31-45; packages/server/src/DataSource.ts:21-103; packages/components/src/storage/S3StorageProvider.ts:46-53; packages/server/src/utils/constants.ts:24"}
 - {field: all, change: verified, evidence: "42 citations checked"}
