id: new-79
repository: FlowiseAI/Flowise
commit: 9291856d1ea4a4ceea9f8fef8ce14f4f6c81e8eb
summary: >
  Flowise, a low-code LLM flow builder (Node.js 24, Express, pnpm/turbo monorepo with a React UI served by the same
  server). The root Dockerfile builds everything from source and runs one process (`pnpm start`, port 3000).
  Defaults are SQLite and local blob storage under ~/.flowise, so a Deployz deploy must select PostgreSQL or MySQL,
  S3 storage and stable secrets by env. Queue mode (Redis plus a `worker` command from the same image) is optional.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    One image, one HTTP port, migrations at boot. Needs DATABASE_TYPE=postgres (or mysql) with DATABASE_* parts,
    STORAGE_TYPE=s3 with S3_STORAGE_BUCKET_NAME and S3_STORAGE_REGION (the S3 keys are optional, so the task role
    works) and fixed secrets (FLOWISE_SECRETKEY_OVERWRITE, JWT, session and token secrets) because the fallback is
    key files on ephemeral disk. Redis and the worker are only for the optional queue mode.
dockerfile:
  accept: [Dockerfile]
  reject:
    - {path: docker/Dockerfile, reason: "installs the published flowise package from npm (npm install -g flowise), not the repo source"}
    - {path: docker/worker/Dockerfile, reason: "worker image variant with a healthcheck sidecar script; the main Dockerfile image runs the worker command too"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 7, quote: "FROM node:24-alpine"}
    - {path: Dockerfile, line: 31, quote: "COPY . ."}
    - {path: Dockerfile, line: 35, quote: "pnpm build:docker"}
    - {path: Dockerfile, line: 45, quote: "CMD [ \"pnpm\", \"start\" ]"}
    - {path: docker/Dockerfile, line: 19, quote: "RUN npm install -g flowise"}
    - {path: docker/Dockerfile, line: 40, quote: "ENTRYPOINT [\"flowise\", \"start\"]"}
