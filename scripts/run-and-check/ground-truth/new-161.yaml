blockers:
  expected: []
  mustNot:
    - "The Prisma/Postgres schema must not be reported as a required database: only chat link sharing uses it"
    - "LLM API keys must not be reported as required app secrets: they are optional server defaults, users can type their own keys in the UI"
    - "MongoDB (MDB_URI) must not block: it is an alternative that needs a schema edit; Deployz uses PostgreSQL"
    - "The missing health route must not block: / answers 200"
vendorQuestions:
  legitimate:
    - "Should the deployment be protected? The app has no login; basic auth needs middleware_BASIC_AUTH.ts renamed to middleware.ts before the build"
    - "Is chat link sharing needed? If yes, the vendor must run `prisma db push` once against the RDS database"
  unnecessary:
    - "Which port? (3000)"
    - "Which Dockerfile? (the only one)"
    - "Which start command? (next start)"
traps:
  - "A prisma schema and POSTGRES_PRISMA_URL look like a required PostgreSQL database -> the database is only for link sharing (src/modules/trade/server/link.ts)"
  - "middleware_BASIC_AUTH.ts looks like active auth -> it is inactive until renamed to middleware.ts (docs/deploy-authentication.md:3)"
  - "next.config.ts sets distDir 'dist' only for BIG_AGI_BUILD standalone or static; the Dockerfile builds the default .next (next.config.ts:49-50, Dockerfile:75-79)"
  - "Dockerfile sets NODE_ENV=development for npm ci then NODE_ENV=production for the build (Dockerfile:20, :54)"
  - "No /health route; a rule that requires an explicit health route finds none (use /)"
openQuestions:
  - "Whether Deployz should warn about an unauthenticated LLM proxy when server-side LLM keys are set"
