id: new-161
repository: enricoros/big-agi
commit: 8a566a48e278a57a054e17dd2a49d2267e6237af
summary: >
  big-AGI is a Next.js 15 (pages router plus tRPC app routes) browser chat UI for many LLM vendors. It is a deployable
  web application: the root Dockerfile builds it from repo source (npm ci, next build, prune) and runs `next start`
  on port 3000. The app is stateless by default (chats live in the browser). A PostgreSQL database through Prisma is an
  optional extra, used only for the chat link sharing feature. There is no Redis, no worker and no S3 use. All
  environment variables are optional (LLM keys can be typed in the UI). The app has no built-in authentication.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    One Dockerfile builds and runs the product on one HTTP port with no required configuration. The only changes a
    vendor may need are HTTP basic auth (a file rename before the build), LLM keys, and an optional PostgreSQL schema
    push for link sharing. With server-side LLM keys set and no auth in front, anyone who reaches the URL can spend
    the LLM quota.
