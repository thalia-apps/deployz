id: new-227
repository: drakkan/sftpgo
commit: 9712163e617744ed244da6d4d2a84cdbd25d8888
summary: >
  SFTPGo is a Go file-transfer server. Its main protocol is SFTP over SSH (port 2022); FTP/S and WebDAV are optional
  bindings that are off by default. It also serves an HTTP service on 8080 with the web admin, the web client and a REST
  API, and a /healthz endpoint. Metadata (users, admins, folders) is stored in a data provider: sqlite by default, with
  postgresql, mysql, cockroachdb, bolt and memory as other drivers. File data is stored on the local filesystem of each
  user by default, or in S3, GCS or Azure Blob when the user is set up with that backend. The root Dockerfile builds the
  server from source with Go; the image runs "sftpgo serve" and the data provider is initialised and migrated at startup.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    SFTPGo is a file-transfer server whose core client protocol is SFTP over SSH (default port 2022), and an ALB serves
    HTTPS only, so the main function cannot be reached. The default storage is the local disk (sqlite file, user home
    directories under /srv/sftpgo/data), which Fargate does not keep. Only the HTTP web client, REST API and WebDAV (when
    enabled) can run on one HTTP port, with PostgreSQL for metadata and S3 for file data; that is a reduced product, not
    the application as built. The Dockerfile itself is a normal source build.
