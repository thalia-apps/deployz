  accept: [8080]
  evidence:
    - {path: sftpgo.json, line: 268, quote: "\"port\": 8080,"}
    - {path: sftpgo.json, line: 89, quote: "\"port\": 2022,"}
bindAllInterfaces:
  value: true
  evidence:
