  items: []
  evidence: []
storage:
  local: required
  paths: [/srv/sftpgo/data, /srv/sftpgo/backups, /var/lib/sftpgo]
  s3: native
  s3SelectBy: {}
  # With the default sqlite driver the database file is under the working directory /var/lib/sftpgo. User files are local
  # unless the user has an S3, GCS or Azure backend.
  evidence:
    - {path: Dockerfile, line: 42, quote: "RUN mkdir -p /etc/sftpgo /var/lib/sftpgo /usr/share/sftpgo /srv/sftpgo/data /srv/sftpgo/backups"}
    - {path: Dockerfile, line: 59, quote: "\"users_base_dir\": \"/srv/sftpgo/data\","}
    - {path: sftpgo.json, line: 204, quote: "\"name\": \"sftpgo.db\","}
    - {path: internal/vfs/s3fs.go, line: 15, quote: "//go:build !nos3"}
env:
  required:
    - {name: SFTPGO_DEFAULT_ADMIN_USERNAME, secret: false, buildTime: false, note: "creates the first admin at start; otherwise the web admin asks for setup"}
    - {name: SFTPGO_DEFAULT_ADMIN_PASSWORD, secret: true, buildTime: false, note: "first admin password"}
    - {name: SFTPGO_DATA_PROVIDER__DRIVER, secret: false, buildTime: false, note: "set to postgresql or mysql; the default sqlite file is lost with the task"}
    - {name: SFTPGO_DATA_PROVIDER__HOST, secret: false, buildTime: false, note: "database host"}
    - {name: SFTPGO_DATA_PROVIDER__PASSWORD, secret: true, buildTime: false, note: "database password"}
  optional: [SFTPGO_DATA_PROVIDER__NAME, SFTPGO_DATA_PROVIDER__PORT, SFTPGO_DATA_PROVIDER__USERNAME, SFTPGO_DATA_PROVIDER__SSLMODE, SFTPGO_HTTPD__BINDINGS__0__PORT, SFTPGO_SFTPD__BINDINGS__0__PORT, SFTPGO_LOG_FILE_PATH]
  buildTime: [COMMIT_SHA, FEATURES]
  evidence:
    - {path: internal/dataprovider/admin.go, line: 651, quote: "envUsername := strings.TrimSpace(os.Getenv(\"SFTPGO_DEFAULT_ADMIN_USERNAME\"))"}
    - {path: internal/dataprovider/admin.go, line: 652, quote: "envPassword := strings.TrimSpace(os.Getenv(\"SFTPGO_DEFAULT_ADMIN_PASSWORD\"))"}
    - {path: Dockerfile, line: 15, quote: "ARG COMMIT_SHA"}
blockers:
  expected:
    - "The main protocol is SFTP over SSH on port 2022, which an HTTPS-only ALB cannot carry; only the HTTP service on 8080 is reachable"
    - "Default storage is local disk (sqlite file and user directories); Fargate storage is ephemeral, so metadata needs PostgreSQL or MySQL and user files need an S3 backend"
  mustNot:
    - "Port 2022 must not be reported as the web port: the HTTP port is 8080"
    - "A database must not be reported as required: sqlite is the default; PostgreSQL or MySQL is an option"
    - "Redis must not be expected: SFTPGo has no Redis dependency"
    - "Dockerfile.distroless must not be assumed to support sqlite: it switches the default driver to bolt"
vendorQuestions:
  legitimate:
    - "Is a web-client-only (HTTP) deployment with PostgreSQL and S3 storage acceptable, without SFTP access?"
  unnecessary:
    - "Which port is the web UI on? (8080)"
    - "Which health path? (/healthz)"
    - "Which database engines are supported? (sqlite, postgresql, mysql, cockroachdb, bolt)"
traps:
  - "The Dockerfiles have no EXPOSE line and no HEALTHCHECK; ports come from sftpgo.json (Dockerfile:59 edits only users_base_dir and backups)"
  - "FTP and WebDAV bindings are port 0, which means disabled (sftpgo.json:122, :157)"
  - "Dockerfile.distroless builds without CGO, so it cannot use sqlite and edits the config to use bolt (Dockerfile.distroless:31)"
  - "Dockerfile.alpine and Dockerfile are the same build; the Debian image also copies optional sftpgo-plugin-* binaries (Dockerfile:53)"
openQuestions:
  - "Whether a user with an S3 backend plus the WebClient is enough product value for a customer; the outcome treats SFTP as the core function"
  - "Env names follow the SFTPGO_<SECTION>__<KEY> viper mapping; each name was not checked against docs"
crossReview:
  - {field: outcome.accept, change: "[NOT_DEPLOYABLE] -> [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]: the HTTP web client and WebDAV run with PostgreSQL and S3; SFTP is the part Deployz cannot route, and the default SQLite and local storage are CODE_CHANGE by policy (docs/ai-analysis.md fix classes; precedent new-131, new-139)", evidence: "packages/analysis/src/readiness-report.ts FIX_CLASSES"}
  - {field: all, change: verified, evidence: "26 citations checked against the pinned commit by script (path, line, quote)"}
