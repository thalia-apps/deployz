    - {path: Dockerfile, line: 26, quote: "-trimpath -ldflags"}
    - {path: Dockerfile, line: 67, quote: "CMD [\"sftpgo\", \"serve\"]"}
    - {path: Dockerfile.alpine, line: 1, quote: "FROM golang:1.27-alpine3.24 AS builder"}
    - {path: Dockerfile.distroless, line: 31, quote: "sed -i 's|\"sqlite\"|\"bolt\"|' sftpgo.json"}
runtime: {accept: [go]}
port:
