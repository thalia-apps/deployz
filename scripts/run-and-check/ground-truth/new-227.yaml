  deployzEngine: postgres
  selectBy: {SFTPGO_DATA_PROVIDER__DRIVER: "postgresql | mysql"}
  connectionVars: [SFTPGO_DATA_PROVIDER__DRIVER, SFTPGO_DATA_PROVIDER__NAME, SFTPGO_DATA_PROVIDER__HOST, SFTPGO_DATA_PROVIDER__PORT, SFTPGO_DATA_PROVIDER__USERNAME, SFTPGO_DATA_PROVIDER__PASSWORD, SFTPGO_DATA_PROVIDER__SSLMODE]
  # Any data_provider key can be set by an SFTPGO_DATA_PROVIDER__<KEY> variable (viper env prefix "sftpgo", "__" separator).
  evidence:
    - {path: sftpgo.json, line: 203, quote: "\"driver\": \"sqlite\","}
    - {path: internal/dataprovider/dataprovider.go, line: 82, quote: "PGSQLDataProviderName = \"postgresql\""}
    - {path: internal/dataprovider/dataprovider.go, line: 84, quote: "MySQLDataProviderName = \"mysql\""}
    - {path: internal/config/config.go, line: 488, quote: "viper.SetEnvPrefix(configEnvPrefix)"}
