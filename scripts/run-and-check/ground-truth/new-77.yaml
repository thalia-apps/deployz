blockers:
  expected:
    - "Durable index data lives only in LMDB files on local disk (/meili_data/data.ms); Fargate local disk is ephemeral, so data is lost on restart or redeploy and there is no EFS/volume support"
    - "No managed-store alternative: S3 snapshot upload is enterprise-edition only (not in the default build), needs static S3 keys or a web identity token file, and snapshots can only be restored from a local file"
  mustNot:
    - "A missing database must not be reported as a blocker: Meilisearch has its own embedded store and needs no PostgreSQL, MySQL or Redis"
    - "Rust build must not be reported as unsupported: the root Dockerfile builds the binary from source in one multi-stage image"
    - "The web UI/dashboard must not be reported as a separate frontend service: it is embedded in the same binary (development mode only)"
    - "meilitool in the image must not count as a second service: it is a CLI binary, not a process"
vendorQuestions:
  legitimate:
    - "Is losing all indexes on every restart acceptable, because the data can be fully re-indexed from another source of truth?"
  unnecessary:
    - "Which port? (7700 in Dockerfile)"
    - "Health path? (/health, unauthenticated)"
    - "Which database or Redis? (none; embedded LMDB)"
    - "Who runs migrations or workers? (none; the server upgrades its own database format at start)"
traps:
  - "Dockerfile sets no MEILI_ENV, so the image runs in development mode: no master key needed, open API and mini-dashboard on / -> set MEILI_ENV=production and MEILI_MASTER_KEY (option.rs:98, main.rs:117)"
  - "MEILI_S3_* options and scheduled snapshots look like an S3 storage option -> they only upload backups, need the enterprise feature, and are not the live index store (crates/meilisearch/src/option.rs:909, crates/index-scheduler/src/scheduler/mod.rs:7, community_edition.rs:67 returns RequiresEnterpriseEdition)"
  - "MEILI_IMPORT_SNAPSHOT / MEILI_IMPORT_DUMP look like a way to restore at boot -> they read a local file path only (lib.rs:361-365)"
  - "rust-toolchain.toml pins channel 1.98.1 while the Dockerfile uses rust:1.89 -> rustup inside the build fetches the pinned toolchain (needs network) (rust-toolchain.toml:2, Dockerfile:2)"
  - "build.rs downloads mini-dashboard assets from github.com at build time and a release build of the workspace is slow and memory heavy (crates/meilisearch/Cargo.toml:171, crates/meilisearch/build.rs get(url))"
  - "CMD is shell form behind ENTRYPOINT tini -> the effective command is /bin/meilisearch (Dockerfile:45-46)"
  - "MEILI_SERVER_PROVIDER=docker only labels analytics (Dockerfile:25)"
openQuestions:
  - "Whether a deployment whose index is rebuilt from an external source at each start is an accepted use; the repo cannot say"
