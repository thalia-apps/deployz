id: new-77
repository: meilisearch/meilisearch
commit: 9bbe2813f55fb856d1d710470a8020240c292e32
summary: >
  Meilisearch, a search engine written in Rust (actix-web HTTP API on 7700). It is the database itself: the index is
  stored in LMDB files under the working directory (/meili_data/data.ms in the root Dockerfile image). There is no
  external DB, Redis or worker. The only copy of the data is on local disk; scheduled snapshots and dumps also go to
  local directories. S3 snapshot upload exists only in the enterprise build feature, needs S3 access keys or a web
  identity token file, and restore needs a local tar.gz file.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    Single image that builds from the root Dockerfile and starts with a health endpoint, but the product is a
    persistent search database whose durable state is local LMDB files (default MEILI_DB_PATH ./data.ms in
    WORKDIR /meili_data). Fargate local disk is ephemeral, so every restart or task replacement loses all indexes,
    documents, API keys and tasks. No S3 or SQL store can hold the live index. The S3 snapshot upload is enterprise-only
    (not in the default build) and cannot be restored from S3 at boot (import needs a local file). It also needs
    static keys or a web identity token file, not the task role. Treat this as the unsupported
    "search engine needing a persistent volume" shape.
