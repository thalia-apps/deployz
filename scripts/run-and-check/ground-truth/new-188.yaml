id: new-188
repository: payloadcms/payload
commit: ae600cf5a6a8aa29a7f88ec6141cb755bf6c0bac
summary: >
  The Payload repository is the pnpm/turbo source monorepo of the Payload CMS framework (payload, db adapters, the
  Next.js admin integration, plugins, docs, examples, templates, and a large test suite). The root has no Dockerfile.
  The root `pnpm dev` runs test/dev.ts, a development harness that picks a test config and defaults to MongoDB. Each
  directory under templates/ (blank, website, ecommerce, with-postgres, ...) is a separate starter project with its own
  package.json (pinned npm versions), Dockerfile and docker-compose.yml. The template Dockerfiles are the Next.js
  standalone pattern (port 3000, node server.js) and ask the project to set output: 'standalone', which at least
  templates/with-postgres/next.config.ts does not. Most templates default to MongoDB.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    From the root, the repository is a framework monorepo (private workspace "payload-monorepo", no root Dockerfile,
    root dev script is a test harness), so NOT_DEPLOYABLE is the faithful answer. A template subfolder is not a fair
    DEPLOYABLE_WITH_CHANGES: templates/with-postgres has no lockfile, so its Dockerfile stops with "Lockfile not found."
    (Dockerfile:18), next.config.ts has no output: 'standalone', the Dockerfile path and context must point to the
    template directory, and uploads need object storage. These are several non-catalogue changes to a different
    project than the repository root.
dockerfile:
  accept: []
  reject:
    - {path: templates/with-postgres/Dockerfile, reason: "template starter, not the repository root; stops with 'Lockfile not found.' because the template has no lockfile, and needs output: 'standalone', which next.config.ts does not set"}
    - {path: templates/blank/Dockerfile, reason: "template starter with MongoDB default (docker-compose mongo service); not selected from the root"}
    - {path: templates/website/Dockerfile, reason: "website template, MongoDB default"}
    - {path: templates/with-vercel-mongodb/Dockerfile, reason: "Vercel + MongoDB template"}
    - {path: templates/with-vercel-postgres/Dockerfile, reason: "Vercel Postgres/Blob template; needs Vercel storage"}
    - {path: templates/blank-tanstack/Dockerfile, reason: "TanStack Start template"}
    - {path: templates/_template/Dockerfile, reason: "internal template source used to generate the other templates"}
    - {path: examples/localization/Dockerfile, reason: "example project, MongoDB default"}
    - {path: examples/astro/payload/Dockerfile, reason: "example project, MongoDB default"}
    - {path: examples/remix/payload/Dockerfile, reason: "example project, MongoDB default"}
    - {path: examples/remix/website/Dockerfile, reason: "example frontend project"}
  target: null
  context: .
  evidence:
    - {path: package.json, line: 2, quote: "\"name\": \"payload-monorepo\","}
    - {path: package.json, line: 4, quote: "\"private\": true,"}
    - {path: package.json, line: 76, quote: "\"dev\": \"cross-env NODE_OPTIONS=\\\"--no-deprecation --max-old-space-size=16384\\\" tsx ./test/dev.ts\","}
    - {path: templates/with-postgres/Dockerfile, line: 18, quote: "else echo \"Lockfile not found.\" && exit 1; \\"}
    - {path: templates/with-postgres/Dockerfile, line: 1, quote: "# To use this Dockerfile, you have to set `output: 'standalone'` in your next.config.mjs file."}
    - {path: templates/with-postgres/Dockerfile, line: 60, quote: "COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./"}
    - {path: templates/with-postgres/package.json, line: 22, quote: "\"@payloadcms/db-postgres\": \"3.82.1\","}
