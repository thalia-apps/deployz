blockers:
  expected:
    - "From the root there is no application: the repository is a framework monorepo with no root Dockerfile; only templates/* and examples/* subprojects have Dockerfiles"
    - "A template Dockerfile needs output: 'standalone' in next.config and a template directory as the build context; no template has a lockfile, so the Dockerfile fails as is"
  mustNot:
    - "MongoDB in templates/blank/docker-compose.yml must not be reported as required for every template: templates/with-postgres uses PostgreSQL"
    - "The root test/dev.ts dev server must not be treated as the production start command"
    - "Redis must not be reported: no template uses it"
vendorQuestions:
  legitimate:
    - "Which template or project directory in this repo should be deployed (for example templates/with-postgres)? The root is the framework source"
    - "Where should uploaded media be stored? Local disk is lost on restart; object storage needs a storage plugin"
  unnecessary:
    - "Which port? (3000)"
    - "Is Redis needed? (no)"
traps:
  - "templates/ and examples/ hold more than ten Dockerfiles; most pair with a MongoDB service in docker-compose.yml"
  - "template Dockerfiles say to set output: 'standalone' in next.config.mjs, but templates use next.config.ts (templates/with-postgres/Dockerfile:1)"
  - "Root `pnpm dev` runs test/dev.ts, a test harness that drops the test database (PAYLOAD_DROP_DATABASE default true, test/dev.ts:153)"
  - "templates/with-postgres/package.json pins payload 3.82.1 from npm, so a build context at the repo root would not use the workspace source"
  - "docker-compose.yml in templates runs `pnpm dev` with the source mounted, a dev setup"
openQuestions:
  - "Whether a vendor connecting this repo is expected to pick a template; the brief treats the root as the unit, so NOT_DEPLOYABLE is primary"
  - "The next.config.ts of templates/with-postgres was not read in full; the absence of a standalone setting comes from a repository-wide search"
crossReview:
  - {field: outcome.accept, change: "removed DEPLOYABLE_WITH_CHANGES; kept NOT_DEPLOYABLE only", evidence: "templates/with-postgres has no yarn.lock, package-lock.json or pnpm-lock.yaml (no template has one) and Dockerfile:18 exits when none exists; next.config.ts:9-29 has no output standalone, which Dockerfile:1 requires"}
  - {field: dockerfile.accept, change: "emptied (was templates/with-postgres/Dockerfile); context set to root; added Dockerfile:18 evidence", evidence: "no Dockerfile at the root; the template Dockerfile is not buildable without a lockfile"}
  - {field: "database, redis, port, start, migrations", change: "none: confirmed for templates/with-postgres", evidence: "payload.config.ts:27-29 postgresAdapter with DATABASE_URL; Dockerfile:65 EXPOSE 3000, :71 node server.js; package.json:9 payload migrate"}
  - {field: all, change: verified, evidence: "14 citations checked"}
