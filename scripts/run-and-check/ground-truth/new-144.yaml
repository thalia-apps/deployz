blockers:
  expected:
    - "SQLite is the only database and is not supported by Deployz; data lives in the local data directory (ephemeral on Fargate, no EFS)"
    - "No Dockerfile or web-server config in the repo: the PHP 8.5 image, nginx or Apache, and the data/config.php file would all need to be written by the vendor"
  mustNot:
    - "Missing PostgreSQL or Redis must not be reported as a separate blocker: the app needs neither"
    - "Missing health route must not be a blocker: /login answers without a session"
