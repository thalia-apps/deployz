id: new-144
repository: grocy/grocy
commit: 41206cb90154e0d17d3e108cc1f182b94fdb465d
summary: >
  Grocy is a PHP 8.5 (Slim 4) household ERP web app. It has no Dockerfile and no container start command in the
  repo (the official image is built elsewhere). It stores everything in a SQLite file under the data directory
  (GROCY_DATAPATH, default data/grocy.db) and has no other database driver. Config, view cache, backups and uploads
  also live in the data directory.
outcome:
  # The worst required item sets the outcome (docs/ai-analysis.md): the capability gap makes it NOT_DEPLOYABLE.
  accept: [NOT_DEPLOYABLE]
  reason: >
    The only database is SQLite on local disk. Deployz does not support SQLite and Fargate disk is ephemeral
    (no EFS), so all data is lost on restart. There is also no Dockerfile, and the repo needs a web server
    (nginx or Apache with PHP-FPM) configured by the vendor.
