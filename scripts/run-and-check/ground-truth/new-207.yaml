blockers:
  expected:
    - "All Jenkins state lives in JENKINS_HOME on local disk; Fargate task storage is ephemeral and no EFS is provided"
    - "The repository has no Dockerfile; the artefact is a Maven-built war run with java -jar"
    - "Inbound agents use a separate TCP agent port (TcpSlaveAgentListener), which is a second non-HTTP port"
  mustNot:
    - "A database or Redis must not be reported as required: Jenkins has neither"
    - "Port 8080 must not be treated as the problem: the durable home is the blocker"
vendorQuestions:
  legitimate:
    - "Can a Jenkins controller that loses all jobs, credentials and plugins on every restart be accepted? It needs a durable home directory"
  unnecessary:
    - "Which database engine? (none)"
    - "Which health path? (/health)"
traps:
  - "The repository has no Dockerfile; the official jenkins/jenkins image is built from a different repository"
  - "The Jenkinsfile in the root is the project's own CI pipeline, not a deployment file"
  - "The war packaging is run by Winstone; there is no application server to install (war/pom.xml:123)"
openQuestions:
  - "The default Winstone port 8080 and bind address come from the Winstone dependency, not from this repository source"
  - "WebSocket-only agents (no TCP agent port) were not traced"
crossReview:
  - {field: outcome.accept, change: "[NOT_DEPLOYABLE] -> [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]: no Dockerfile and durable JENKINS_HOME are CODE_CHANGE by policy (docs/ai-analysis.md fix classes; precedent new-131, new-139)", evidence: "packages/analysis/src/readiness-report.ts FIX_CLASSES"}
