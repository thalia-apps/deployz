id: new-207
repository: jenkinsci/jenkins
commit: 923d995f642086940c82e2fa56f4120f4305c313
summary: >
  Jenkins is a Java CI/CD automation server (Maven multi-module project; the war module builds jenkins.war, which embeds
  the Winstone servlet container). It has no relational database and no Redis: all state (jobs, configuration, credentials,
  secrets, installed plugins, build records, workspaces) is XML and files under JENKINS_HOME on local disk. The repository has
  no Dockerfile at all (the official image lives in a separate repository). Build agents may connect over a separate TCP
  inbound agent port or over WebSocket.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    Jenkins keeps its whole state in the JENKINS_HOME directory (default $user.home/.jenkins) and has no database option, so
    it needs a durable data directory that Fargate does not give. Without it every restart loses jobs, credentials and
    plugins. The repository also has no Dockerfile, and the artefact is a Maven-built war that needs a Java runtime image
    written from scratch. The JNLP agent port (TCP, set by slaveAgentPort) is a second, non-HTTP port; WebSocket agents can
    avoid it, but the durable home is the decisive blocker.
