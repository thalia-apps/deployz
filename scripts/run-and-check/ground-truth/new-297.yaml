id: new-297
repository: mail-in-a-box/mailinabox
commit: 8c032705ae78daa237cd77affcc5087ca68e3a15
summary: >
  Mail-in-a-Box is a set of shell scripts that turn a fresh Ubuntu 22.04 server into a complete mail server: Postfix
  (SMTP), Dovecot (IMAP), Nextcloud, z-push, nsd4 (DNS), OpenDKIM, ufw, fail2ban, duplicity backups and munin. A small
  Python Flask management daemon (management/daemon.py, port 10222 on localhost) provides the admin API and control
  panel. The installer is `sudo setup/start.sh` and it changes the operating system. The repository has no Dockerfile
  and no container build.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The project is a machine installer, not an application image. It installs and configures system services (SMTP, IMAP,
    DNS, firewall, backups) on a whole Ubuntu host and owns the mail, DNS and TLS ports. It has no Dockerfile, its core
    data (mailboxes, DNS zones, certificates) is on local disk, and the only HTTP part is the management daemon on
    localhost. Deployz runs one HTTP web process of one container image on Fargate; this repository is not an HTTP
    web app and cannot be reduced to one.
