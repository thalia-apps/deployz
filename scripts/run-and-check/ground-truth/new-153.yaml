blockers:
  expected:
    - "MongoDB is required (MONGODB_URI) and is not a Deployz-supported database (only RDS PostgreSQL and MySQL)"
    - "The image runs two long-running servers (front-end 3000 and back-end API 3100) under one supervisor; the browser needs both reachable"
  mustNot:
    - "Missing PostgreSQL must not be reported as the blocker; the blocker is that the app needs MongoDB"
    - "Redis must not be required: no Redis dependency exists in the open-source back-end"
    - "Python gbstats must not count as a separate worker: it is a subprocess of the back-end"
    - "The Dockerfile base on dhi.io must not be treated as a prebuilt-artefact problem: it builds the app from source"
