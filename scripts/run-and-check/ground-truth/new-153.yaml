id: new-153
repository: growthbook/growthbook
commit: a6748ca1d3eb0027532ff147b9f76c570ffb689a
summary: >
  GrowthBook open-source feature-flag and experimentation platform (TypeScript pnpm monorepo: Express back-end on 3100,
  Next.js front-end on 3000, Python gbstats). The root Dockerfile builds from source but runs two supervised Node
  processes (back-end and front-end, plus a Python stats subprocess) through scripts/run-apps.js. The data store is
  MongoDB only (MONGODB_URI). MongoDB is not supported by Deployz, so the app cannot run on a Deployz RDS stack.
outcome:
  # The worst required item sets the outcome (docs/ai-analysis.md): the capability gap makes it NOT_DEPLOYABLE.
  accept: [NOT_DEPLOYABLE]
  reason: >
    The required database is MongoDB (no SQL backend exists), which Deployz does not provide. The image also runs two
    long-running servers (front-end 3000 and back-end API 3100) under one supervisor, and the browser calls the API
    host directly, so one ALB port cannot serve it. Uploads default to local disk (ephemeral).
