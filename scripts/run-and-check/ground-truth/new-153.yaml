traps:
  - "Dockerfile builds from source and looks fully deployable, but its base images need `docker login dhi.io` (Dockerfile:16)"
  - "Two EXPOSE lines, 3000 and 3100, both required in production (Dockerfile:261-262)"
  - "MongoDB is hidden behind MONGODB_URI helper variables with a localhost fallback default (secrets.ts:105-127)"
  - "The image CMD is a custom Node supervisor replacing pm2-runtime, not a single server (Dockerfile:265, scripts/run-apps.js)"
  - "UPLOAD_METHOD defaults to local disk; S3 is optional and chosen by env (secrets.ts:85-91)"
  - "ENCRYPTION_KEY and JWT_SECRET default to dev and are fatal outside localhost (secrets.ts:177-200)"
openQuestions: []
