blockers:
  expected:
    - "All server data, including media, is only in an embedded RocksDB directory on local disk; there is no PostgreSQL, MySQL or S3 option"
  mustNot:
    - "The existence of Dockerfiles under docker/ must not make the case deployable: they are layers of a Bake graph"
    - "The published image jevolk/tuwunel is not application source in this repository and must not be used as the answer"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which database? (RocksDB only, local disk)"
traps:
  - "docker/Dockerfile.* are Docker Bake layers; none builds the application alone (docker/Dockerfile.install:13)"
  - "The server name is part of the data identity; a task replacement with an empty directory creates a new server with no history"
  - "Only the compose example sets the listen address to 0.0.0.0; the default is loopback"
openQuestions: []
