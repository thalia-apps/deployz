id: new-286
repository: matrix-construct/tuwunel
commit: 8ed90a27d6f49c93a9713a46e071fb03042fa308
summary: >
  Tuwunel is a Matrix homeserver written in Rust (a conduwuit fork). It serves the Matrix client and federation HTTP
  APIs and stores all its state, including media, in an embedded RocksDB database in one directory (database_path,
  default /var/lib/tuwunel). There is no PostgreSQL or MySQL backend, no S3 backend for the main data, and no Redis.
  The repository has no root Dockerfile; docker/ holds Docker Bake building blocks (Dockerfile.cargo, .install, .source
  and others) that are layers of one build graph, not one buildable file. The published image jevolk/tuwunel is built
  from them with docker/bake.sh.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The core data (accounts, rooms, events, keys, media) lives only in an embedded RocksDB directory on local disk.
    The config comment says that directory is the only place where the server saves data. There is no option to use
    PostgreSQL, MySQL or S3 for it. Fargate containers have no persistent volume in the Deployz model, so every task
    replacement would lose the server identity and all data. The Dockerfiles are Bake layers that need the bake files,
    not a single file that builds the app.
dockerfile:
  accept: []
  reject:
    - {path: docker/Dockerfile.install, reason: "one layer of the Bake graph; copies a binary built by an earlier target (COPY --from=bins)"}
    - {path: docker/Dockerfile.cargo, reason: "dependency build layer (cargo-chef); not a runnable image"}
    - {path: docker/Dockerfile.source, reason: "source layer of the Bake graph; adds the source to an input target"}
    - {path: docker/Dockerfile.rocksdb, reason: "builds the RocksDB library layer"}
  target: null
  context: .
  evidence:
    - {path: docker/Dockerfile.install, line: 3, quote: "FROM input AS install"}
    - {path: docker/Dockerfile.install, line: 13, quote: "COPY --from=bins $src_path $dst_path"}
    - {path: docker/Dockerfile.source, line: 3, quote: "FROM input AS source"}
    - {path: docker/README.md, line: 8, quote: "All Docker images for the project are built here. All images are"}
