id: new-34
repository: go-vikunja/vikunja
commit: b67a9728ef6e739a361ea1205f2c3249d2aad628
summary: >-
  Vikunja is a to-do / project management app. A Go API (echo) embeds a Vue frontend built in the
  same Dockerfile and serves both from one binary. Self-hosting is the single published image
  (Dockerfile, FROM scratch); all settings come from VIKUNJA_* env vars.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]   # DEPLOYABLE only if Deployz passes the RELEASE_VERSION build arg itself
  reason: >-
    Build from a source archive fails unless RELEASE_VERSION is passed (no default in the apibuilder stage;
    no .git for the git describe fallback). Single container with a Postgres or MySQL option. Set VIKUNJA_DATABASE_TYPE=postgres (default is sqlite),
    DB host/user/password/database, VIKUNJA_DATABASE_SSLMODE=require for RDS (default disable),
    VIKUNJA_SERVICE_PUBLICURL (boot fails without it), and VIKUNJA_SERVICE_SECRET (else random per start).
    Files: set VIKUNJA_FILES_TYPE=s3 for durable attachments.
dockerfile:
  accept: [Dockerfile]
  reject: []
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 40, quote: "FROM scratch"}
    - {path: Dockerfile, line: 50, quote: "ENTRYPOINT [ \"/app/vikunja/vikunja\" ]"}
    - {path: Dockerfile, line: 24, quote: "COPY --from=frontendbuilder /build/dist ./frontend/dist"}
    - {path: Dockerfile, line: 26, quote: "ARG TARGETOS TARGETARCH TARGETVARIANT RELEASE_VERSION"}
    - {path: build/magefile.go, line: 141, quote: "if v := os.Getenv(\"RELEASE_VERSION\"); v != \"\" {"}
    - {path: build/magefile.go, line: 145, quote: "out, err := exec.CommandContext(ctx, \"git\", \"describe\", \"--tags\", \"--always\", \"--abbrev=10\").Output()"}
    - {path: build/magefile.go, line: 213, quote: "version, err := releaseVersion(ctx)   (in Release.Xgo, run by Dockerfile:31)"}
runtime: {accept: [go]}
port:
  accept: [3456]
  evidence:
    - {path: Dockerfile, line: 51, quote: "EXPOSE 3456"}
    - {path: pkg/config/config.go, line: 381, quote: "ServiceInterface.setDefault(\":3456\")"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: pkg/config/config.go, line: 381, quote: "ServiceInterface.setDefault(\":3456\")  (no host = all interfaces)"}
startCommand: {source: image, accept: []}
healthPath:
