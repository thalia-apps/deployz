    - {path: pkg/cmd/web.go, line: 141, quote: "initialize.FullInit()"}
redis:
  status: optional
  selectBy: {VIKUNJA_REDIS_ENABLED: "true", VIKUNJA_REDIS_HOST: "host:6379", VIKUNJA_KEYVALUE_TYPE: redis, VIKUNJA_RATELIMIT_STORE: redis}
  evidence:
