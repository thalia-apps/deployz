  default: sqlite
  deployzEngine: postgres
  selectBy: {VIKUNJA_DATABASE_TYPE: postgres}
  connectionVars: [VIKUNJA_DATABASE_HOST, VIKUNJA_DATABASE_USER, VIKUNJA_DATABASE_PASSWORD, VIKUNJA_DATABASE_DATABASE, VIKUNJA_DATABASE_SSLMODE]
  evidence:
    - {path: pkg/config/config.go, line: 427, quote: "DatabaseType.setDefault(\"sqlite\")"}
    - {path: pkg/db/db.go, line: 99, quote: "case \"mysql\": engine, err = initMysqlEngine()"}
    - {path: pkg/db/db.go, line: 104, quote: "case \"postgres\":"}
    - {path: pkg/config/config.go, line: 436, quote: "DatabaseSslMode.setDefault(\"disable\")"}
    - {path: Dockerfile, line: 58, quote: "ENV VIKUNJA_DATABASE_PATH=/db/vikunja.db (sqlite path, a volume)"}
migrations:
