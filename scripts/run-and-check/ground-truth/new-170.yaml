id: new-170
repository: langfuse/langfuse
commit: b1067f3a8c7deb449893f7f84d2e2699a4405656
summary: >
  Langfuse is an LLM observability platform (Next.js web app plus a separate Node worker, TypeScript monorepo). It needs
  PostgreSQL (Prisma), ClickHouse (required: all traces, observations and scores), Redis (BullMQ queues), and S3-compatible
  blob storage (event uploads, required bucket). The web image (web/Dockerfile, port 3000) and the worker image
  (worker/Dockerfile, port 3030) are two separate Dockerfiles and two services. The official compose file runs
  langfuse-web, langfuse-worker, postgres, clickhouse, minio and redis.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    ClickHouse is a required analytics store (CLICKHOUSE_URL is mandatory in the env schema and the web entrypoint exits
    without it), and ClickHouse is outside the MVP. The product also needs a second image, the worker, to process the
    ingestion queue, so a one-image deploy would accept events and never write them.
dockerfile:
  accept: []
  reject:
    - {path: web/Dockerfile, reason: "builds the web app from source (turbo prune) and is the right web image, but the product also needs the separate worker image; listed as rejected only because no single Dockerfile covers the product"}
    - {path: worker/Dockerfile, reason: "worker image; the worker is a second required service"}
    - {path: ai-gateway/Dockerfile, reason: "separate AI gateway service"}
    - {path: .devcontainer/Dockerfile, reason: "development container"}
  target: null
  context: .
  evidence:
    - {path: web/Dockerfile, line: 151, quote: "RUN turbo prune web --docker"}
    - {path: web/Dockerfile, line: 252, quote: "RUN NODE_OPTIONS='--max-old-space-size-percentage=75' turbo run build --filter=web..."}
    - {path: worker/Dockerfile, line: 258, quote: "CMD [\"node\", \"worker/dist/index.js\"]"}
    - {path: docker-compose.yml, line: 118, quote: "image: docker.langfuse.com/langfuse/langfuse:4"}
runtime: {accept: [node]}
port:
  accept: [3000]
  evidence:
    - {path: web/Dockerfile, line: 311, quote: "ENV PORT 3000"}
    - {path: docker-compose.yml, line: 122, quote: "- 3000:3000"}
bindAllInterfaces:
