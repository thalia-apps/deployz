id: new-69
repository: immich-app/immich
commit: 4c33587fe88c52e50cb63dc8cea347fac6ef01ac
summary: >
  Immich self-hosted photo and video library (NestJS server in server/, SvelteKit web app served by the same
  server, pnpm monorepo). server/Dockerfile builds one image from the repo (server, web, cli and plugins) and runs
  the API and microservices workers in one process tree. It needs PostgreSQL with pgvector or VectorChord, Redis
  (BullMQ) and a /data media folder on local disk. There is no S3 or object storage driver in this commit. A second
  service, machine-learning (its own image and Dockerfile), is optional but is a separate application image.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    Every uploaded photo and video, thumbnail and encoded video is written to the local /data folder (UPLOAD_LOCATION
    volume). There is no S3 driver, so the durable library has no alternative to a persistent volume, which Deployz
    does not provide. On ephemeral Fargate disk the library is lost on each task restart, and the stored mount-check
    flags make the next start fail unless IMMICH_IGNORE_MOUNT_CHECK_ERRORS is set. The rest fits: Postgres works
    through pgvector (RDS), Redis is available, and the API and job workers run in one container.
