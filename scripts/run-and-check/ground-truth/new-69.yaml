blockers:
  expected:
    - "Media library (originals, thumbnails, encoded video, profile images, backups) is stored only on local disk under /data (UPLOAD_LOCATION). There is no S3 or object storage option in this commit, and Deployz provides no persistent volume or EFS, so the data is lost when the task restarts."
  mustNot:
    - "The Postgres vector extension must not block: pgvector is supported and RDS PostgreSQL provides it, so VectorChord is not required"
    - "Redis must not block: ElastiCache Redis (Valkey) is available, configured by REDIS_HOSTNAME"
    - "The microservices worker must not be reported as a separate service: it runs in the same process tree with the API"
    - "The machine-learning service must not be a core blocker: it is optional and can be turned off with IMMICH_MACHINE_LEARNING_ENABLED=false or in the admin settings; it is a feature gap (smart search, face recognition), not the reason for the verdict"
    - "The mise tool downloads in the Dockerfile must not be reported as a blocker by themselves: they are build-time downloads from public registries"
vendorQuestions:
  legitimate:
    - "Is losing the photo library acceptable? The media folder is local only; a persistent volume would be needed"
    - "Is smart search and face recognition needed? That needs the separate machine-learning image, which Deployz cannot run as a second service"
  unnecessary:
    - "Which port? (2283 in image and defaults)"
    - "Who runs migrations? (the server runs them at start under an advisory lock)"
    - "Is a separate worker process needed? (api and microservices run in one process tree)"
    - "Health path? (/api/server/ping)"
    - "Which vector extension? (auto-detected; pgvector works)"
traps:
  - "docker-compose.yml lists immich-machine-learning, redis (valkey) and a custom postgres image with VectorChord -> the compose database image is not required: the server also accepts pgvector (docker/docker-compose.yml:61, server/src/constants.ts:37)"
  - "docker-compose database image name mentions vectorchord and pgvectors -> a plain RDS PostgreSQL with pgvector passes the extension check (server/src/services/database.service.ts:82)"
  - "ENTRYPOINT is tini + bash -c with CMD start.sh -> the image already runs the app, no explicit command needed (server/Dockerfile:125)"
  - "Dockerfile has many stages (sdk, plugin-sdk, server, web, cli, plugins) -> the last stage is the app, no --target needed (server/Dockerfile:90)"
  - "/ is the web app and /health does not exist -> use /api/server/ping (server/src/app.common.ts:65)"
  - ".dockerignore lists **/Dockerfile and docs, e2e, machine-learning -> these only trim the build context; the build still works (.dockerignore:9)"
  - "Plugins stage runs mise install --locked, which downloads many tools (java, terragrunt, opentofu, ffmpeg) -> a heavy and slow build, with a COPY --from of the ghcr.io/jdx/mise image (server/Dockerfile:71)"
  - "Server home path is /data by default and compose mounts UPLOAD_LOCATION there -> this is the durable library, not a cache (docker/docker-compose.yml:21)"
openQuestions:
  - "Whether a verdict of DEPLOYABLE_WITH_CHANGES (ephemeral storage, with a data-loss warning) is also acceptable for a demo: the data would not survive a restart, so NOT_DEPLOYABLE is the accepted verdict here"
crossReview:
  - {field: migrations, change: "none: startup confirmed; the server runs runMigrations itself at boot (the package.json migrations:* scripts are only developer tools)", evidence: "server/src/services/database.service.ts:116-117; server/package.json:33"}
  - {field: healthPath, change: "none: /api/server/ping is public, under the api prefix, and not in excludePaths", evidence: "server/src/constants.ts:63; server/bin/immich-healthcheck:17"}
  - {field: storage.s3, change: "none: no S3 or AWS SDK in server/package.json or server/src; local /data is required and the mount check fails the start", evidence: "server/src/services/storage.service.ts:68-94"}
  - {field: dockerfile, change: "none: all COPY sources exist in git (mise.toml, mise.lock, .mise, packages/plugin-core/mise.toml, i18n, LICENSE); start.sh is server/bin/start.sh; the .dockerignore does not remove any build input", evidence: "server/Dockerfile:14-104; .dockerignore:1-39"}
  - {field: all, change: verified, evidence: "44 citations checked"}
