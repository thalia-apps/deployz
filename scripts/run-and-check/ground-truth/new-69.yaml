database:
  status: required
  engines: [postgres]
  default: postgres
  deployzEngine: postgres
  selectBy: {}
  connectionVars: [DB_URL, "DB_HOSTNAME/DB_PORT/DB_USERNAME/DB_PASSWORD/DB_DATABASE_NAME", DB_SSL_MODE]
  # Needs a vector extension: VectorChord (vchord) or pgvector (vector), auto-detected from pg_available_extensions
  # (VectorChord is preferred). RDS PostgreSQL has pgvector (accepted range >=0.5 <1) but not VectorChord, so
  # DB_VECTOR_EXTENSION=pgvector is optional but safe. Migrations also create uuid-ossp, unaccent, cube,
  # earthdistance and pg_trgm, which RDS supports. Postgres >=14.
  evidence:
    - {path: server/src/repositories/config.repository.ts, line: 233, quote: "host: dto.DB_HOSTNAME || 'database',"}
    - {path: server/src/repositories/config.repository.ts, line: 229, quote: "const databaseConnection: DatabaseConnectionParams = dto.DB_URL"}
    - {path: server/src/repositories/config.repository.ts, line: 238, quote: "ssl: dto.DB_SSL_MODE || undefined,"}
    - {path: server/src/constants.ts, line: 37, quote: "export const VECTOR_EXTENSIONS = [DatabaseExtension.VectorChord, DatabaseExtension.Vector] as const;"}
    - {path: server/src/constants.ts, line: 25, quote: "export const VECTOR_VERSION_RANGE = '>=0.5 <1';"}
    - {path: server/src/constants.ts, line: 23, quote: "export const POSTGRES_VERSION_RANGE = '>=14.0.0';"}
    - {path: server/src/repositories/database.repository.ts, line: 44, quote: "SELECT name FROM pg_available_extensions WHERE name IN"}
    - {path: server/src/services/database.service.ts, line: 87, quote: "await this.createExtension(extension);"}
    - {path: server/src/repositories/config.repository.ts, line: 242, quote: "if (dto.DB_VECTOR_EXTENSION) {"}
