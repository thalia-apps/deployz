id: new-78
repository: qdrant/qdrant
commit: 222b2e44ab1c3f17e8246396ead6558e45041df7
summary: >
  Qdrant vector database (Rust, actix-web REST on 6333 and tonic gRPC on 6334). The root Dockerfile builds the
  binary from source and runs it through entrypoint.sh. The database IS the app: all collections, vectors and
  indexes live on local disk (./storage). There is no S3 or SQL backend for this data. S3 is only an optional
  target for snapshot backups. On Fargate local disk is ephemeral, so the data would be lost on each restart.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The only durable store is the local storage_path (./storage). Deployz offers no persistent volume or EFS, and
    there is no S3, Postgres or Redis option for collections. S3 supports snapshots only (backups, not the live
    data). An ephemeral deploy would boot and answer health checks but lose all data on every task restart.
    Qdrant is also itself a vector DB, which is on the unsupported list as a separate service.
