    - {path: Dockerfile, line: 234, quote: "RUN_MODE=production"}
blockers:
  expected:
    - "Durable local disk is required: all collections, vectors and indexes are stored in ./storage (storage_path) and Deployz has no persistent volume or EFS; Fargate disk is ephemeral so data is lost on every restart"
    - "Qdrant is a vector database; Deployz does not offer vector DBs as a managed or separate service"
  mustNot:
    - "S3 snapshot storage must not be read as S3 data storage: snapshots are backups only, the live data stays on local disk"
    - "The gRPC port 6334 must not block: the REST port 6333 serves everything and the ALB uses one HTTP port; gRPC is optional"
    - "A missing database, Redis or migration step must not be reported as a gap: Qdrant needs none of them"
    - "Cluster mode and consensus (cluster.enabled: false by default) must not be raised as a requirement"
    - "GPU build args and the cargo-chef, mold and xx build stages must not block: GPU is off by default"
vendorQuestions:
  legitimate:
    - "Is losing all vectors on each task restart acceptable (for example a cache or demo index that is rebuilt from another source)?"
    - "Should snapshots go to S3 for backup and manual restore, accepting that restore is a manual step?"
  unnecessary:
    - "Which port? (6333 REST, 6334 gRPC; both in the image and config)"
    - "Who runs migrations? (none)"
    - "Health path? (/healthz, /livez, /readyz)"
    - "Is Redis or a database needed? (no)"
traps:
  - "snapshots_storage supports s3, gcs and azure -> backups only, the live collections stay on local ./storage (config/config.yaml:27-31)"
  - "Two ports 6333 and 6334 -> REST on 6333 is enough for the ALB; gRPC 6334 is optional (Dockerfile:236-237)"
  - "Dockerfile has GPU, cargo-chef and many ARGs -> the default CPU path builds the qdrant stage (Dockerfile:166)"
  - "The web UI is downloaded from GitHub during the build -> network needed at build time, not a repo-local source (Dockerfile:133, tools/sync-web-ui.sh)"
  - "Rust release build with cargo install and a full workspace compile -> long build and high memory (Dockerfile:111-130)"
  - "api_key is commented out in the default config -> without it the endpoint is open (config/config.yaml:435)"
  - "entrypoint.sh recovery mode on exit code 137 -> OOM handling inside one container, not a second process (tools/entrypoint.sh:36)"
openQuestions:
  - "Whether a rebuildable, ephemeral index is acceptable to the vendor (then DEPLOYABLE_WITH_CHANGES could be argued, but Deployz data-loss rules make NOT_DEPLOYABLE the safe verdict)"
