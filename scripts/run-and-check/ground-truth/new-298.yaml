id: new-298
repository: conversejs/converse.js
commit: b418951bae232aba7d35de3265c667349bfcf81c
summary: >
  Converse.js is a client-side XMPP chat application written in JavaScript. `npm run build` bundles it with rspack into
  dist/ (which is git-ignored), and static pages (fullscreen.html, dev.html, index.html) load dist/converse.min.js and
  call converse.initialize with a JSON block in the page. The browser connects straight to an XMPP server through a BOSH
  or WebSocket URL set in that block (the shipped value is the public test server of the project). The repository has no
  Dockerfile, no server code, no database, no worker. `npm run serve` starts the dev dependency http-server.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    There is no Dockerfile and no server: the deliverable is a static bundle that needs `npm install` and `npm run build`
    and a static file server. A contained repository change adds a Dockerfile (node build stage, then a static server such
    as nginx serving dist and the page) and sets bosh_service_url or websocket_url in the page to the customer's XMPP
    server. That makes it DEPLOYABLE_WITH_CHANGES. NOT_DEPLOYABLE is also accepted because the client does nothing without
    an XMPP server (ejabberd, Prosody) that Deployz does not provide; it is truly ambiguous because the customer may
    already run that server elsewhere and the client needs only its URL.
