id: new-302
repository: safebucket/safebucket
commit: ecb121302ba055b7b57c563af0586c414d0ce343
summary: >
  SafeBucket is a file-sharing application written in Go with a React frontend that the binary serves (static files are
  enabled by default). The root Dockerfile builds the web UI with node, builds the Go binary (CGO on) and runs it as
  `./safebucket` in a distroless image on port 8080. Everything is configured by YAML or by environment variables with a
  double underscore for nesting (APP__PORT, DATABASE__TYPE, STORAGE__TYPE, ...). Pluggable parts: database postgres
  (default) or sqlite; storage minio, rustfs, s3, aws, gcp or azure; events jetstream, aws, gcp, azure or memory; cache
  redis, valkey or memory; notifier smtp or filesystem; activity loki or filesystem. The profile (APP__PROFILE) is
  default (HTTP server and workers in one process), api or worker. Migrations run when the database connection opens. The
  project's own AWS example (deployments/aws) uses ECS, RDS, ElastiCache, S3, SQS and Loki, but the lite local example uses
  SQLite, memory cache, memory events, filesystem notifier and activity, and one S3-compatible store.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    One Go web process built from the root Dockerfile. Settings alone choose the Deployz-supported parts:
    DATABASE__TYPE=postgres (the default), STORAGE__TYPE=aws with a bucket, CACHE__TYPE=memory, EVENTS__TYPE=memory,
    NOTIFIER__TYPE=smtp (or filesystem) and ACTIVITY__TYPE=filesystem. No Redis, SQS or Loki is needed, because memory
    cache and memory events are valid for one task and the lite example runs this way. Files live in S3 and metadata in
    PostgreSQL. The case is not fully clear: browsers upload to presigned S3 URLs, so the bucket needs a CORS rule for the
    app origin, and bucket upload events normally reach the app through SQS (the file version is also confirmed by an API
    route); an analysis that asks for these as repository changes is accepted too, but neither needs a code change.
