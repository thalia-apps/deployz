  default: postgres
  deployzEngine: postgres
  selectBy: {DATABASE__TYPE: postgres, DATABASE__POSTGRES__HOST: "<host>", DATABASE__POSTGRES__PORT: "5432", DATABASE__POSTGRES__USER: "<user>", DATABASE__POSTGRES__PASSWORD: "<password>", DATABASE__POSTGRES__NAME: "<db>", DATABASE__POSTGRES__SSLMODE: require}
  connectionVars: [DATABASE__TYPE, DATABASE__POSTGRES__HOST, DATABASE__POSTGRES__PORT, DATABASE__POSTGRES__USER, DATABASE__POSTGRES__PASSWORD, DATABASE__POSTGRES__NAME, DATABASE__POSTGRES__SSLMODE]
  # The default type is postgres; the lite example selects sqlite with DATABASE__SQLITE__PATH.
  evidence:
    - {path: internal/configuration/config.go, line: 136, quote: "\"database.type\":                           ProviderPostgres,"}
    - {path: internal/models/configuration.go, line: 84, quote: "Type     string                  `mapstructure:\"type\"     validate:\"required,oneof=postgres sqlite\"`"}
    - {path: internal/database/postgres.go, line: 16, quote: "dsn := fmt.Sprintf(\"host=%s user=%s password=%s dbname=%s port=%d sslmode=%s\","}
    - {path: deployments/local/lite/.env, line: 28, quote: "DATABASE__TYPE=sqlite"}
