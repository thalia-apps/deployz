blockers:
  expected: []
  mustNot:
    - "SQS, ElastiCache and Loki in deployments/aws must not be reported as required: they are options, and memory events and cache plus filesystem activity are valid settings"
    - "The SQLite default of the lite example and its /app/data volume must not block: DATABASE__TYPE defaults to postgres"
    - "The rustfs bucket and the bucket-init service in the lite compose files must not be read as extra application services"
    - "The api and worker profiles must not force a separate worker: the default profile runs everything in one process"
    - "The jetstream (NATS) option must not be reported as a required broker"
vendorQuestions:
  legitimate:
    - "What are the first administrator email and password? (APP__ADMIN_EMAIL, APP__ADMIN_PASSWORD)"
    - "What is the public URL? (APP__API_URL, APP__WEB_URL, APP__ALLOWED_ORIGINS)"
    - "Which SMTP server sends the invitation emails? (NOTIFIER__SMTP__*)"
  unnecessary:
    - "Which database? (the default is PostgreSQL)"
    - "Is Redis, SQS or a worker needed? (no)"
    - "Which port? (8080)"
traps:
  - "The project's own AWS example needs SQS, ElastiCache, Loki and Mailpit; that is the full-featured topology and not the minimum. The memory options and filesystem activity run the same binary with no extra service (deployments/aws/terraform/ecs_task_safebucket.tf:88-117; deployments/local/lite/.env:32-46)"
  - "Environment variables use a double underscore for nesting and the queue names under EVENTS__QUEUES are required even for the memory type (internal/configuration/config.go:76-81; deployments/local/lite/.env:36-38)"
  - "APP__MFA_ENCRYPTION_KEY must be exactly 32 characters (internal/models/configuration.go:34)"
  - "Browsers upload and download through presigned S3 URLs, so the bucket needs a CORS rule for the app origin; the AWS example sets it in Terraform and the application does not (deployments/aws/terraform/s3.tf:34-40)"
  - "With STORAGE__TYPE=aws the S3 upload events arrive through SQS in the AWS example; with memory events the confirm route /versions/{id}/confirm can complete a version (internal/services/bucket_file_version.go:37)"
  - "The local profile name default runs the HTTP server and workers together; api and worker are split profiles (internal/core/app.go:58-71)"
  - "The Dockerfile uses CGO and a distroless cc base image (Dockerfile:30,35)"
openQuestions:
  - "Whether the first upload of a new file completes without S3 bucket events when EVENTS__TYPE=memory is not proved by a client call in the web source; the lite example with RustFS and memory events shows it works in that setup."
crossReview:
  - {field: dockerfile, change: 'none: the root Dockerfile builds web and Go binary and runs ./safebucket', evidence: 'Dockerfile:9,30,35,44'}
  - {field: database, change: 'none: postgres is the default type and the Postgres connection uses separate parts', evidence: 'internal/configuration/config.go:136; internal/database/postgres.go:16,33'}
  - {field: redis / events, change: 'none: memory is a valid cache and events type; the AWS example uses Redis and SQS as options', evidence: 'internal/models/configuration.go:144,292; deployments/local/lite/.env:32,35'}
  - {field: outcome, change: 'none: settings only; CORS on the bucket and the upload event path are open points, not code changes', evidence: 'deployments/aws/terraform/s3.tf:34-40; internal/services/bucket_file_version.go:37'}
  - {field: all, change: verified, evidence: 30 citations checked}
