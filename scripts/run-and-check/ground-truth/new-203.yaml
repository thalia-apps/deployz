    - {path: make/photon/prepare/templates/registry/config.yml.jinja, line: 30, quote: "redis:"}
    - {path: make/harbor.yml.tmpl, line: 210, quote: "# external_redis:"}
workers:
  status: independent
  commands: ["/harbor/harbor_jobservice"]
  evidence:
    - {path: make/photon/jobservice/Dockerfile, line: 24, quote: "ENTRYPOINT [\"/harbor/entrypoint.sh\"]"}
    - {path: make/photon/prepare/templates/core/env.jinja, line: 32, quote: "JOBSERVICE_URL={{jobservice_url}}"}
scheduledJobs:
  status: none
  items: []
  evidence: []
storage:
  local: required
  paths: [/data]
  s3: native
  s3SelectBy: {storage_service: s3}
  # Image blobs go to /data/registry by default; storage_service can select s3, gcs, azure, swift or oss. Job logs and secrets also use /data.
  evidence:
    - {path: make/harbor.yml.tmpl, line: 66, quote: "data_volume: /data"}
    - {path: make/harbor.yml.tmpl, line: 68, quote: "Harbor Storage settings by default is using /data dir on local filesystem"}
    - {path: make/photon/prepare/templates/docker_compose/docker-compose.yml.jinja, line: 154, quote: "- {{data_volume}}/:/data/:z"}
env:
  required:
    - {name: POSTGRESQL_HOST, secret: false, buildTime: false, note: "core database host; generated by the prepare tool"}
    - {name: POSTGRESQL_PASSWORD, secret: true, buildTime: false, note: "database password"}
    - {name: _REDIS_URL_CORE, secret: false, buildTime: false, note: "Redis URL for core"}
    - {name: HARBOR_ADMIN_PASSWORD, secret: true, buildTime: false, note: "first admin password"}
    - {name: CORE_SECRET, secret: true, buildTime: false, note: "shared secret between core and jobservice"}
    - {name: JOBSERVICE_SECRET, secret: true, buildTime: false, note: "jobservice secret"}
    - {name: EXT_ENDPOINT, secret: false, buildTime: false, note: "public URL of the registry"}
  optional: [LOG_LEVEL, WITH_TRIVY, READ_ONLY, HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
  buildTime: []
  evidence:
    - {path: make/photon/prepare/templates/core/env.jinja, line: 25, quote: "HARBOR_ADMIN_PASSWORD={{harbor_admin_password}}"}
    - {path: make/photon/prepare/templates/core/env.jinja, line: 27, quote: "CORE_SECRET={{core_secret}}"}
    - {path: make/photon/prepare/templates/core/env.jinja, line: 10, quote: "EXT_ENDPOINT={{public_url}}"}
blockers:
  expected:
    - "Harbor is a stack of separate images (core, portal, nginx, registry, registryctl, jobservice, exporter, log, db, redis); Deployz deploys one web image plus optional workers of the same image"
    - "No Dockerfile builds the product from source: core, jobservice and registry Dockerfiles copy pre-built binaries and rely on Photon base images built earlier"
    - "The services find each other by name and are wired by configuration files rendered by make/prepare from harbor.yml"
    - "Default image storage is the local /data directory (S3 is optional)"
  mustNot:
    - "The core Dockerfile must not be treated as the whole application: the UI, the registry and the proxy are other images"
    - "Redis and PostgreSQL must not be missed: both are required, Deployz can supply them"
    - "make/photon/db/Dockerfile and valkey/Dockerfile must not be treated as the app image"
vendorQuestions:
  legitimate:
    - "Is a managed container registry (ECR) acceptable instead of Harbor on Fargate?"
  unnecessary:
    - "Which database engine? (PostgreSQL only)"
    - "Which port? (8080)"
    - "Which health path? (/api/v2.0/ping)"
traps:
  - "make/photon/*/Dockerfile cannot be built with a plain docker build: they need harbor_base_namespace and harbor_base_image_version build arguments and binaries that make compiled before"
  - "The .base files are separate base images that must exist before the component images (make/photon/core/Dockerfile:3)"
  - "make/harbor.yml.tmpl hostname must not be localhost, and the compose file maps ports through the prepare tool"
  - "The nginx proxy listens on 8080 and 8443 inside the container, but the host ports 80 and 443 come from harbor.yml (docker-compose.yml.jinja:320)"
  - "The Valkey image is named redis in compose and uses the redis.conf path"
openQuestions:
  - "Whether a single-image mode of Harbor core with an external registry and portal exists; none was found in the sources"
  - "The Makefile build of each binary (compile_core, compile_jobservice) was not read in detail"
crossReview:
  - {field: outcome.accept, change: "[NOT_DEPLOYABLE] -> [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]: the multi-image stack and prebuilt-binary Dockerfiles are CODE_CHANGE by policy (docs/ai-analysis.md fix classes; precedent new-131, new-139)", evidence: "packages/analysis/src/readiness-report.ts FIX_CLASSES"}
