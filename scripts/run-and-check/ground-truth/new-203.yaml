    - {path: make/photon/jobservice/Dockerfile, line: 7, quote: "COPY ./make/photon/jobservice/harbor_jobservice /harbor/"}
    - {path: make/photon/registry/Dockerfile, line: 7, quote: "COPY ./make/photon/registry/binary/registry /usr/bin/registry_DO_NOT_USE_GC"}
