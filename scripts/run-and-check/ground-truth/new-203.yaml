runtime: {accept: [go]}
port:
  # The public entry is the nginx proxy on 8080 (HTTP) and 8443 (HTTPS); core and jobservice listen on 8080 inside the stack; registry on 5000.
  accept: [8080]
  evidence:
    - {path: make/photon/nginx/Dockerfile, line: 9, quote: "HEALTHCHECK CMD curl --fail -s http://localhost:8080 || exit 1"}
    - {path: make/photon/prepare/templates/docker_compose/docker-compose.yml.jinja, line: 320, quote: "- {{http_port}}:8080"}
    - {path: make/photon/registry/Dockerfile, line: 14, quote: "HEALTHCHECK CMD curl --fail -s http://localhost:5000"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: make/photon/nginx/Dockerfile, line: 9, quote: "HEALTHCHECK CMD curl --fail -s http://localhost:8080 || exit 1"}
