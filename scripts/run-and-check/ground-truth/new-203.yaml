id: new-203
repository: goharbor/harbor
commit: 58d7d2f95d9e61381d75bb524e9da07e2d5a0aa7
summary: >
  Harbor is a container registry platform made of many cooperating services, each with its own image: core (Go API and
  token service, 8080), portal (Angular UI behind nginx), nginx proxy (public 8080/8443), registry (distribution, 5000),
  registryctl, jobservice (8080), a PostgreSQL database image, a Valkey (Redis) image, log (rsyslog), exporter and an
  optional Trivy adapter. There is no root Dockerfile. The images are built by make with Dockerfiles in make/photon/*
  on Photon base images, and most of them copy binaries that make compiled earlier (harbor_core, harbor_jobservice,
  registry). The deployment is generated by an installer: make/prepare renders configuration files and a docker-compose
  file from make/harbor.yml. Image data is kept under /data (filesystem) or in S3 and other cloud storage.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    Harbor is a multi-image microservice stack. A working registry needs at least core, portal, nginx, registry,
    registryctl and jobservice as separate images and processes that call each other by service name, plus PostgreSQL and
    Redis. Deployz builds one image from one repository Dockerfile; no single Dockerfile produces the application, and
    the images are not built from source in one step (core, jobservice and registry Dockerfiles copy pre-built
    binaries). The docker client protocol (/v2/ registry API) is HTTP, but the stack is rendered by an installer
    (make/prepare) that writes configuration for the services, so it is outside the one-image web service model. Local
    /data is the default image store; S3 is possible.
