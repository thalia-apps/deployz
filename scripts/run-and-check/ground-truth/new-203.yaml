    - {path: make/photon/prepare/templates/core/env.jinja, line: 12, quote: "POSTGRESQL_HOST={{harbor_db_host}}"}
    - {path: make/harbor.yml.tmpl, line: 187, quote: "# external_database:"}
migrations:
