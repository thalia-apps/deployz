blockers:
  expected:
    - "EMQX is an MQTT broker: clients use MQTT over TCP (1883, 8883), which an HTTPS-only ALB cannot serve"
    - "The image exposes seven ports; Deployz allows one public HTTP port"
    - "The broker needs a durable data directory (/opt/emqx/data); Fargate task storage is ephemeral"
  mustNot:
    - "The dashboard port 18083 must not be treated as the product web port: it is an admin UI, the product is MQTT"
    - "A database or Redis must not be reported as required: EMQX embeds its storage"
    - "CI fixture Dockerfiles under .ci/ must not be treated as application images"
vendorQuestions:
  legitimate:
    - "Is EMQX the MQTT broker for another application? It is better run as a managed MQTT service (AWS IoT Core or EMQX Cloud), outside this deployment"
  unnecessary:
    - "Which port? (1883 for MQTT, 18083 for the dashboard)"
    - "Which Dockerfile? (deploy/docker/Dockerfile)"
    - "Is a database needed? (no, embedded)"
traps:
  - "deploy/docker/Dockerfile builds from source but its default base images come from ghcr.io and dhi.io, and the build needs the full Erlang toolchain (deploy/docker/Dockerfile:1-3)"
  - "SOURCE_TYPE=tgz switches the build to a pre-built tarball; the default is src (deploy/docker/Dockerfile:4)"
  - "Port 4370 (Erlang distribution) and 5369 (gen_rpc) are cluster ports, not client ports (deploy/docker/Dockerfile:124)"
  - "The CI Dockerfiles under .ci/docker-compose-file are databases and mocks for tests"
openQuestions:
  - "The EMQX_* environment variable names follow the documented EMQX convention and were not read in the source"
crossReview:
  - {field: outcome.accept, change: "none: [NOT_DEPLOYABLE] confirmed against docs/product/mvp-scope.md and the fix-class policy", evidence: "summary and blockers.expected of this file"}
  - {field: all, change: verified, evidence: "14 citations checked against the pinned commit by script (path, line, quote)"}
