id: new-199
repository: emqx/emqx
commit: d12fb1d61eaced6463bb129b93b09fd202507a9b
summary: >
  EMQX is an Erlang/OTP MQTT broker for IoT. Devices connect with MQTT (1883, 8883), MQTT over WebSocket (8083, 8084)
  and other non-HTTP protocols; an HTTP dashboard and REST API run on 18083. The broker keeps its data and logs in
  /opt/emqx/data and /opt/emqx/log (declared as volumes). deploy/docker/Dockerfile does build the broker from the
  repository source (make emqx-enterprise-tgz in an emqx-builder image) into one image, but the product is a message
  broker, not a web application.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    EMQX is an MQTT broker server. Its main job is MQTT over raw TCP on 1883 (and TLS on 8883), which the ALB cannot
    serve; it also exposes several ports (1883, 8083, 8084, 8883, 18083, 4370, 5369) where Deployz allows one public HTTP
    port. The broker keeps durable state in /opt/emqx/data, which Fargate does not give a task. The dashboard on 18083 is
    only an admin UI, not the product.
dockerfile:
  accept: [deploy/docker/Dockerfile]
  reject:
    - {path: deploy/docker/Dockerfile.msodbc, reason: "optional extension of a published emqx-enterprise image with the MS SQL ODBC driver; the file says it is run manually"}
    - {path: .ci/docker-compose-file/databricks/Dockerfile, reason: "CI test fixture (flask mock of Databricks)"}
    - {path: .ci/docker-compose-file/influxdb/v3.Dockerfile, reason: "CI test fixture (InfluxDB image)"}
    - {path: .ci/docker-compose-file/openldap/Dockerfile, reason: "CI test fixture (OpenLDAP image)"}
    - {path: .ci/docker-compose-file/pgsql/Dockerfile, reason: "CI test fixture (PostgreSQL image with TLS config)"}
    - {path: plugins/emqx_bridge_mqtt_dq/Dockerfile, reason: "plugin packaging on top of the published emqx/emqx image"}
  target: null
  context: .
  evidence:
    - {path: deploy/docker/Dockerfile, line: 1, quote: "ARG BUILD_FROM=ghcr.io/emqx/emqx-builder/6.2-3:1.19.1-28.5.0.7-3-debian13"}
    - {path: deploy/docker/Dockerfile, line: 63, quote: "make ${PROFILE}-tgz && \\"}
    - {path: deploy/docker/Dockerfile, line: 126, quote: "EXPOSE 1883 8083 8084 8883 18083 4370 5369"}
runtime: {accept: [erlang]}
port:
  # 1883 is the MQTT client port; 18083 is the HTTP dashboard and API.
  accept: [1883, 18083]
  evidence:
    - {path: deploy/docker/Dockerfile, line: 126, quote: "EXPOSE 1883 8083 8084 8883 18083 4370 5369"}
    - {path: apps/emqx_dashboard/src/emqx_dashboard_schema.erl, line: 147, quote: "bind(18083)"}
    - {path: apps/emqx/src/emqx_schema.erl, line: 704, quote: "mqtt_listener(1883) ++"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: apps/emqx/src/emqx_schema.erl, line: 704, quote: "mqtt_listener(1883) ++"}
startCommand:
  source: image
  accept: ["/opt/emqx/bin/emqx foreground"]
  evidence:
    - {path: deploy/docker/Dockerfile, line: 128, quote: "ENTRYPOINT [\"/usr/bin/docker-entrypoint.sh\"]"}
    - {path: deploy/docker/Dockerfile, line: 130, quote: "CMD [\"/opt/emqx/bin/emqx\", \"foreground\"]"}
healthPath:
  # /status is on the dashboard HTTP listener (18083), not on the MQTT port.
  accept: ["/status"]
  evidence:
    - {path: apps/emqx_management/src/emqx_mgmt_api_status.erl, line: 73, quote: "\"/status\"."}
database:
