  paths: [/app/data/storage]
  s3: native
  s3SelectBy: {STORAGE_DRIVER: s3, AWS_S3_BUCKET: "<bucket>", AWS_S3_REGION: "<region>"}   # no static keys: leave AWS_S3_ACCESS_KEY_ID/SECRET unset, the SDK uses the task role
  evidence:
    - {path: Dockerfile, line: 60, quote: "VOLUME [\"/app/data/storage\"]"}
    - {path: .env.example, line: 13, quote: "# options: local | s3 | azure"}
