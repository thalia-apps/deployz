    - {path: apps/server/src/integrations/environment/environment.validation.ts, line: 39, quote: "@IsOptional() (before APP_URL)"}
    - {path: .env.example, line: 17, quote: "AWS_S3_ACCESS_KEY_ID="}
blockers:
  expected: []
  mustNot:
    - "Redis: supported by Deployz (ElastiCache); not a blocker."
    - "Local storage VOLUME /app/data/storage: attachments can use STORAGE_DRIVER=s3; not a blocker."
    - "Workers/queues: BullMQ processors run in the web process; no separate worker needed."
    - "docker-compose.yml: only app + db + redis; Postgres and Redis are Deployz-managed addons."
    - "Azure storage driver: ignore; S3 is available."
vendorQuestions:
  legitimate:
    - "Public APP_URL / domain: depends on the customer's chosen host name."
    - "SMTP/Postmark settings: depend on the customer's mail provider (needed for invites and password reset)."
  unnecessary:
    - "Which database engine (only Postgres is supported by the app)."
    - "Which port or bind address (3000, 0.0.0.0)."
    - "How migrations run (automatic at boot in production)."
    - "Whether a separate worker or cron is needed (all in-process)."
    - "Which Dockerfile (only one)."
traps:
  - "apps/server 'start' script is nest start with NODE_ENV=development; root 'pnpm start' uses start:prod; image CMD is correct -> keep image CMD (package.json:8, apps/server/package.json:11)"
  - "Migrations run only when NODE_ENV=production; start:prod sets it -> no separate migration command (database.module.ts:137)"
  - "Dev migration scripts (migration:up via tsx) are not needed -> startup migration is enough (apps/server/package.json:19)"
  - "docker-compose volume at /app/data/storage is the local-disk default -> S3 is the cloud answer (docker-compose.yml:16)"
  - "/api/health needs Postgres and Redis up (503 otherwise); /api/health/live is the light probe; both under the api prefix (health.controller.ts:7, main.ts:52)"
  - "Collab websocket (/collab) is on the same port by default; COLLAB_URL is optional, only for a separate collab server (environment.service.ts:233)"
  - "Dockerfile uses node:26-slim and pnpm@11.28.2; large monorepo build; no build-time env vars (Dockerfile:1,4)"
  - "Server rewrites client/dist/index.html at boot; /app is chowned to node so this works (static.module.ts, Dockerfile:51)"
  - "ee/ code is optional and loaded conditionally -> not required (app.module.ts:38)"
openQuestions:
  - "Whether node:26-slim and pnpm 11.28.2 resolve at build time: not checked (registry availability)."
  - "S3 with ECS task-role credentials: credentials stay undefined when both AWS_S3_ACCESS_KEY_ID and AWS_S3_SECRET_ACCESS_KEY are empty, so the AWS SDK default chain (task role) applies (storage.provider.ts:55,64-72). Required: STORAGE_DRIVER=s3, AWS_S3_BUCKET, AWS_S3_REGION; AWS_S3_ENDPOINT and AWS_S3_URL optional. Not run."
  - "Whether GET / returns 2xx in the container: static handler registered only if client/dist/index.html exists; not run."
