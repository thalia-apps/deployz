id: new-36
repository: docmost/docmost
commit: 6d117f8c52e54e810d5931f153eb2d31c904efb3
summary: >-
  Docmost is a collaborative wiki/docs app (NestJS + Fastify server, React/Vite client, TypeScript, pnpm/nx monorepo).
  Self-hosted via the root Dockerfile (one image serves API, websockets and the built client) with PostgreSQL and Redis,
  as in the repo docker-compose.yml. Collaboration (hocuspocus), queues (BullMQ) and interval tasks run inside the web process.
outcome:
  accept: [DEPLOYABLE]
  reason: >-
    Postgres (RDS) and Redis (ElastiCache) are both required and both supported by Deployz. Migrations run at boot, workers
    are in-process, uploads can go to S3 with STORAGE_DRIVER=s3. Needs APP_URL, APP_SECRET (32+ chars), DATABASE_URL, REDIS_URL,
    and STORAGE_DRIVER=s3 so attachments are durable. Without S3 the attachments are lost on task replacement.
