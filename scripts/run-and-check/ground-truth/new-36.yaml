    - {path: apps/server/src/integrations/storage/providers/storage.provider.ts, line: 64, quote: "if (environmentService.getAwsS3AccessKeyId() ||"}
env:
  required:
    - {name: APP_SECRET, secret: true, buildTime: false, note: "min 32 chars; the placeholder REPLACE_WITH_LONG_SECRET is rejected"}
    - {name: DATABASE_URL, secret: true, buildTime: false, note: "postgres:// or postgresql:// URL (contains password)"}
    - {name: REDIS_URL, secret: false, buildTime: false, note: "redis:// or rediss:// URL"}
    - {name: APP_URL, secret: false, buildTime: false, note: "validation marks it optional, but without it links use http://localhost:3000 and isHttps() is false (cookies not secure); set the public https URL"}
  optional: [STORAGE_DRIVER, AWS_S3_BUCKET, AWS_S3_REGION, AWS_S3_ACCESS_KEY_ID, AWS_S3_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT, AWS_S3_FORCE_PATH_STYLE, MAIL_DRIVER, MAIL_FROM_ADDRESS, SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, POSTMARK_TOKEN, FILE_UPLOAD_SIZE_LIMIT, DISABLE_TELEMETRY, COLLAB_URL, COLLAB_DISABLE_REDIS, PORT, JWT_TOKEN_EXPIRES_IN]
  buildTime: []
