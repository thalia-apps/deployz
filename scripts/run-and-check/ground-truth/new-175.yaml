  reject:
    - {path: Dockerfile.lite, reason: "lite variant without the offline extras; not the main image"}
    - {path: Dockerfile.postgres, reason: "database image variant, not the application"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 17, quote: "&& bun run build"}
    - {path: Dockerfile, line: 143, quote: "EXPOSE 9621"}
    - {path: Dockerfile, line: 146, quote: "CMD [\"python\", \"-m\", \"lightrag.api.lightrag_server\"]"}
runtime: {accept: [python]}
port:
  accept: [9621]
  evidence:
    - {path: Dockerfile, line: 143, quote: "EXPOSE 9621"}
    - {path: lightrag/api/config.py, line: 371, quote: "default=get_env_value(\"PORT\", 9621, int),"}
    - {path: env.example, line: 16, quote: "PORT=9621"}
bindAllInterfaces:
