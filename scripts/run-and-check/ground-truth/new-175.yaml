id: new-175
repository: HKUDS/LightRAG
commit: aaebfe1bb8d55deb6a4304d357a3bf4c92fcd40a
summary: >
  LightRAG is a Python (FastAPI, uvicorn) graph-based RAG server with a React web UI (built with bun and served by the
  API). The root Dockerfile builds the UI and the Python package from source and runs python -m
  lightrag.api.lightrag_server on 9621. The default storage backends are local files under WORKING_DIR (JsonKVStorage,
  JsonDocStatusStorage, NetworkXStorage, NanoVectorDBStorage), so state is lost on a Fargate task replacement. Env
  settings switch all four stores to PostgreSQL (PGKVStorage, PGDocStatusStorage, PGVectorStorage with pgvector,
  PGTableGraphStorage on plain tables, no Apache AGE), which RDS PostgreSQL can host. The LLM and the embedding model are
  external APIs (LLM_BINDING_* and EMBEDDING_BINDING_*). Neo4j, MongoDB, Milvus, Qdrant, Memgraph and OpenSearch are
  optional alternative stores, not required.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, DEPLOYABLE]
  reason: >
    One Dockerfile builds the app from source, one HTTP port (9621), /health. The product needs a durable store, and the
    default one is local disk. With LIGHTRAG_*_STORAGE set to the PG* classes and POSTGRES_* variables, every store
    lives in RDS PostgreSQL (pgvector is installed with CREATE EXTENSION vector, PGTableGraphStorage needs no extension).
    That is a configuration-only deploy (DEPLOYABLE), but the storage choice is not the default, so
    DEPLOYABLE_WITH_CHANGES (set the storage env, enable pgvector) is also defensible. A deploy with the default file
    storage loses all data on restart.
