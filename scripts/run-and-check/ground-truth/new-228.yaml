blockers:
  expected:
    - "No Dockerfile exists in the repository; the official image is built elsewhere"
    - "Embedded Elasticsearch runs as a child process and keeps its index in the local data directory; Elasticsearch is not a supported dependency and Fargate disk is ephemeral"
    - "Four JVM processes (launcher, search, web, compute engine) start in one container and need several GB of memory"
  mustNot:
    - "Port 9000 must not be treated as a failure"
    - "The embedded H2 database must not be accepted for production"
    - "Redis must not be reported as required"
    - "A separate Elasticsearch must not be requested: it is embedded and not configured by the user in the single-server mode"
vendorQuestions:
  legitimate:
    - "Is SonarQube being deployed as a code-analysis server? It needs an embedded search process and local data that Deployz does not provide"
  unnecessary:
    - "Which port? (9000)"
    - "Which database engine? (PostgreSQL)"
    - "Which Dockerfile? (none exists in the repository)"
traps:
  - "The .dockerignore mentions a docker directory, but the repository has no Dockerfile (.dockerignore:2)"
  - "The launcher JVM, not the web server, is the start command; the web server is a child process (sonar.sh:85)"
  - "The web port 9000 is also the Elasticsearch-aware status endpoint: status stays STARTING while Elasticsearch is unreachable (StatusAction.java:42)"
  - "Elasticsearch listens on 9001 on loopback by default and must not be exposed (sonar.properties:300)"
  - "/api/system/health needs admin rights or a passcode; use /api/system/status for a load balancer check"
openQuestions:
  - "Whether Elasticsearch rebuilds its index from the database after a task restart on empty data was not checked"
  - "Whether the Elasticsearch process starts on a Fargate kernel with vm.max_map_count 65530 was not checked; the properties file says standalone mode only warns (sonar.properties:287)"
crossReview:
  - {field: outcome.accept, change: "none: [NOT_DEPLOYABLE] confirmed against docs/product/mvp-scope.md and the fix-class policy", evidence: "summary and blockers.expected of this file"}
  - {field: all, change: verified, evidence: "18 citations checked against the pinned commit by script (path, line, quote)"}
