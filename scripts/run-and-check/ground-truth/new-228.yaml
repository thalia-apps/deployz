id: new-228
repository: SonarSource/sonarqube
commit: 53c8009b61340eda6e2f188993ba96122d911d64
summary: >
  SonarQube Community Build is a large Java code-quality server built with Gradle. One launcher JVM
  (sonar-application) starts three child processes in the same container: an embedded Elasticsearch search process, the
  web server (port 9000) and the Compute Engine. The repository has no Dockerfile at all (the .dockerignore refers to a
  docker directory that is not in the repository; the official image lives in a separate project). It stores data in a
  database (PostgreSQL, Oracle or SQL Server; the default embedded H2 is for tests) and keeps the Elasticsearch indexes
  and temporary files under sonar.path.data and sonar.path.temp on local disk.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The server embeds Elasticsearch as a child process, and the web status only becomes UP when that search cluster is
    healthy. Its index data lives in a local data directory. Elasticsearch is outside the MVP datastore list, and an
    ephemeral Fargate disk loses the indexes at every task start. There is also no Dockerfile in the repository, and
    a source build needs the Gradle monorepo build, a bundled JRE download and the frontend build, which is more than a
    small Dockerfile addition. Four cooperating JVM processes in one container are also outside a single-process web
    service.
