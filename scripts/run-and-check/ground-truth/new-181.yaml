blockers:
  expected:
    - "No Dockerfile builds AFFiNE from the repository: .github/deployment/node/Dockerfile copies CI-built dist folders, .render/Dockerfile wraps the published image"
    - "PostgreSQL needs the pgvector extension and the schema needs the one-shot self-host-predeploy.js step before the server starts"
    - "Redis is required"
    - "Blobs default to local disk; durable files need the aws-s3 provider in the config file"
  mustNot:
    - "Missing Elasticsearch or Manticore must not be a blocker: the default search provider is embedded"
    - "The private.key and config files in ~/.affine/config must not count as a durable-disk requirement: the predeploy step generates them"
    - "Separate worker services must not be required: the allinone flavor runs everything in one process"
vendorQuestions:
  legitimate:
    - "Which Dockerfile should Deployz use? The repo has none that builds from source"
    - "Which S3 bucket holds blobs? (set storages.blob.storage to aws-s3 in the config file)"
  unnecessary:
    - "Which port? (3010)"
    - "Health path? (/info)"
    - "Which database engine? (PostgreSQL with pgvector)"
traps:
  - "The node Dockerfile looks like the production image but copies pre-built dist folders from packages/frontend (.github/deployment/node/Dockerfile:7)"
  - "Server configuration lives in a Rust native module and a JSON config file (~/.affine/config), so a TypeScript-only search for env variables finds few names"
  - "The compose file runs the migration as a second container from the same image (.docker/selfhost/compose.yml:30), not at server start"
  - "Redis, pgvector and the one-shot migration are all in .docker/selfhost/compose.yml; manticore and elasticsearch only appear in e2e and optional indexer config"
crossReview:
  - {field: outcome.accept, change: "none: keep both. DEPLOYABLE_WITH_CHANGES is defensible: docs/ai-analysis.md treats an unbuildable Dockerfile (no-buildable-dockerfile) as CODE_CHANGE, and a multi-stage Dockerfile (yarn build, napi Rust module packages/backend/native, front ends) is a plain add-a-Dockerfile change with no missing capability. NOT_DEPLOYABLE stays only for a strict no-CI-built-artefacts reading; the runtime needs no unsupported service", evidence: "packages/backend/native/Cargo.toml and build.rs exist; .github/deployment/node/Dockerfile:7 copies dist"}
  - {field: database/redis/workers/migrations, change: "none: PostgreSQL+pgvector, Redis, allinone flavor, one-shot predeploy confirmed", evidence: ".docker/selfhost/compose.yml:19-52; env.ts:104; self-host-predeploy.js:47,56"}
  - {field: port/healthPath/bindAllInterfaces, change: "none", evidence: "config.ts:64,69; app.controller.ts:8; server.ts:157"}
  - {field: storage/search blockers, change: "none: fs default with aws-s3 provider; indexer provider enum has embedded, elasticsearch, manticoresearch", evidence: "admin.rs:582; indexer/config.ts:6-9"}
  - {field: all, change: verified, evidence: "14 citations checked"}
