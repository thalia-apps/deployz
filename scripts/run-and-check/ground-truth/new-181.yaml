id: new-181
repository: toeverything/AFFiNE
commit: 8cef09e1dd62b47a3cbc9f352aa10b3a90c75d34
summary: >
  AFFiNE is a Yarn monorepo (TypeScript, NestJS) for a collaborative workspace: web, mobile and admin front ends plus a
  NestJS server (packages/backend/server) with a Rust native module. The default SERVER_FLAVOR is allinone, so one Node
  process serves the web app, GraphQL, websocket sync and background jobs on port 3010 (GET /info is the status route).
  It needs PostgreSQL with the pgvector extension and Redis (the self-host compose file has both). Migrations run in a
  separate one-shot step (self-host-predeploy.js). Blobs default to local disk (~/.affine/storage); an aws-s3 storage
  provider is supported in the configuration. Search uses the embedded provider by default (Elasticsearch and
  Manticore are optional). No Dockerfile builds from source: .github/deployment/node/Dockerfile copies pre-built
  dist folders, and .render/Dockerfile starts from the published image.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    The runtime fits Deployz (one Node image, port 3010, /info, PostgreSQL 16, Redis, one-shot migration, S3 for blobs).
    But no Dockerfile builds from the repository: the node Dockerfile copies the CI-built web, admin and mobile dist
    folders and a built server, and .render/Dockerfile only wraps ghcr.io/toeverything/affine:stable. A vendor change adds
    a multi-stage Dockerfile (yarn workspace build, Rust native module, front ends, server). A strict read of "no CI-built
    artefacts" gives NOT_DEPLOYABLE. The database also needs the pgvector extension (RDS PostgreSQL 16 supports it).
