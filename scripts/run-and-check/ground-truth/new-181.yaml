    - {path: .render/Dockerfile, reason: "FROM the published ghcr.io/toeverything/affine:stable image; nothing is compiled"}
  target: null
  context: .
  evidence:
    - {path: .github/deployment/node/Dockerfile, line: 7, quote: "COPY ./packages/frontend/apps/web/dist /app/static"}
    - {path: .github/deployment/node/Dockerfile, line: 35, quote: "CMD [\"sh\", \"-c\", \"node ./scripts/upgrade-config.js && exec node ./dist/main.js\"]"}
    - {path: .render/Dockerfile, line: 4, quote: "FROM ghcr.io/toeverything/affine:stable"}
