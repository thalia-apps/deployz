    - {path: docker/Dockerfile, line: 119, quote: "ARG RAILS_ENV=production"}
blockers:
  expected:
    - "docker/Dockerfile:90 runs git rev-parse HEAD without a guard; a source archive has no .git, so the build fails (exit 128) until the Dockerfile is changed"
  mustNot:
    - "pgvector must not block: RDS PostgreSQL supports the vector extension and the migration enables it"
    - "Redis must not be called optional or unsupported: ElastiCache Redis is available"
    - "Sidekiq must not be reported as a second application container: it is a worker service of the same image"
    - "Local storage (/app/storage) must not block: ActiveStorage supports S3 natively"
    - "Missing CMD in the image must not make the app undeployable: the compose file gives the command"
    - "The vite.Dockerfile and rails.Dockerfile dev images must not be reported as missing base image blockers"
vendorQuestions:
  legitimate:
    - "SMTP settings for outbound email: the repo does not say which mail provider the vendor uses"
  unnecessary:
    - "Which port? (3000)"
    - "Which Dockerfile? (docker/Dockerfile)"
    - "Which database engine? (PostgreSQL only)"
    - "Whether a worker is needed (Sidekiq is needed; command in Procfile and compose)"
    - "Health path? (/health)"
traps:
  - "docker/Dockerfile has no CMD or ENTRYPOINT -> the start command must be explicit; use the compose command (docker/Dockerfile:155, docker-compose.production.yaml:22)"
  - "docker/dockerfiles/rails.Dockerfile has a CMD but is a dev image on top of chatwoot:development -> do not use (docker/dockerfiles/rails.Dockerfile:1,9)"
  - "docker/Dockerfile line 90 runs git rev-parse HEAD and needs .git in the build context; .dockerignore does not exclude .git, but a source archive has no .git, so this RUN fails the build (no || true). The final stage then copies /app/.git_sha (docker/Dockerfile:90,151). The app itself does not need the file: config/initializers/git_sha.rb falls back to 'unknown' (docker/Dockerfile:90)"
  - "docker/entrypoints/rails.sh waits for pg_isready and runs bundle install; it is for compose and dev, and is not needed on Deployz (docker/entrypoints/rails.sh:24)"
  - "docker-compose.production.yaml binds Postgres, Redis and Rails to 127.0.0.1 and uses volumes -> a self-host layout, not the Deployz topology (docker-compose.production.yaml:16)"
  - "Procfile release phase runs db:chatwoot_prepare -> the image does not; run it as a migration command (Procfile:1)"
  - "Procfile web uses $PORT and ip_lookup:setup -> the image port is fixed 3000 with -p 3000 (Procfile:2)"
  - "config/storage.yml lists GCS, Azure and S3-compatible services -> use amazon (S3) on AWS (config/storage.yml:10)"
  - "RAILS_ENV=production and RAILS_SERVE_STATIC_FILES=true are image defaults -> Rails serves the precompiled assets itself, no nginx needed (docker/Dockerfile:16,119)"
openQuestions:
  - "The amazon ActiveStorage service passes empty strings when AWS_ACCESS_KEY_ID is unset. Whether the AWS SDK then falls back to the ECS task role was not run or verified"
  - "Whether the first-run db:chatwoot_prepare needs a long statement timeout on a small RDS (the Procfile sets POSTGRES_STATEMENT_TIMEOUT=600s)"
crossReview:
  - {field: outcome.accept, change: "[DEPLOYABLE_WITH_CHANGES] -> [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]; reason starts with the build failure", evidence: "docker/Dockerfile:90 unguarded RUN git rev-parse HEAD (git is installed at line 34, but a source archive has no .git so it exits 128); no build arg avoids it; no .gitattributes"}
  - {field: blockers.expected, change: "[] -> the unguarded git rev-parse build failure", evidence: "docker/Dockerfile:90"}
  - {field: dockerfile.evidence, change: "added lines 90 and 151", evidence: "docker/Dockerfile:90,151"}
  - {field: summary / traps, change: "summary and trap now say the build fails from a source archive; added the git_sha.rb fallback", evidence: "config/initializers/git_sha.rb:2-12 (File.directory?('.git') guard, then .git_sha, then 'unknown')"}
  - {field: startCommand / healthPath / port / database / migrations / redis / workers / storage / env, change: "none: challenged against the code, no error found", evidence: "docker/Dockerfile:155 no CMD; config/environments/production.rb:46 FORCE_SSL default false so /health gets no redirect; app/controllers/health_controller.rb:3-5; config/database.yml:2-31; lib/tasks/db_enhancements.rake:17; docker-compose.production.yaml:22,34"}
  - {field: all, change: verified, evidence: "45 citations checked (all exact)"}
