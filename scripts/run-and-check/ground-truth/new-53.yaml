id: new-53
repository: chatwoot/chatwoot
commit: adcb69429c209ef009041e007ada03614bbbc6ce
summary: >
  Chatwoot customer support platform (Ruby on Rails 7 API plus Vue dashboard, built with Vite). Production
  runs as two processes from one image: the Rails web server and a Sidekiq worker. It needs PostgreSQL with
  the pgvector extension and Redis. The production Dockerfile (docker/Dockerfile) builds from source with a git
  checkout, but a RUN step needs a .git directory (git rev-parse HEAD, no guard), so a build from a source archive
  fails. It also sets no CMD or ENTRYPOINT, so the vendor must give the start command. Uploads use local disk by default; S3 is
  native through ActiveStorage.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    The only production Dockerfile fails to build from a source archive: docker/Dockerfile:90 runs
    "git rev-parse HEAD > /app/.git_sha" with no "|| true", and a source archive has no .git (exit 128). The vendor
    must change the Dockerfile (guard or remove that step and the .git_sha copy), or Deployz must build from a
    git checkout; with that fix the app is DEPLOYABLE_WITH_CHANGES, else NOT_DEPLOYABLE.
    The image has no start command: set "bundle exec rails server -b 0.0.0.0 -p 3000". Schema setup and migrations
    are a separate command (rails db:chatwoot_prepare) that nothing runs at boot. A Sidekiq worker service is
    needed. Redis is required. The default ActiveStorage service is local disk, which is ephemeral, so set
    ACTIVE_STORAGE_SERVICE=amazon with a bucket. PostgreSQL must allow the vector extension (RDS does).
dockerfile:
  accept: [docker/Dockerfile]
  reject:
    - {path: docker/dockerfiles/rails.Dockerfile, reason: "development image: FROM chatwoot:development, an image built elsewhere"}
    - {path: docker/dockerfiles/vite.Dockerfile, reason: "development Vite server image: FROM chatwoot:development"}
    - {path: .devcontainer/Dockerfile, reason: dev container}
    - {path: .devcontainer/Dockerfile.base, reason: dev container base}
  target: null
  context: .
  evidence:
    - {path: docker/Dockerfile, line: 3, quote: "FROM ruby:3.4.4-alpine3.21 AS pre-builder"}
    - {path: docker/Dockerfile, line: 99, quote: "FROM ruby:3.4.4-alpine3.21"}
    - {path: docker/Dockerfile, line: 77, quote: "COPY . /app"}
    - {path: docker/Dockerfile, line: 85, quote: "bundle exec rake assets:precompile"}
    - {path: docker/Dockerfile, line: 90, quote: "RUN git rev-parse HEAD > /app/.git_sha"}
    - {path: docker/Dockerfile, line: 151, quote: "COPY --from=pre-builder /app/.git_sha /app/.git_sha"}
    - {path: docker/dockerfiles/rails.Dockerfile, line: 1, quote: "FROM chatwoot:development"}
runtime: {accept: [ruby]}
port:
  accept: [3000]
  evidence:
    - {path: docker/Dockerfile, line: 155, quote: "EXPOSE 3000"}
    - {path: docker-compose.production.yaml, line: 22, quote: "command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: docker-compose.production.yaml, line: 22, quote: "'-b', '0.0.0.0'"}
startCommand:
  source: explicit
  accept: ["rails server", "rails s "]
  # docker/Dockerfile ends at EXPOSE 3000 with no CMD and no ENTRYPOINT. The reference command is in docker-compose.production.yaml
  # (entrypoint docker/entrypoints/rails.sh, which waits for Postgres and runs bundle install, then execs the command; not needed on Deployz).
  evidence:
    - {path: docker-compose.production.yaml, line: 22, quote: "command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']"}
    - {path: docker-compose.production.yaml, line: 21, quote: "entrypoint: docker/entrypoints/rails.sh"}
    - {path: Procfile, line: 2, quote: "bin/rails server -p $PORT -e $RAILS_ENV"}
healthPath:
  accept: ["/health"]
  # HealthController inherits ActionController::Base, so it skips authentication and app callbacks. It returns 200 with {"status":"woot"}.
  # The Rails root "/" serves the dashboard and may redirect, so do not use it.
  evidence:
    - {path: config/routes.rb, line: 45, quote: "get '/health', to: 'health#show'"}
    - {path: app/controllers/health_controller.rb, line: 3, quote: "class HealthController < ActionController::Base"}
    - {path: app/controllers/health_controller.rb, line: 5, quote: "render json: { status: 'woot' }"}
database:
  status: required
  engines: [postgres]
  default: postgres
  deployzEngine: postgres
  selectBy: {}
  connectionVars: [DATABASE_URL, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DATABASE, POSTGRES_USERNAME, POSTGRES_PASSWORD]
  evidence:
    - {path: config/database.yml, line: 2, quote: "adapter: postgresql"}
    - {path: config/database.yml, line: 29, quote: "ENV.fetch('POSTGRES_DATABASE', 'chatwoot_production')"}
    - {path: docker/entrypoints/helpers/pg_database_url.rb, line: 4, quote: "# Let DATABASE_URL env take presedence over individual connection params."}
    - {path: db/schema.rb, line: 19, quote: "enable_extension \"vector\""}
    - {path: db/migrate/20250104200055_create_captain_tables.rb, line: 3, quote: "the 'vector' extension is mandatory to run the application"}
    - {path: docker-compose.production.yaml, line: 38, quote: "image: pgvector/pgvector:pg16"}
migrations:
  mode: command
  accept: ["bundle exec rails db:chatwoot_prepare", "rails db:chatwoot_prepare"]
  # Nothing in the image or the web command runs it. The Procfile release phase runs it. It loads the schema and seeds on an empty database, else it migrates.
  evidence:
    - {path: lib/tasks/db_enhancements.rake, line: 17, quote: "task chatwoot_prepare: :load_config do"}
    - {path: Procfile, line: 1, quote: "bundle exec rails db:chatwoot_prepare"}
    - {path: docker/entrypoints/rails.sh, line: 24, quote: "bundle install"}
redis:
  status: required
