    - {name: FRONTEND_URL, secret: false, buildTime: false, note: "public https URL; used for links and default_url_options"}
    - {name: REDIS_URL, secret: false, buildTime: false, note: "default is redis://127.0.0.1:6379, which is wrong on Fargate"}
