blockers:
  expected:
    - "The data store is DynamoDB (not provided by Deployz) or an embedded Badger directory on local disk (lost with the container)"
  mustNot:
    - "The Lambda handler in api/cmd/main.go must not be read as a second deployment target for Deployz"
    - "nginx in the image must not be read as an extra application service by itself; it is the static file server and proxy"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which database? (DynamoDB or embedded Badger only)"
traps:
  - "The code default DB_ENGINE is dynamo, so a container without DB_ENGINE=badger tries to reach DynamoDB (api/pkg/config/config.go:138)"
  - "The Dockerfile uses supervisord to run nginx and the Go API in one container (Dockerfile:111-139)"
  - "The default JWT_SECRET and USER_JTI_SALT are public strings in the source (config.go:78,80)"
  - "The docker-compose file maps both 80 and 8080; the public entry is nginx on 80 and the API is behind /api/"
openQuestions: []
crossReview:
  - {field: outcome, change: 'NOT_DEPLOYABLE: no supported store for the core data (DynamoDB or local Badger)', evidence: 'api/pkg/config/config.go:31-36,138; docker-compose.yml:14,28'}
  - {field: workers, change: 'none: supervisord runs nginx and the API only; there is no worker program', evidence: 'Dockerfile:119,128'}
  - {field: all, change: verified, evidence: 22 citations checked}
