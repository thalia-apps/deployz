id: new-291
repository: jesusnoseq/request-inbox
commit: abf6263b1624040a0c0c90f4595e34ca3d4431d1
summary: >
  Request Inbox is a webhook.site style tool: a Go (gin) API plus a React front end. The hosted version runs the API as
  an AWS Lambda function on DynamoDB. The root Dockerfile builds both parts into one image on nginx: nginx serves the
  React build and proxies /api/ to the Go binary, and supervisord (generated by /entrypoint.sh) starts nginx and the API
  as two programs. The data engine is chosen by DB_ENGINE: dynamo (the code default, AWS DynamoDB) or badger (an
  embedded key-value store in the directory DB_BADGER_PATH, default /tmp/inbox.db, with an in-memory option). No
  PostgreSQL, MySQL or Redis option.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The inboxes, captured requests, API keys and users are stored either in DynamoDB, which Deployz does not provide, or
    in an embedded Badger directory on local disk, which stateless Fargate containers lose at every task replacement.
    There is no PostgreSQL, MySQL or S3 storage option. The image also runs nginx and the API as two supervised
    programs. The core data has no supported store, so the app cannot keep its data on Deployz.
