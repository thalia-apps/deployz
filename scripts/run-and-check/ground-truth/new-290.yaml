id: new-290
repository: recurser/string-is
commit: 5647108dbc2c075ccb785fa9264a32e0f3c031dd
summary: >
  string.is is a client-side web tool that detects and converts string formats (JSON, base64, hashes, dates and so
  on). It is a Next.js 12.3.1 app (React 17, Yarn) with no API routes, no database, no Redis and no storage. The root
  Dockerfile is a three-stage build on node:20-alpine: yarn install, `yarn build` with OUTPUT_STANDALONE=1 (which
  makes next.config.js emit the standalone server), and a runner that copies .next/standalone and runs
  `node server.js` as user nextjs on port 3000.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    The root Dockerfile builds the app from source and runs one Node process on port 3000. The app keeps no state and
    needs no environment value: NEXT_PUBLIC_BASE_PATH and the analytics domain are build arguments with defaults. The
    vendor needs no repository change.
