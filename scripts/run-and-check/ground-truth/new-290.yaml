  - "NEXT_PUBLIC_BASE_PATH is inlined into the client bundle at build time, so a sub-path needs a rebuild (next.config.js:114-115)"
  - "next.config.js sets a strict Content-Security-Policy and an Access-Control-Allow-Origin list for string.is hosts only (next.config.js:14-34)"
