storage:
  local: required
  paths: ["~/.node-red (userDir): flows.json, flows_cred.json, .config.*.json, node_modules"]
  s3: none
  s3SelectBy: {}
  evidence:
    - {path: packages/node_modules/node-red/settings.js, line: 35, quote: "flowFile: 'flows.json',"}
    - {path: packages/node_modules/node-red/settings.js, line: 44, quote: "//credentialSecret: \"a-secret-key\","}
    - {path: packages/node_modules/@node-red/runtime/lib/storage/localfilesystem/index.js, line: 46, quote: "\".node-red\");"}
    - {path: packages/node_modules/@node-red/runtime/lib/storage/localfilesystem/index.js, line: 50, quote: "await fs.ensureDir(fspath.join(settings.userDir,\"node_modules\"));"}
env:
  required:
    - {name: PORT, secret: false, buildTime: false, note: "default 1880; set it to the Deployz port if different"}
    - {name: credentialSecret (settings.js), secret: true, buildTime: false, note: "not an env var; settings.js must set it (for example from process.env) or a random key is stored in the ephemeral userDir and credentials become unreadable after a restart"}
    - {name: adminAuth (settings.js), secret: true, buildTime: false, note: "editor and admin API are open by default (adminAuth is commented out); a public HTTPS URL needs adminAuth with a bcrypt password hash"}
  optional: [NODE_RED_HOME, HOME, NODE_OPTIONS]
  buildTime: []
  evidence:
    - {path: packages/node_modules/node-red/settings.js, line: 78, quote: "//adminAuth: {"}
    - {path: packages/node_modules/node-red/settings.js, line: 44, quote: "//credentialSecret: \"a-secret-key\","}
    - {path: packages/node_modules/node-red/settings.js, line: 148, quote: "uiPort: process.env.PORT || 1880,"}
blockers:
  expected:
    - "No Dockerfile in the repo: the source repo has only the npm monorepo and a build script; a Dockerfile must be added by the vendor"
    - "Durable state is local disk only: flows.json, flows_cred.json, settings and palette-installed nodes in userDir are lost when the Fargate task restarts (no DB or S3 storage module in the repo)"
    - "Editor and admin API have no authentication by default: public exposure needs adminAuth in settings.js"
  mustNot:
    - "Must not require a database, Redis or queue: none is used"
    - "Must not report Node.js 22 or the missing built editor assets as a blocker: npm run build creates them inside the image build"
    - "Must not treat the node-red-docker repo reference as a second image or service"
    - "Must not require several services: it is one Node process with embedded flow runtime and schedulers"
vendorQuestions:
  legitimate:
    - "Fixed flows or editable? Are the flows committed in the image (no editor use) or edited in the browser editor?"
    - "Which extra nodes (npm packages) are needed? They must be added in the image build, not installed from the palette at runtime"
    - "What editor login (adminAuth) and credentialSecret must be used?"
  unnecessary:
    - "Which port? (1880 by default, PORT overrides)"
    - "Is a database or Redis needed? (no)"
    - "Who runs migrations? (none)"
traps:
  - "No Dockerfile; the official Docker image lives in the separate node-red-docker repo (.github/scripts/update-node-red-docker.js:15), so do not assume one exists here"
  - "The root package.json is a private dev root; the runnable package is packages/node_modules/node-red (its package.json:15 bin red.js)"
  - "editor-client public assets are git-ignored and built by npm run build (.gitignore:23, package.json:14)"
  - "settings.js in the repo is a template with adminAuth, credentialSecret and contextStorage commented out (settings.js:44, :78, :359)"
  - "settings.js accepts a storageModule (custom module object) -> the repo ships only localfilesystem, so durable state still needs vendor-written code (runtime/lib/storage/index.js:34)"
  - "Palette manager installs npm nodes into userDir/node_modules at runtime; this is ephemeral on Fargate (localfilesystem/index.js:50)"
openQuestions:
  - "Whether a fixed-flow deployment (flows in the image) is an acceptable use of Deployz or an editable Node-RED is expected"
crossReview:
  - {field: traps, change: "added the storageModule setting as a trap: a custom storage module is possible but none ships in the repo, so storage.local stays required and s3 none", evidence: "packages/node_modules/@node-red/runtime/lib/storage/index.js:34"}
  - {field: healthPath, change: "none: / is served with ensureRuntimeStarted (503 before start) and ui.ensureSlash only redirects paths without a trailing slash; / has one, so 200 with no redirect", evidence: "packages/node_modules/@node-red/editor-api/lib/editor/index.js:73; lib/editor/ui.js:43-50"}
  - {field: outcome / dockerfile / port / database / storage, change: "none: no Dockerfile in git ls-files, editor-client/public is git-ignored, port 1880 via PORT, localfilesystem is the default storage", evidence: ".gitignore:23; node-red/settings.js:148; runtime/lib/storage/index.js:42"}
  - {field: all, change: verified, evidence: "20 citations checked"}
