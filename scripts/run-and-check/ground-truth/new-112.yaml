id: new-112
repository: node-red/node-red
commit: 22d019c4eccac31d95f3b6167c7334de72ef02a6
summary: >
  Node-RED 5.x low-code flow runtime (Node.js, Express, one process). The repo is the npm monorepo source: it has no
  Dockerfile and the editor-client public folder is generated by `npm run build` (git-ignored). Flows, credentials,
  settings and installed palette nodes are written to the user directory on local disk (default ~/.node-red) by the
  built-in localfilesystem storage. There is no database, Redis or S3 storage module in the repo.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    The repo has no Dockerfile, so a Dockerfile must be added (npm ci, npm run build, node packages/node_modules/node-red/red.js).
    The durable state (flows.json, flows_cred.json, .config.*.json, palette nodes) lives only on local disk, which is
    ephemeral on Fargate, and the repo has no DB or S3 storage module. This is a judgement call: as a fixed-flow app (flows
    committed to the image, no editor use) it can run with changes; as an editable Node-RED it loses all editor changes at
    each restart, a persistent-volume blocker.
dockerfile:
  accept: []
  reject:
    - {path: .github/scripts/update-node-red-docker.js, reason: "release script for the separate node-red-docker repo; not a Dockerfile and not in this repo"}
  target: null
  context: .
  evidence:
    - {path: .github/scripts/update-node-red-docker.js, line: 15, quote: "node-red-docker/package.json"}
    - {path: .gitignore, line: 23, quote: "packages/node_modules/@node-red/editor-client/public"}
runtime: {accept: [node]}
port:
  accept: [1880]
  evidence:
    - {path: packages/node_modules/node-red/settings.js, line: 148, quote: "uiPort: process.env.PORT || 1880,"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: packages/node_modules/node-red/red.js, line: 349, quote: "settings.uiHost = settings.uiHost||\"0.0.0.0\";"}
startCommand:
  source: explicit
  accept: ["node packages/node_modules/node-red/red.js", "npm start"]
  # no Dockerfile, so the command must be given; the package.json "start" script is the repo's own command
  evidence:
    - {path: package.json, line: 13, quote: "\"start\": \"node packages/node_modules/node-red/red.js\","}
    - {path: package.json, line: 14, quote: "\"build\": \"node scripts/build\","}
healthPath:
  accept: ["/"]
  # the editor root is served at "/" (httpAdminRoot default); it returns 200 when the runtime is started (503 before) and has no redirect at the root.
  # With adminAuth set, the page still loads; the login happens in the client. /flows and /nodes need auth.
  evidence:
    - {path: packages/node_modules/@node-red/editor-api/lib/editor/index.js, line: 73, quote: "editorApp.get(\"/\",ensureRuntimeStarted,ui.ensureSlash,ui.editor);"}
    - {path: packages/node_modules/@node-red/editor-api/lib/editor/index.js, line: 35, quote: "res.status(503).send(\"Not started\");"}
database:
  status: none
  engines: []
  default: null
  deployzEngine: null
  selectBy: {}
  connectionVars: []
  evidence:
