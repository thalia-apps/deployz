  reject: [docker/dev/Dockerfile]
  target: null
  context: .
  evidence:
    - {path: docker/Dockerfile, line: 4, quote: "# This file assumes that the frontend has been built using ./scripts/frontend-build"}
    - {path: docker/Dockerfile, line: 40, quote: "COPY backend       /app"}
    - {path: docker/Dockerfile, line: 41, quote: "COPY frontend/dist /app/frontend"}
    - {path: docker/Dockerfile, line: 58, quote: "ENTRYPOINT [ \"/init\" ]"}
runtime: {accept: [node]}
port:
