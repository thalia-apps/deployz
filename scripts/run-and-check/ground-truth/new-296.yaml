    - {path: backend/lib/config.js, line: 80, quote: "if (envPostgresHost && envPostgresUser && envPostgresName) {"}
    - {path: backend/lib/config.js, line: 97, quote: "const envSqliteFile = process.env.DB_SQLITE_FILE || \"/data/database.sqlite\";"}
