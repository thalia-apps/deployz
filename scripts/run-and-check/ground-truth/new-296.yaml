id: new-296
repository: NginxProxyManager/nginx-proxy-manager
commit: 1aca775cb983270a3f5be23fd32501173165ebd3
summary: >
  Nginx Proxy Manager is a web UI that manages an nginx reverse proxy: it writes proxy-host, redirect and stream
  configuration files under /data/nginx and reloads nginx, and it issues Let's Encrypt certificates with certbot. The
  image (docker/Dockerfile) is built on a prebuilt nginx-full base image, installs the s6-overlay supervisor and runs
  three services together: nginx (ports 80 and 443 for the proxied traffic), the Node.js backend (port 3000, the API)
  and the admin UI (port 81, nginx serves the built frontend). The Dockerfile copies frontend/dist, which a separate
  script must build first. The backend stores its data in SQLite (/data/database.sqlite) by default, or in MySQL or
  PostgreSQL when DB_MYSQL_* or DB_POSTGRES_* variables are set.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The product is a reverse proxy. Its job is to terminate traffic for other hosts on ports 80 and 443 and to forward
    it, with nginx configuration files and certificates written to /data on local disk and nginx reloaded by the
    backend. One Deployz service has one HTTP port behind the Deployz HTTPS load balancer, so the proxy function does
    not apply, and the generated configuration state is local. The image also runs nginx, the backend and the UI under
    s6-overlay as several processes, and it copies a frontend/dist folder that the Dockerfile does not build. The
    database option (PostgreSQL or MySQL) does not change this.
