    - {path: backend/internal/nginx.js, line: 133, quote: "return `/data/nginx/${internalNginx.getFileFriendlyHostType(host_type)}/${host_id}.conf`;"}
    - {path: backend/internal/nginx.js, line: 286, quote: "fs.writeFileSync(filename, config_text, { encoding: \"utf8\" });"}
env:
  required: []
  optional: [DB_POSTGRES_HOST, DB_POSTGRES_PORT, DB_POSTGRES_USER, DB_POSTGRES_PASSWORD, DB_POSTGRES_NAME, DB_MYSQL_HOST, DB_SQLITE_FILE, PUID, PGID, DISABLE_IPV6]
  buildTime: []
  evidence:
    - {path: backend/lib/config.js, line: 77, quote: "const envPostgresHost = process.env.DB_POSTGRES_HOST || null;"}
blockers:
  expected:
    - "The product is a reverse proxy for other hosts on ports 80 and 443 with its own nginx; Deployz serves one HTTP port behind its HTTPS load balancer"
    - "Generated nginx configuration and certificates live in /data on local disk and are applied by an nginx reload in the same container"
  mustNot:
    - "The PostgreSQL and MySQL options must not be read as the only blocker: the proxy role and the local nginx state are the blockers"
    - "The s6-overlay supervisor must not be the only reason: nginx, backend and UI are one image, but the reverse-proxy function remains"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which database? (not useful: the product is not deployable)"
    - "Is Redis or S3 needed? (no)"
traps:
  - "DB_POSTGRES_* and DB_MYSQL_* make a PostgreSQL or MySQL option exist, which looks like an easy case; the database is not the issue (backend/lib/config.js:57-97)"
  - "The Dockerfile copies frontend/dist and says a script must build the frontend first, so the root build alone does not make the image (docker/Dockerfile:4,41)"
  - "The container exposes three ports (80, 81, 443) and the backend listens on 3000 behind the internal nginx (docker/Dockerfile:38; backend/index.js:33)"
openQuestions: []
crossReview:
  - {field: dockerfile, change: 'none: docker/Dockerfile is the production image; it expects frontend/dist from a prior build step', evidence: 'docker/Dockerfile:4,40,41,58'}
  - {field: database, change: 'none: SQLite by default; PostgreSQL or MySQL when the DB_* variables are set', evidence: 'backend/lib/config.js:57,80,97'}
  - {field: outcome, change: 'none: reverse proxy with local generated nginx state; not a plain web app', evidence: 'docker/Dockerfile:38,57; backend/internal/nginx.js:133,286'}
  - {field: all, change: verified, evidence: 23 citations checked}
