blockers:
  expected:
    - "No Dockerfile; the database and the permanent directory are set in configuration files that Maven generates, so the vendor must add a Dockerfile and a configuration step"
  mustNot:
    - "The supported databases other than PostgreSQL and MySQL (HSQLDB, Oracle) must not be reported as missing services"
    - "The embedded Solr must not be read as a required second server: it runs in the same JVM (solr.type embedded)"
    - "The many Maven modules must not be read as several services that run together"
vendorQuestions:
  legitimate:
    - "Which database URL, user and password does the XWiki configuration use? (PostgreSQL or MySQL from Deployz)"
    - "Which directory is the permanent directory?"
  unnecessary:
    - "Is Redis or a worker needed? (no)"
    - "Which port? (8080)"
traps:
  - "hibernate.cfg.xml is a Maven-processed template; the default connection is HSQLDB in the permanent directory, and the PostgreSQL and MySQL blocks use localhost URLs that must be replaced (hibernate.cfg.xml.vm:250,281)"
  - "environment.permanentDirectory is commented out by default; without it the data goes to a temporary directory (xwiki.properties.vm:94)"
  - "The database driver JAR for PostgreSQL or MySQL is not part of the WAR by default and must be copied to WEB-INF/lib (hibernate.cfg.xml.vm:34)"
  - "The repository holds only the platform; xwiki-commons and xwiki-rendering are separate repositories that the build takes from Maven repositories"
openQuestions:
  - "The exact Maven command and profile that produce a Jetty or Tomcat package with a chosen database were not traced in the pom files"
crossReview:
  - {field: dockerfile, change: 'none: the full tree has no Dockerfile or compose file', evidence: 'README.md:15'}
  - {field: database, change: 'none: the connection is a build-time template property or a hand edit, not an environment value', evidence: 'hibernate.cfg.xml.vm:26,123,281'}
  - {field: outcome, change: 'none: two outcomes accepted because of the missing Dockerfile and the local permanent directory', evidence: 'xwiki.properties.vm:92,94,810'}
  - {field: all, change: verified, evidence: 15 citations checked}
