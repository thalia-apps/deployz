id: new-309
repository: xwiki/xwiki-platform
commit: a3de4aa544631de20b320aed81684abf26027b4b
summary: >
  XWiki Platform is a large Java wiki platform: a Maven multi-module repository (about 25,000 files; xwiki-platform-core,
  xwiki-platform-distribution, xwiki-platform-tools). The runnable application is the web application that
  xwiki-platform-distribution-war assembles (a servlet container such as Jetty or Tomcat is needed; the all-in-one
  Jetty and HSQLDB package comes from xwiki-platform-distribution-jetty-hsqldb and its start_xwiki.sh listens on 8080).
  The repository has no Dockerfile and no compose file (the official Docker image is in another repository). The database
  is not chosen by an environment value: WEB-INF/hibernate.cfg.xml is generated from hibernate.cfg.xml.vm with Maven
  properties (xwikiDbConnectionUrl and others), or edited by hand; the default is HSQLDB in the permanent directory, and
  PostgreSQL, MySQL, MariaDB and others are supported. The permanent directory (environment.permanentDirectory in
  xwiki.properties) also holds the embedded Solr index, the extension repository and the jobs.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    The architecture can fit Deployz (one Java web process on one port, PostgreSQL or MySQL, no Redis, no worker), but
    settings alone cannot deploy it. There is no Dockerfile, so the vendor must write one that builds the WAR with Maven
    and adds a servlet container; the database connection and the permanent directory are set in configuration files
    (hibernate.cfg.xml, xwiki.properties) and not in environment values, so a repository change is needed. That gives
    DEPLOYABLE_WITH_CHANGES. NOT_DEPLOYABLE is also accepted because the change is large (a build of a 25,000-file Maven
    multi-module tree) and the application keeps its Solr index, its installed extensions and its jobs on local disk in
    the permanent directory, which Fargate does not keep between task starts.
