id: new-198
repository: elastic/elasticsearch
commit: 4b3e63dcc68d6311b69a30a26ea71b906f645996
summary: >
  Elasticsearch is a Java distributed search and analytics engine built with Gradle. It is a datastore server: it serves
  a REST API on 9200 and a transport protocol on 9300, and keeps its indices in a data directory on durable disk. The
  Dockerfiles in distribution/docker are Groovy templates that need a distribution archive made by the Gradle build, so
  no Dockerfile builds the server from the repository source with a plain docker build.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository is a search-engine datastore server. It needs a durable data directory (indices under data/), which
    Fargate does not give a task, and Elasticsearch is named as unsupported in the Deployz MVP. Nodes also talk over a
    transport protocol on 9300. The Dockerfiles are templates (${base_image} and Groovy placeholders) that depend on a
    Gradle-built distribution archive, so there is no buildable Dockerfile.
dockerfile:
  accept: []
  reject:
    - {path: distribution/docker/src/docker/dockerfiles/default/Dockerfile, reason: "Groovy template with placeholders; needs the Gradle-built distribution archive and a base_image value"}
    - {path: distribution/docker/src/docker/dockerfiles/wolfi/Dockerfile, reason: "Wolfi variant of the same template"}
    - {path: distribution/docker/src/docker/dockerfiles/ironbank/Dockerfile, reason: "Iron Bank variant of the same template"}
    - {path: distribution/docker/src/docker/dockerfiles/cloud_ess_fips/Dockerfile, reason: "Elastic Cloud FIPS variant of the same template"}
    - {path: distribution/docker/src/docker/Dockerfile.ess, reason: "Elastic Cloud image layer that adds filebeat, metricbeat and plugin archives"}
    - {path: libs/native-toolchain/Dockerfile.cross-toolchain, reason: "cross-compile toolchain for native libraries"}
    - {path: test/fixtures/krb5kdc-fixture/Dockerfile, reason: "test fixture"}
    - {path: test/fixtures/old-elasticsearch/src/main/resources/docker/Dockerfile, reason: "test fixture"}
    - {path: x-pack/test/idp-fixture/src/main/resources/idp/Dockerfile, reason: "test fixture"}
    - {path: x-pack/test/idp-fixture/src/main/resources/nginx/Dockerfile, reason: "test fixture"}
    - {path: x-pack/test/idp-fixture/src/main/resources/oidc/Dockerfile, reason: "test fixture"}
    - {path: x-pack/test/idp-fixture/src/main/resources/openldap/Dockerfile, reason: "test fixture"}
    - {path: x-pack/test/smb-fixture/src/main/resources/Dockerfile, reason: "test fixture"}
  target: null
