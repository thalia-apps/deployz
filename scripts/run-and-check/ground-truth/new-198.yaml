blockers:
  expected:
    - "Elasticsearch is a search datastore server and is outside the Deployz MVP support list"
    - "The node needs a durable data directory for indices; Fargate task storage is ephemeral"
    - "No Dockerfile builds from repository source: the image templates need a Gradle-built distribution archive"
  mustNot:
    - "Port 9200 must not be treated as a failure: it is the REST API port; the datastore role and the storage decide the outcome"
    - "A database or Redis must not be reported as required: Elasticsearch is the datastore"
    - "Test fixture Dockerfiles must not be treated as application images"
vendorQuestions:
  legitimate:
    - "Is Elasticsearch the search backend for another application? It is better run as a managed search service (Elastic Cloud or Amazon OpenSearch Service), outside this deployment"
  unnecessary:
    - "Which port? (9200)"
    - "Which health path? (/_cluster/health)"
    - "Is a database needed? (no)"
traps:
  - "distribution/docker/src/docker/dockerfiles/default/Dockerfile contains template placeholders and is not valid Dockerfile syntax by itself (Dockerfile:22)"
  - "Port 9300 is the node-to-node transport protocol, not HTTP (Dockerfile:117)"
  - "The image sets network.host 0.0.0.0, so the bind address is not a problem (config/elasticsearch.yml:2)"
openQuestions:
  - "The ES_JAVA_OPTS and ELASTIC_PASSWORD names come from documented container usage and were not read in the source"
crossReview:
  - {field: outcome.accept, change: "none: [NOT_DEPLOYABLE] confirmed against docs/product/mvp-scope.md and the fix-class policy", evidence: "summary and blockers.expected of this file"}
  - {field: all, change: verified, evidence: "12 citations checked against the pinned commit by script (path, line, quote)"}
