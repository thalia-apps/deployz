blockers:
  expected:
    - "The repository is the MySQL database server; clients use the MySQL wire protocol on 3306, not HTTP"
    - "The server needs a durable datadir; Fargate task storage is ephemeral"
    - "No Dockerfile builds the server"
  mustNot:
    - "RDS MySQL 8.0 must not be offered as a way to deploy this repository: the repository is the database engine itself"
    - "The Dockerfiles under components/telemetry/test and extra/ must not be accepted as app images"
vendorQuestions:
  legitimate:
    - "Is MySQL being deployed as a database for another app? A database server is better run as a managed database"
  unnecessary:
    - "Which port? (3306)"
    - "Which health path? (the server has no HTTP endpoint)"
traps:
  - "The repository has Dockerfiles, but only in test helpers and vendored libraries (components/telemetry/test, extra/)"
  - "MYSQL_PORT comes from the CMake variable MYSQL_TCP_PORT, set at build time (include/mysql_version.h.in:20)"
openQuestions:
  - "The default value of MYSQL_TCP_PORT (3306) was not read in this tree's CMake files; it is the long-standing MySQL default"
crossReview:
