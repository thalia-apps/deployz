  reject:
    - {path: components/telemetry/test/collector/Dockerfile, reason: "telemetry component test helper (OpenTelemetry collector)"}
    - {path: components/telemetry/test/prometheus/Dockerfile, reason: "telemetry component test helper (Prometheus)"}
    - {path: components/telemetry/test/loki/Dockerfile-all, reason: "telemetry component test helper (Loki)"}
