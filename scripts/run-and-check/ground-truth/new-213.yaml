id: new-213
repository: mysql/mysql-server
commit: 06bcb0eb0ad281e08dd2b4d81b99ad25491433e7
summary: >
  MySQL Server is a C and C++ relational database server (mysqld, CMake build). It is a datastore, not a web
  application. It speaks the MySQL wire protocol on TCP 3306 and keeps data in a datadir. The only Dockerfiles are
  telemetry test helpers and vendored third-party copies (curl, opentelemetry-cpp, opentelemetry-proto); none builds
  the server.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository is a database server. Clients use the MySQL wire protocol on 3306, which is not HTTP and cannot sit
    behind the ALB. It needs a durable datadir that Fargate does not provide. No Dockerfile builds mysqld from the
    source.
dockerfile:
