env:
  required: []
  optional: [PORT, WS_FALLBACK, RTC_CONFIG, RATE_LIMIT, DEBUG_MODE, IPV6_LOCALIZE, SIGNALING_SERVER]
  buildTime: []
  # RATE_LIMIT=1 (number of proxy hops) is advisable behind the ALB so that peers are grouped by the real client IP (X-Forwarded-For).
  # WS_FALLBACK=true lets transfers between different networks go through the server over the WebSocket when no TURN server exists.
  evidence:
    - {path: server/index.js, line: 40, quote: "conf.wsFallback = process.argv.includes('--include-ws-fallback') || process.env.WS_FALLBACK === \"true\";"}
    - {path: server/index.js, line: 42, quote: "conf.rtcConfig = process.env.RTC_CONFIG && process.env.RTC_CONFIG !== \"false\""}
    - {path: server/index.js, line: 61, quote: "if (process.argv.includes('--rate-limit') || process.env.RATE_LIMIT === \"true\") {"}
    - {path: server/peer.js, line: 48, quote: "else if (request.headers['x-forwarded-for']) {"}
blockers:
  expected: []
  mustNot:
    - "WebRTC, STUN or TURN must not block: peer data flows browser to browser; Deployz only hosts signalling on the HTTP port"
    - "The WebSocket server must not be treated as a second port or a separate worker: it shares port 3000 with Express"
    - "The coturn service in docker-compose-coturn.yml must not be required: it is an optional extra for cross-network transfers"
    - "A missing database, Redis or storage must not be reported as a blocker: the app is stateless"
    - "A missing /health route must not block: / returns 200"
vendorQuestions:
  legitimate:
    - "Do users transfer files between different networks? That needs a TURN server (RTC_CONFIG) or WS_FALLBACK=true (relay through the server)"
  unnecessary:
    - "Which port? (3000)"
    - "Which Dockerfile? (Dockerfile)"
    - "Is a database needed? (no)"
traps:
  - "docker-compose-coturn.yml runs a coturn TURN server on UDP/TCP 3478 and a range of UDP relay ports, which look like unsupported extra services but are optional (docker-compose-coturn.yml)"
  - "/health does not exist and unknown paths return a 301 redirect to / (server.js:57-59), so a health check on /health sees a redirect, not 200"
  - "Docker HEALTHCHECK is wget --spider on / (Dockerfile:18-19)"
  - "The default STUN server is stun.l.google.com (index.js:48), an outbound call from the browser, not from the server"
  - "Peers are grouped by client IP; behind the ALB the client IP comes from X-Forwarded-For (peer.js:48) and RATE_LIMIT sets the proxy hop count (server.js:25)"
  - "Dockerfile uses alpine:latest with apk-installed Node (Dockerfile:1,6), not a node image"
openQuestions:
  - "Whether a tool should treat cross-network WebRTC as needing TURN (UDP) and reject the app; this file judges it optional because WS_FALLBACK relays over the WebSocket"
crossReview:
