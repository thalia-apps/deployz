id: new-137
repository: schlagmichdoch/PairDrop
commit: 1b0c9c9d903c3cfc706df1303dc75c3b54d04c77
summary: >
  PairDrop is a Node.js (Express + ws) local file-sharing web app, a clone of Snapdrop. One process serves the static
  web client from public/ and a WebSocket signalling server on the same HTTP port (3000). Files travel peer to peer
  over WebRTC between browsers, not through the server. There is no database, no Redis, no worker and no local state.
  Optional TURN or STUN servers and an optional server-relayed WebSocket fallback are set by environment variables.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    The Dockerfile builds from the repo source and runs `npm start` (one Node process, one port, no state). The server
    only brokers signalling over WebSocket on the same port through the ALB. WebRTC data flows between the browsers
    (default STUN stun.l.google.com), so Deployz does not need to host any UDP service. Transfers across different
    networks need a TURN server or WS_FALLBACK=true (server relay over the WebSocket); that is an optional setting,
    not a blocker.
