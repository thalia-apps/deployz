summary: >
  The GitHub repository readeck/readeck contains only a README.md that points to the official repository on Codeberg.
  The pinned commit ("Initial commit") has no source code, no Dockerfile, no manifest and no configuration. Nothing in the
  archive can be built or deployed.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The archive has one file, README.md, with a pointer to codeberg.org/readeck/readeck. There is no application source,
    no Dockerfile and no runtime to analyse. An analyser must not guess the port, health path or database from the
    product's public documentation.
