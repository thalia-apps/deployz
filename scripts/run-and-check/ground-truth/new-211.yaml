  accept: ["mongod --bind_ip 0.0.0.0 --dbpath /data/db"]
  evidence:
    - {path: README.md, line: 37, quote: "$ ./mongod"}
    - {path: src/mongo/db/storage/storage_options.h, line: 45, quote: "std::string dbpath;"}
