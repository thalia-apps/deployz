blockers:
  expected:
    - "The repository is the MongoDB database server; clients use the MongoDB wire protocol on 27017, not HTTP"
    - "MongoDB is not a supported datastore and the server needs a durable dbpath (/data/db)"
    - "No Dockerfile builds a production server image; all Dockerfiles are build, test or third-party images"
  mustNot:
    - "buildscripts/antithesis/base_images/mongo_binaries/Dockerfile must not be accepted as the app image: it is a test image with gdb and llvm that EXPOSEs 20000-20100"
    - "A bazel/remote_execution_container Dockerfile must not be accepted: they are compiler toolchains"
vendorQuestions:
  legitimate:
    - "Is MongoDB being deployed as the database for another application? MongoDB is not a supported Deployz datastore"
  unnecessary:
    - "Which Dockerfile? (none builds the server)"
    - "Which health path? (mongod has no HTTP health route)"
traps:
  - "Many Dockerfiles exist (about 40), almost all in bazel/remote_execution_container and src/third_party; none is an application image"
  - "README says to create /data/db before starting mongod (README.md:36)"
  - "The Antithesis image creates /data/db and /data/configdb, which looks like a server image but only prepares a test environment (mongo_binaries/Dockerfile:10)"
openQuestions:
  - "The loopback default for bind_ip was taken from MongoDB's documented behaviour, not read from the option default in this tree"
