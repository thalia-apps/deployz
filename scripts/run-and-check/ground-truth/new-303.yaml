id: new-303
repository: 0xERR0R/blocky
commit: 501edc07a373f949452097655619f77df4e1fcb6
summary: >
  Blocky is a DNS proxy and ad-blocker for a local network, written in Go. Its main service is a DNS server on port 53
  (UDP and TCP). An optional HTTP listener (ports.http, example 4000) serves a REST API, Prometheus metrics and DNS over
  HTTPS. The root Dockerfile builds a static binary and runs it as ENTRYPOINT /app/blocky in a scratch image; the
  configuration is a YAML file (BLOCKY_CONFIG_FILE=/app/config.yml) that is not part of the image. The cache can use
  Redis and the query log can use PostgreSQL or MySQL, all optional.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The application is a DNS server, not an HTTP web application. Its clients are DNS resolvers on port 53 (UDP and TCP).
    The Deployz load balancer forwards HTTPS to one HTTP port and does not carry DNS. The HTTP listener is a secondary
    interface (metrics, REST API, DoH) and the application is useless without the DNS port.
