    - {path: docker/default.Dockerfile, line: 95, quote: "FROM linkding AS linkding-plus"}
    - {path: scripts/run-docker.sh, line: 5, quote: "docker build -f \"docker/$variant.Dockerfile\" --target linkding"}
    - {path: .dockerignore, line: 2, quote: "*"}
runtime: {accept: [python]}
