id: new-32
repository: sissbruecker/linkding
commit: 27b7303baf41bb28babc610ac8eaa486e1ddfab5
summary: >-
  linkding is a self-hosted bookmark manager (Django, Python 3.13, uwsgi, Huey task queue).
  It is meant to run as one Docker container (docker/default.Dockerfile, CMD ./bootstrap.sh) with
  /etc/linkding/data mounted; SQLite is the default and PostgreSQL is supported via LD_DB_ENGINE.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]   # judgement call, see crossReview
  reason: >-
    Set LD_DB_ENGINE=postgres plus LD_DB_HOST/LD_DB_DATABASE/LD_DB_USER/LD_DB_PASSWORD/LD_DB_PORT to the RDS
    instance, so durable data is in PostgreSQL. Build with --target linkding. Migrations run at boot.
    Redis is not used. The background worker runs inside the same container. PostgreSQL holds bookmarks and
    users, but /etc/linkding/data still holds user-uploaded bookmark files (enabled by default), snapshot/PDF
    assets and the secret key; upstream docs say to mount it as a volume and has no S3. Without a volume
    those files are lost on task replacement; LD_DISABLE_ASSET_UPLOAD=true avoids the user-data loss in the
    default build (snapshots are off unless the plus image sets LD_ENABLE_SNAPSHOTS). Favicons and previews are regenerable.
    LD_SUPERUSER_NAME/LD_SUPERUSER_PASSWORD create the first login.
