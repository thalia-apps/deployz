    - {path: bookmarks/settings/base.py, line: 323, quote: "LD_ASSET_FOLDER = os.path.join(BASE_DIR, \"data\", \"assets\")"}
    - {path: bookmarks/settings/prod.py, line: 19, quote: "open(os.path.join(BASE_DIR, \"data\", \"secretkey.txt\"))"}
    - {path: docker-compose.yml, line: 8, quote: "/etc/linkding/data"}
