    - {path: docs/src/content/docs/backups.md, line: 11, quote: "`assets` - folder that contains HTML snapshots of bookmarks"}
    - {path: docs/src/content/docs/backups.md, line: 21, quote: "If you are using a different database, such as Postgres, you'll have to back up the database and other contents of the data folder manually."}
