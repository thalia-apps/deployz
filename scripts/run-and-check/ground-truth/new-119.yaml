blockers:
  expected:
    - "Data connectors are separate services: the v3 engine reads data only through NDC connectors (for example ndc-postgres), each its own image; Deployz allows one application image (v3/README.md:48-52, v3/docker-compose.yaml:1-2)"
    - "No app definition in the repo: METADATA_PATH and AUTHN_CONFIG_PATH files are made by the DDN CLI for a user project and are not in the image (v3/README.md:54-62, v3/crates/engine/bin/engine/main.rs:26-36)"
    - "Hasura v2 server has no Dockerfile that builds from the repo: only a CI-built binary is packaged (packaging/graphql-engine/Dockerfile:7)"
  mustNot:
    - "Rust build time or the cargo-chef stage must not block: v3/Dockerfile builds from source with a plain cargo build"
    - "The port or the health path must not be unknown: 3000 and /health are in the source"
    - "No database is needed by the engine itself: do not report a missing DATABASE_URL"
    - "Redis, workers, scheduled jobs and local volumes must not be reported: the engine has none"
    - "v3/docker-compose.yaml (Postgres, Jaeger, auth hook, plugins) is a dev stack, not a proof that the engine needs these services itself"
vendorQuestions:
  legitimate:
    - "Which Hasura version is the target (v2 Haskell server or v3 DDN engine), and where is the project metadata (open_dd.json, auth_config.json) and which NDC connector images does it use?"
  unnecessary:
    - "Which port? (3000 default in main.rs)"
    - "Health path? (/health)"
    - "Does it need a database or Redis? (the engine has none; data is in connectors)"
    - "Is there a start command? (ENTRYPOINT engine in v3/Dockerfile)"
traps:
  - "v3/Dockerfile is the only from-source build and looks deployable, but it is for local development and the engine needs metadata plus connector services (v3/Dockerfile:21)"
  - "packaging/graphql-engine/Dockerfile looks like the v2 production image, but it only copies a CI-built binary from rootfs/ (packaging/graphql-engine/Dockerfile:7)"
  - "v2 server defaults to port 8080 and /healthz, v3 engine to 3000 and /health: different engines in one repo (server/src-lib/Hasura/Server/Init/Arg/Command/Serve.hs:219, server/src-lib/Hasura/Server/App.hs:977)"
  - "v3/static/metadata.json points to http://local.hasura.dev:8080: a test fixture, not a production app (v3/static/metadata.json:12)"
  - "Many docker-compose files under install-manifests/ and community/ show Postgres, MongoDB, ClickHouse and others: examples, not the repo topology"
openQuestions:
  - "Whether a user would copy their own DDN build output into v3/ and deploy the engine with a hosted connector: a post-MVP shape, the repo alone does not show it"
crossReview:
  - {field: dockerfile.accept, change: "none: v3/Dockerfile kept. It builds the engine from the repo alone (COPY sources rust-toolchain.toml, .cargo, Cargo.toml, Cargo.lock, crates are in git; ENV RELEASE_VERSION=dev stops build.rs from needing .git; git is installed for cargo git dependencies). An empty accept list would score an analysis that names this Dockerfile as wrong, although it is the only from-source app build. NOT_DEPLOYABLE comes from the missing metadata and connectors, not from the build. Added a comment", evidence: "v3/Dockerfile:21-23,26,35-37,58; v3/crates/engine/build.rs:13-14"}
  - {field: outcome, change: "none: NOT_DEPLOYABLE kept. v3/static/metadata.json and auth configs are test fixtures that point to a local connector and are not copied into the image", evidence: "v3/crates/engine/bin/engine/main.rs:26,35; v3/docker-compose.yaml:11-12"}
  - {field: healthPath, change: "none: /health confirmed (200, no auth middleware on health_route, not behind the /*path pre-route handler); / serves GraphiQL", evidence: "v3/crates/engine/src/routes.rs:81,94,137"}
  - {field: all, change: verified, evidence: "19 citations checked"}
