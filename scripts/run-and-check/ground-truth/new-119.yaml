id: new-119
repository: hasura/graphql-engine
commit: 0ee2929472fdc7f8206a865f456a949d2b2eccee
summary: >
  Hasura monorepo with two engines. Hasura v2 (Haskell, server/) has no Dockerfile that builds it from the repo:
  packaging/graphql-engine/Dockerfile only copies a CI-built binary (rootfs/bin) on top of a BASE_IMAGE build arg.
  Hasura v3 (Rust, v3/) has v3/Dockerfile that compiles the engine with cargo and ships one binary, but it is a
  local-development file. The v3 engine is a stateless GraphQL gateway: it needs a metadata file and an auth config
  file made by the DDN CLI (not in the repo), and it talks to separate NDC connector services (a second image) for data.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The only Dockerfile that builds an app from source (v3/Dockerfile) builds the v3 engine, which does nothing
    without METADATA_PATH and AUTHN_CONFIG_PATH files (no default, not in the image) and without one or more NDC
    connector services that run as separate images (for example ndc-postgres). The v2 server has no from-source
    Dockerfile (CI-built binary only). So there is no single-image deployable app in the repo.
dockerfile:
  # Kept: it builds from the repo alone (all COPY sources are in git; RELEASE_VERSION=dev is set, so build.rs needs no .git).
  # The outcome is NOT_DEPLOYABLE because of the missing app definition, not because the image cannot be built.
  accept: [v3/Dockerfile]
  reject:
    - {path: packaging/graphql-engine/Dockerfile, reason: "needs ARG BASE_IMAGE and COPY rootfs/bin from a CI-built binary; no build from source"}
    - {path: packaging/graphql-engine-base/ubuntu.dockerfile, reason: "base image only (OS packages, pg_dump); no application"}
    - {path: packaging/cli-migrations/v3/Dockerfile, reason: "packages the CLI on top of a prebuilt graphql-engine image"}
    - {path: v3/custom-connector.Dockerfile, reason: "builds a test connector, a second image"}
    - {path: v3/dev-auth-webhook.Dockerfile, reason: "dev auth webhook for local compose, a second image"}
    - {path: docs/Dockerfile, reason: "documentation site"}
    - {path: dc-agents/sqlite/Dockerfile, reason: "v2 data connector agent, a separate service"}
  target: null
  context: v3
  evidence:
    - {path: packaging/graphql-engine/Dockerfile, line: 2, quote: "FROM ${BASE_IMAGE}"}
    - {path: packaging/graphql-engine/Dockerfile, line: 7, quote: "COPY rootfs/bin/ /bin/"}
    - {path: v3/Dockerfile, line: 58, quote: "RUN cargo build --release --bin engine"}
    - {path: v3/Dockerfile, line: 71, quote: "ENTRYPOINT [\"engine\"]"}
    - {path: v3/Dockerfile, line: 21, quote: "This Dockerfile is only for local development"}
