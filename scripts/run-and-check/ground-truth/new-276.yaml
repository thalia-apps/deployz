id: new-276
repository: navidrome/navidrome
commit: ec2e0a9ea9cd7c2f08f930fc0579b991e1fe0900
summary: >
  Navidrome is a self-hosted music streaming server (Subsonic-compatible API plus a React web UI) written in Go. The root
  Dockerfile is a large multi-stage build (UI with node, Go with CGO and the SQLite driver, ffmpeg and mpv in the
  Alpine runtime). The image declares two volumes: /data (the SQLite database, the config file, the cache) and /music (the
  media library that the scanner reads). The only database is SQLite (mattn/go-sqlite3); no PostgreSQL or MySQL driver
  exists. The application serves HTTP on 0.0.0.0:4533 and answers /ping.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The product is a streaming server for a media library on a local disk (/music), and its only database is a SQLite
    file in /data. Deployz does not provide SQLite or persistent volumes, and no PostgreSQL, MySQL or S3 option exists
    for the database or the library. Same case as other SQLite-only apps with a mounted data directory.
