blockers:
  expected:
    - "The only database is SQLite in the /data volume, and Deployz provides only PostgreSQL and RDS MySQL"
    - "The media library is a local directory (/music) that a person fills; there is no S3 library option and no way to fill the directory in Deployz"
  mustNot:
    - "ffmpeg and mpv in the runtime image must not be read as extra services"
    - "The Dockerfile must not be rejected for its size: it builds from the clone"
    - "The scanner and the scheduler must not be read as a separate worker or an EventBridge schedule"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port or health path? (4533 and /ping; not useful: the product is not deployable)"
    - "Is Redis needed? (no)"
traps:
  - "The Dockerfile is long (osxcross, xx cross-compilation, node UI build, mpv stubs) but it builds the app from the clone; the blocker is the data model, not the build (Dockerfile:182-216)"
  - "/data and /music are declared as VOLUMEs; without a volume the library is empty and the database is lost at each task restart (Dockerfile:205)"
  - "The sqlite driver needs CGO (Dockerfile:71)"
  - "The /ping route comes from chi's Heartbeat middleware and is mounted under the server root (server/server.go:177)"
openQuestions: []
crossReview:
  - {field: dockerfile, change: 'none: the root Dockerfile builds the UI and the Go binary from the clone and its final stage is the runtime image', evidence: 'Dockerfile:182,203,216'}
  - {field: database, change: 'none: only the go-sqlite3 driver is a dependency, and the database path is under the data folder', evidence: 'go.mod:40; conf/configuration.go:405'}
  - {field: outcome, change: 'none: SQLite in a /data volume and a local /music library; no PostgreSQL, MySQL or S3 option', evidence: 'Dockerfile:205-207'}
  - {field: all, change: verified, evidence: 18 citations checked}
