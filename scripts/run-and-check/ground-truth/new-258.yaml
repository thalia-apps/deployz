id: new-258
repository: thomiceli/opengist
commit: 2acf3dae87f9c3d536e0a870787941bbd06d0b46
summary: >
  Opengist is a self-hosted pastebin (a GitHub Gist clone) written in Go with a Vite front end. Every gist is a bare Git
  repository on local disk under $OG_OPENGIST_HOME/repos/<user>/<gist>. The metadata database is SQLite by default
  (opengist.db in the home directory), and PostgreSQL or MySQL work through OG_DB_URI. The root Dockerfile builds the app
  from source (last stage prod), declares VOLUME /opengist, listens on HTTP 6157 and starts a built-in SSH server on 2222
  by default. The schema is migrated at start (GORM AutoMigrate). The default code index is Bleve, a local index directory.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The core data (the Git repository of each gist) is durable only on a local disk path ($OG_OPENGIST_HOME/repos), with
    no object-store or database backend. Deployz has no persistent volume or EFS, so every gist would be lost at the next
    task restart or deploy. A PostgreSQL database keeps only the metadata. This is the same case as new-59 (Gitea).
