  paths: [/opengist/repos, /opengist/opengist.db, /opengist/opengist.index, /opengist/custom]
  s3: none
  s3SelectBy: {}
  # Gists are bare Git repositories on local disk. No S3 or database backend exists for them.
  evidence:
    - {path: internal/git/commands.go, line: 23, quote: "ReposDirectory = \"repos\""}
    - {path: internal/git/commands.go, line: 37, quote: "return filepath.Join(config.GetHomeDir(), ReposDirectory, strings.ToLower(user), gist)"}
    - {path: Dockerfile, line: 69, quote: "VOLUME /opengist"}
    - {path: docs/installation/docker.md, line: 25, quote: "- \"$HOME/.opengist:/opengist\""}
env:
  required:
    - {name: OG_DB_URI, secret: true, buildTime: false, note: "postgres://user:password@host:5432/db; the default is SQLite in the home directory. Contains the DB password"}
    - {name: OG_SECRET_KEY, secret: true, buildTime: false, note: "session and MFA encryption key; without it the app writes a random key to a file in the home directory, which is lost on restart"}
    - {name: OG_EXTERNAL_URL, secret: false, buildTime: false, note: "public HTTPS URL; used for clone URLs and WebAuthn"}
  optional: [OG_SSH_GIT_ENABLED, OG_HTTP_GIT_ENABLED, OG_INDEX, OG_LOG_LEVEL, OG_METRICS_ENABLED, OG_GITHUB_CLIENT_KEY, OG_GITHUB_SECRET, OG_OIDC_CLIENT_KEY, OG_OIDC_SECRET, OG_OIDC_DISCOVERY_URL]
  buildTime: []
  evidence:
    - {path: internal/config/config.go, line: 40, quote: "SecretKey string `yaml:\"secret-key\" env:\"OG_SECRET_KEY\"`"}
    - {path: internal/config/config.go, line: 45, quote: "ExternalUrl  string `yaml:\"external-url\" env:\"OG_EXTERNAL_URL\"`"}
    - {path: internal/config/config.go, line: 321, quote: "SecretKey, _ = session.GenerateSecretKey(path)"}
blockers:
  expected:
    - "Gist data is Git repositories on local disk ($OG_OPENGIST_HOME/repos, VOLUME /opengist) with no S3 or database backend; Fargate disk is ephemeral"
  mustNot:
    - "SQLite default must not be the only reason: PostgreSQL and MySQL work through OG_DB_URI"
    - "The Dockerfile must not be called unbuildable: the prod stage builds from source with make"
    - "Redis must not be required"
vendorQuestions:
  legitimate:
    - "Where must gist Git repositories live durably? (local disk only; no S3 option)"
  unnecessary:
    - "Which port? (6157)"
    - "Health path? (/healthcheck)"
    - "Who runs migrations? (AutoMigrate at start)"
traps:
  - "OG_DB_URI moves only the metadata to PostgreSQL; the gists themselves stay as Git repositories on disk (internal/git/commands.go:37)"
  - "The image starts a built-in SSH server on 2222 by default; an ALB cannot serve it, so OG_SSH_GIT_ENABLED=disabled is needed (config.yml:84, internal/cli/main.go:44)"
  - "The Dockerfile has a dev stage (make watch, VOLUME) before the prod stage; the default last stage prod is the right one (Dockerfile:24, :49)"
  - "Without OG_SECRET_KEY the key is generated and stored in the home directory, so sessions and MFA data break after a restart (internal/config/config.go:319-321)"
  - "The Bleve code index is a local directory; meilisearch is the only external option (config.yml:30)"
  - "The Helm chart uses PVCs (helm/opengist/templates/pvc.yaml), which confirms the durable disk need"
openQuestions: []
crossReview:
  - {field: dockerfile.accept, change: "none: the prod stage copies /config.yml, the binary and docker/ from the build stage that runs make on the full source", evidence: "Dockerfile:44-46,49,62-64"}
  - {field: outcome.accept, change: "none: gists are bare Git repositories under the home directory with no object-store backend; same case as new-59 (Gitea)", evidence: "internal/git/commands.go:23,37; reasons.txt new-59"}
  - {field: all, change: verified, evidence: "29 citations checked"}
