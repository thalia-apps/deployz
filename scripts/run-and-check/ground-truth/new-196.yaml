id: new-196
repository: coder/code-server
commit: ee31cdbe02c07b3ba718007f221d14c890696c61
summary: >
  code-server runs VS Code in the browser: a Node.js (TypeScript, Express) server on port 8080 that wraps a patched VS Code
  taken from the lib/vscode git submodule. It has no database or Redis. It serves an editor over HTTP and WebSocket, with
  password authentication, and works on files in a workspace directory. Settings, extensions and sessions are stored in the
  user data directory and the config file under the home directory. All three Dockerfiles in ci/release-image install a
  pre-built code-server .deb or .rpm package from release-packages/; none builds the application from source.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    code-server is a single-user remote IDE whose job is to edit files on a durable disk: the workspace (WORKDIR
    /home/coder), the user data directory with settings, extensions and sessions, and ~/.config/code-server/config.yaml.
    Fargate storage is ephemeral and no EFS is provided, so every restart or task replacement loses the work. Also no
    Dockerfile builds the product from source: the release images only install a package that CI builds first, and a source
    build needs the full VS Code submodule build.
