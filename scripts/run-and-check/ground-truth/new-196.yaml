blockers:
  expected:
    - "The product is a remote IDE on a durable workspace and user data directory; Fargate storage is ephemeral and no EFS is provided"
    - "No Dockerfile builds code-server from source: the release images install a pre-built .deb or .rpm, and the source needs the lib/vscode submodule build"
  mustNot:
    - "A database or Redis must not be reported as required: code-server has neither"
    - "The default bind address (localhost) must not be treated as final: the release image passes 0.0.0.0:8080"
    - "WebSocket support must not be treated as a blocker: an ALB passes WebSocket upgrades"
vendorQuestions:
  legitimate:
    - "Is an IDE whose workspace and extensions are lost at every restart acceptable?"
  unnecessary:
    - "Which port? (8080)"
    - "Which health path? (/healthz)"
    - "Is a database needed? (no)"
traps:
  - "The Dockerfiles in ci/release-image need release-packages/ from an earlier CI build, so a plain docker build of the repository fails (ci/release-image/Dockerfile:5)"
  - "The image entrypoint uses fixuid (setuid) and sudo without a password for user coder (Dockerfile:38, :43)"
  - "The default config file binds 127.0.0.1:8080 and generates a random password (src/node/cli.ts:758-760)"
  - "Dockerfile.fedora and Dockerfile.opensuse are the same image on other bases, not other applications"
openQuestions:
  - "A single-user ephemeral demo of the IDE would work with PASSWORD set and an image that installs the released package; the outcome treats lost workspace data as the blocker"
  - "The patched VS Code build steps in ci/build were not traced in detail"
