blockers:
  expected:
    - "SeaweedFS is a storage server (datastore); volume data needs durable local disk and Fargate storage is ephemeral"
    - "No Dockerfile builds the checked-out source: docker/Dockerfile.go_build clones upstream and needs CI-prebuilt directories; the others copy a prebuilt weed or are test images"
    - "Several roles and ports (master, volume, filer, S3, WebDAV, gRPC) run in one process and are reached by each other and by clients"
  mustNot:
    - "A database must not be reported as required: the default filer metadata store is embedded leveldb on disk"
    - "Port 8333 alone must not be treated as sufficient: the S3 gateway needs the master and volume roles to store data"
    - "Test, FoundationDB, RocksDB and Kafka Dockerfiles must not be treated as application images"
vendorQuestions:
  legitimate:
    - "Is SeaweedFS being deployed as the object store for another application? It needs durable disk and several ports and is better replaced by Amazon S3"
  unnecessary:
    - "Which port? (S3 is 8333)"
    - "Which Dockerfile? (none builds the source cleanly)"
traps:
  - "docker/Dockerfile.go_build looks like the production Dockerfile but builds a clone of upstream from GitHub, not the repository checkout (docker/Dockerfile.go_build:8)"
  - "The image default command is mini, a single-process cluster for small and dev use (weed/command/mini.go:344)"
  - "The EXPOSE list has eight ports; gRPC ports are the HTTP port plus 10000 (weed/command/mini.go:57)"
  - "The repository has more than 40 Dockerfiles, almost all under test/ and docker/ for tests"
openQuestions:
  - "Whether weed s3 alone with an external filer would match a Deployz service; the filer and volume servers would still be separate durable services"
