id: new-226
repository: seaweedfs/seaweedfs
commit: ec43f4ca00c5d295ba6058aa3d178a53aa848d69
summary: >
  SeaweedFS is a Go distributed file and object store (master, volume server, filer, S3 gateway, WebDAV, admin). It is a
  datastore, not a web application. The official image runs "weed mini -dir=/data", one process that starts master, volume,
  filer, S3 and admin on several ports (master 9333, volume 8080, filer 8888, S3 8333, plus gRPC ports at +10000). File
  data lives in volume files under /data, which must be durable. The filer metadata can use an external store (for
  example MySQL), but the volume data cannot. Docker/Dockerfile.go_build, the production image file, clones SeaweedFS from
  GitHub during the build and needs CI-prebuilt Rust binary directories, so it does not build the checked-out source.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    SeaweedFS is a storage server. Object data is written to volume files in a local data directory (mini -dir=/data),
    which is durable-disk state that Fargate does not provide. The server exposes many ports (master, volume, filer, S3,
    WebDAV, gRPC) and uses internal gRPC between its roles, so one HTTP port does not describe it. No Dockerfile builds the
    app from the repository source with a simple context: go_build clones upstream over the network, the local and e2e
    files copy a prebuilt weed binary, and the rest are test or toolchain images.
