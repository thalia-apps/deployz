id: new-292
repository: keven1024/015
commit: 411d7dbed640c198636eff6277b0c17fdd3ba204
summary: >
  015 is a self-hosted temporary file and text sharing site. It has a Nuxt 4 front end, a Go (Echo) API and a separate Go
  (Asynq) worker, with Redis for share metadata and the queue. The root Dockerfile builds the front end and the API
  and starts three processes through 015.sh (the API on 5001, the Nuxt server on 5000, and Caddy on 80 as the front
  proxy). The worker has its own worker/Dockerfile and is not in the app image. The documented deployment is two
  containers (app and worker) that share one local ./uploads directory, plus Redis, and a config.yaml file mounted
  into both. Uploaded files live only on the local file system; the repository has no S3 or other object storage code.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The app stores every uploaded file on a local directory (upload.path) that the app container and the separate
    worker container must both read and write. A stateless Fargate task has no shared persistent volume in the Deployz
    model, and there is no S3 option, so uploads would be lost at each task replacement and the worker could not see them.
    The worker is a second image from another Dockerfile, not a command of the app image, and the image already starts
    three processes through a shell script. Several services must run together on shared local disk.
