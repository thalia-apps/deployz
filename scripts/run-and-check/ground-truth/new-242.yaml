    - {path: Dockerfile, line: 78, quote: "CMD [\"node\", \"server.js\"]"}
healthPath:
  accept: ["/healthz", "/check"]
  # /healthz is registered before the GUI and always returns 200 JSON. A bare / answers 302 to /check.
  evidence:
    - {path: server.js, line: 57, quote: "app.get('/healthz', (req, res) => {"}
    - {path: server.js, line: 59, quote: "res.status(200).json({"}
    - {path: server.js, line: 196, quote: "return res.redirect(302, '/check');"}
    - {path: render.yaml, line: 22, quote: "healthCheckPath: /healthz"}
