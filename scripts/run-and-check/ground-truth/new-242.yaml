    - {path: render.yaml, line: 27, quote: "- key: TRUST_PROXY"}
    - {path: astro.config.mjs, line: 30, quote: "const deployTarget = unwrapEnvVar('PLATFORM', guessPlatform()).toLowerCase();"}
blockers:
  expected: []
  mustNot:
    - "Chromium must not be reported as a second server or image: it is installed in the same image and launched by the API handlers"
    - "vercel.json, netlify.toml, fly.toml and render.yaml must not be read as a required platform: the Dockerfile builds a node target by default"
    - "render.yaml must not provision a schedule or worker: it has one web service with runtime image"
    - "Missing database, Redis, workers or S3 must not be reported: none are used"
    - "Optional external API keys must not be required: the app runs without them and skips those checks"
vendorQuestions:
  legitimate:
    - "The tool scans any host, including port scans and traceroute; should API_BLOCKED_HOSTS or API_DISABLED_CHECKS limit it on a public deployment?"
  unnecessary:
    - "Which port? (3000)"
    - "Health path? (/healthz)"
    - "Database, Redis, worker or storage? (none)"
traps:
  - "The comment says EXPOSE cannot follow PORT; the real port is PORT, default 3000 (Dockerfile:58-59, server.js:36)"
  - "/ answers 302 to /check for self-hosted users, so a health check on / without redirect support fails (server.js:195-196)"
  - "Chromium for screenshots and Lighthouse needs memory; the Small size (512 MiB) may be too small, fly.toml uses 1 GB (fly.toml:15)"
  - "astro.config.mjs imports the Vercel and Netlify adapters; they are dev dependencies used only at build, and the default target is node (astro.config.mjs:11-12, :26)"
  - "@sparticuz/chromium and puppeteer are in dependencies, but the image uses the system Chromium through CHROME_PATH (Dockerfile:62-63)"
openQuestions: []
crossReview:
  - {field: "dockerfile.accept", change: "none: package.json and yarn.lock are in git; .dockerignore excludes only node_modules, dist and platform caches; the build stage checks that the compiled server loads", evidence: "Dockerfile:14,31,36-38,56; .dockerignore:2-10"}
  - {field: "healthPath", change: "none: /healthz returns 200 JSON; / answers 302 to /check unless BOSS_SERVER or DISABLE_GUI is set", evidence: "server.js:57-59,194-196"}
  - {field: "all", change: "verified", evidence: "18 citations checked"}
