id: new-242
repository: lissy93/web-check
commit: bea963c2d07284897e8fa6315ccb730a4ec19add
summary: >
  Web-Check is an OSINT tool that analyses a website. One Express server (server.js) serves the API (one handler per file in
  api/) and the Astro GUI built to dist/ (node adapter, middleware mode). The root Dockerfile is multi-stage: it installs
  with yarn, runs `yarn build --production`, and the slim final stage adds system Chromium, traceroute and tini, then runs
  `node server.js` on PORT (default 3000). /healthz returns 200 JSON. There is no database, cache, worker or storage. All
  external API keys are optional. render.yaml and fly.toml deploy the prebuilt image or the same Dockerfile.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    The root Dockerfile builds the app from source, and the image runs one Node process on one HTTP port (3000) with an
    unauthenticated /healthz route. Chromium runs inside the same process tree for screenshots, not as a separate server.
    No datastore is needed, so only settings are needed (TRUST_PROXY, optional API keys), as new-141.
dockerfile:
  accept: [Dockerfile]
  reject:
    - {path: docker-compose.yml, reason: "uses the prebuilt image lissy93/web-check; no build"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 38, quote: "RUN yarn build --production"}
    - {path: Dockerfile, line: 52, quote: "apt-get install -y --no-install-recommends chromium traceroute tini && \\"}
    - {path: Dockerfile, line: 56, quote: "RUN node --input-type=module -e \"await import('/app/dist/server/entry.mjs');\""}
    - {path: Dockerfile, line: 78, quote: "CMD [\"node\", \"server.js\"]"}
runtime: {accept: [node]}
