id: new-120
repository: temporalio/temporal
commit: f7ca7c3c49318cefa10299960b2c8dd7d9d4f9cb
summary: >
  Temporal server (Go). A distributed workflow engine with four internal services (frontend, history, matching,
  worker) that run in one `temporal-server start` process by default. The frontend speaks gRPC on 7233 and an
  optional HTTP API on 7243. There is no Dockerfile that builds from the repo: the only image Dockerfiles copy
  pre-built binaries from ./build/${TARGETARCH}/ (made by CI with make bins), and the image has no config file.
  A persistent store (Cassandra, MySQL, PostgreSQL or SQLite) needs a schema applied by a separate tool.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    No Dockerfile builds the server from the repo archive: server.Dockerfile copies ./build/${TARGETARCH}/temporal-server,
    which is a CI-built artefact absent from the archive. The main protocol is gRPC (HTTP/2), which an HTTPS ALB
    serving one HTTP port for web traffic does not expose as an HTTP/1 service; the HTTP API (port 7243) is off
    unless httpPort is set in a config file the image does not contain. The DB schema must also be applied
    with temporal-sql-tool, which is not in the server image.
dockerfile:
  accept: []
  reject:
    - {path: docker/targets/server.Dockerfile, reason: "copies pre-built ./build/${TARGETARCH}/temporal-server; no Go build stage; build context is docker/, not the repo root"}
    - {path: docker/targets/admin-tools.Dockerfile, reason: "copies pre-built CLI and schema tools from ./build; this is a tools image, not the server"}
  target: null
  context: docker
  evidence:
    - {path: docker/targets/server.Dockerfile, line: 14, quote: "COPY --chmod=755 ./build/${TARGETARCH}/temporal-server /usr/local/bin/"}
    - {path: docker/targets/server.Dockerfile, line: 3, quote: "FROM alpine:${ALPINE_TAG}"}
    - {path: docker/docker-bake.hcl, line: 71, quote: "context = \"docker\""}
    - {path: docker/docker-bake.hcl, line: 72, quote: "dockerfile = \"targets/server.Dockerfile\""}
    - {path: Makefile, line: 5, quote: "# Rebuild binaries (used by Dockerfile)."}
    - {path: docker/targets/admin-tools.Dockerfile, line: 21, quote: "./build/${TARGETARCH}/temporal \\"}
runtime: {accept: [go]}
port:
  accept: [7233, 7243]
  evidence:
    - {path: docker/config_template.yaml, line: 272, quote: "default .Env.FRONTEND_GRPC_PORT \"7233\""}
    - {path: docker/config_template.yaml, line: 273, quote: "default .Env.FRONTEND_HTTP_PORT \"7243\""}
    - {path: config/development-postgres12.yaml, line: 50, quote: "grpcPort: 7233"}
    - {path: config/development-postgres12.yaml, line: 53, quote: "httpPort: 7243"}
bindAllInterfaces:
  value: false
  evidence:
    - {path: docker/config_template.yaml, line: 280, quote: "bindOnIP: \"{{ default .Env.BIND_ON_IP \"127.0.0.1\" }}\""}
    - {path: docker/scripts/sh/entrypoint.sh, line: 7, quote: ": \"${BIND_ON_IP:=$(getent hosts"}
startCommand:
  source: image
  accept: ["/etc/temporal/entrypoint.sh", "temporal-server start"]
healthPath:
  # Frontend health is the gRPC health service (grpc.health.v1); no HTTP/1 /health route was found. The HTTP API
  # (grpc-gateway, port 7243; the image template sets httpPort, a rendered config is still needed) serves /system-info (the HTTP tests call it without a prefix), but the ALB must target 7243 and it is not the gRPC port.
  accept: ["/system-info", "/api/v1/system-info"]
  evidence:
    - {path: service/frontend/fx.go, line: 575, quote: "healthpb.Health_Check_FullMethodName:"}
    - {path: service/frontend/fx.go, line: 1131, quote: "return cfg.Services[string(serviceName)].RPC.HTTPPort != 0"}
    - {path: common/config/config.go, line: 87, quote: "// HTTPPort is the port on which HTTP will listen. If unset/0, HTTP will be"}
    - {path: tests/http_api_test.go, line: 368, quote: "s.httpGet(env, http.StatusOK, \"/system-info\", \"application/json\")"}
database:
  status: required
  engines: [cassandra, mysql8, postgres12, postgres12_pgx, sqlite]
  default: cassandra
  deployzEngine: postgres
  selectBy: {DB: postgres12}
  connectionVars: [POSTGRES_SEEDS, DB_PORT, DBNAME, POSTGRES_USER, POSTGRES_PWD, SQL_TLS_ENABLED]
  evidence:
    - {path: docker/config_template.yaml, line: 16, quote: "{{- $db := default .Env.DB \"cassandra\" | lower -}}"}
    - {path: docker/config_template.yaml, line: 102, quote: "{{- else if eq $db \"postgres12\" \"postgres12_pgx\" }}"}
    - {path: docker/config_template.yaml, line: 107, quote: "connectAddr: \"{{ default .Env.POSTGRES_SEEDS \"\" }}:{{ default .Env.DB_PORT \"5432\" }}\""}
    - {path: docker/config_template.yaml, line: 115, quote: "enabled: {{ default .Env.SQL_TLS_ENABLED \"false\" }}"}
migrations:
  mode: command
  accept: ["temporal-sql-tool"]
  evidence:
    - {path: docker/targets/admin-tools.Dockerfile, line: 23, quote: "./build/${TARGETARCH}/temporal-sql-tool \\"}
    - {path: docker/targets/admin-tools.Dockerfile, line: 28, quote: "COPY ./build/temporal/schema /etc/temporal/schema"}
    - {path: docker/targets/server.Dockerfile, line: 14, quote: "temporal-server /usr/local/bin/"}
redis:
  status: none
  evidence:
