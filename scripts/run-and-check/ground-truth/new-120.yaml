    - {name: POSTGRES_SEEDS, secret: false, buildTime: false, note: "DB host; with DB_PORT, DBNAME, POSTGRES_USER"}
    - {name: POSTGRES_PWD, secret: true, buildTime: false, note: "DB password"}
    - {name: BIND_ON_IP, secret: false, buildTime: false, note: "entrypoint resolves the container hostname when unset; 0.0.0.0 also sets TEMPORAL_BROADCAST_ADDRESS"}
  optional: [SQL_TLS_ENABLED, NUM_HISTORY_SHARDS, LOG_LEVEL, FRONTEND_GRPC_PORT, FRONTEND_HTTP_PORT, ENABLE_ES, USE_INTERNAL_FRONTEND, VISIBILITY_DBNAME]
  buildTime: []
  evidence:
    - {path: docker/config_template.yaml, line: 109, quote: "user: \"{{ default .Env.POSTGRES_USER \"\" }}\""}
    - {path: docker/config_template.yaml, line: 110, quote: "password: \"{{ default .Env.POSTGRES_PWD \"\" }}\""}
    - {path: docker/scripts/sh/entrypoint.sh, line: 12, quote: ": \"${TEMPORAL_BROADCAST_ADDRESS:=$(getent hosts"}
blockers:
  expected:
    - "No Dockerfile builds the server from the repo archive: docker/targets/server.Dockerfile needs a pre-built ./build/<arch>/temporal-server (CI artefact), and its build context is docker/"
    - "Main protocol is gRPC (HTTP/2) on 7233; an HTTPS ALB web service with one HTTP/1 health check does not fit (health is the gRPC health service)"
    - "The server image has no config file and the schema needs temporal-sql-tool (separate admin-tools image), so a one-image deploy cannot create the DB schema"
  mustNot:
    - "Cassandra and Elasticsearch support must not block by themselves: PostgreSQL and MySQL are supported stores"
    - "The four internal services (frontend, history, matching, worker) must not count as four deployable services: they run in one process by default"
    - "Redis must not be required: Temporal does not use it"
    - "Temporal UI (temporalio/ui in develop docker-compose) must not be treated as part of the server image"
vendorQuestions:
  legitimate:
    - "How is the server binary built in the deploy: Deployz needs a Dockerfile that compiles it (go build ./cmd/server); the repo only has CI-built-binary Dockerfiles"
    - "Is the gRPC frontend reachable by workers outside the VPC: Temporal clients use gRPC on 7233 and an ALB path is not a fit"
  unnecessary:
    - "Is a worker process needed? (all services run in one process by default)"
    - "Is Redis needed? (not used)"
    - "Which DB? (PostgreSQL 12+ or MySQL 8 are supported by the server)"
traps:
  - "docker/targets/server.Dockerfile looks like the server Dockerfile but copies pre-built binaries from ./build (docker/targets/server.Dockerfile:14)"
  - "docker/config_template.yaml defaults DB to cassandra and binds 127.0.0.1 -> set DB and BIND_ON_IP (docker/config_template.yaml:16, docker/config_template.yaml:280)"
  - "develop/docker-compose/docker-compose.yml lists Cassandra, Elasticsearch, Prometheus, Grafana and the UI -> developer dependencies only, not the production topology (develop/docker-compose/docker-compose.yml:30)"
  - "HTTP API port 7243 is off unless httpPort is set in the config (common/config/config.go:87)"
openQuestions:
  - "Whether a custom Dockerfile with a Go build stage plus a rendered config and a schema step would count as DEPLOYABLE_WITH_CHANGES: the repo does not provide one, and gRPC still has no ALB path"
crossReview:
  - {field: healthPath.accept, change: "[/api/v1/system-info] -> [/system-info, /api/v1/system-info]; the HTTP API tests call /system-info with no /api/v1 prefix, and the /api/v1 form is not in the repo sources (generated routes are in a go.temporal.io/api module)", evidence: "tests/http_api_test.go:368 s.httpGet(env, http.StatusOK, \"/system-info\"; tests/http_api_test.go:394-396 request goes to the HTTP API address with the given path"}
  - {field: outcome, dockerfile, database.selectBy, port, bindAllInterfaces, startCommand, change: "none: checked against server.Dockerfile, entrypoint.sh, config_template.yaml (DB default cassandra, postgres12 branch, httpPort 7243 in template, bindOnIP 127.0.0.1); no other Dockerfile builds the server", evidence: "docker/targets/server.Dockerfile:14; docker/config_template.yaml:16,273,280"}
  - {field: all, change: verified, evidence: "31 citations checked"}
