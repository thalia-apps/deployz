    - {path: temporal/server.go, line: 39, quote: "string(primitives.WorkerService),"}
    - {path: docker/scripts/sh/entrypoint.sh, line: 16, quote: "exec temporal-server start"}
scheduledJobs:
  status: none
  items: []
  evidence: []
storage:
  local: none
  paths: []
  s3: none
  s3SelectBy: {}
  evidence:
    - {path: docker/config_template.yaml, line: 7, quote: "numHistoryShards: {{ default .Env.NUM_HISTORY_SHARDS \"4\" }}"}
env:
