id: new-124
repository: ClickHouse/ClickHouse
commit: d491ad88ce45448fba69cbf462cd629a09dcc0bd
summary: >
  ClickHouse is a C++ column-oriented database server (HTTP 8123, native TCP 9000), not a web app. The repo has no
  Dockerfile that builds the server from source: docker/server/Dockerfile is a symlink to Dockerfile.ubuntu, which installs
  pre-built clickhouse-server packages from packages.clickhouse.com. The server is a database that stores its data in
  /var/lib/clickhouse on local disk, and ClickHouse is not a Deployz-supported service.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    ClickHouse is itself the database, and Deployz does not support ClickHouse. No Dockerfile builds it from the repo
    archive (the images download release packages). The data path /var/lib/clickhouse is a VOLUME on ephemeral local disk
    (no EFS), so data is lost on every task restart. The source build needs 159 contrib submodules that the archive
    does not contain.
dockerfile:
  accept: []
  reject:
    - {path: docker/server/Dockerfile, reason: "symlink to Dockerfile.ubuntu"}
    - {path: docker/server/Dockerfile.ubuntu, reason: "installs pre-built clickhouse-server deb packages from packages.clickhouse.com; no build from repo source; COPY entrypoint.sh and docker_related_config.xml are relative to docker/server, so they are missing with the repo root as build context"}
    - {path: docker/bare/Dockerfile, reason: "FROM scratch, ADD root /: the root directory is made by docker/bare/prepare from a local build/programs/clickhouse binary, which is not in git"}
    - {path: docker/server/Dockerfile.alpine, reason: "downloads pre-built tgz packages; also needs a glibc donor stage"}
    - {path: docker/server/Dockerfile.distroless, reason: "same package-download pattern, not a source build"}
    - {path: docker/keeper/Dockerfile, reason: "ClickHouse Keeper image, a different service, also from packages"}
    - {path: ci/docker/binary-builder/Dockerfile, reason: "CI build toolchain image, does not produce the server image"}
  target: null
  context: .
  evidence:
    - {path: docker/server/Dockerfile, line: 1, quote: "Dockerfile.ubuntu"}
    - {path: docker/server/Dockerfile.ubuntu, line: 36, quote: "https://packages.clickhouse.com/deb"}
    - {path: docker/server/Dockerfile.ubuntu, line: 37, quote: "ARG VERSION=\"26.10.2.103\""}
    - {path: docker/server/Dockerfile.ubuntu, line: 140, quote: "apt-get install --yes --no-install-recommends ${packages}"}
    - {path: docker/server/Dockerfile.ubuntu, line: 163, quote: "COPY entrypoint.sh /entrypoint.sh"}
    - {path: docker/bare/Dockerfile, line: 2, quote: "ADD root /"}
    - {path: docker/server/Dockerfile.alpine, line: 93, quote: "wget_with_retry \"${REPOSITORY}/${package}-${VERSION}-${arch}.tgz\""}
runtime: {accept: []}
