  status: none
  items: []
  evidence: []
storage:
  local: required
  paths: [/var/lib/clickhouse, /var/log/clickhouse-server]
  s3: none
  s3SelectBy: {}
  # ClickHouse can place MergeTree data on an S3 disk via storage_configuration, but this needs extra XML config and
  # keeps metadata on local disk; it is not a Deployz bucket feature. The default is local disk.
  evidence:
    - {path: docker/server/Dockerfile.ubuntu, line: 166, quote: "VOLUME /var/lib/clickhouse"}
    - {path: programs/server/config.xml, line: 596, quote: "<path>/var/lib/clickhouse/</path>"}
env:
  required: []
  optional: [CLICKHOUSE_USER, CLICKHOUSE_PASSWORD, CLICKHOUSE_PASSWORD_FILE, CLICKHOUSE_DB, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT]
  buildTime: []
  evidence:
    - {path: docker/server/entrypoint.sh, line: 52, quote: "CLICKHOUSE_USER=\"${CLICKHOUSE_USER:-default}\""}
blockers:
  expected:
    - "ClickHouse is an unsupported database service: Deployz offers only RDS PostgreSQL/MySQL, Redis and S3"
    - "No Dockerfile builds the server from the repo archive: the images download pre-built packages from packages.clickhouse.com"
    - "Data lives in /var/lib/clickhouse on local disk (VOLUME); Fargate disk is ephemeral and there is no EFS, so all data is lost on restart"
    - "A source build needs the contrib/ submodules (159 entries in .gitmodules); the Deployz archive has no submodule content"
  mustNot:
    - "Missing PostgreSQL or Redis must not be a blocker: ClickHouse needs neither"
    - "Missing health path must not be a blocker: /ping exists and returns 200"
    - "Binding to localhost must not be a blocker: the image config listens on 0.0.0.0"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (8123 HTTP, 9000 native; Deployz needs the HTTP port)"
    - "Which database? (the server is the database)"
    - "Health path? (/ping)"
traps:
  - "docker/server/Dockerfile looks like a Dockerfile -> it is a symlink to Dockerfile.ubuntu (docker/server/Dockerfile:1)"
  - "Dockerfile.ubuntu looks like a server build -> it only installs release deb packages from the network (docker/server/Dockerfile.ubuntu:36, :140)"
  - "ARG deb_location_url / single_binary_location_url -> optional overrides for CI binaries, not a repo-source build (docker/server/Dockerfile.ubuntu:46, :51)"
  - "ci/docker/* has many Dockerfiles -> CI and test images, not the production server (ci/docker)"
  - "9000, 8123 and 9009 are all exposed -> three ports, but Deployz routes one HTTP port (8123); native TCP clients on 9000 cannot go through the HTTPS ALB (docker/server/Dockerfile.ubuntu:165)"
  - "default user has no password and network access is off unless CLICKHOUSE_USER or CLICKHOUSE_PASSWORD is set -> auth is part of any deploy (docker/server/entrypoint.sh:154)"
openQuestions:
  - "Whether ClickHouse should be served at all as a Deployz app: judged out of scope, since the platform has no ClickHouse service and no persistent volume"
crossReview:
  - {field: dockerfile.reject, change: "added docker/bare/Dockerfile (FROM scratch, ADD root /; root comes from a local build via docker/bare/prepare) and the build-context reason for Dockerfile.ubuntu; accept stays [] because with the repo root as context the COPY sources are missing", evidence: "docker/server/Dockerfile.ubuntu:163 COPY entrypoint.sh /entrypoint.sh; docker/bare/Dockerfile:2 ADD root /; docker/bare/prepare:15"}
  - {field: outcome / dockerfile.accept, change: "none: judgement kept. Open point: if Deployz used docker/server as build context, Dockerfile.ubuntu would build (it downloads release packages at the pinned VERSION), but NOT_DEPLOYABLE still holds (ClickHouse unsupported, data on ephemeral disk)", evidence: "docker/server/Dockerfile.ubuntu:140; docker/server/Dockerfile.ubuntu:166"}
  - {field: healthPath, port, bindAllInterfaces, traps line refs, .gitmodules count, change: "none: checked against code (ping handler, 8123, listen 0.0.0.0, trap lines :46 :51 :154 correct, 159 submodules)", evidence: "src/Server/HTTPHandlerFactory.cpp:496; .gitmodules (159 [submodule] entries)"}
  - {field: all, change: verified, evidence: "18 citations checked"}
