healthPath:
  accept: ["/ping"]
  # /ping is a strict-path handler that returns "Ok." (HTTP 200) with no auth. The image entrypoint itself polls it.
  evidence:
    - {path: src/Server/HTTPHandlerFactory.cpp, line: 496, quote: "ping_handler->attachStrictPath(\"/ping\");"}
    - {path: src/Server/HTTPHandlerFactory.cpp, line: 172, quote: "constexpr auto ping_response_expression = \"Ok.\\n\";"}
    - {path: docker/server/entrypoint.sh, line: 193, quote: "URL=\"http://127.0.0.1:$HTTP_PORT/ping\""}
