    - {path: docker-compose.yml, line: 28, quote: "- SECRET"}
    - {path: backend/app/cmd/server.go, line: 615, quote: "return nil, fmt.Errorf(\"invalid remark42 url %s\", s.RemarkURL)"}
blockers:
  expected:
    - "Every comment is stored in BoltDB files under /srv/var on local disk; there is no PostgreSQL, MySQL or S3 store, and the image stops at start when /srv/var is missing"
  mustNot:
    - "The missing PostgreSQL or MySQL must not be reported as a setting to add: the application has no such driver"
    - "The rpc store type must not be read as a Deployz-supported database"
    - "docker-compose.yml (one service, one bind mount) must not be read as several services"
    - "The frontend build and the backend build in one Dockerfile must not be read as two services"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which database? (BoltDB files only)"
    - "Which port? (8080)"
    - "Is a worker needed? (no)"
traps:
  - "docker-init.sh exits with code 199 when /srv/var does not exist, so the image refuses to run without a mounted data directory (docker-init.sh:30)"
  - "store.type has only bolt and rpc; rpc is a remote store that needs a separate server (backend/app/cmd/server.go:186)"
  - "Pictures and avatars default to fs, so uploaded images are also local files (backend/app/cmd/server.go:196)"
  - "The server stops at start when REMARK_URL has no http:// or https:// prefix (backend/app/cmd/server.go:614)"
openQuestions: []
crossReview:
  - {field: outcome, change: 'none: BoltDB on local disk, no SQL or S3 option; same case as new-267', evidence: 'README.md:20; backend/app/cmd/server.go:186,188'}
  - {field: all, change: verified, evidence: 18 citations checked}
