id: new-305
repository: umputun/remark42
commit: 0e1ad2ad6cb6acb7e92057c1ef44af7485bea47a
summary: >
  Remark42 is a self-hosted comment engine (Go backend with the frontend files embedded or served from /srv/web). The
  root Dockerfile builds the frontend with pnpm and the backend with Go and runs `/srv/remark42 server` on port 8080.
  All comments, users and settings are kept in BoltDB files under /srv/var (store type bolt; the only other store type is
  rpc, a remote store that needs another server). Pictures and avatars default to the file system (fs). The README says
  "No external databases, everything embedded in a single data file". docker-init.sh stops the container with exit 199
  when /srv/var does not exist, because the state would be lost.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The core data (every comment and user) is in BoltDB files on local disk, and there is no PostgreSQL, MySQL or S3 store
    option. The rpc store type needs a separate custom server that Deployz does not provide. Fargate task storage is
    ephemeral and Deployz has no persistent volume, so the data would be lost at each restart. This is the durable local
    state case, as new-267 (Trilium).
