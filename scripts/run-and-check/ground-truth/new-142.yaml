blockers:
  expected: []
  mustNot:
    - "A static site must not be rejected as having no server: nginx serves it"
    - "The Node API and repl (src/node, `npm run node`, `npm run repl`) must not be treated as a service: they are a library and a REPL"
    - "Missing database, Redis, workers or S3 must not be reported: the app is client-side only"
    - "The unprivileged nginx image must not be reported as running as root or as needing port 80"
    - "The nightwatch UI tests and chromedriver must not be reported as runtime needs"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (8080)"
    - "Health path? (/)"
    - "Database, Redis, worker or storage? (none)"
    - "Which Dockerfile? (Dockerfile)"
traps:
  - "package.json start is `npx grunt dev` (webpack dev server on 8080) and the project also ships a Node library, so a rule-based runtime detector may pick a Node server and a start command; the image runs nginx (package.json:208, Dockerfile:30)"
  - "No EXPOSE, no nginx.conf and no CMD in the Dockerfile: the port 8080 comes from the nginx-unprivileged base image and the README, not from a repo file"
  - "The build stage uses `npm ci --ignore-scripts` and then `npm run postinstall` (Dockerfile:16,22): the grunt postinstall needs the full source, so a changed order breaks the build"
  - "The final stage is named `cyberchef` (Dockerfile:30): the stage name is the build target"
  - "Node >=24 is required (package.json engines): an older default Node base image fails the build"
  - "The webpack build is large and needs a big Node heap; package.json has a setheapsize script for 2048 MB (package.json:223)"
openQuestions:
  - "Port 8080 is not stated in any repo file except the README; the nginx-unprivileged default is image knowledge"
crossReview:
  - {field: outcome / dockerfile.target, change: "none: final stage is named cyberchef (Dockerfile:30), static build copied into nginx-unprivileged; DEPLOYABLE holds", evidence: "Dockerfile:25; Dockerfile:30; Dockerfile:34"}
  - {field: port, change: "none: no EXPOSE, nginx.conf or CMD in the Dockerfile; 8080 comes from the nginx-unprivileged base image and the README port mapping (also stated in openQuestions)", evidence: "README.md:54; README.md:63; Dockerfile:30"}
  - {field: healthPath, change: "none: index.html at / is a static file", evidence: "Gruntfile.js:152; Dockerfile:34"}
  - {field: all, change: verified, evidence: "12 citations checked"}
