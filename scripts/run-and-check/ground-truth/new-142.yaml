id: new-142
repository: gchq/CyberChef
commit: 11b86fecdb5d8f6244cf931e1f87cec887ec1f1f
summary: >
  CyberChef is a browser-only "cyber Swiss army knife" web app (webpack, grunt, Node 24). All data processing runs in
  the browser. There is no backend. The Dockerfile builds the static site with `npm run build` (grunt prod) and serves
  build/prod with the unprivileged nginx image, which listens on 8080 by default. There is no database, Redis, worker,
  storage or required environment variable.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    A static site built from the repo source and served by nginx is a deployable web app. The multi-stage Dockerfile
    builds with npm and copies build/prod into nginx-unprivileged. `/` returns the generated index.html with HTTP 200.
dockerfile:
  accept: [Dockerfile]
  reject: []
  target: cyberchef
  context: .
  evidence:
    - {path: Dockerfile, line: 7, quote: "FROM --platform=$BUILDPLATFORM node:24-alpine"}
    - {path: Dockerfile, line: 22, quote: "RUN npm run postinstall"}
    - {path: Dockerfile, line: 25, quote: "RUN npm run build"}
    - {path: Dockerfile, line: 30, quote: "FROM nginxinc/nginx-unprivileged:stable-alpine"}
    - {path: Dockerfile, line: 34, quote: "COPY --from=builder /app/build/prod /usr/share/nginx/html/"}
runtime: {accept: [static, nginx]}
port:
  accept: [8080]
  # The repo has no nginx.conf and no EXPOSE. nginx-unprivileged listens on 8080 by default, and the README maps -p 8080:8080.
  evidence:
    - {path: README.md, line: 54, quote: "docker run -it -p 8080:8080 cyberchef"}
    - {path: README.md, line: 63, quote: "docker run -it -p 8080:8080 ghcr.io/gchq/cyberchef:latest"}
    - {path: Dockerfile, line: 30, quote: "FROM nginxinc/nginx-unprivileged:stable-alpine"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: README.md, line: 54, quote: "docker run -it -p 8080:8080 cyberchef"}
startCommand:
  source: image
  accept: ["nginx -g daemon off;"]
  evidence:
    - {path: Dockerfile, line: 30, quote: "FROM nginxinc/nginx-unprivileged:stable-alpine"}
healthPath:
