id: new-46
repository: gethomepage/homepage
commit: 42a26dcdc6b231062d362c109c1ef9410f0271ff
summary: >-
  Homepage is a self-hosted dashboard (Next.js pages router, Node 24, pnpm). It is configured by YAML files in
  /app/config and has no database. It is self-hosted as the ghcr image or the repo Dockerfile, with a config volume.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >-
    Single container, no DB/Redis/worker. Needs HOMEPAGE_ALLOWED_HOSTS=* (or the public host) or every request
    with another Host header gets HTTP 400, and the ALB probe hits the task with Host=<task-ip>:3000, which cannot be
    listed in advance, so * is needed for the health check. Config is not durable (skeleton files are re-created at boot).
dockerfile:
  accept: [Dockerfile]
  reject: []
  target: null   # last stage is runner = app
  context: .
  evidence:
    - {path: Dockerfile, line: 4, quote: "FROM node:24-slim AS builder"}
    - {path: Dockerfile, line: 33, quote: "FROM node:24-alpine AS runner"}
    - {path: Dockerfile, line: 18, quote: "if [ \"$CI\" != \"true\" ]; then  corepack enable ... pnpm run build"}
runtime: {accept: [node]}
port:
