id: new-201
repository: gitlabhq/gitlabhq
commit: d7b9a6176ab4e279465ba3ee09922cde2b74de47
summary: >
  GitLab (the FOSS mirror) is a very large Ruby on Rails monolith with a Go front proxy (Workhorse). A running GitLab is
  a set of separate services: Puma (Rails), Workhorse, Sidekiq, Gitaly (Go gRPC Git storage), GitLab Shell (Git over
  SSH), PostgreSQL and Redis. The repository ships no Dockerfile that builds the application. The official container
  image gitlab/gitlab-ce is built from the separate Omnibus packaging project, and the repository docs say Omnibus
  packages are the recommended install.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    No Dockerfile builds GitLab from this repository: Dockerfile.assets only copies precompiled assets into a scratch
    image, qa/Dockerfile is the test-runner image, and docker-compose.yml pulls the published gitlab/gitlab-ce image.
    A working instance needs many cooperating services (Puma, Workhorse, Sidekiq, Gitaly, GitLab Shell) that talk over
    Unix sockets and gRPC, durable Git repository storage on disk (Gitaly), Git over SSH on a second protocol and port,
    plus PostgreSQL and Redis. This is outside one image with one HTTP port, and Gitaly repository data cannot live on
    ephemeral Fargate storage.
dockerfile:
  accept: []
  reject:
    - {path: Dockerfile.assets, reason: "scratch image that only copies precompiled public/assets; contains no application"}
    - {path: qa/Dockerfile, reason: "end-to-end test runner image (ENTRYPOINT bin/test) built on a GitLab CI build image"}
    - {path: qa/perf/ai/Dockerfile.ab, reason: "performance test tool image"}
    - {path: vendor/Dockerfile/Ruby.Dockerfile, reason: "GitLab template for users' Dockerfiles (all vendor/Dockerfile/*.Dockerfile are templates), not an image of GitLab"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile.assets, line: 2, quote: "FROM scratch"}
    - {path: Dockerfile.assets, line: 3, quote: "COPY public/assets /assets/"}
    - {path: qa/Dockerfile, line: 66, quote: "ENTRYPOINT [\"bin/test\"]"}
    - {path: docker-compose.yml, line: 2, quote: "image: gitlab/gitlab-ce:latest"}
    - {path: README.md, line: 58, quote: "The recommended way to install GitLab is with the [Omnibus packages]"}
runtime: {accept: [ruby]}
port:
  # Workhorse is the HTTP entry point; the Omnibus image serves nginx on 80 and 443 and SSH on 22.
  accept: [8181, 80]
  evidence:
    - {path: workhorse/cmd/gitlab-workhorse/main.go, line: 96, quote: "\"listenAddr\", \"localhost:8181\""}
    - {path: doc/install/docker/installation.md, line: 167, quote: "- '22:22'"}
bindAllInterfaces:
  value: false
  evidence:
    - {path: workhorse/cmd/gitlab-workhorse/main.go, line: 96, quote: "\"listenAddr\", \"localhost:8181\""}
    - {path: config/puma.rb.example, line: 34, quote: "bind 'unix:///home/git/gitlab/tmp/sockets/gitlab.socket'"}
startCommand:
  # No image exists in the repository. Components are started by Omnibus (runit) or lib/support/init.d/gitlab.
  source: explicit
  accept: []
  evidence:
    - {path: config/puma.rb.example, line: 34, quote: "bind 'unix:///home/git/gitlab/tmp/sockets/gitlab.socket'"}
healthPath:
  accept: ["/-/health", "/-/readiness", "/-/liveness"]
  evidence:
    - {path: config/routes.rb, line: 157, quote: "'/-/health' implemented by BasicHealthCheck middleware"}
    - {path: config/routes.rb, line: 159, quote: "get 'readiness' => 'health#readiness'"}
database:
