    - {path: Gemfile, line: 74, quote: "gem 'pg', '~> 1.6.1'"}
    - {path: config/initializers/1_postgresql_only.rb, line: 3, quote: "PostgreSQL is the only supported database from GitLab 12.1"}
migrations:
  mode: command
  accept: ["bundle exec rake db:migrate"]
  evidence: []
redis:
  status: required
  selectBy: {}
  evidence:
    - {path: Gemfile, line: 346, quote: "gem 'redis', '~> 5.4.1'"}
    - {path: config/resque.yml.example, line: 5, quote: "url: redis://localhost:6379"}
workers:
  status: independent
  commands: ["sidekiq"]
  evidence:
    - {path: Gemfile, line: 308, quote: "gem 'sidekiq', path: 'vendor/gems/sidekiq'"}
scheduledJobs:
  status: none
  items: []
  evidence: []
storage:
  # Git repositories are stored by Gitaly on its own disk; uploads, artifacts and LFS have object storage options.
  local: required
  paths: [/var/opt/gitlab, /home/git/repositories]
  s3: native
  s3SelectBy: {}
  evidence:
    - {path: doc/install/docker/installation.md, line: 106, quote: "| `$GITLAB_HOME/data`  | `/var/opt/gitlab`  | Stores application data."}
    - {path: config/gitlab.yml.example, line: 1450, quote: "gitaly_address: unix:/home/git/gitlab/tmp/sockets/private/gitaly.socket"}
    - {path: Gemfile, line: 686, quote: "gem 'gitaly', '~> 19.4.0'"}
env:
  required: []
  optional: []
  buildTime: []
  evidence: []
blockers:
  expected:
    - "No Dockerfile builds GitLab from the repository; the only container for the product is the Omnibus-built gitlab/gitlab-ce image referenced by docker-compose.yml"
    - "Gitaly stores Git repositories on durable local disk and is a separate gRPC service; Fargate task storage is ephemeral"
    - "GitLab is many processes (Puma, Workhorse, Sidekiq, Gitaly, GitLab Shell) that communicate over Unix sockets; this is not one web service from one image"
    - "Git over SSH (port 22) is a second, non-HTTP client protocol"
  mustNot:
    - "Dockerfile.assets, qa/Dockerfile and vendor/Dockerfile/* must not be treated as the application image"
    - "MySQL must not be offered: GitLab supports PostgreSQL only"
    - "Redis must not be called optional"
vendorQuestions:
  legitimate:
    - "Is GitLab being deployed as a self-managed Git forge? That needs the Omnibus or Helm distribution and durable Gitaly storage, which Deployz does not provide"
  unnecessary:
    - "Which Dockerfile? (none builds the application)"
    - "Which database engine? (PostgreSQL only)"
    - "Is Redis needed? (yes)"
traps:
  - "docker-compose.yml is two lines and pulls gitlab/gitlab-ce:latest instead of building (docker-compose.yml:2)"
  - "Dockerfile.assets looks like an application Dockerfile but only copies assets into FROM scratch (Dockerfile.assets:2)"
  - "vendor/Dockerfile/*.Dockerfile are templates GitLab offers to its users for new projects, not GitLab images"
  - "config/puma.rb.example binds a Unix socket, not a TCP port (config/puma.rb.example:34)"
  - "The Gemfile lists the gitaly gem, which is only the gRPC client; the Gitaly server is a separate Go program"
openQuestions:
  - "None that change the outcome; the repository ships no image and its docs direct users to Omnibus packages"
crossReview:
  - {field: outcome.accept, change: "[NOT_DEPLOYABLE] -> [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]: no application Dockerfile and a multi-service layout (Puma, Workhorse, Sidekiq, Gitaly) are CODE_CHANGE by policy; Gitaly durable repositories make it not deployable in practice (docs/ai-analysis.md fix classes; precedent new-131, new-139)", evidence: "packages/analysis/src/readiness-report.ts FIX_CLASSES"}
