blockers:
  expected:
    - "SQLite is the only database and its files must stay on durable local disk (pb_data); Deployz has only ephemeral container disk"
    - "The repo has no Dockerfile"
  mustNot:
    - "Redis must not be required or reported"
    - "A worker or scheduler process must not be required: the cron runs inside the server"
    - "Postgres or MySQL must not be provisioned: the app cannot use them"
    - "S3 must not be reported as a fix for the database: it covers uploaded files and backups only"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (8090 is the serve default)"
    - "Who runs migrations? (serve runs all migrations at start: apis/serve.go:67)"
    - "Which health path? (/api/health)"
    - "Is a worker needed? (no)"
traps:
  - "S3 settings -> S3 holds uploaded files and backups only; data.db and auxiliary.db stay on local disk (core/base.go:751, core/base.go:49)"
  - "Default listen address is 127.0.0.1:8090 -> a container needs serve --http=0.0.0.0:8090 or the load balancer cannot reach it (cmd/serve.go:35)"
  - "ui/dist is committed -> go build ./examples/base needs no npm step (ui/embed.go:11)"
  - ".goreleaser.yaml and the release workflow build binaries -> they are not a Dockerfile (.goreleaser.yaml:13)"
  - "/ has no route unless a pb_public directory exists -> do not use / as health path; the admin UI is at /_/ (examples/base/main.go:115)"
  - "Pure-Go SQLite (modernc) -> CGO is not needed, but the database is still a local file (go.mod:25)"
openQuestions:
  - "A vendor who accepts data loss on each restart, or who runs one task with an added durable volume outside Deployz, could run the app; Deployz offers no durable disk"
