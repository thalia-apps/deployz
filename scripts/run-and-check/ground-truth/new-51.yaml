id: new-51
repository: pocketbase/pocketbase
commit: 9d281ccaba65f2686eb7b0b614ccda72d1116a1b
summary: >-
  PocketBase is a Go backend in one binary (embedded SQLite, REST API, admin UI, auth, file storage). The repo has
  no Dockerfile. The app keeps all data in SQLite files in the local pb_data directory. SQLite is the only database
  and there is no Postgres or MySQL option. Uploaded files can go to S3, but the database cannot.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >-
    The database is SQLite in pb_data/data.db and pb_data/auxiliary.db. No other engine exists. Fargate disk is
    ephemeral, so every restart or redeploy loses all data and users. Settings, collections and accounts live in
    these files. S3 storage only covers uploaded files and backups. The repo also has no Dockerfile, so the vendor
    must write one. A deploy with an ephemeral disk would start but would not keep data, so it is not a valid answer.
