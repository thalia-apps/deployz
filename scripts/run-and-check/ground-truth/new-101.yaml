    - {path: backend/open_webui/config.py, line: 655, quote: "PGVECTOR_DB_URL = os.getenv('PGVECTOR_DB_URL', DATABASE_URL)"}
    - {path: backend/open_webui/storage/provider.py, line: 119, quote: "if S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY:"}
