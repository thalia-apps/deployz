id: new-101
repository: open-webui/open-webui
commit: 33c1978d5bad52a31df75ea55143025dfad18d16
summary: >
  Open WebUI, a self-hosted chat UI for LLMs. One image from the root Dockerfile: a Node stage builds the Svelte
  frontend, then a Python 3.12 stage runs FastAPI with uvicorn (bash start.sh). One web process serves UI and API on
  port 8080. By default it uses SQLite, a local Chroma vector store and local file uploads under /app/backend/data
  (all ephemeral on Fargate). It can use PostgreSQL (DATABASE_URL), pgvector in the same Postgres (VECTOR_DB=pgvector)
  and native S3 (STORAGE_PROVIDER=s3).
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, DEPLOYABLE]
  reason: >
    A Deployz deploy must set DATABASE_URL to Postgres, VECTOR_DB=pgvector and STORAGE_PROVIDER=s3, and must set
    WEBUI_SECRET_KEY. Without these the app uses SQLite, Chroma and local disk, which are ephemeral. All three
    alternatives are native, so no blocker. Redis is needed only for more than one task. The image is large
    (CPU torch and embedding models downloaded at build), which is a build-time cost, not a blocker.
dockerfile:
  accept: [Dockerfile]
  reject:
    - {path: docker-compose.yaml, reason: "compose file, not a Dockerfile; local run with an Ollama service"}
    - {path: docker-compose.data.yaml, reason: "compose override for a data volume, not a Dockerfile"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 59, quote: "FROM python:3.12-slim-trixie AS base"}
    - {path: Dockerfile, line: 28, quote: "FROM --platform=$BUILDPLATFORM node:22-alpine3.20 AS build"}
    - {path: Dockerfile, line: 234, quote: "CMD [ \"bash\", \"start.sh\"]"}
runtime: {accept: [python]}
port:
  accept: [8080]
  evidence:
    - {path: Dockerfile, line: 213, quote: "EXPOSE 8080"}
    - {path: Dockerfile, line: 78, quote: "PORT=8080"}
    - {path: backend/start.sh, line: 33, quote: "PORT=\"${PORT:-8080}\""}
bindAllInterfaces:
  value: true
  evidence:
