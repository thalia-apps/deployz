    - {path: backend/open_webui/config.py, line: 180, quote: "UPLOAD_DIR = DATA_DIR / 'uploads'"}
    - {path: backend/open_webui/config.py, line: 512, quote: "CHROMA_DATA_PATH = f'{DATA_DIR}/vector_db'"}
    - {path: backend/open_webui/config.py, line: 509, quote: "VECTOR_DB = os.getenv('VECTOR_DB', 'pgvector' if USE_SLIM else 'chroma')"}
