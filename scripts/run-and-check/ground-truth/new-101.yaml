  accept: ["bash start.sh", "uvicorn open_webui.main:app"]
healthPath:
  accept: ["/health"]
  # /health returns {"status": true} with no auth and no dependency check. /ready checks startup, DB and Redis (503 if not ready) and is also unauthenticated.
  evidence:
    - {path: backend/open_webui/main.py, line: 3075, quote: "@app.get('/health')"}
    - {path: backend/open_webui/main.py, line: 3080, quote: "@app.get('/ready')"}
    - {path: Dockerfile, line: 215, quote: "HEALTHCHECK CMD curl --silent --fail http://localhost:${PORT:-8080}/health"}
