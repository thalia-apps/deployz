  deployzEngine: postgres
  selectBy: {DATABASE_URL: "postgresql://user:pass@host:5432/db"}
  connectionVars: [DATABASE_URL, "DATABASE_TYPE/DATABASE_USER/DATABASE_PASSWORD/DATABASE_HOST/DATABASE_PORT/DATABASE_NAME"]
  evidence:
    - {path: backend/open_webui/env.py, line: 271, quote: "DATABASE_URL = os.getenv('DATABASE_URL', f'sqlite:///{DATA_DIR}/webui.db')"}
    - {path: backend/open_webui/env.py, line: 273, quote: "DATABASE_TYPE = os.getenv('DATABASE_TYPE')"}
    - {path: backend/open_webui/env.py, line: 300, quote: "if 'postgres://' in DATABASE_URL:"}
    - {path: backend/requirements.txt, line: 115, quote: "psycopg2-binary==2.9.12"}
migrations:
