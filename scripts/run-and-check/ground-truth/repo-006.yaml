    - {path: packages/prisma/schema.prisma, line: 23, quote: "url       = env(\"NEXT_PRIVATE_DATABASE_URL\")"}
    - {path: packages/prisma/schema.prisma, line: 24, quote: "directUrl = env(\"NEXT_PRIVATE_DIRECT_DATABASE_URL\")"}
migrations:
  mode: startup
  accept: ["npx prisma migrate deploy --schema ../../packages/prisma/schema.prisma"]
