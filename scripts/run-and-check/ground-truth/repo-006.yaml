id: repo-006
repository: documenso/documenso
commit: 3ec877a68bc423373220f9ee2fda3d93ba368680
summary: >
  Documenso is a TypeScript monorepo (Turborepo, npm workspaces) for document e-signing. The web app is apps/remix
  (React Router 7 on a Hono server). The repository root has no Dockerfile; docker/Dockerfile is the production image and
  builds apps/remix from source with the repository root as context. It listens on port 3000 and runs
  `sh start.sh`, which applies Prisma migrations and then starts `node build/server/main.js`. PostgreSQL is required
  (Prisma). Files are stored in the database by default (base64) and in S3 when NEXT_PUBLIC_UPLOAD_TRANSPORT=s3. Background
  jobs run in the same process (local provider). No Redis is needed by default.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    One web process from docker/Dockerfile (the recipe build override docker/Dockerfile is the right file: the root has no
    Dockerfile), port 3000, /api/health, migrations in the start script, PostgreSQL through NEXT_PRIVATE_DATABASE_URL, no
    Redis, no separate worker. Only settings are needed. A signing certificate (.p12) is optional at start but needed to
    sign documents.
