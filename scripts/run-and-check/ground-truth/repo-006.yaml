    - {path: apps/remix/app/routes/api+/health.ts, line: 47, quote: "{ status: overallStatus === 'error' ? 500 : 200 },"}
    - {path: render.yaml, line: 8, quote: "healthCheckPath: /api/health"}
database:
  status: required
  engines: [postgres]
  default: postgres
  deployzEngine: postgres
  selectBy: {}
  connectionVars: [NEXT_PRIVATE_DATABASE_URL, NEXT_PRIVATE_DIRECT_DATABASE_URL]
