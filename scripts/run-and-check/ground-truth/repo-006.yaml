    - {path: apps/remix/Dockerfile.pnpm, reason: "older app-level Dockerfile; not the production image built by docker/build.sh"}
    - {path: apps/remix/Dockerfile.bun, reason: "older app-level Dockerfile; not the production image built by docker/build.sh"}
    - {path: docker/development/Dockerfile.gotenberg, reason: "development helper for the Gotenberg converter, not the app"}
  target: null
  context: .
  evidence:
    - {path: docker/Dockerfile, line: 20, quote: "COPY . ."}
    - {path: docker/Dockerfile, line: 90, quote: "RUN turbo run build --filter=@documenso/remix..."}
    - {path: docker/Dockerfile, line: 141, quote: "CMD [\"sh\", \"start.sh\"]"}
    - {path: docker/Dockerfile.chromium, line: 2, quote: "FROM documenso/documenso:${TAG}"}
