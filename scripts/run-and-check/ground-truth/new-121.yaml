healthPath:
  accept: ["/api/health", "/healthz"]
  # Both handlers are HTTP middleware (m.Use) that run before routing and auth. /api/health also checks the database and
  # returns 503 when it fails or when the apiserver is not ready. /healthz always returns 200 "Ok". / redirects to /login for anonymous users.
  evidence:
    - {path: pkg/api/http_server.go, line: 726, quote: "m.Use(hs.healthzHandler)"}
    - {path: pkg/api/http_server.go, line: 727, quote: "m.Use(hs.apiHealthHandler)"}
    - {path: pkg/api/http_server.go, line: 773, quote: "// healthzHandler always return 200 - Ok if Grafana's web server is running"}
    - {path: pkg/api/http_server.go, line: 797, quote: "// apiHealthHandler will return ok if Grafana's web server is running and it"}
