env:
  required:
    - {name: GF_DATABASE_TYPE, secret: false, buildTime: false, note: "postgres or mysql; the default sqlite3 file is on ephemeral disk"}
    - {name: "GF_DATABASE_HOST / GF_DATABASE_NAME / GF_DATABASE_USER / GF_DATABASE_PASSWORD", secret: false, buildTime: false, note: "or GF_DATABASE_URL; host is host:port (the Postgres port defaults to 5432 when absent); the password is secret"}
    - {name: GF_DATABASE_SSL_MODE, secret: false, buildTime: false, note: "require (Postgres) or true (MySQL); default is disable and RDS forces TLS"}
    - {name: GF_SECURITY_ADMIN_PASSWORD, secret: true, buildTime: false, note: "default is the public value admin; set a strong value before the first start"}
    - {name: GF_SECURITY_SECRET_KEY, secret: true, buildTime: false, note: "default is a public repo value used to encrypt data source secrets in the database; set a random value"}
    - {name: GF_SERVER_ROOT_URL, secret: false, buildTime: false, note: "public HTTPS URL; used for links, OAuth redirects and alert links (default is http://localhost:3000/)"}
  optional: [GF_SECURITY_ADMIN_USER, GF_SERVER_DOMAIN, GF_SECURITY_COOKIE_SECURE, GF_USERS_ALLOW_SIGN_UP, GF_PLUGINS_PREINSTALL, GF_AUTH_ANONYMOUS_ENABLED, GF_SMTP_ENABLED, GF_REMOTE_CACHE_TYPE, GF_DATABASE_MAX_OPEN_CONN, GF_SERVER_SERVE_FROM_SUB_PATH]
