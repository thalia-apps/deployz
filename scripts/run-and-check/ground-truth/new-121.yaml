    - {path: conf/defaults.ini, line: 524, quote: "cookie_secure = false"}
blockers:
  expected: []
  mustNot:
    - "SQLite default must not block: PostgreSQL and MySQL are supported through GF_DATABASE_* env"
    - "Local data, plugin and log directories must not block: durable state is in the database; plugins are re-fetched or bundled"
    - "Redis must not be required: remote cache defaults to the database and HA engines are optional (multi-instance only)"
    - "Image renderer, Loki, Prometheus, Tempo and other Grafana stack products must not be required: they are optional separate products"
    - "Alerting, unified storage and search must not count as several services: they run in the one grafana process"
    - "The enterprise-src build context and the tgz-builder stage must not block: they are empty or unused in the default build"
    - "No S3 bucket is needed: S3 is only an optional external image store"
vendorQuestions:
  legitimate:
    - "Plugins: extra plugins install into local disk (GF_PLUGINS_PREINSTALL) at each start; the repo does not say which the user needs"
    - "Data sources: Grafana only shows data from user-supplied data sources (Prometheus, Loki and others); these are external and not part of the deploy"
  unnecessary:
    - "Which port? (3000 in the image and defaults)"
    - "Who runs migrations? (the server migrates the database at boot)"
    - "Is a worker or scheduler process needed? (all embedded)"
    - "Is Redis needed? (not for one task)"
    - "Health path? (/api/health or /healthz)"
traps:
  - "Dockerfile has many stages (tgz-builder, final-ubuntu, final-distroless) -> the last stage final-alpine is the default; no --target needed (Dockerfile:410)"
  - "tgz-builder stage copies a prebuilt tarball (GRAFANA_TGZ) -> only used when GO_SRC and JS_SRC are overridden; the default builds from source (Dockerfile:11-12, Dockerfile:126)"
  - "final-distroless stage has a different entrypoint without run.sh -> not the default image (Dockerfile:367, Dockerfile:405)"
  - "conf/defaults.ini shows type = sqlite3 and admin/admin -> defaults to override, not the real choice (conf/defaults.ini:240, conf/defaults.ini:488)"
  - "/ redirects to /login for anonymous users -> use /api/health or /healthz (pkg/api/http_server.go:726-727)"
  - "Dockerfile starts with syntax=docker/dockerfile:1.7-labs and COPY --parents -> needs BuildKit to pull the labs frontend (Dockerfile:1, Dockerfile:89)"
  - "Build is heavy: yarn monorepo build with NODE_OPTIONS max_old_space_size=8000 plus a full Go build -> needs a large builder (Dockerfile:30)"
  - "devenv, docker-compose and the many docs examples (Prometheus, Loki, MySQL, Redis) -> dev setups, not the production topology"
openQuestions:
  - "Whether the Deployz builder can run the BuildKit labs frontend and has enough memory and time for the 8 GB Node build plus Go build"
  - "Whether the user wants more than one task: that needs a shared database plus Redis for alert HA (ha_redis_address) and Live HA, and a per-task unified-search index"
crossReview:
  - {field: dockerfile.reject, change: "added packaging/docker/custom/Dockerfile (FROM grafana/grafana image, not from source)", evidence: "packaging/docker/custom/Dockerfile:3"}
  - {field: healthPath comment, change: "added that /api/health also returns 503 while the apiserver is not ready", evidence: "pkg/api/http_server.go:831-833"}
  - {field: env.required GF_DATABASE_* host note, change: "host without a port is valid: Postgres port defaults to 5432 (a GF_DATABASE_PORT key also exists)", evidence: "pkg/services/sqlstore/database_config.go:98-100,172"}
  - {field: traps (distroless), change: "line ref 367 -> 367 and 405 (the distroless stage and the stage with the other ENTRYPOINT)", evidence: "Dockerfile:367,405"}
  - {field: dockerfile / outcome, change: "none: root Dockerfile, no target, DEPLOYABLE(_WITH_CHANGES) confirmed. All COPY sources are in git; go.work modules are all under copied dirs; Makefile falls back when .git is missing; run.sh is the ENTRYPOINT of the last stage final-alpine", evidence: "Dockerfile:66-126,410; Makefile:22-24"}
  - {field: all, change: verified, evidence: "34 citations checked"}
