id: new-121
repository: grafana/grafana
commit: 27371d3787a546d0a53ea484aa5e34ccbcc074de
summary: >
  Grafana observability and dashboard platform (Go backend, React frontend, yarn monorepo). The root Dockerfile builds
  the full OSS server from source (a Node frontend stage and a Go backend stage) into one alpine image. One process
  serves HTTP on port 3000. Alerting, scheduling, unified storage and search run inside that process. The image
  defaults to SQLite on local disk, so a Deployz deploy must select PostgreSQL or MySQL.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    One image, one web process, one port. Needs GF_DATABASE_* env to use RDS (default is SQLite on ephemeral disk), with
    TLS set by GF_DATABASE_SSL_MODE, plus a public URL, a secret key and an admin password (defaults are public
    admin/admin). Migrations run at boot. Redis is not needed for one task. The image build is heavy (full yarn and Go
    build, 8 GB Node heap) and uses the BuildKit labs syntax, which is a build-risk and not a blocker.
