    - {path: api/db/connect.js, line: 68, quote: "cached.promise = mongoose.connect(MONGO_URI, opts).then((mongoose) => {"}
    - {path: .env.example, line: 30, quote: "MONGO_URI=mongodb://127.0.0.1:27017/LibreChat"}
