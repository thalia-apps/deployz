id: new-102
repository: danny-avila/LibreChat
commit: 8d3da9bbb220a0a96be9330a2e1cbd385fb786d5
summary: >
  LibreChat AI chat app (Node.js, Express, React client built by Vite). The root Dockerfile builds one app image
  that runs `npm run backend` on port 3080. The app needs MongoDB (MONGO_URI is mandatory; no SQL option).
  The upstream compose adds MongoDB, Meilisearch, pgvector and a RAG API as separate images.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The app throws at start if MONGO_URI is missing, and the only database is MongoDB, which Deployz does not support
    (RDS PostgreSQL or MySQL only). There is no PostgreSQL or MySQL mode. The image itself is buildable and the rest
    (Redis, S3, no worker) would fit, but the MongoDB requirement is a hard blocker.
dockerfile:
  accept: [Dockerfile]
  reject:
    - {path: Dockerfile.multi, reason: "multi-stage variant that builds packages and an API-only image; the root Dockerfile is the standard one"}
    - {path: .devcontainer/Dockerfile, reason: "development container"}
    - {path: otel/langfuse-fanout/Dockerfile, reason: "separate optional Langfuse fan-out sidecar, not the app"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 4, quote: "FROM node:24.22.1-alpine AS node"}
    - {path: Dockerfile, line: 64, quote: "npm run frontend"}
    - {path: Dockerfile, line: 83, quote: "CMD [\"npm\", \"run\", \"backend\"]"}
runtime: {accept: [node]}
port:
  accept: [3080]
  evidence:
    - {path: Dockerfile, line: 81, quote: "EXPOSE 3080"}
    - {path: api/server/index.js, line: 114, quote: "const port = isNaN(Number(PORT)) ? 3080 : Number(PORT);"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: Dockerfile, line: 82, quote: "ENV HOST=0.0.0.0"}
    - {path: api/server/index.js, line: 115, quote: "const host = HOST || 'localhost';"}
startCommand:
  source: image
  accept: ["npm run backend", "node api/server/index.js"]
healthPath:
  accept: ["/health", "/livez"]
  evidence:
    - {path: api/server/index.js, line: 358, quote: "app.get('/health', (_req, res) => res.status(200).send('OK'));"}
    - {path: api/server/index.js, line: 359, quote: "app.get('/livez', (_req, res) => res.status(200).send('OK'));"}
