blockers:
  expected:
    - "Notes live in a SQLite file (document.db) on durable local disk; Fargate storage is ephemeral and there is no PostgreSQL, MySQL or S3 option"
  mustNot:
    - "The missing PostgreSQL or Redis must not be reported as the blocker: the app does not use them"
    - "docker-compose.yml (one service, one bind mount) must not be read as several services"
    - "Dockerfile.alpine and Dockerfile.legacy must not be read as extra applications"
    - "The desktop, mobile and web-clipper apps in apps/ must not be read as services that must run together"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which database? (SQLite file only)"
    - "Is a worker or Redis needed? (no)"
    - "Which port? (8080)"
traps:
  - "apps/server/Dockerfile copies ./dist and ./start-docker.sh from the build context; dist is the output of pnpm build, so the image is not buildable from a plain clone (apps/server/Dockerfile:19)"
  - "The root has no Dockerfile; the image Dockerfiles are under apps/server (docker-compose.yml:7 uses the published image)"
  - "A volume mapping of the data directory in docker-compose.yml is a requirement, not a hint: without it every restart loses all notes (docker-compose.yml:20)"
  - "The image runs HEALTHCHECK through a script that reads a file in the data directory, not an HTTP path from the Dockerfile (apps/server/docker_healthcheck.sh)"
  - "The first visit asks for a password at /set-password; the instance is open until someone sets it (apps/server/src/routes/routes.ts:50)"
openQuestions: []
