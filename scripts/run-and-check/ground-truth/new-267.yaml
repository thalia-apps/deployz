id: new-267
repository: TriliumNext/Trilium
commit: 6c3f5d78ec6010044b324e810a2a9aa9040383bd
summary: >
  TriliumNext Trilium Notes is a pnpm monorepo for a hierarchical note-taking application (Node 24, Express). The web
  server is apps/server; the repository also holds a desktop app (Electron), a web clipper, a mobile client and other
  apps. The server keeps all notes in a SQLite file, document.db, in a data directory (TRILIUM_DATA_DIR,
  /home/node/trilium-data in the image) and also writes its config.ini, backups and a healthcheck file there. There is
  no PostgreSQL, MySQL or S3 option. apps/server/Dockerfile copies a pre-built ./dist folder; it does not build from
  source. The server listens on 8080 on all interfaces and asks the user to set a password on the first visit.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    Trilium stores every note in a SQLite database on local disk (document.db in the data directory), with backups and
    configuration next to it. Fargate task storage is ephemeral, and the application has no PostgreSQL, MySQL or S3
    storage option, so the durable local disk state cannot be moved to a Deployz service. This is the durable-local-state
    case, as new-200 (Garage). The Dockerfile also needs a pre-built dist folder, so it would need a change even if the
    storage were supported.
