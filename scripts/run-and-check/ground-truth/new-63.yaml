id: new-63
repository: strapi/strapi
commit: 37c8dd40f92e9973f74beb9a3e28f45f5109a887
summary: >
  Strapi framework monorepo (Node.js, Koa, yarn workspaces + Nx, packages/* plus examples/*). It is the framework source,
  not a deployable app. The repo has no Dockerfile at all; the README says Strapi ships no official Docker images and
  users build their own from their own project. The examples/* apps (getstarted, complex, kitchensink, empty) are private
  dev and test fixtures that default to SQLite. templates/website is a project template, not a service.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    No Dockerfile builds a production app from this repo. The only runnable apps are examples/* fixtures (private,
    SQLite default, "Migration test fixture" for examples/complex) that need the whole workspace built first. Deployz
    cannot deploy a framework library without an app. A Dockerfile written by the user for examples/getstarted would
    deploy a test fixture, not a product, so DEPLOYABLE_WITH_CHANGES is not accepted.
dockerfile:
  accept: []
  reject:
    - {path: docker-compose.dev.yml, reason: "compose file with a Postgres dev database, not a Dockerfile"}
    - {path: docker-compose.test.yml, reason: "compose file with a test database for the test suite, not a Dockerfile"}
    - {path: examples/complex/docker-compose.dev.yml, reason: "compose file with dev databases (postgres, mysql, mariadb) for a fixture app, not a Dockerfile"}
  target: null
  context: .
  evidence:
    - {path: README.md, line: 76, quote: "Strapi doesn't ship official Docker images, so you build your own from your project."}
    - {path: docker-compose.dev.yml, line: 5, quote: "image: postgres"}
runtime: {accept: [node]}
port:
  accept: [1337]
  evidence:
    - {path: packages/core/core/src/configuration/index.ts, line: 22, quote: "port: Number(process.env.PORT) || 1337,"}
    - {path: examples/getstarted/config/server.js, line: 7, quote: "port: env.int('PORT', 1337),"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: examples/getstarted/config/server.js, line: 6, quote: "host: env('HOST', '0.0.0.0'),"}
startCommand:
  source: explicit
  accept: ["strapi start", "yarn start"]
  evidence:
    - {path: examples/getstarted/package.json, line: 12, quote: "\"start\": \"strapi start\","}
healthPath:
  accept: ["/_health"]
  # The root package has no app; for a Strapi project the built-in /_health route returns 204 with no auth and no redirect.
  evidence:
    - {path: packages/core/core/src/services/server/index.ts, line: 40, quote: "router.all('/_health', healthCheck);"}
    - {path: packages/core/core/src/services/server/index.ts, line: 15, quote: "ctx.status = 204;"}
database:
  status: conditional
  engines: [sqlite, postgres, mysql, mariadb]
  default: sqlite
  deployzEngine: postgres
  selectBy: {DB: postgres}
  connectionVars: []
  # The fixture config has no env-driven connection: DB only selects a hardcoded profile (localhost, user strapi, password strapi).
  # A real Strapi project reads DATABASE_* from its own config; the fixture does not.
  evidence:
    - {path: examples/getstarted/config/database.js, line: 7, quote: "filename: '.tmp/data.db',"}
    - {path: examples/getstarted/config/database.js, line: 20, quote: "host: 'localhost',"}
    - {path: examples/getstarted/config/database.js, line: 56, quote: "connection: process.env.DB ? db[process.env.DB] || db.sqlite : db.sqlite,"}
migrations:
