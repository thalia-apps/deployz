blockers:
  expected:
    - "No Dockerfile in the repo, and no production application: this is the Strapi framework source (packages/*). Users create their own project and Dockerfile"
    - "The only apps are private example fixtures in examples/* (for example examples/complex is a migration test fixture) that need the full yarn workspace built first"
  mustNot:
    - "docker-compose.dev.yml and docker-compose.test.yml must not be taken as a production topology or as a Dockerfile"
    - "Postgres, MySQL and MariaDB support of the examples must not be reported as the blocker; the blocker is that there is no deployable app"
    - "The SQLite default in the fixtures must not be the stated reason for NOT_DEPLOYABLE"
vendorQuestions:
  legitimate:
    - "Which Strapi project should be deployed? The monorepo has no production app; a user project with its own Dockerfile is needed"
  unnecessary:
    - "Which port? (1337)"
    - "Health path? (/_health)"
    - "Which Dockerfile? (none exists)"
traps:
  - "examples/getstarted, examples/kitchensink, examples/empty have start scripts and look like apps -> private dev and test fixtures, not a product (examples/getstarted/package.json:4)"
  - "examples/complex describes itself as a migration test fixture, not an app (examples/complex/package.json:5)"
  - "docker-compose.dev.yml, docker-compose.test.yml, examples/complex/docker-compose.dev.yml -> databases for development and tests only, no Dockerfile (docker-compose.dev.yml:5)"
  - "README Docker section looks like Docker support -> it says Strapi ships no official image; a community CLI generates a Dockerfile for a user project (README.md:76)"
  - "templates/website -> a project template with data and types, no Dockerfile or deploy config"
openQuestions:
  - "A tool that generates a Dockerfile for examples/getstarted could deploy the fixture; this is judged out of scope because the fixture is not a product"
crossReview:
  - {field: database.connectionVars, change: "'DATABASE_* per fixture config' -> []: the fixture database.js has no env-driven connection; DB only picks a hardcoded profile with host localhost and user/password strapi, so even the fixture cannot reach RDS without a code change", evidence: "examples/getstarted/config/database.js:13-21,56"}
  - {field: database.engines, change: "added mysql: db = {mysql, sqlite, postgres, mariadb} (mysql profile at line 25)", evidence: "examples/getstarted/config/database.js:26,49"}
  - {field: env, change: "added APP_KEYS (default toBeModified1,toBeModified2) to optional with evidence", evidence: "examples/getstarted/config/server.js:13"}
  - {field: outcome.accept, change: "none: NOT_DEPLOYABLE alone kept; the repo is the framework source with no Dockerfile, the only apps are private fixtures (hardcoded localhost DB, test data); a generated Dockerfile for examples/getstarted would deploy a fixture, not a product", evidence: "README.md:76; examples/complex/package.json:5; examples/getstarted/package.json:4"}
  - {field: dockerfile, change: "none: git ls-files shows no Dockerfile or .dockerignore anywhere (only 3 compose files)", evidence: "git ls-files | grep -i dockerfile -> empty"}
  - {field: all, change: verified, evidence: "18 citations checked"}
