id: new-266
repository: ixartz/SaaS-Boilerplate
commit: e3952a7ed5b0ef172ac4363c4644b8c334d1094b
summary: >
  SaaS Boilerplate is a Next.js 16 SaaS starter (React 19, Tailwind, next-intl with English and French, Clerk hosted
  authentication with organizations, Drizzle ORM on PostgreSQL through DATABASE_URL, optional Sentry). The repository
  has no Dockerfile, compose file or Procfile. `npm run build` runs `drizzle-kit migrate` and then `next build`; `npm
  start` is `next start`. In development the app uses a local PGlite server. Migrations are SQL files in migrations/.
  No Redis, no worker, no file storage. The committed .env holds placeholder Clerk values and a local DATABASE_URL.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]
  reason: >
    The architecture fits Deployz (one Next.js web process on port 3000, PostgreSQL, no Redis, no worker, no local
    data, Clerk reached with keys). But the full file list has no Dockerfile, so the vendor must add one (npm ci, next
    build, next start). That is the "no Dockerfile" repository change, as new-244. The build also needs the Clerk
    publishable key and valid environment values, because next.config.ts imports the env validation.
