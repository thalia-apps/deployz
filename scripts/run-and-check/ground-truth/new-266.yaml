env:
  required:
    - {name: DATABASE_URL, secret: true, buildTime: false, note: "PostgreSQL URL; Deployz supplies it. The committed .env sets a 127.0.0.1 value, which fails if it reaches a build or start"}
    - {name: CLERK_SECRET_KEY, secret: true, buildTime: false, note: "Clerk server key from the vendor's Clerk application; the committed .env holds only a placeholder"}
    - {name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, secret: false, buildTime: true, note: "Clerk publishable key; NEXT_PUBLIC values are inlined into the client bundle by next build, and the committed .env holds a pk_test development key"}
  optional: [NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_LOGGING_LEVEL, NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_SENTRY_DISABLED, SENTRY_AUTH_TOKEN, SENTRY_ORGANIZATION, SENTRY_PROJECT, NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN, NEXT_PUBLIC_BETTER_STACK_INGESTING_HOST]
  buildTime: [NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY]
  evidence:
    - {path: src/libs/Env.ts, line: 6, quote: "CLERK_SECRET_KEY: z.string().min(1),"}
    - {path: src/libs/Env.ts, line: 11, quote: "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: z.string().min(1),"}
    - {path: next.config.ts, line: 5, quote: "import './src/libs/Env';"}
    - {path: .env, line: 15, quote: "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres"}
    - {path: .env, line: 27, quote: "CLERK_SECRET_KEY=your_clerk_secret_key"}
    - {path: .env.production, line: 10, quote: "NEXT_PUBLIC_APP_URL=https://react-saas.com"}
blockers:
  expected:
    - "No Dockerfile: the vendor must add a production Dockerfile (npm ci, next build, next start on port 3000) and a migration command"
  mustNot:
    - "Clerk must not block: it is a hosted authentication service reached with keys"
    - "PGlite (pglite-server, local.db) must not be read as local database state: it is the development database only"
    - "Sentry and Checkly must not block: both are optional"
    - "Redis, workers or S3 must not be required"
    - "Vercel or Neon recommendations must not block"
vendorQuestions:
  legitimate:
    - "Where do the Clerk keys come from? (the vendor's Clerk application: publishable key at build, secret key at runtime)"
  unnecessary:
    - "Which database? (PostgreSQL only)"
    - "Is a worker or Redis needed? (no)"
traps:
  - "`npm run build` runs `db:migrate` first; with the committed DATABASE_URL (127.0.0.1) the build waits and times out, as the comment in .env.production warns (package.json:13, .env.production:58)"
  - "A committed .env and .env.production hold placeholder and development values (a Clerk pk_test key, a local DATABASE_URL, https://react-saas.com); Next.js loads them at build and start unless real environment variables replace them (.env:9, :15)"
  - "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is inlined at build time; changing it at runtime does not change the client bundle"
  - "drizzle-kit and dotenv-cli are devDependencies, so a runtime migration command needs the dev dependencies in the image (package.json:89, :90)"
  - "package.json declares node >=24 in engines (package.json:5); an older base image can fail the build"
  - "The proxy runs Clerk only for sign-in, sign-up, dashboard and onboarding routes, so `/` works without a Clerk session (src/proxy.ts:28-31)"
openQuestions: []
