migrations:
  mode: command
  accept: ["npm run db:migrate", "drizzle-kit migrate", "npx drizzle-kit migrate", "dotenv -c -- drizzle-kit migrate"]
  # The build script runs the migration before next build, so a Dockerfile that runs next build needs a separate migration step; drizzle-kit is a devDependency.
  evidence:
    - {path: package.json, line: 28, quote: "\"db:migrate\": \"dotenv -c -- drizzle-kit migrate\","}
    - {path: package.json, line: 13, quote: "\"build\": \"run-s db:migrate build:next\","}
    - {path: drizzle.config.ts, line: 4, quote: "out: './migrations',"}
    - {path: README.md, line: 411, quote: "During the build process, database migrations are automatically executed, so there's no need to run them manually. However, you must define `DATABASE_URL` in your environment variables."}
