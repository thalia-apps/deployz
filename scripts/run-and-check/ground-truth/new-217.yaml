id: new-217
repository: openclaw/openclaw
commit: 11091f0bf62f93465c03aae211a3ae185cde88ae
summary: >
  OpenClaw is a personal AI assistant: a Node.js (TypeScript, pnpm) Gateway process that is the control plane for agent
  sessions, tools and chat channels (WhatsApp, Telegram, Slack, Discord, Teams, Signal, iMessage and 20+ more). It
  serves a Control UI and a WebSocket API on port 18789, a bridge on 18790 and an optional Teams webhook on 3978. The
  root Dockerfile builds the Gateway from source in several stages into one runtime image (node:24 trixie-slim, user
  node, tini). State is SQLite plus files in /home/node/.openclaw on a persistent local disk. PostgreSQL is a supported
  alternative for the five store families, but small SQLite anchor files, channel credentials, the workspace and
  config stay local by design. Only one active Gateway per state is supported.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    The Gateway is a single-owner, stateful, always-on personal assistant, not a stateless web service. Its state
    (shared state and agent SQLite databases, openclaw.json, channel credentials such as WhatsApp sessions, the agent
    workspace, plugin packages) lives in a state directory that the docs require on a persistent local filesystem, and
    they warn against network mounts. Fargate task storage is ephemeral and Deployz gives no EFS. The PostgreSQL option
    does not remove this: each PostgreSQL store keeps a local SQLite anchor that must match the server data ("Missing
    PostgreSQL anchor" is an error), and credentials, workspace and config stay local. Only one Gateway may use a
    store, so no stateless scale-out exists. The product also opens extra ports (18790 bridge, 3978 Teams webhook) and
    runs agent tools (shell, browser) on the host, which an MVP web service does not support. S3 does not replace the
    state directory.
