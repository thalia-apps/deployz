database:
  status: conditional
  engines: [sqlite, postgres]
  default: sqlite
  deployzEngine: postgres
  selectBy: {"database.engine in openclaw.json": postgres}
  connectionVars: [OPENCLAW_DATABASE_DSN]
  # SQLite is the default. PostgreSQL 16 to 18 is supported for the state, agent, workboard, logbook and team-reports families; extensions unaccent and pg_trgm (and pgvector for semantic memory search) must exist. The DSN is set by a SecretRef in openclaw.json, not by a plain env variable.
  evidence:
