    - {path: docs/gateway/postgresql.md, line: 14, quote: "PostgreSQL is a **supported alternative**"}
    - {path: docs/gateway/postgresql.md, line: 227, quote: "Use a qualified **PostgreSQL 16–18** runtime with **UTF8 server and client encoding**."}
    - {path: docs/gateway/postgresql.md, line: 294, quote: "connection: { source: \"env\", provider: \"default\", id: \"OPENCLAW_DATABASE_DSN\" },"}
