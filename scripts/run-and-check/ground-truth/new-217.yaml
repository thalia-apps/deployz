blockers:
  expected:
    - "State (SQLite databases, openclaw.json, channel credentials, workspace, plugin packages) needs a persistent local filesystem; Fargate disk is ephemeral and EFS is not provided"
    - "PostgreSQL does not remove the local disk need: local SQLite anchors must match the server data, and credentials, workspace and config stay local"
    - "One Gateway per state only; there is no shared-store scale-out or failover"
    - "The product is a personal assistant that runs agent tools on the host and keeps long-lived channel sessions (for example WhatsApp); the extra ports 18790 and 3978 are not served by a single HTTPS ALB listener"
  mustNot:
    - "Redis must not be reported: the repository does not use it"
    - "S3 must not be reported as a replacement for the state directory: there is no object-storage state backend"
    - "Dockerfiles under scripts/ (sandbox, e2e, install smoke) must not be treated as the application image"
    - "The port must not be reported as 3000 or 8080: the Gateway listens on 18789"
vendorQuestions:
  legitimate:
    - "Is this a single-person or single-team assistant that needs a persistent disk? Deployz cannot give it durable local storage"
    - "Which chat channels are needed? Some need long-lived sessions or inbound webhooks on extra ports"
  unnecessary:
    - "Which Dockerfile? (the root Dockerfile)"
    - "Is Redis needed? (no)"
    - "Which health path? (/healthz)"
traps:
  - "The README and docs say the Gateway runs on your own computer and that state lives on your hardware (README.md:20); it is not a hosted multi-tenant web app"
  - "docker-compose.yml also runs an openclaw-cli service that shares the Gateway network namespace; it is a helper, not a second app (docker-compose.yml:96)"
  - "docs show a PostgreSQL option, which can look like a full move to a managed database; anchors and client credentials still need local disk (docs/gateway/postgresql.md:61)"
  - "The Docker socket mount in docker-compose.yml is commented out and only needed for agent sandboxes (docker-compose.yml:55)"
  - "The build uses a large Node heap (OPENCLAW_DOCKER_BUILD_NODE_OPTIONS 8192 MB) and pnpm install, so the build is heavy (Dockerfile:13)"
  - "The Gateway answers /healthz as soon as the HTTP server is live; /readyz also waits for channel health, so a missing channel can keep it not ready"
openQuestions:
  - "Whether a stateless start with PostgreSQL and a fresh local state directory could work after each task restart was not tested; the docs treat a missing anchor as an error"
  - "Which channels open inbound connections was not checked per channel; only the Microsoft Teams port (3978) appears in the compose file"
crossReview:
  - {field: outcome.accept, change: "[NOT_DEPLOYABLE] -> [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]: durable state directory is CODE_CHANGE by policy (docs/ai-analysis.md fix classes; precedent new-131, new-139)", evidence: "packages/analysis/src/readiness-report.ts FIX_CLASSES"}
