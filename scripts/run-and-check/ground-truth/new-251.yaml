vendorQuestions:
  legitimate:
    - "Which production Dockerfile should Deployz use? The repo has none (Vercel project)"
    - "Is the app allowed to depend on the public hosted proxy movies-proxy.vercel.app, or must the vendor host the proxy (TMDB_API_KEY) too?"
  unnecessary:
    - "Which database? (none)"
    - "Which port? (3000)"
    - "Is TMDB_API_KEY needed? (only by proxy/)"
traps:
  - "proxy/ is a workspace package with its own package.json, .env.example and vercel.json; it is not the app (pnpm-workspace.yaml:6)"
  - "The proxy base URL is hard-coded twice; NUXT_PUBLIC_API_BASE_URL changes runtimeConfig but not app/composables/tmdb.ts (nuxt.config.ts:2, app/composables/tmdb.ts:6)"
  - "All dependencies, nuxt included, are devDependencies, so a production Dockerfile must install dev dependencies for the build (package.json:36)"
  - "nuxt is pinned to a nightly build (npm:nuxt-nightly@4.6.0-...) and devEngines asks for Node 24 and pnpm 11 (package.json:7, :12, :57)"
  - "The home page awaits TMDB data during SSR, so / fails when the outside proxy is down; /api has no outside call"
