id: new-251
repository: nuxt/movies
commit: 4d05739da559360e91214815d97dd2cfa37154ce
summary: >
  Nuxt Movies is a Nuxt 4 (nightly) server-rendered demo app that shows movies and TV data from The Movie Database (TMDB).
  `nuxt build` makes a Nitro server in .output/, and `node .output/server/index.mjs` serves it (port 3000 by default).
  The app fetches all data and images through a hosted proxy, https://movies-proxy.vercel.app, which is hard-coded in
  nuxt.config.ts and app/composables/tmdb.ts. The proxy source is in proxy/ (a separate Nitro app that needs
  TMDB_API_KEY) but the main app does not need it to run. No database, no Redis, no worker, no local files. The
  repository has no Dockerfile (Vercel project).
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]
  reason: >
    The app is one stateless Node web process on one HTTP port with no datastore, which fits Deployz. But the repository
    has no Dockerfile of any kind, so a repository change (a Dockerfile with pnpm install, nuxt build and node
    .output/server/index.mjs) is needed. The full file list proves that there is none, as new-156. The proxy/ app is
    optional because the main app calls the hosted proxy.
