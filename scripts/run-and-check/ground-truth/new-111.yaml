id: new-111
repository: Budibase/budibase
commit: ce4f62d5582a60de6e84dbf5077e28bde224f5e2
summary: >
  Budibase low-code platform (Node.js/TypeScript yarn + lerna monorepo, Svelte builder). Self-hosted topology is several
  processes: app server (packages/server), worker (packages/worker), CouchDB, Redis, MinIO/S3, nginx proxy and LiteLLM.
  Both service Dockerfiles copy CI-built packages/*/dist, and the all-in-one hosting/single/Dockerfile also copies dist and
  bundles CouchDB (base image), Redis, MinIO, nginx, LiteLLM and a Postgres server. CouchDB is the required primary
  store and is not supported by Deployz.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The core data store is CouchDB (apps, users, config, all app data), which Deployz does not provide. No Dockerfile builds
    from the repo archive alone: every image COPYs packages/server/dist and packages/worker/dist, which are .gitignored build
    output made by a yarn/lerna build outside Docker. The topology also needs two app images (app and worker) or the
    all-in-one image that runs CouchDB, MinIO, Redis and nginx in one container with a volume at /data.
dockerfile:
  accept: []
  reject:
    - {path: packages/server/Dockerfile, reason: "COPY packages/server/dist and packages/server/dist/yarn.lock; dist is CI build output (dist/ is gitignored), absent from the repo archive; also needs BUDIBASE_VERSION build arg"}
    - {path: packages/worker/Dockerfile, reason: "COPY packages/worker/dist; dist is CI build output; second application image, separate from the app server"}
    - {path: hosting/single/Dockerfile, reason: "all-in-one image: base budibase/database:2.1.0 (CouchDB) from a registry, copies server/worker dist and server/client/builder build output, bundles Redis, MinIO, nginx, LiteLLM and Postgres; VOLUME /data"}
    - {path: hosting/couchdb/Dockerfile, reason: "builds the CouchDB database image, not the app"}
    - {path: hosting/proxy/Dockerfile, reason: "nginx proxy image, a separate service"}
    - {path: hosting/tests/Dockerfile, reason: "test helper image"}
    - {path: packages/server/scripts/integrations/mssql/data/Dockerfile, reason: "test data image for MSSQL integration tests"}
  target: null
  context: .
  evidence:
    - {path: packages/server/Dockerfile, line: 64, quote: "COPY packages/server/dist/ dist/"}
    - {path: packages/server/Dockerfile, line: 51, quote: "COPY packages/server/dist/yarn.lock ."}
    - {path: packages/worker/Dockerfile, line: 49, quote: "COPY packages/worker/dist/ dist/"}
    - {path: hosting/single/Dockerfile, line: 31, quote: "COPY packages/server/dist packages/server/dist"}
    - {path: hosting/single/Dockerfile, line: 2, quote: "ARG BASEIMG=budibase/database:2.1.0"}
    - {path: hosting/single/Dockerfile, line: 147, quote: "VOLUME /data"}
    - {path: .gitignore, line: 53, quote: "dist/"}
    - {path: packages/server/package.json, line: 15, quote: "postbuild"}
runtime: {accept: [node]}
port:
  accept: [4001]
  evidence:
    - {path: packages/server/Dockerfile, line: 80, quote: "EXPOSE 4001"}
    - {path: packages/server/Dockerfile, line: 10, quote: "ENV PORT=4001"}
    - {path: hosting/single/runner.sh, line: 133, quote: "export APP_PORT=\"${APP_PORT:-4001}\""}
    - {path: packages/worker/src/index.ts, line: 143, quote: "parseInt(env.PORT || \"4002\")"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: packages/server/src/koa.ts, line: 111, quote: "server.listen(env.PORT || 0)"}
startCommand:
  source: image
  accept: ["./docker_run.sh", "node --enable-source-maps dist/index.js", "./runner.sh"]
healthPath:
  accept: ["/health"]
  # app server /health returns 200 only when startup state is ready (503 otherwise). Worker also has /health (200).
  evidence:
    - {path: packages/server/src/api/index.ts, line: 23, quote: "router.get(\"/health\", async ctx => {"}
    - {path: packages/server/src/api/index.ts, line: 30, quote: "if (getState() !== \"ready\") {"}
    - {path: packages/worker/src/api/index.ts, line: 169, quote: "router.get(\"/health\", ctx => (ctx.status = 200))"}
database:
  status: required
  engines: [couchdb]
  default: couchdb
  deployzEngine: null
  selectBy: {}
  connectionVars: [COUCH_DB_URL, COUCH_DB_SQL_URL]
  evidence:
