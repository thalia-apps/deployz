id: new-113
repository: frappe/erpnext
commit: 821ca1d87e81751216f1f6fd5ed89935b1677f98
summary: >
  ERPNext is a Python app (a Frappe Framework app), not a standalone web service. It has no HTTP server, no
  production Dockerfile and no start command of its own: it must be installed with `bench` into a bench that holds
  the separate Frappe framework (a different repository, develop branch, >=17). A running site needs MariaDB (or
  experimental PostgreSQL), several Redis instances, a web process, background worker processes, a scheduler and a
  socket.io process. The only Dockerfile is .oss-scanner/Dockerfile, a security-scanner fixture that bakes MariaDB,
  Redis and a test site into one image and has no CMD. Production images are built in the separate frappe_docker repo.
outcome:
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    NOT_DEPLOYABLE as the repo stands: no production Dockerfile builds from the repo alone, the framework and the
    process topology (web, workers, scheduler, socket.io, bench config) come from other repositories, and the only
    Dockerfile is a scanner fixture that embeds MariaDB and Redis. DEPLOYABLE_WITH_CHANGES is a judgement call: a user
    could write a new Dockerfile (bench init + get-app) and run web, worker and scheduler commands from one image with
    managed DB and Redis, but that is a new image design, not a small change.
dockerfile:
  accept: []
  reject:
    - {path: .oss-scanner/Dockerfile, reason: "scanner fixture: installs MariaDB and Redis inside the image, creates test_site with fixed passwords at build time, builds frappe develop with bench init, and has no CMD or ENTRYPOINT; not a production image"}
  target: null
  context: .
  evidence:
    - {path: .oss-scanner/Dockerfile, line: 1, quote: "# ERPNext for OSS Scanner."}
    - {path: .oss-scanner/Dockerfile, line: 5, quote: "# MariaDB and Redis run inside this one container"}
    - {path: .oss-scanner/Dockerfile, line: 24, quote: "mariadb-server mariadb-client libmariadb-dev redis-server"}
    - {path: .oss-scanner/Dockerfile, line: 82, quote: "bench init --skip-assets --frappe-branch"}
    - {path: .oss-scanner/Dockerfile, line: 110, quote: "bench new-site test_site --db-root-password root --admin-password admin"}
    - {path: README.md, line: 81, quote: "See [Frappe Docker Documentation](https://github.com/frappe/frappe_docker)"}
    - {path: .github/workflows/docker-release.yml, line: 18, quote: "repos/frappe/frappe_docker/actions/workflows/core-build-stable.yml/dispatches"}
runtime: {accept: [python]}
port:
  accept: [8000]
  evidence:
