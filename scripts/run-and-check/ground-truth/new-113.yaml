  items: [cron every 15 minutes, hourly, hourly_maintenance, daily_maintenance]
  evidence:
    - {path: erpnext/hooks.py, line: 516, quote: "\"0/15 * * * *\": ["}
    - {path: erpnext/hooks.py, line: 532, quote: "\"hourly_maintenance\": ["}
storage:
  local: required
  paths: [sites/<site>/public/files, sites/<site>/private/files, sites/<site>/private/backups]
  s3: none
  s3SelectBy: {}
  evidence:
    - {path: erpnext/edi/doctype/code_list/code_list_import.py, line: 16, quote: "LOCAL_FILE_PREFIXES = (\"/files/\", \"/private/files/\")"}
env:
  required:
    - {name: "db_host / db_name / db_password", secret: true, buildTime: false, note: "kept in the bench site_config.json, written by bench new-site; not env vars of this repo"}
    - {name: "Administrator password", secret: true, buildTime: false, note: "set with bench new-site --admin-password"}
    - {name: host_name, secret: false, buildTime: false, note: "public site URL / site name; Frappe selects the site from the Host header"}
  optional: []
  buildTime: []
  evidence:
    - {path: .oss-scanner/Dockerfile, line: 110, quote: "--admin-password admin"}
blockers:
  expected:
    - "No production Dockerfile in the repo builds the app: the only one is the .oss-scanner scanner fixture"
    - "ERPNext needs the Frappe framework from another repository (frappe >=17.0.0-dev) installed with bench; this repo alone does not run"
    - "A site needs a web process, a scheduler, background workers (queues short/default/long) and a socket.io process; none has a start command here"
    - "Site files (public, private, backups) are on local disk under sites/; the repo gives no S3 option"
  mustNot:
    - "MariaDB must not be reported as a missing service: Frappe also supports PostgreSQL, which Deployz offers (PostgreSQL 16; compatibility is a risk to note, not the blocker). MySQL 8 is not a Frappe database, so it is not the right managed engine"
    - "node/yarn in package.json must not be reported as a second runtime image: the banking UI and assets are built at bench build time"
    - "docker-release.yml must not be treated as a build recipe for this repo: it only dispatches a build in frappe_docker"
vendorQuestions:
  legitimate:
    - "Which Frappe framework version and image will run this app (frappe >=17 develop)? The repo does not pin one"
    - "Is MariaDB or PostgreSQL the target database? PostgreSQL support is tested only on request (server-tests-postgres is label-triggered)"
  unnecessary:
    - "Which port? (8000)"
    - "Which language runtime? (Python 3.14)"
traps:
  - ".oss-scanner/Dockerfile looks like the app image -> scanner fixture with MariaDB, Redis and a test site inside, no CMD (.oss-scanner/Dockerfile:1-8)"
  - "README Docker section -> points to the frappe_docker repo with compose files, not a Dockerfile in this repo (README.md:81)"
  - "pyproject.toml builds an ERPNext wheel (flit) -> a library for bench, not a runnable server (pyproject.toml:34-36)"
  - "package.json has dev and build scripts -> they build the banking UI only, not the app (package.json:14-18)"
  - "docker-release.yml -> only dispatches a build in frappe/frappe_docker (docker-release.yml:18)"
openQuestions:
  - "Whether a user-written Dockerfile based on frappe_docker could run on Deployz with one image and different commands for web, worker, scheduler and socket.io; the nginx front and bench config make this uncertain"
crossReview:
  - {field: database.deployzEngine, change: "mysql -> postgres; Frappe supports MariaDB and PostgreSQL only, MySQL 8 is not a Frappe database; CI runs a Postgres site config (db_type postgres). Added the evidence item and updated blockers.mustNot", evidence: ".github/helper/site_config_postgres.json:6; .github/workflows/server-tests-postgres.yml:103"}
  - {field: storage.local, change: "ephemeral -> required; uploaded files under sites/<site>/public and private are durable user data with no S3 option in the repo, which the writer already listed as a blocker (ephemeral was inconsistent). Replaced the unrelated hooks.py:1 evidence", evidence: "erpnext/edi/doctype/code_list/code_list_import.py:16"}
  - {field: redis.evidence, change: "replaced a weak citation (install.sh:294 only comments a Procfile line out) with the redis_cache/redis_queue site config keys", evidence: ".github/helper/install.sh:386"}
  - {field: dockerfile.accept, change: "none: .oss-scanner/Dockerfile does build from the repo as context, but it is a scanner fixture (MariaDB and Redis inside the image, test_site with fixed passwords, no CMD or ENTRYPOINT), so [] stays. Unresolved: an analyser may pick it as the only Dockerfile", evidence: ".oss-scanner/Dockerfile:5,75,110 (no CMD/ENTRYPOINT in the file)"}
  - {field: all, change: verified, evidence: "26 citations checked"}
