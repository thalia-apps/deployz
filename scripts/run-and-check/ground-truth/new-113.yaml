  status: independent
  commands: ["bench worker --queue short,default,long", "bench schedule", "node socketio server"]
  evidence:
    - {path: erpnext/accounts/doctype/accounting_dimension/accounting_dimension.py, line: 128, quote: "frappe.enqueue(delete_accounting_dimension, doc=self, queue=\"long\""}
    - {path: erpnext/hooks.py, line: 514, quote: "scheduler_events = {"}
scheduledJobs:
