    - {path: .oss-scanner/Dockerfile, line: 110, quote: "--install-app erpnext"}
redis:
  status: required
  selectBy: {}
  evidence:
    - {path: .oss-scanner/Dockerfile, line: 5, quote: "# MariaDB and Redis run inside this one container"}
    - {path: .github/helper/install.sh, line: 386, quote: "for key in (\"redis_cache\", \"redis_queue\"):"}
    - {path: erpnext/accounts/doctype/accounting_dimension/accounting_dimension.py, line: 120, quote: "frappe.enqueue("}
