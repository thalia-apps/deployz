blockers:
  expected:
    - "Two application images from this repo (backend/docker/Dockerfile and frontend/docker/Dockerfile) behind a path-routing proxy (docker/Caddyfile); Deployz runs one image with one port"
  mustNot:
    - "PostgreSQL must not be reported as missing: HD_DATABASE_TYPE=postgres is supported"
    - "Redis must not be required"
    - "The Caddy proxy is not a third app image to build, but it shows the path routing that one Deployz service cannot give"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which database? (postgres is supported)"
    - "Which Dockerfile? (both are needed, which is the blocker)"
traps:
  - "Each Dockerfile builds a complete-looking production image from the repo root; picking one gives a half product (backend/docker/Dockerfile:44, frontend/docker/Dockerfile:29)"
  - "docker/.env is mounted into the backend as a file in compose (docker/docker-compose.yml:8); the same values can be environment variables"
  - "backend/.env and frontend/.env are development files, not production configuration"
  - "The S3 media backend needs static access keys and an endpoint URL, so task-role S3 does not work without keys (backend/src/config/media.config.ts:40)"
  - "The backend binds 127.0.0.1 by default (backend/src/config/app.config.ts:66)"
  - "The version is 2.0.0-alpha.3 (package.json:3); the docs/ folder is a documentation site, not the app"
