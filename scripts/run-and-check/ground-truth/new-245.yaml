id: new-245
repository: hedgedoc/hedgedoc
commit: 3e60fa14883333510292fe5553ff4adcf924259e
summary: >
  HedgeDoc 2 (2.0.0-alpha.3) is a pnpm and turbo monorepo for a collaborative Markdown editor. It has two application
  images: backend/docker/Dockerfile builds the NestJS (Fastify) API and realtime server on port 3000, and
  frontend/docker/Dockerfile builds a separate Next.js standalone server on port 3001. docker/docker-compose.yml runs
  both with PostgreSQL and a Caddy proxy that sends /api, /realtime, /public, /uploads and /apidoc to the backend and
  everything else to the frontend. The backend supports SQLite, PostgreSQL and MariaDB (HD_DATABASE_TYPE), runs Knex
  migrations at start and stores uploads on the filesystem by default (S3, Azure, imgur and WebDAV are options).
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The product needs two application images built from this repository (backend and frontend) and a path-routing
    proxy that puts both behind one origin. Deployz runs one image per deployment with one ALB port, and a worker
    cannot have a different Dockerfile or a URL. Neither image alone is the product: the backend serves no UI and the
    frontend has no API. This is the several-application-images case, as new-82.
dockerfile:
  accept: []
  reject:
    - {path: backend/docker/Dockerfile, reason: "builds only the backend API and realtime server; the UI is in a second image"}
    - {path: frontend/docker/Dockerfile, reason: "builds only the Next.js frontend; it needs the backend at /api and /realtime on the same origin"}
  target: null
  context: .
  evidence:
    - {path: backend/docker/Dockerfile, line: 44, quote: "RUN pnpm run build --filter=@hedgedoc/backend --cache=local:,remote: --no-daemon"}
    - {path: frontend/docker/Dockerfile, line: 29, quote: "RUN pnpm run build --filter=@hedgedoc/frontend --no-cache --no-daemon"}
    - {path: docker/docker-compose.yml, line: 6, quote: "image: ghcr.io/hedgedoc/hedgedoc/backend:develop"}
    - {path: docker/docker-compose.yml, line: 12, quote: "image: ghcr.io/hedgedoc/hedgedoc/frontend:develop"}
