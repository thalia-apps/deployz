blockers:
  expected: []
  mustNot:
    - "Redis must not be required: cache, channel layer and task queue use PostgreSQL"
    - "A second worker container must not be required: allinone runs server and worker in one process"
    - "The Docker socket mount in compose.yml must not block: it only lets the worker manage outpost containers; the embedded outpost needs no socket"
    - "Local /data must not block: it holds uploaded icons and backgrounds, and S3 is a native option"
    - "The outpost Dockerfiles (ldap, proxy, rac, radius) must not be read as extra required services"
    - "The distroless stage must not be chosen as the target: the default last stage final is right"
vendorQuestions:
  legitimate:
    - "Which admin password to set at first start (AUTHENTIK_BOOTSTRAP_PASSWORD_HASH), or whether to use the first-visit setup page"
    - "Public URL to set as AUTHENTIK_WEB__BASE_URL when the bootstrap variables are used"
  unnecessary:
    - "Which port? (9000 in default.yml; 9443 is a self-signed TLS port)"
    - "Who runs migrations? (boot runs lifecycle.migrate at every start)"
    - "Is Redis needed? (no)"
    - "Which Dockerfile or target? (lifecycle/container/Dockerfile, last stage)"
    - "Health path? (/-/health/live/)"
traps:
  - "The image has ENTRYPOINT but no CMD -> `ak` with no argument runs a Django manage command and exits; set `allinone` (lifecycle/ak.py:25, lifecycle/container/Dockerfile:368)"
  - "compose.yml and the ECS template list server and worker as two services -> allinone is the one-service form (src/main.rs:57, lifecycle/container/compose.yml:22); `server` is also valid, but only with a worker service (authentik/blueprints/apps.py:127)"
  - "No EXPOSE in the Dockerfile -> the port is 9000 from default.yml:38, not 80 or 8000; 8000 is the internal gunicorn socket address (src/server/mod.rs:172)"
  - "`/` returns a redirect to the login flow -> use /-/health/live/ (src/server/core.rs:282)"
  - "The distroless stage is defined before final -> final is last, so no --target is needed (lifecycle/container/Dockerfile:355)"
  - "Docs say the SSL mode default is verify-ca, default.yml says disable -> set AUTHENTIK_POSTGRESQL__SSLMODE=require for RDS (default.yml:24, lifecycle/aws/template.yaml:679)"
  - "The ECS template mounts EFS on /data and /data/media -> only for uploads; S3 is the Deployz-compatible choice (lifecycle/aws/template.yaml:708)"
  - "The build compiles Rust and the web UI in one Dockerfile and needs BuildKit (RUN --mount) -> a long, memory-heavy build (lifecycle/container/Dockerfile:142)"
  - "With AUTHENTIK_BOOTSTRAP_* set the instance counts as set up, and then AUTHENTIK_WEB__BASE_URL is required or startup fails (authentik/core/setup/signals.py:58)"
  - "Without bootstrap variables the first visitor to the initial-setup flow creates the admin account (authentik/core/setup/views.py:40)"
openQuestions:
  - "Whether allinone is supported for production: the docs and the ECS template use two services, and the Makefile uses allinone for development (Makefile:129). The code runs both in one process."
  - "Not run: the whole analysis comes from reading the code at this commit"
