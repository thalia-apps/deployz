startCommand:
  source: explicit
  # `server` is accepted for the vendor topology (server main command + one `worker` service). `server` with no
  # worker service is a broken deployment: only the worker applies blueprints (the default flows).
  accept: ["allinone", "server"]
  evidence:
    - {path: lifecycle/container/Dockerfile, line: 368, quote: "ENTRYPOINT [ \"dumb-init\", \"--\", \"ak\" ]"}
    - {path: lifecycle/ak.py, line: 25, quote: "argv = [\"manage\", \"--\", *args]"}
    - {path: lifecycle/ak.py, line: 13, quote: "COMMANDS = (\"allinone\", \"server\", \"worker\""}
    - {path: src/main.rs, line: 57, quote: "/// Run both the authentik server and worker."}
    - {path: src/main.rs, line: 146, quote: "let workers = worker::start(worker::Cli::default(), &mut tasks)?;"}
    - {path: lifecycle/container/compose.yml, line: 22, quote: "command: server"}
    - {path: lifecycle/aws/template.yaml, line: 669, quote: "- server"}
    - {path: src/main.rs, line: 77, quote: "Command::Server(_) => {"}
healthPath:
  accept: ["/-/health/live/", "/-/health/ready/"]
  # /-/health/live/ returns 200 from the server and, in allinone mode, also checks that the worker runs. It does not
  # touch the database. /-/health/ready/ also runs SELECT 1 on the database. `/` redirects to the login flow, so not used.
  evidence:
    - {path: src/server/core.rs, line: 282, quote: ".route(\"/health/live/\", any(health_live))"}
    - {path: src/server/core.rs, line: 281, quote: ".route(\"/health/ready/\", any(health_ready))"}
    - {path: src/server/core.rs, line: 299, quote: ".nest(\"/-/\", monitoring_router.clone())"}
    - {path: src/server/core.rs, line: 194, quote: "SELECT 1"}
    - {path: authentik/root/middleware.py, line: 43, quote: "if request.path == \"/-/health/live/\":"}
    - {path: lifecycle/aws/template.yaml, line: 1165, quote: "HealthCheckPath: /-/health/live/"}
