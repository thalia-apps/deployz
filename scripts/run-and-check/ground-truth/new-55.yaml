workers:
  status: optional-independent
  commands: ["worker"]
  # The vendor topology is two services (server + worker). allinone runs both in the one container, so no
  # separate Deployz worker service is needed. With `server` as main command, one `worker` service is REQUIRED:
  # the server runs migrations itself (boot::bootstrap) and answers /-/health/live/ without a worker, but only the
  # worker applies blueprints (default flows and brand), runs schedules and runs the outpost controller.
  # The comparator scores optional-independent as zero worker services, so a correct server + worker answer
  # gets a workers mismatch there. Keep this limit in mind when you read the score.
  evidence:
    - {path: lifecycle/container/compose.yml, line: 44, quote: "command: worker"}
    - {path: lifecycle/aws/template.yaml, line: 899, quote: "- worker"}
    - {path: src/main.rs, line: 146, quote: "let workers = worker::start(worker::Cli::default(), &mut tasks)?;"}
    - {path: authentik/lib/default.yml, line: 174, quote: "processes: 1"}
    - {path: authentik/blueprints/apps.py, line: 127, quote: "send_on_startup=True,"}
    - {path: authentik/blueprints/v1/tasks.py, line: 148, quote: "def blueprints_discovery"}
    - {path: authentik/outposts/tasks.py, line: 106, quote: "def outpost_controller"}
scheduledJobs:
  status: embedded
  items: [scheduled tasks and blueprint, outpost, token and cache housekeeping run by the task worker]
  evidence:
    - {path: authentik/lib/default.yml, line: 181, quote: "scheduler_interval: \"seconds=60\""}
