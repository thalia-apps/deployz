    - {path: lifecycle/container/Dockerfile, line: 303, quote: "FROM scratch AS distroless"}
    - {path: lifecycle/container/Dockerfile, line: 142, quote: "cargo build --package authentik"}
    - {path: lifecycle/container/Dockerfile, line: 46, quote: "RUN pnpm run build"}
