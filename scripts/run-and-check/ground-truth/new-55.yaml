  - {field: workers, change: "status kept optional-independent (comparator expects zero worker services for it; independent would fail the allinone answer). Comment and evidence now state that a worker is required with server, because blueprints, schedules and the outpost controller run only as worker tasks. Server health /-/health/live/ does not depend on the worker in server mode", evidence: "authentik/blueprints/apps.py:127; authentik/blueprints/v1/tasks.py:148; authentik/outposts/tasks.py:106; src/server/core.rs:255"}
  - {field: summary / traps / openQuestions, change: "added the server + worker form and its limit", evidence: "see startCommand and workers"}
  - {field: dockerfile, change: "none: every COPY and bind-mount source exists in git (package.json, web, website, packages, tests/container, schemas, locale, blueprints, lifecycle, krb5.conf, .cargo, scripts/node); the last stage final is the default target", evidence: "lifecycle/container/Dockerfile:29-44,123-125,271-288,356"}
  - {field: port / healthPath / database / redis / storage / env, change: "none: re-read from code and confirmed (9000, /-/health/live/ in src/server/core.rs:282, Postgres only, no Redis, S3 native, secret key check in wait_for_db.py:47)", evidence: "authentik/lib/default.yml:38; src/server/core.rs:282; lifecycle/wait_for_db.py:47"}
  - {field: all, change: verified, evidence: "57 citations checked"}
