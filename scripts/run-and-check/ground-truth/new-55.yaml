env:
  required:
    - {name: AUTHENTIK_SECRET_KEY, secret: true, buildTime: false, note: "cookie signing key; startup exits when it is empty; use a long random value"}
    - {name: AUTHENTIK_POSTGRESQL__HOST, secret: false, buildTime: false, note: "default is localhost; Deployz supplies the database host"}
    - {name: AUTHENTIK_POSTGRESQL__PASSWORD, secret: true, buildTime: false, note: "default is env POSTGRES_PASSWORD; user and database name default to authentik"}
    - {name: AUTHENTIK_POSTGRESQL__SSLMODE, secret: false, buildTime: false, note: "set to require for RDS; the default.yml default is disable and the docs say verify-ca"}
    - {name: AUTHENTIK_STORAGE__BACKEND, secret: false, buildTime: false, note: "s3 for durable uploads; default file writes to ephemeral /data"}
    - {name: AUTHENTIK_STORAGE__S3__BUCKET_NAME, secret: false, buildTime: false, note: "the S3 bucket; access key and secret key are optional, the AWS SDK default chain (task role) is used"}
    - {name: AUTHENTIK_STORAGE__S3__REGION, secret: false, buildTime: false, note: "bucket region"}
