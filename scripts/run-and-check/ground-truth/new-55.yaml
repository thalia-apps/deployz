    - {path: lifecycle/container/rac.Dockerfile, reason: "RAC outpost image, not the core application"}
    - {path: lifecycle/container/radius.Dockerfile, reason: "RADIUS outpost image, not the core application"}
    - {path: website/Dockerfile, reason: "documentation site image"}
