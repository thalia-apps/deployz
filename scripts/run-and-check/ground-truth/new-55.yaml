id: new-55
repository: goauthentik/authentik
commit: d871a4723352453c77910957f586e76549c6e84c
summary: >
  authentik identity provider (Python/Django core, Rust server binary, web UI built with pnpm). The repo has one
  production Dockerfile, lifecycle/container/Dockerfile, that builds everything from source. The image has an
  ENTRYPOINT (`ak`) and no CMD, so the vendor must give a command. Docker Compose and the repo ECS template run
  two services (`server` and `worker`). The `allinone` command runs both in one process and fits one Deployz
  service. `server` as main command with one `worker` service also works. `server` alone does not: only the
  worker applies the blueprints that create the default login flows. PostgreSQL is the only database. There is no Redis: cache, channels and task queue use PostgreSQL.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, DEPLOYABLE]
  reason: >
    Needs a start command (`allinone`), because the image has no CMD. Needs AUTHENTIK_SECRET_KEY and the
    AUTHENTIK_POSTGRESQL__* values. For durable uploads, switch the file storage to S3 with
    AUTHENTIK_STORAGE__BACKEND=s3. Without it, uploaded icons and backgrounds go to ephemeral /data. No second
    container, Redis or other datastore is needed.
