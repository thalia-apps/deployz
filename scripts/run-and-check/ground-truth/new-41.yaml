    - {path: packages/env/src/constants/defaults.ts, line: 32, quote: "RATE_LIMITER_STORE: 'memory',"}
    - {path: api/src/redis/utils/redis-config-available.ts, line: 13, quote: "return 'REDIS' in env || Object.keys(env).some"}
