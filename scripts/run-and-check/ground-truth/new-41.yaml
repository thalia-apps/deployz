  paths: [/directus/uploads, /directus/extensions, /directus/database]
  s3: native
  s3SelectBy: {STORAGE_LOCATIONS: s3, STORAGE_S3_DRIVER: s3}
  evidence:
    - {path: packages/env/src/constants/defaults.ts, line: 25, quote: "STORAGE_LOCATIONS: 'local',"}
    - {path: packages/env/src/constants/defaults.ts, line: 27, quote: "STORAGE_LOCAL_ROOT: './uploads',"}
    - {path: api/src/storage/get-storage-driver.ts, line: 5, quote: "s3: '@directus/storage-driver-s3',"}
    - {path: Dockerfile, line: 41, quote: "mkdir -p database extensions uploads"}
    - {path: packages/storage-driver-s3/src/index.ts, line: 109, quote: "if ((this.config.key && !this.config.secret)"}
    - {path: packages/storage-driver-s3/src/index.ts, line: 113, quote: "if (this.config.key && this.config.secret) {"}
    - {path: api/src/storage/register-locations.ts, line: 19, quote: "getConfigFromEnv(`STORAGE_${location.toUpperCase()}_`)"}
env:
  required:
    - {name: DB_CLIENT, secret: false, buildTime: false, note: "set to pg; image default sqlite3 is ephemeral"}
    - {name: "DB_HOST / DB_PORT / DB_DATABASE / DB_USER / DB_PASSWORD", secret: false, buildTime: false, note: "or DB_CONNECTION_STRING for pg; the password is secret"}
    - {name: SECRET, secret: true, buildTime: false, note: "a random value is used if missing, so tokens break on restart or with several tasks; set 32+ bytes"}
    - {name: STORAGE_LOCATIONS, secret: false, buildTime: false, note: "s3, with STORAGE_S3_DRIVER=s3, STORAGE_S3_BUCKET, STORAGE_S3_REGION; STORAGE_S3_KEY/SECRET are optional (set both or neither): when omitted the AWS SDK default credential chain is used, so the ECS task role works"}
    - {name: ADMIN_EMAIL, secret: false, buildTime: false, note: "not needed to boot (without ADMIN_EMAIL and ADMIN_PASSWORD the UI onboarding creates the first admin), but then the first visitor to the public URL can claim the admin account, so set both"}
    - {name: ADMIN_PASSWORD, secret: true, buildTime: false, note: "see ADMIN_EMAIL"}
    - {name: PUBLIC_URL, secret: false, buildTime: false, note: "public HTTPS URL; used for links and auth redirects (default '/')"}
  optional: [STORAGE_S3_KEY, STORAGE_S3_SECRET, STORAGE_S3_ENDPOINT, STORAGE_S3_ROOT, PROJECT_NAME, PROJECT_OWNER, ADMIN_TOKEN, CORS_ENABLED, CORS_ORIGIN, REDIS, CACHE_ENABLED, CACHE_STORE, EMAIL_TRANSPORT, EMAIL_FROM, SESSION_COOKIE_SECURE, HEALTHCHECK_ENABLED, PM2_INSTANCES, WEBSOCKETS_ENABLED]
  buildTime: []
  evidence:
    - {path: api/src/app.ts, line: 110, quote: "if (!env['SECRET']) {"}
    - {path: api/src/utils/create-admin.ts, line: 42, quote: "const adminEmail = admin?.email ?? env['ADMIN_EMAIL'];"}
    - {path: api/src/utils/create-admin.ts, line: 45, quote: "Without credentials there's no admin user to create."}
    - {path: packages/env/src/constants/defaults.ts, line: 11, quote: "PUBLIC_URL: '/',"}
    - {path: packages/env/src/constants/defaults.ts, line: 69, quote: "SESSION_COOKIE_SECURE: false,"}
blockers:
  expected: []
  mustNot:
    - "SQLite default must not block: Postgres and MySQL are supported via DB_CLIENT"
    - "uploads, database and extensions directories must not block: S3 storage is native and the DB is external"
    - "Redis must not be required: memory stores are the default (needed only with several instances)"
    - "pm2 must not count as several services: it is a process supervisor for one app in the same container"
    - "MSSQL, Oracle and CockroachDB support must not be reported as an unsupported DB: Postgres and MySQL are available"
vendorQuestions:
  legitimate:
    - "Extensions: custom extensions load from /directus/extensions (local disk); the repo does not say whether the user needs any"
  unnecessary:
    - "Which port? (8055 in image and defaults)"
    - "Who runs migrations? (the entrypoint runs bootstrap on each start)"
    - "Is a worker or scheduler process needed? (all embedded)"
    - "Health path? (/server/health, or /server/ping)"
traps:
  - "Dockerfile.dhi -> hardened variant that needs a dhi.io base image; use Dockerfile (Dockerfile.dhi:9-10)"
  - "docker-compose.yml lists many DBs, RustFS, MailDev, Keycloak -> debug only, not the production topology (docker-compose.yml:1-5)"
  - "ENV DB_CLIENT=sqlite3 in the image -> a default to override, not the real storage choice (Dockerfile:65)"
  - "builder stage is not the final stage -> last stage runtime is the app, no --target needed (Dockerfile:47)"
  - "pm2 cluster mode in ecosystem.config.cjs -> one instance by default (PM2_INSTANCES ?? 1), so no Redis need (ecosystem.config.cjs:15)"
  - "/ redirects (ROOT_REDIRECT) -> use /server/health (no bare /health; router mounted at /server), which returns 503 when DB, Redis or storage checks fail (api/src/app.ts:267, api/src/app.ts:403); /server/ping is a dependency-free alternative (api/src/app.ts:320)"
  - "Build runs a full monorepo build with NODE_OPTIONS max-old-space-size=8192 -> build needs much memory (Dockerfile:23)"
openQuestions:
  - "Whether the first-visitor onboarding (no ADMIN_EMAIL/ADMIN_PASSWORD) is acceptable on a public URL: a vendor choice"
crossReview:
  - {field: healthPath, change: "/health -> /server/health (plus /server/ping); the health router is mounted under /server, a bare /health returns 404 (the SPA or ROOT_REDIRECT). Also fixed the trap and vendorQuestions text", evidence: "api/src/app.ts:403 app.use('/server', serverRouter); api/src/controllers/server.ts:80; api/src/app.ts:320 /server/ping; sdk/src/rest/commands/server/health.ts:20 path '/server/health'"}
  - {field: storage / env (S3 credentials), change: "resolved the open question: STORAGE_S3_KEY and STORAGE_S3_SECRET are optional; when both are absent no credentials are passed and the AWS SDK default chain (ECS task role) is used; only one of the two throws. Added STORAGE_S3_KEY/SECRET/ENDPOINT/ROOT to optional, extended the STORAGE_LOCATIONS note, removed the open question", evidence: "packages/storage-driver-s3/src/index.ts:109-118; api/src/storage/register-locations.ts:19"}
  - {field: env.required ADMIN_EMAIL/ADMIN_PASSWORD, change: "judgement kept as required: not needed to boot (bootstrap skips admin creation without both, onboarding UI creates it), but a public fresh instance lets the first visitor claim admin, so both stay listed with a clearer note; added an open question", evidence: "api/src/utils/create-admin.ts:42-46"}
  - {field: evidence line numbers, change: "Dockerfile.dhi 8->10 (and trap ref 5-8 -> 9-10), redis-config-available.ts 11->13, create-admin.ts 46->45", evidence: "Dockerfile.dhi:10; api/src/redis/utils/redis-config-available.ts:13; api/src/utils/create-admin.ts:45"}
  - {field: database.default, change: "none: DB_CLIENT default sqlite3 confirmed (Dockerfile:65 sets it; there is no earlier default); pg needs DB_HOST/PORT/DATABASE/USER or DB_CONNECTION_STRING", evidence: "Dockerfile:65; api/src/database/index.ts:68-76"}
  - {field: all, change: verified, evidence: "37 citations checked"}
