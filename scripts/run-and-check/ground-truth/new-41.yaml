id: new-41
repository: directus/directus
commit: b3ce03c18673230913bdfdf14907eb13e6865178
summary: >
  Directus headless CMS / data platform (Node.js, Express, pnpm monorepo, Vue admin app). Self-hosted via the
  root Dockerfile image (entrypoint runs `directus bootstrap`, then pm2-runtime). The image defaults to SQLite
  and local uploads, so a Deployz deploy must select PostgreSQL (or MySQL) and S3.
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    Needs DB_CLIENT=pg (or mysql) with DB_* parts, STORAGE_LOCATIONS=s3 with STORAGE_S3_* and a SECRET. Without these
    the image uses SQLite and local disk, which are ephemeral. Redis is only needed for more than one instance.
dockerfile:
  accept: [Dockerfile]
  reject:
    - {path: Dockerfile.dhi, reason: "hardened runtime base dhi.io/node needs registry entitlement (ARG DHI_RUNTIME); not for general builds"}
    - {path: packages/memory/test/docker-compose.yml, reason: "test compose, not a Dockerfile"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 47, quote: "FROM node:${NODE_VERSION}-alpine AS runtime"}
    - {path: Dockerfile, line: 82, quote: "CMD [\"node\", \"docker-entrypoint.cjs\"]"}
    - {path: Dockerfile.dhi, line: 10, quote: "ARG DHI_RUNTIME=dhi.io/node:${NODE_VERSION}-alpine${ALPINE_VERSION}"}
runtime: {accept: [node]}
port:
  accept: [8055]
  evidence:
    - {path: Dockerfile, line: 80, quote: "EXPOSE 8055"}
    - {path: packages/env/src/constants/defaults.ts, line: 10, quote: "PORT: 8055,"}
bindAllInterfaces:
  value: true
  evidence:
    - {path: packages/env/src/constants/defaults.ts, line: 9, quote: "HOST: '0.0.0.0',"}
startCommand:
  source: image
  accept: ["node docker-entrypoint.cjs"]
healthPath:
  accept: ["/server/health", "/server/ping"]
  # serverRouter is mounted at /server, so there is no bare /health. /server/health is unauthenticated (returns only status) and
  # writes a test file to every storage location and checks the DB; /server/ping returns "pong" with no dependency check.
  evidence:
    - {path: api/src/controllers/server.ts, line: 80, quote: "'/health',"}
    - {path: api/src/app.ts, line: 403, quote: "app.use('/server', serverRouter);"}
    - {path: api/src/app.ts, line: 320, quote: "app.get('/server/ping', (_req, res) => res.send('pong'));"}
    - {path: api/src/controllers/server.ts, line: 91, quote: "if (data['status'] === 'error') res.status(503);"}
    - {path: api/src/services/server.ts, line: 252, quote: "testDatabase(), testRedis(), testStorage(), testEmail()"}
    - {path: api/src/app.ts, line: 267, quote: "app.get('/', (_req, res, next) => {"}
database:
  status: required
  engines: [sqlite3, pg, cockroachdb, mysql, mssql, oracledb]
  default: sqlite3
  deployzEngine: postgres
  selectBy: {DB_CLIENT: pg}
  connectionVars: [DB_CONNECTION_STRING, "DB_HOST/DB_PORT/DB_DATABASE/DB_USER/DB_PASSWORD"]
  evidence:
    - {path: Dockerfile, line: 65, quote: "DB_CLIENT=\"sqlite3\""}
    - {path: Dockerfile, line: 66, quote: "DB_FILENAME=\"/directus/database/database.sqlite\""}
    - {path: api/src/database/index.ts, line: 69, quote: "case 'cockroachdb':"}
    - {path: api/src/database/index.ts, line: 74, quote: "requiredEnvVars.push('DB_CONNECTION_STRING');"}
    - {path: api/src/database/index.ts, line: 78, quote: "case 'mysql':"}
migrations:
  mode: startup
  accept: ["node cli.js bootstrap"]
  evidence:
    - {path: docker-entrypoint.cjs, line: 31, quote: "spawnSync(node, ['cli.js', 'bootstrap']"}
    - {path: api/src/cli/commands/bootstrap/index.ts, line: 34, quote: "await runMigrations(database, 'latest');"}
    - {path: api/src/cli/commands/bootstrap/index.ts, line: 70, quote: "logger.info('Running migrations...');"}
redis:
