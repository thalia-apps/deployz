storage:
  # The fs driver keeps OAuth app registrations as JSON files; the app registers a new app when a key is missing, so the data is a cache and not durable state.
  local: conditional
  paths: [/elk/data]
  s3: none
  s3SelectBy: {}
  evidence:
    - {path: Dockerfile, line: 55, quote: "ENV NUXT_STORAGE_FS_BASE='/elk/data'"}
    - {path: Dockerfile, line: 58, quote: "VOLUME [ \"/elk/data\" ]"}
    - {path: nuxt.config.ts, line: 156, quote: "driver: process.env.NUXT_STORAGE_DRIVER ?? (isCI ? 'cloudflare' : 'fs'),"}
    - {path: server/utils/shared.ts, line: 45, quote: "else if (driver === 'memory') {"}
    - {path: server/utils/shared.ts, line: 92, quote: "export async function getApp(origin: string, server: string) {"}
env:
  required:
    - {name: NUXT_STORAGE_DRIVER, secret: false, buildTime: false, note: "set to memory; the default fs driver writes to /elk/data, which the non-root elk user cannot create without a mounted volume, and getApp then returns null so login fails"}
  optional: [NUXT_PUBLIC_DEFAULT_SERVER, NUXT_PUBLIC_SINGLE_INSTANCE, NUXT_PUBLIC_PRIVACY_POLICY_URL, NUXT_PUBLIC_TRANSLATE_API, NUXT_STORAGE_FS_BASE, NUXT_ADMIN_KEY]
  buildTime: []
  evidence:
