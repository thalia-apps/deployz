id: new-264
repository: elk-zone/elk
commit: 3405d745d857cc8f3d16b472f975b581375ad73a
summary: >
  Elk is a Nuxt 4 web client for Mastodon. The browser talks to the chosen Mastodon server directly; the Nitro server
  only registers an OAuth application on each Mastodon server and stores its client id and secret (key servers:v4:...)
  through the unstorage driver in NUXT_STORAGE_DRIVER: fs (default, base /elk/data in the image), cloudflare KV, vercel
  KV or memory. The root Dockerfile is a multi-stage pnpm build that runs `node .output/server/index.mjs` as the
  non-root user elk on port 5314. No database, no Redis, no queue, no worker.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    The root Dockerfile builds the app from source and runs one Nitro process on port 5314. The app needs no database,
    Redis or worker. The only server state is a cache of OAuth app registrations that the app re-creates when it is
    missing (getApp registers a new app on the Mastodon server). The image's fs storage base /elk/data is not writable
    by the elk user without a volume, so the vendor sets NUXT_STORAGE_DRIVER=memory as an environment variable. That is
    a Deployz setting, not a repository change.
