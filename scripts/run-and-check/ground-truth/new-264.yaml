    - {path: .env.example, line: 3, quote: "NUXT_PUBLIC_SINGLE_INSTANCE="}
    - {path: nuxt.config.ts, line: 160, quote: "adminKey: '',"}
    - {path: Dockerfile, line: 44, quote: "USER elk"}
blockers:
  expected: []
  mustNot:
    - "The VOLUME /elk/data must not block: the stored data is a regenerable cache and the memory driver needs no disk"
    - "Cloudflare KV and Vercel KV settings must not be read as required services: they are alternative storage drivers"
    - "Netlify files and docs must not block"
    - "No database, Redis or S3 may be reported as required"
vendorQuestions:
  legitimate:
    - "Which Mastodon server is the default, and may users sign in to other servers? (NUXT_PUBLIC_DEFAULT_SERVER, NUXT_PUBLIC_SINGLE_INSTANCE)"
  unnecessary:
    - "Which database? (none)"
    - "Is a worker or Redis needed? (no)"
    - "Which port? (5314)"
traps:
  - "The default storage driver is fs with base /elk/data, but the image runs as user elk and /elk/data exists only as a mounted volume; without it getApp swallows the write error and returns null (Dockerfile:44, server/utils/shared.ts:92)"
  - "The driver is chosen at build time too: nuxt.config.ts picks cloudflare when isCI is true, and NUXT_STORAGE_DRIVER overrides it (nuxt.config.ts:156)"
  - "The build needs a large heap: NODE_OPTIONS sets 6144 MB (Dockerfile:32)"
  - "Memory storage is per task: an OAuth callback that reaches a different task than the login request registers a new app and fails"
  - "docker-compose.yaml has one service with a bind-mounted data folder; it is not a multi-service app (docker-compose.yaml:6)"
openQuestions: []
crossReview:
  - {field: dockerfile, change: 'none: the root Dockerfile builds from source with pnpm and runs the Nitro server as user elk', evidence: 'Dockerfile:29,32,44,60'}
  - {field: storage / env, change: 'none: /elk/data exists only as a volume, the elk user cannot create it, and getApp returns null on a write error; memory driver avoids the disk and the data is re-created on demand', evidence: 'Dockerfile:44,55,58; server/utils/shared.ts:45,92'}
  - {field: database / redis, change: 'none: the storage drivers are fs, cloudflare, vercel and memory; no SQL or Redis driver', evidence: 'server/utils/shared.ts:24-45'}
  - {field: outcome, change: 'none: DEPLOYABLE with NUXT_STORAGE_DRIVER=memory as a setting; per-task memory is a limit for more than one task (see traps)', evidence: 'nuxt.config.ts:156'}
  - {field: all, change: verified, evidence: 22 citations checked}
