  buildTime: []
  evidence:
    - {path: src/config/src/config.rs, line: 1676, quote: "#[env_config(name = \"ZO_ROOT_USER_EMAIL\")]"}
    - {path: src/config/src/config.rs, line: 1678, quote: "#[env_config(name = \"ZO_ROOT_USER_PASSWORD\")]"}
blockers:
  expected:
    - "Default state is SQLite metadata plus data and WAL on local disk (/data); a deploy without ZO_META_STORE=postgres and ZO_LOCAL_MODE_STORAGE=s3 loses data on restart"
    - "The write-ahead log stays on local disk in S3 mode, so data not yet flushed to S3 can be lost when the task stops"
  mustNot:
    - "NATS must not be reported as required: it is needed only for cluster mode (ZO_LOCAL_MODE=false); local mode uses the in-memory queue"
    - "ClickHouse, Elasticsearch, Kafka or MinIO must not be reported as required: OpenObserve stores data in its own format on disk or S3"
    - "Redis must not be reported as required"
    - "A separate ingester, querier or router service must not be required: ZO_NODE_ROLE defaults to all"
    - "Dockerfile.pr must not be chosen: it copies a pre-built binary"
vendorQuestions:
  legitimate:
    - "Which root user email and password should be set (ZO_ROOT_USER_EMAIL, ZO_ROOT_USER_PASSWORD)?"
    - "Which S3 bucket should hold the data (ZO_S3_BUCKET_NAME) and is a data-loss window for unflushed WAL data acceptable?"
  unnecessary:
    - "Which port? (5080)"
    - "Health path? (/healthz)"
    - "Is NATS needed? (not in local mode)"
    - "Is a worker needed? (all roles run in one process)"
traps:
  - "Cluster mode (ZO_LOCAL_MODE=false) requires NATS and PostgreSQL; leave local mode on (config.rs:2047, config.rs:4408-4412, config.rs:4463-4467)"
  - "ZO_LOCAL_MODE_STORAGE is ignored when ZO_LOCAL_MODE is false; in local mode it chooses disk or s3 (config.rs:2049-2050)"
  - "Default meta store is SQLite when ZO_META_STORE is empty in local mode (config.rs:4451-4453)"
  - "ZO_QUEUE_STORE defaults to memory in local mode and nats in cluster mode (config.rs:4396-4402)"
  - "Dockerfile.tag.amd64 and the other tag variants build from source but only for one architecture; Dockerfile.pr and the cross/ files do not build the app"
  - "The cargo release build is slow and memory heavy; the web build sets NODE_OPTIONS max-old-space-size=8192 (deploy/build/Dockerfile:7)"
  - "Even with S3 data and PostgreSQL metadata, local mode keeps the cluster coordinator and local cache on SQLite under data_db_dir, and ingested data stays in the WAL on local disk until it is uploaded; both are transient, not primary data (src/infra/src/db/mod.rs:135-145, src/main.rs:262-263)"
  - "The root user email and password have no default in the Rust config; the first start needs both (config.rs:1676-1679)"
crossReview:
  - {field: "outcome.accept", change: "none: kept [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]. With ZO_LOCAL_MODE_STORAGE=s3 and ZO_META_STORE=postgres the primary data and metadata leave the disk by settings alone, so local disk is not a durable-state requirement. Only the WAL window (flushed to local disk on shutdown, uploaded to S3 later) is lost on task replacement; a strict reader may ask for a change, so both stay", evidence: "src/main.rs:262 \"// flush WAL cache to disk\"; config.rs:3947 is_local_storage only for disk/local; db/mod.rs:128-132 meta store dispatch"}
  - {field: "database", change: "none: PostgreSQL is a settings-only choice in local mode", evidence: "config.rs:4463 the postgres-only rule applies only when not local_mode; config.rs:4468 needs the DSN"}
  - {field: "storage", change: "none: S3 is a settings-only choice; added a trap that coordinator and cache stay on SQLite in local mode", evidence: "config.rs:3947 cfg.common.is_local_storage = cfg.common.local_mode"}
  - {field: "traps", change: "fixed citation: ZO_LOCAL_MODE default is at config.rs:2047, not 2053 (2053 is cluster_coordinator)", evidence: "config.rs:2047 ZO_LOCAL_MODE default = true"}
  - {field: "dockerfile, port, startCommand, healthPath, redis, workers", change: "none: confirmed", evidence: "deploy/build/Dockerfile:7,21,32; config.rs:1725; router/mod.rs:897; server.rs:61"}
  - {field: "all", change: "verified", evidence: "17 citations checked"}
