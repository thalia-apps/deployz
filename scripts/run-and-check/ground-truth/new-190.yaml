    - {path: src/config/src/config.rs, line: 2069, quote: "#[env_config(name = \"ZO_META_POSTGRES_DSN\", default = \"\")]"}
    - {path: src/config/src/config.rs, line: 4463, quote: "if !cfg.common.local_mode && !cfg.common.meta_store.starts_with(\"postgres\") {"}
