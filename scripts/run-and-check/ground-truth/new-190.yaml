id: new-190
repository: openobserve/openobserve
commit: 99042f764015f4d505f48cd11c248a593b3c325f
summary: >
  OpenObserve is a Rust observability platform (logs, metrics, traces) with an embedded Vue web UI. One binary serves
  the UI and the API on HTTP port 5080. deploy/build/Dockerfile builds the web UI with Node and the server with cargo
  from the repository source. By default it runs in single-node local mode (ZO_LOCAL_MODE=true) with SQLite metadata and
  data files on local disk (/data). Local mode can use S3 for data (ZO_LOCAL_MODE_STORAGE=s3) and PostgreSQL for metadata
  (ZO_META_STORE=postgres) with an in-memory queue, so NATS is needed only in cluster mode (ZO_LOCAL_MODE=false).
outcome:
  accept: [DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    deploy/build/Dockerfile builds from source and runs one process on port 5080 with /healthz. Environment settings alone
    select S3 for data and PostgreSQL for metadata in single-node local mode, so no repository change is needed. Without
    those settings the defaults write SQLite and data files to /data, which is lost on a new task. The write-ahead log is
    always on local disk (data_wal_dir), so a task restart can lose the data not yet flushed to S3; a strict read can ask for
    a repository change or an accepted data-loss window. The Rust build is large and slow but needs no change.
dockerfile:
  accept: [deploy/build/Dockerfile]
  reject:
    - {path: deploy/build/Dockerfile.pr, reason: "copies a pre-built ./bin/openobserve binary, no build"}
    - {path: deploy/build/Dockerfile.tag.amd64, reason: "release image for amd64 only (x86_64 target, release-prod profile); builds from source but pinned to one architecture and used by the release pipeline"}
    - {path: deploy/build/Dockerfile.amd64, reason: "architecture-specific release variant"}
    - {path: deploy/build/Dockerfile.aarch64, reason: "architecture-specific release variant"}
    - {path: cross/Dockerfile.oss.musl, reason: "cross-compilation builder image"}
    - {path: .devcontainer/Dockerfile, reason: "development container"}
  target: null
  context: .
  evidence:
    - {path: deploy/build/Dockerfile, line: 7, quote: "RUN NODE_OPTIONS=\"--max-old-space-size=8192\" npm run build"}
    - {path: deploy/build/Dockerfile, line: 21, quote: "RUN cargo build --release"}
    - {path: deploy/build/Dockerfile, line: 32, quote: "CMD [\"/openobserve\"]"}
    - {path: deploy/build/Dockerfile.pr, line: 8, quote: "COPY ./bin/openobserve /"}
