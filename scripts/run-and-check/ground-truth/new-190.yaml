  # Default data and WAL are on local disk (ZO_DATA_DIR ./data/openobserve/, created at /data by init-dir). With S3 selected the WAL still stays on disk until flushed.
  evidence:
    - {path: src/config/src/config.rs, line: 2050, quote: "#[env_config(name = \"ZO_LOCAL_MODE_STORAGE\", default = \"disk\")]"}
    - {path: src/config/src/config.rs, line: 2128, quote: "#[env_config(name = \"ZO_DATA_DIR\", default = \"./data/openobserve/\")]"}
    - {path: src/config/src/config.rs, line: 2130, quote: "#[env_config(name = \"ZO_DATA_WAL_DIR\", default = \"\")] // ./data/openobserve/wal/"}
    - {path: src/config/src/config.rs, line: 3608, quote: "#[env_config(name = \"ZO_S3_BUCKET_NAME\", default = \"\")]"}
    - {path: deploy/build/Dockerfile, line: 31, quote: "RUN [\"/openobserve\", \"init-dir\", \"-p\", \"/data/\"]"}
