id: new-186
repository: medusajs/medusa
commit: 5ac3fdcbf82e818337d424852c778ce2ffd5e8e9
summary: >
  The Medusa repository is the Yarn-workspaces source monorepo of the Medusa commerce framework (@medusajs/medusa,
  core libraries, commerce modules, providers, admin dashboard, CLI, docs). It is not a store application: a
  deployable Medusa store is generated with `npx create-medusa-app` into its own project. The repo root has no
  Dockerfile for an application. The only Dockerfile is .oss-scanner/Dockerfile, a build and test environment (Node 22,
  a local PostgreSQL and Redis started inside the same container) for a security scanner. The integration-tests
  packages hold test fixtures with medusa-config files, not a product. A real Medusa store would run `medusa start`
  on port 9000 with PostgreSQL required and Redis optional.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The root is a framework and library monorepo ("private": true workspace root, "Every Medusa package published to
    npm lives under packages"). No directory is a store application with a Dockerfile; the only Dockerfile is a
    scanner test environment that installs PostgreSQL and Redis into one container. A vendor who connects this repo has
    nothing to deploy: the product is created from the npm packages in a separate project.
