  accept: []
  reject:
    - {path: .oss-scanner/Dockerfile, reason: "scanner build and test environment: installs postgresql and redis-server in the same container and runs no server; not an application image"}
  target: null
  context: .
  evidence:
    - {path: .oss-scanner/Dockerfile, line: 5, quote: "FROM node:22-bookworm"}
    - {path: .oss-scanner/Dockerfile, line: 8, quote: "ca-certificates git python3 build-essential postgresql redis-server \\"}
    - {path: package.json, line: 3, quote: "\"private\": true,"}
