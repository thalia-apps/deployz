blockers:
  expected:
    - "The repository is a framework and library monorepo, not an application: no Dockerfile or workspace builds a store; a store is generated into a separate project with create-medusa-app"
    - "The only Dockerfile (.oss-scanner/Dockerfile) is a scanner test environment with PostgreSQL and Redis installed in the same container"
  mustNot:
    - "PostgreSQL and Redis installed in .oss-scanner/Dockerfile must not be read as a bundled-database application image"
    - "integration-tests/* medusa-config fixtures must not be treated as deployable stores"
    - "The root package.json (name root, private, turbo build) must not be treated as a start command for a server"
vendorQuestions:
  legitimate:
    - "Is there a separate repository that holds the Medusa store project (medusa-config, src/) for deployment? This repo is the framework source"
  unnecessary:
    - "Which port? (9000 for a generated store)"
    - "Is Redis needed? (optional)"
traps:
  - ".oss-scanner/Dockerfile looks like the only Dockerfile but is a test and audit environment (.oss-scanner/Dockerfile:1)"
  - "integration-tests/http/medusa-config.js and package.json files look like an app but are test fixtures"
  - "packages/medusa/src/commands/start.ts has port 9000 and a /health route, tempting a DEPLOYABLE answer, but they belong to the library a store imports"
  - "The README calls Medusa an open-source commerce platform; the repo is the platform source, not an instance of it"
openQuestions:
  - "Whether a tool could scaffold a store project from create-medusa-app and treat that as DEPLOYABLE_WITH_CHANGES; the repo itself contains no project"
crossReview:
  - {field: outcome.accept, change: "none: NOT_DEPLOYABLE confirmed", evidence: "README.md:53 says every Medusa package published to npm lives under packages; the tree has no starter or template folder, only integration-tests fixtures and www docs"}
  - {field: dockerfile, change: "none: .oss-scanner/Dockerfile is the only Dockerfile and is a scanner environment", evidence: ".oss-scanner/Dockerfile:1 'Build environment for Anthropic's OSS Scanner'"}
  - {field: "database, redis, port, health", change: "none: confirmed for a generated store", evidence: "start.ts:216 port = 9000; config.ts:152 a fake redis instance is used when redisUrl is missing"}
  - {field: all, change: verified, evidence: "9 citations checked"}
