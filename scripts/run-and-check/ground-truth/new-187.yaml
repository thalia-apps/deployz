id: new-187
repository: vendure-ecommerce/vendure
commit: 6cca401ac3efb9b714bf996fe261f278a1add3fb
summary: >
  The Vendure repository is the source monorepo of the Vendure headless commerce framework (@vendure/core, admin
  dashboard, CLI, plugins, e2e testing harness), built with lerna and bun. It is not a store: a deployable Vendure
  server is created with `npx @vendure/create` into its own project, whose Dockerfile comes from the template
  packages/create/templates/Dockerfile.hbs. The root has no Dockerfile. The root docker-compose.yml starts development
  and test services only (MariaDB, MySQL, PostgreSQL, Keycloak, Elasticsearch, Redis). The only real Dockerfile is
  .oss-scanner/Dockerfile, a build and test environment. packages/dev-server is a private development harness.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The root is a framework and library monorepo ("This is the Vendure source monorepo"). No Dockerfile builds an
    application: .oss-scanner/Dockerfile is a scanner environment, and packages/create/templates/Dockerfile.hbs is a
    Handlebars template that the scaffolding tool renders into a new project. packages/dev-server is a private
    development server with a MySQL default and a dev-only config, not a product. A vendor who connects this repo has
    nothing to deploy.
dockerfile:
  accept: []
  reject:
    - {path: .oss-scanner/Dockerfile, reason: "scanner build and test environment (Node 22, bun install, tests); not an application image"}
    - {path: packages/create/templates/Dockerfile.hbs, reason: "Handlebars template rendered into a new project by @vendure/create; contains {{...}} placeholders and is not buildable as is"}
  target: null
  context: .
  evidence:
    - {path: .oss-scanner/Dockerfile, line: 4, quote: "FROM node:22-bookworm"}
    - {path: packages/create/templates/Dockerfile.hbs, line: 1, quote: "{{#if isBun}}FROM oven/bun:1{{else}}FROM node:24{{/if}}"}
    - {path: README.md, line: 89, quote: "This is the Vendure source monorepo: the `@vendure/core` framework, the React and TanStack admin dashboard, the CLI, the official plugins, and an e2e testing harness. To build with Vendure, run `npx @vendure/create"}
