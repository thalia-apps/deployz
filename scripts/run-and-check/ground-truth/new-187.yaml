blockers:
  expected:
    - "The repository is a framework and library monorepo, not an application: no Dockerfile or workspace builds a store; a project is generated with @vendure/create"
    - "The root docker-compose.yml lists development and test services (several databases, Keycloak, Elasticsearch, Redis), not a production topology"
  mustNot:
    - "Elasticsearch and Keycloak in docker-compose.yml must not be reported as required services"
    - "packages/create/templates/Dockerfile.hbs must not be selected as a Dockerfile: it is a template with placeholders"
    - "packages/dev-server must not be treated as the deployable app: it is private, dev-only, and defaults to MySQL"
vendorQuestions:
  legitimate:
    - "Is there a separate repository that holds the Vendure project (src/vendure-config.ts, server and worker entry files) for deployment? This repo is the framework source"
  unnecessary:
    - "Which port? (3000 default)"
    - "Which database? (PostgreSQL or MySQL, set by the generated project)"
traps:
  - "docker-compose.yml starts MariaDB, two MySQL versions, two PostgreSQL versions, Keycloak, Elasticsearch and Redis for framework development and tests (docker-compose.yml:1)"
  - "packages/create/templates/Dockerfile.hbs is a real-looking Dockerfile (node:24, build, standalone start) but is a template (Dockerfile.hbs:1)"
  - "packages/dev-server has dev and worker scripts and a /health route, tempting a DEPLOYABLE answer"
  - "The default HTTP port 3000 is a framework default (default-config.ts:83), not an app in the repo"
openQuestions:
  - "Whether a tool could render the create template and treat that as DEPLOYABLE_WITH_CHANGES; the repo contains no rendered project"
crossReview:
  - {field: outcome.accept, change: "none: NOT_DEPLOYABLE confirmed", evidence: "README.md:89 says this is the Vendure source monorepo; packages/create/templates holds only .hbs Handlebars files (Dockerfile.hbs, vendure-config.hbs, index.hbs), no buildable project, so a template subfolder is not DEPLOYABLE_WITH_CHANGES"}
  - {field: "dockerfile, redis, database", change: "none: confirmed", evidence: "only .oss-scanner/Dockerfile and the .hbs template exist; docker-compose.yml is a dev and test stack; dev-config.ts:159 MySQL default of the private dev-server"}
  - {field: all, change: verified, evidence: "11 citations checked"}
