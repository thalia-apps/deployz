blockers:
  expected:
    - "The only Dockerfile uses dhi.io base images (Docker login needed); the vendor must change the FROM lines to public images"
  mustNot:
    - "The Next.js frontend and the Flask backend must not be read as two services: the backend serves the exported static site on one port"
    - "Temporary files in /tmp must not be read as durable local state: the app deletes them after one hour"
    - "The rembg model download and the Ghostscript libraries must not block: both are installed in the image build"
    - "docker/compose files (Traefik, log rotation) must not be read as extra required services"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which database? (none)"
    - "Is a worker or Redis needed? (no)"
    - "Which port? (5000)"
traps:
  - "Every FROM line pulls from dhi.io, which needs `docker login dhi.io`; a build without credentials fails at the first stage (Dockerfile:11,34,169)"
  - "The result files are kept in /tmp of the one task; with more than one task a download request can reach a task that does not hold the file (app.json:3)"
  - "granian starts with workers auto (the CPU count), and the in-process cleanup scheduler runs once per process start (backend/image_converter/config/app.json:12; bootstraper.py:35)"
  - "The default max upload size is 40960 MiB, which is larger than the ALB and /tmp can hold in practice (backend/image_converter/config/app.json:7)"
  - "The final image has no shell; the health check is a Python script (Dockerfile:205-208)"
openQuestions: []
crossReview:
