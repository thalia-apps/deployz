id: new-307
repository: karimz1/imgcompress
commit: e21e0c9552dc53a16ae21744e8d8025784b0eaaf
summary: >
  imgcompress is a self-hosted image compression, conversion and background-removal tool: a Flask backend (served by
  granian) with a Next.js static frontend. The root Dockerfile builds the frontend with pnpm, builds a Python 3.14
  virtualenv with uv, pre-downloads a rembg model, and runs `python /container/entrypoint.py` under dumb-init, which
  writes the frontend runtime.json and starts the web server on 0.0.0.0:5000. No database, no Redis, no worker. Uploads
  and results are temporary files in /tmp, removed by an in-process scheduler after one hour. All three build stages use
  base images from the dhi.io registry (Docker Hardened Images).
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES]
  reason: >
    The architecture fits Deployz: one stateless web process on port 5000, no database, only temporary files. But the
    only Dockerfile pulls its three base images (node, debian-base and a uv image) from dhi.io, a registry that needs a
    Docker login. Deployz builds have no credentials for it (the same reason as the other dhi.io repositories in this set
    of tests). A contained change replaces the FROM lines with public Docker Hub or Debian images. The settings alone
    cannot change the base images.
