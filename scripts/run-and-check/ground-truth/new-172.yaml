    - "The gRPC port 4317 must not count as the app port or block the deploy: OTLP/HTTP is served on the HTTP port 6006"
    - "The Prometheus port 9090 must not be treated as a second service"
    - "A missing database must not be a blocker: SQLite is the default and PostgreSQL is optional"
    - "Redis, object storage or a worker must not be reported as required"
