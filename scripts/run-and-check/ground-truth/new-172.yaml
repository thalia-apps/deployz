id: new-172
repository: Arize-ai/phoenix
commit: 80f27153694c92e55b1b970a7af4c11093103341
summary: >
  Arize Phoenix is an LLM observability and evaluation server (Python, FastAPI/Starlette, React UI). The root Dockerfile
  builds the UI (pnpm) and the Python wheel from source and runs `python -m phoenix.server.main serve` in a distroless
  image. One process serves the UI, the REST and GraphQL API and OTLP/HTTP on 6006; OTLP/gRPC is a second port, 4317.
  The database is SQLite in the working directory by default, or PostgreSQL through PHOENIX_SQL_DATABASE_URL. Schema
  migrations run inside the process at startup. No Redis, no object store, no worker.
outcome:
  accept: [DEPLOYABLE]
  reason: >
    One source-built Dockerfile, one HTTP port (6006) with /healthz, PostgreSQL optional through one URL variable, and
    in-process migrations. Traces can reach the app over OTLP/HTTP on 6006; the gRPC port 4317 is optional. Without
    PHOENIX_SQL_DATABASE_URL the SQLite file sits on ephemeral task storage, so a Deployz deploy should select PostgreSQL.
