    - "Which Dockerfile? (Dockerfile)"
    - "Is Redis needed? (no)"
traps:
  - "Dockerfile exposes three ports (6006, 4317, 9090); the web service port is 6006 (Dockerfile:164-168)"
  - "Default storage is SQLite under the working directory, lost on task restart; docker-compose.yml shows the PostgreSQL setup (docker-compose.yml:12)"
  - "The final image is distroless with no shell, so the start command is `-m phoenix.server.main serve` on the image python entrypoint (Dockerfile:172)"
  - "The Dockerfile pulls a WASM binary from GitHub at build time (Dockerfile:101-117); this is a build-time download only"
openQuestions:
  - "Whether a tool should ask for PHOENIX_ENABLE_AUTH: it is off by default, which makes a public deploy open"
crossReview:
  - {field: outcome.accept, change: "none: DEPLOYABLE confirmed. Phoenix has a PostgreSQL driver (pg extra in the image), so SQLite is not a gap (docs/ai-analysis.md rule: SQLite is a gap only when it is the only driver). Postgres is chosen by one env variable, a setting. A tool that leaves SQLite is still running, but data is lost on restart, so the truth says the Deployz deploy should select PostgreSQL.", evidence: "Dockerfile:64 --extra pg; config.py:3392 reads PHOENIX_SQL_DATABASE_URL"}
  - {field: database, change: "none: status optional, default sqlite, deployzEngine postgres, selectBy PHOENIX_SQL_DATABASE_URL confirmed", evidence: "config.py:3400, 170"}
