id: new-171
repository: comet-ml/opik
commit: 25fa8b47b62d9f97ed9171920643de4bd6c51726
summary: >
  Opik is an LLM observability and evaluation platform made of several services: a Java 25 Dropwizard backend
  (apps/opik-backend, port 8080), a React frontend served by nginx (apps/opik-frontend), a Python evaluator backend
  (apps/opik-python-backend, port 8000), and optional guardrails and sandbox services. The backend needs MySQL (state),
  ClickHouse (analytics, with ZooKeeper in the compose stack), Redis, and S3-compatible storage (MinIO in compose).
  The official stack is deployment/docker-compose/docker-compose.yaml.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    ClickHouse is a required analytics store (ANALYTICS_DB_* settings, a "clickhouse" readiness health check) and is
    outside the MVP. The product also needs several distinct images at runtime (backend, nginx frontend, Python backend),
    and the UI is a separate nginx image that proxies to the backend.
dockerfile:
  accept: []
  reject:
    - {path: apps/opik-backend/Dockerfile, reason: "builds the Java backend from source (maven) and is the API image, but the product also needs the frontend and python-backend images, and ClickHouse"}
    - {path: apps/opik-frontend/Dockerfile, reason: "separate nginx frontend image"}
    - {path: apps/opik-python-backend/Dockerfile, reason: "separate evaluator service"}
    - {path: apps/opik-guardrails-backend/Dockerfile, reason: "optional guardrails service"}
    - {path: apps/opik-sandbox-executor-python/Dockerfile, reason: "sandbox executor service"}
  target: null
  context: apps/opik-backend
  evidence:
    - {path: apps/opik-backend/Dockerfile, line: 22, quote: "mvn clean package -Dmaven.test.skip=true -Dmaven.source.skip=true -Dmaven.javadoc.skip=true -Dspotless.skip=true"}
    - {path: deployment/docker-compose/docker-compose.yaml, line: 170, quote: "context: ../../apps/opik-backend"}
    - {path: apps/opik-frontend/Dockerfile, line: 23, quote: "RUN npm run build -- --mode $BUILD_MODE \\"}
    - {path: deployment/docker-compose/docker-compose.yaml, line: 322, quote: "context: ../../apps/opik-python-backend"}
