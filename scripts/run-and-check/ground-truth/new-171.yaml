blockers:
  expected:
    - "ClickHouse is a required analytics store (ANALYTICS_DB_* variables, clickhouse readiness check) and is outside the MVP datastores"
    - "The product runs as several distinct images (Java backend, nginx frontend, Python evaluator backend), not one image on one port"
  mustNot:
    - "MySQL and Redis must not block by themselves: both are supported MVP datastores"
    - "ZooKeeper in docker-compose.yaml must not be counted separately: it only serves the ClickHouse cluster"
    - "MinIO must not block: S3 is supported"
    - "Port 3003 (redoc server in the backend image) must not be treated as the app port"
    - "The Java runtime must not be a blocker by itself"
vendorQuestions:
  legitimate:
    - "Can ClickHouse run outside Deployz (managed ClickHouse) and the backend point to it?"
    - "How are the frontend and the Python evaluator hosted, given they are separate images?"
  unnecessary:
    - "Which port? (8080 for the backend)"
    - "Which database for state? (MySQL 8)"
traps:
  - "The backend image starts a redoc web server on 3003 in the background before the Java process (apps/opik-backend/entrypoint.sh:5); the API port is 8080"
  - "The Dockerfile CMD is entrypoint.sh, which does not run migrations; migrations run from run_db_migrations.sh in the compose command (docker-compose.yaml:175)"
  - "Health is a Dropwizard path on the application port, /health-check, and its checks fail when ClickHouse or Redis is missing (apps/opik-backend/config.yml:353-373)"
  - "Dockerfile.cpu and Dockerfile in apps/opik-guardrails-backend are optional guardrails, not the main app"
crossReview:
  - {field: outcome.accept, change: "none: NOT_DEPLOYABLE confirmed", evidence: "config.yml:373 registers a critical clickhouse ready check beside db and redis (lines 370-376); compose:46 clickhouse image"}
  - {field: database, change: "none: mysql + clickhouse confirmed", evidence: "docker-compose.yaml:181 and :190"}
  - {field: redis/workers/storage/port/healthPath, change: "none: confirmed", evidence: "config.yml:353,370; Dockerfile:89"}
  - {field: all, change: verified, evidence: "22 citations checked"}
