id: new-218
repository: opensearch-project/OpenSearch
commit: ca1a3adaa616a8fe513762b7886bce72ac16bdf3
summary: >
  OpenSearch is a Java distributed search and analytics engine (an Elasticsearch fork), built with Gradle. It is a
  datastore server that serves a REST API on 9200 and a transport protocol on 9300, and keeps its indices in a data
  directory on durable disk. The only product Dockerfile, distribution/docker/src/docker/Dockerfile, is a Groovy
  template that needs a Gradle-built opensearch tar.gz, so no Dockerfile builds the server from source with docker build.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The repository is a search-engine datastore server. It needs a durable data directory (indices under data/), which
    Fargate does not give a task, and OpenSearch is named as unsupported in the Deployz MVP. The Dockerfile is a template
    with placeholders and depends on a Gradle-built archive.
dockerfile:
  accept: []
  reject:
    - {path: distribution/docker/src/docker/Dockerfile, reason: "Groovy template (${base_image}, ${source_opensearch}); needs the Gradle-built opensearch tar.gz"}
    - {path: test/fixtures/azure-fixture/Dockerfile, reason: "test fixture"}
    - {path: test/fixtures/gcs-fixture/Dockerfile, reason: "test fixture"}
    - {path: test/fixtures/krb5kdc-fixture/Dockerfile, reason: "test fixture"}
