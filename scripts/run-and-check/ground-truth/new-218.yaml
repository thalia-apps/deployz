blockers:
  expected:
    - "OpenSearch is a search datastore server and is outside the Deployz MVP support list"
    - "The node needs a durable data directory for indices; Fargate task storage is ephemeral"
    - "The only product Dockerfile is a template that needs a Gradle-built opensearch tar.gz, not repository source"
  mustNot:
    - "Port 9200 must not be treated as a failure: it is the REST API port; the datastore role and the storage decide the outcome"
    - "A database or Redis must not be reported as required: OpenSearch is the datastore"
    - "Test fixture Dockerfiles must not be treated as application images"
vendorQuestions:
  legitimate:
    - "Is OpenSearch the search backend for another application? It is better run as Amazon OpenSearch Service, outside this deployment"
  unnecessary:
    - "Which port? (9200)"
    - "Which health path? (/_cluster/health)"
    - "Is a database needed? (no)"
traps:
  - "distribution/docker/src/docker/Dockerfile has template placeholders and is not valid Dockerfile syntax by itself (Dockerfile:22, :49)"
  - "Port 9300 is the node-to-node transport protocol, not HTTP (Dockerfile:103)"
  - "The image sets network.host 0.0.0.0, so the bind address is not a problem (config/opensearch.yml:2)"
openQuestions:
  - "The OPENSEARCH_JAVA_OPTS name comes from documented container usage and was not read in the source"
crossReview:
  - {field: outcome.accept, change: "none: [NOT_DEPLOYABLE] confirmed against docs/product/mvp-scope.md and the fix-class policy", evidence: "summary and blockers.expected of this file"}
  - {field: all, change: verified, evidence: "13 citations checked against the pinned commit by script (path, line, quote)"}
