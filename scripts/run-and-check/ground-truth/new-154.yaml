blockers:
  expected:
    - "No Dockerfile builds DbGate from the repo archive: docker/Dockerfile copies a CI-prepared context (bundle.js, public, plugins) that is not in git"
  mustNot:
    - "Missing database must not be a blocker: DbGate has no own database; the databases it manages are user targets"
    - "PostgreSQL, MySQL, MongoDB, Redis, Oracle and SQL Server in the plugins must not be reported as required services"
    - "Redis must not be required: dbgate-plugin-redis is only a client driver"
    - "Local data in /root/.dbgate must not block by itself: ephemeral, and CONNECTIONS env can define connections"
    - "The Electron app in app/ must not be chosen as the deployable unit"
vendorQuestions:
  legitimate:
    - "Which Dockerfile should Deployz use? The repo has none that builds from source (vendor must supply a build stage for web, api and plugins)"
    - "Should saved connections persist? Local disk is ephemeral on Fargate; predefine connections with the CONNECTIONS env variable"
  unnecessary:
    - "Which port? (3000)"
    - "Which database? (none needed)"
    - "Health path? (/health)"
    - "Who runs migrations? (none)"
traps:
  - "Two docker/ Dockerfiles look production-ready but COPY a context filled by CI (docker/Dockerfile:14, build-docker.yaml:71-85)"
  - "node:22-slim base and `COPY . .` look like a source build, but the repo root is not the context and docker/ has no source (docker/Dockerfile:1,14)"
  - "The many database plugins (postgres, mysql, mongo, redis, oracle, mssql, clickhouse) are client drivers, not dependencies (plugins/)"
  - "STORAGE_DATABASE reads like an app database requirement but is Premium-only; community maps it to denyall (authProvider.js:309-310)"
  - "Open by default: no auth unless LOGIN and PASSWORD are set (authProvider.js:294)"
  - "e2e-tests and test/ Dockerfiles are test containers"
openQuestions:
  - "Whether the yarn workspaces build (build:web, build:api, plugins, install:drivers:docker) works in one multi-stage Dockerfile from the archive; not tested"
