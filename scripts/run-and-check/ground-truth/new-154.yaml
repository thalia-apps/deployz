id: new-154
repository: dbgate/dbgate
commit: 7aa44d13e44a715fb7235db47e047e1ac0c981fb
summary: >
  DbGate is a multi-database web and desktop client (Node.js Express API in packages/api, Svelte web UI in
  packages/web, Electron app in app/). The Docker web edition serves UI and API from one Node process on port 3000.
  The repo Dockerfiles do not build from source: docker/Dockerfile does `COPY . .` inside the docker/ directory, which
  CI fills with a built bundle.js, web public files and plugins (yarn prepare:docker). DbGate connects to user
  databases (Postgres, MySQL, MongoDB, Oracle and others); those are managed targets, not its own database. Its own
  state (saved connections, settings, files) lives on local disk in ~/.dbgate; STORAGE_DATABASE (its metadata DB) is
  Premium-only and is mapped to a deny-all auth provider in the community code.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, NOT_DEPLOYABLE]
  reason: >
    The architecture fits Deployz (one Node process, port 3000, /health without auth, no own database). The repo has no
    Dockerfile that builds the app from the repo archive: both Dockerfiles copy a CI-built context (bundle.js, public,
    plugins). A new multi-stage Dockerfile that runs the yarn build is needed (DEPLOYABLE_WITH_CHANGES). A strict
    read of "no prebuilt artefacts" gives NOT_DEPLOYABLE. The app has no authentication unless LOGIN and PASSWORD are set,
    and saved connections in ~/.dbgate are lost on restart unless the CONNECTIONS env variable defines them.
