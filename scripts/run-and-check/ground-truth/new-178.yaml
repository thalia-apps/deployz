id: new-178
repository: ToolJet/ToolJet
commit: 338ac6f1e851ee5c737069fab36e918a4524cdcd
summary: >
  ToolJet is a low-code internal-tool builder: a NestJS (Node) server that also serves the built React frontend
  (SERVE_CLIENT), plus a plugin bundle. docker/ce-production.Dockerfile builds plugins, frontend and server from source
  in a multi-stage build and bundles a local Redis (bound to 127.0.0.1 and started by the entrypoint). The image has
  no CMD: the entrypoint waits for PostgreSQL, runs db:setup:prod and then executes the given command, which the
  compose file sets to npm run start:prod. The server listens on PORT (default 3000), health at /api/health. It needs
  two PostgreSQL databases on the same server (the app database and the ToolJet Database, TOOLJET_DB). The ToolJet
  Database feature is served through a separate PostgREST process (postgrest/postgrest image in the compose file),
  reached with PGRST_HOST. Other docker files are EE, cloud, preview or dev variants.
outcome:
  accept: [DEPLOYABLE_WITH_CHANGES, DEPLOYABLE]
  reason: >
    The community-edition Dockerfile builds from source and runs one web service on one HTTP port with PostgreSQL 16
    and (bundled or Valkey) Redis; the migration runs in the entrypoint. The image has no default start command, so the
    start command must be set to npm run start:prod (or a CMD added). The ToolJet Database feature needs a PostgREST
    sidecar that Deployz does not run, so that feature is unavailable; the app builder, data sources and users still
    work. DEPLOYABLE_WITH_CHANGES is the primary answer because of the missing CMD and the non-default Dockerfile path.
