    - {path: docker/LTS/cloud/cloud-production.Dockerfile, reason: "ToolJet Cloud image"}
    - {path: docker/client.Dockerfile, reason: "frontend-only image"}
    - {path: docker/client.Dockerfile.dev, reason: "development image"}
  target: null
