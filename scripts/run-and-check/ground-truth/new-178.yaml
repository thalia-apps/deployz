blockers:
  expected:
    - "The image has no default command: set the start command to npm run start:prod (the entrypoint runs the database setup first)"
    - "The ToolJet Database feature needs a PostgREST service (PGRST_HOST); Deployz runs one image, so that feature is not available"
    - "A second PostgreSQL database (TOOLJET_DB) is needed on the same server"
  mustNot:
    - "The bundled Redis must not be reported as a missing external service: the entrypoint starts it inside the container"
    - "docker-compose.yaml services (plugins, client, postgrest, redis) must not be counted as separate required deployments: they are the development stack"
    - "Python or Oracle client libraries in the image must not be reported as extra services"
    - "A separate migration task must not be required: the entrypoint runs db:setup:prod before start"
vendorQuestions:
  legitimate:
    - "Is the ToolJet Database feature needed? It needs PostgREST, which Deployz does not run"
    - "Should a separate Redis (Valkey) be used instead of the one bundled in the container?"
  unnecessary:
    - "Which port? (3000, or PORT)"
    - "Health path? (/api/health)"
    - "Which Dockerfile? (docker/ce-production.Dockerfile)"
traps:
  - "docker-compose.yaml at the root is a development stack (dev Dockerfiles, bind mounts, client on 8082, server on 3000) (docker-compose.yaml:11-64)"
  - "deploy/docker/docker-compose.yaml uses the published tooljet/tooljet-ce image and port 80 with PORT=80, not the repository build (deploy/docker/docker-compose.yaml:8, 15)"
  - ".env.example sets TOOLJET_HOST to localhost:8082, the dev client port (.env.example:10)"
  - "ce-production.Dockerfile has no CMD; without a start command the entrypoint runs the DB setup and exits (docker/ce-entrypoint.sh:43)"
  - "The image runs Redis on 127.0.0.1 inside the container; with several tasks each has its own Redis"
  - "Many other Dockerfiles exist (EE, cloud, preview, cypress) and only ce-production builds the community edition for production"
  - "PostgREST is optional for startup: deploy/docker/docker-compose.yaml marks its service as needed only when ToolJet DB is used (line 17), and the proxy falls back to http://localhost:3001 (postgrest-proxy.service.ts:120)"
  - "db:create also creates a sample database (SAMPLE_DB), so the database user must be able to run createdb (server/scripts/create-database.ts:42, 70)"
  - "The server listens on '::'(IPv6 any), which also accepts IPv4 on Linux (server/src/main.ts:161)"
openQuestions:
  - "Whether the missing PostgREST sidecar makes the app NOT_DEPLOYABLE for a vendor who needs ToolJet Database"
crossReview:
  - {field: image / redis, change: "none: confirmed multi-process image. The entrypoint starts a daemonized redis-server bound to 127.0.0.1 inside the container (ce-production.Dockerfile:126-129), then runs the DB setup and execs the command. One task works; REDIS_HOST can point to Valkey instead", evidence: "docker/ce-entrypoint.sh:4-8"}
  - {field: database, change: "none: two databases are required because create-database.ts throws if TOOLJET_DB is empty; added evidence", evidence: "server/scripts/create-database.ts:41, 81-87"}
  - {field: blockers, change: "none: PostgREST is not needed to start; only the ToolJet Database feature uses it. Not a blocker for the core flow. Added a trap", evidence: "deploy/docker/docker-compose.yaml:17; postgrest-proxy.service.ts:120"}
  - {field: outcome.accept, change: "none: both outcomes kept (no CMD means the start command is set in Deployz, which is settings only; DEPLOYABLE_WITH_CHANGES if a CMD must be added)", evidence: "ce-production.Dockerfile:141; ce-entrypoint.sh:43"}
  - {field: all, change: verified, evidence: "20 citations checked"}
