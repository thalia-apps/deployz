    - {name: ROOT_URL, secret: false, buildTime: false, note: "public URL of the app; the compose default is http://localhost"}
  optional: [MONGO_URL_FILE, MONGO_OPLOG_URL, WEKAN_DB, WRITABLE_PATH, S3, S3_SECRET_KEY_FILE, MAIL_URL, MAIL_FROM, WITH_API, PORT, OAUTH2_ENABLED, LDAP_ENABLE, TRUSTED_URL, BROWSER_POLICY_ENABLED]
  buildTime: [VERSION]
  evidence:
    - {path: docker-compose.yml, line: 232, quote: "- ROOT_URL=http://localhost  #   <=== using only at same laptop/desktop where Wekan is installed"}
    - {path: Dockerfile, line: 41, quote: "ARG VERSION=12.74"}
blockers:
  expected:
    - "MongoDB is the required database (MONGO_URL); Deployz supports only PostgreSQL and MySQL"
    - "No Dockerfile builds the app from the repository: the root Dockerfile downloads a prebuilt release bundle from GitHub releases"
  mustNot:
    - "The FerretDB PostgreSQL compose files must not be read as PostgreSQL support: FerretDB is a separate MongoDB-compatible server, and v2 needs the DocumentDB PostgreSQL image"
    - "The bundled FerretDB with SQLite must not be read as a supported embedded database: it is a second background process with SQLite on ephemeral local disk"
    - "Attachments must not be the main blocker: S3 is supported through the S3 setting"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (8080)"
    - "Is Redis needed? (no)"
traps:
  - "docker-compose-ferretdb-v1-postgresql.yml and docker-compose-ferretdb-v2-postgresql.yml mention PostgreSQL, but WeKan still speaks only the MongoDB protocol through a FerretDB service (docker-compose-ferretdb-v2-postgresql.yml:24)"
  - "The root Dockerfile looks like a normal app image but its first stage downloads the release zip (Dockerfile:97)"
  - "The entrypoint can start FerretDB in the background in the same container (releases/ferretdb/wekan-entrypoint.sh:218), which is a multi-process image with SQLite on local disk"
  - "The repository has many platform files (snapcraft.yaml, sandstorm-pkgdef.capnp, scalingo.json, app.json) that are not build recipes for Deployz"
  - "A CLAUDE.md and AGENTS.md in the repository are contributor notes, not deployment instructions"
openQuestions:
  - "No dedicated HTTP health route was confirmed; / is assumed"
crossReview:
  - {field: dockerfile.reject, change: "none: the bundle stage downloads and checksums the release zip, and the final stage copies only that bundle and the entrypoint scripts", evidence: "Dockerfile:96-104,408,415"}
  - {field: outcome.accept, change: "none: MongoDB through MONGO_URL with only FerretDB alternatives, plus a prebuilt bundle; same case as new-183", evidence: "releases/ferretdb/wekan-entrypoint.sh:9-11,112; reasons.txt new-183"}
  - {field: all, change: verified, evidence: "20 citations checked"}
