id: new-255
repository: wekan/wekan
commit: 696a1a2c8af22c04996a34690ed99904e7bc2753
summary: >
  WeKan is a Meteor (Node.js) kanban board. The database is MongoDB through MONGO_URL. The alternative is FerretDB, a
  MongoDB-compatible server: either a separate container (on SQLite, PostgreSQL or the FerretDB DocumentDB PostgreSQL
  image), or a FerretDB binary that the entrypoint starts in the background in the same container with SQLite files under
  /data/files/db. The root Dockerfile does not build from source: it downloads a release zip
  (wekan-<version>-<arch>.zip) from GitHub releases and copies the prebuilt bundle. The app listens on 8080. Attachments
  and avatars go to WRITABLE_PATH (/data/files) or to S3 through the S3 JSON setting.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    The only datastore is MongoDB (MONGO_URL), which is outside the MVP. The FerretDB options do not help: a separate
    FerretDB container is an extra service, the FerretDB v2 PostgreSQL mode needs the DocumentDB extension image (not RDS),
    and the bundled FerretDB runs as a second background process with SQLite on local disk. Also no Dockerfile builds the
    app from the repository: the root Dockerfile downloads a prebuilt release bundle. Same case as new-183 (Rocket.Chat:
    Meteor, MongoDB, prebuilt bundle).
