  reject:
    - {path: Dockerfile, reason: "downloads the prebuilt release zip wekan-${VERSION}-${WEKAN_ARCH}.zip from GitHub releases; it does not build the repository source"}
    - {path: .devcontainer/Dockerfile, reason: "development container"}
    - {path: .gitpod.Dockerfile, reason: "Gitpod development workspace image"}
  target: null
  context: .
  evidence:
    - {path: Dockerfile, line: 96, quote: "WEKAN_ZIP=\"wekan-${VERSION}-${WEKAN_ARCH}.zip\""}
    - {path: Dockerfile, line: 97, quote: "WEKAN_ZIP_URL=\"https://github.com/wekan/wekan/releases/download/v${VERSION}/${WEKAN_ZIP}\""}
    - {path: Dockerfile, line: 133, quote: "mv bundle /out/build"}
