    - {name: NEXTAUTH_SECRET, secret: true, buildTime: false, note: "required when NODE_ENV=production"}
    - {name: NEXTAUTH_URL, secret: false, buildTime: false, note: "public frontend URL"}
    - {name: NEXT_PUBLIC_BACKEND_URL, secret: false, buildTime: true, note: "public URL of the second service (backend); the browser calls it directly"}
    - {name: REWORKD_PLATFORM_OPENAI_API_KEY, secret: true, buildTime: false, note: "LLM key; a vendor or customer input"}
  optional: [REWORKD_PLATFORM_DB_CA_PATH, GOOGLE_CLIENT_ID, GITHUB_CLIENT_ID, DISCORD_CLIENT_ID, REWORKD_PLATFORM_SERP_API_KEY]
  buildTime: [NEXT_PUBLIC_BACKEND_URL]
  evidence:
