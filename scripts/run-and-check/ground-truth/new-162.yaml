id: new-162
repository: reworkd/AgentGPT
commit: 18b073ab05b2902e1d052c3d2799786d8623b5e5
summary: >
  AgentGPT is two services plus a database: a Next.js 13 frontend (next/, NextAuth, Prisma, MySQL) and a separate
  FastAPI backend (platform/, port 8000, MySQL through aiomysql). The browser calls the backend directly at
  NEXT_PUBLIC_BACKEND_URL (a build-time public URL), so a deploy needs two public HTTP endpoints. The only frontend
  Dockerfile runs `npm run dev` with a wait-for-db entrypoint and a hard-coded MySQL host. The repo ships no
  single-image build of the product.
outcome:
  # Policy (docs/ai-analysis.md, fix classes): a second service and a development Dockerfile are CODE_CHANGE, so outcome 2 is also correct.
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    Two separate services (frontend on 3000, backend on 8000) that the browser must both reach. Deployz serves one
    container with one ALB port. next/Dockerfile is a development runner (CMD npm run dev, an entrypoint that runs
    prisma migrate and db push and waits for host agentgpt_db:3307). MySQL is a supported Deployz engine, but the
    two-service topology and the browser-to-backend call are not supported.
dockerfile:
  accept: []
  reject:
    - {path: next/Dockerfile, reason: "development image: CMD npm run dev, entrypoint waits for agentgpt_db:3307 and runs prisma migrate and db push; frontend only"}
    - {path: platform/Dockerfile, reason: "FastAPI backend only (python -m reworkd_platform, reload default true); a second service"}
    - {path: db/Dockerfile, reason: "mysql:8.0 image with setup.sql; a database container, not the app"}
  target: null
  context: .
  evidence:
    - {path: next/Dockerfile, line: 39, quote: "CMD [\"npm\", \"run\", \"dev\"]"}
    - {path: next/Dockerfile, line: 36, quote: "ENTRYPOINT [\"sh\", \"/entrypoint.sh\"]"}
    - {path: next/entrypoint.sh, line: 16, quote: "./wait-for-db.sh agentgpt_db 3307"}
    - {path: platform/Dockerfile, line: 33, quote: "CMD [\"/usr/local/bin/python\", \"-m\", \"reworkd_platform\"]"}
    - {path: docker-compose.yml, line: 4, quote: "frontend:"}
    - {path: docker-compose.yml, line: 17, quote: "platform:"}
runtime: {accept: [node, python]}
