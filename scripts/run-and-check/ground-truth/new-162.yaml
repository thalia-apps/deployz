    - {path: next/src/env/schema.mjs, line: 20, quote: "NEXTAUTH_SECRET: requiredForProduction(),"}
    - {path: next/src/env/schema.mjs, line: 70, quote: "NEXT_PUBLIC_BACKEND_URL: z.string().url().default(\"http://localhost:8000\"),"}
    - {path: platform/reworkd_platform/settings.py, line: 56, quote: "openai_api_key: str = \"<Should be updated via env>\""}
blockers:
  expected:
    - "Two services: the Next.js frontend and the FastAPI backend; the browser calls the backend directly at NEXT_PUBLIC_BACKEND_URL, so two public endpoints are needed"
    - "The only frontend Dockerfile is a dev runner (npm run dev) with a compose-specific entrypoint (host agentgpt_db, port 3307)"
  mustNot:
    - "MySQL must not block: it is a supported Deployz engine"
    - "Kafka, Pusher and Pinecone must not be reported as required: all are optional settings"
vendorQuestions:
  legitimate:
    - "Can the backend be served on the frontend host (one origin)? The code uses an absolute NEXT_PUBLIC_BACKEND_URL"
  unnecessary:
    - "Which database? (MySQL)"
    - "Health path of the backend? (/api/monitoring/health)"
traps:
  - "Three Dockerfiles (next, platform, db): none builds the whole product, each is one piece (docker-compose.yml)"
  - "docker-compose.yml bind-mounts source and runs dev servers: not a production topology (docker-compose.yml:11-14, :26)"
  - "Backend default host is 127.0.0.1 and reload is true: it needs REWORKD_PLATFORM_HOST=0.0.0.0 and reload off (settings.py:43-46)"
  - "next/prisma has useMysql.sh and useSqlite.sh: the default schema.prisma is already mysql (schema.prisma:6)"
  - "Backend settings need the REWORKD_PLATFORM_ prefix (constants.py:1); frontend settings do not"
openQuestions:
  - "Whether the repository is archived: not provable from the source archive"
crossReview:
  - {field: outcome, change: "none: accept already has NOT_DEPLOYABLE and DEPLOYABLE_WITH_CHANGES (two services, dev-runner Dockerfile are CODE_CHANGE)", evidence: "next/Dockerfile; platform/Dockerfile; db/Dockerfile"}
  - {field: "port, healthPath, database", change: "none: backend /api/monitoring/health route exists (health_check), backend port 8000, MySQL for both services", evidence: "platform/reworkd_platform/web/api/monitoring/views.py:6"}
  - {field: all, change: verified, evidence: "26 citations checked"}
