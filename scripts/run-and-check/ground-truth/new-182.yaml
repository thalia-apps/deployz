  - {field: database, change: "removed mongodb from engines: default at this commit is CockroachDB (postgres wire), PostgreSQL via override; MongoDB is stale README text", evidence: "dev/docker-compose.yaml:55; dev/docker-compose.pg.yaml:10; README.md:230"}
  - {field: redis.status, change: "required -> optional: docker-compose.min.yaml lists redis among excluded services", evidence: "dev/docker-compose.min.yaml:4"}
  - {field: blockers.expected, change: "Elasticsearch softened (min stack drops it); Redpanda kept required", evidence: "dev/docker-compose.min.yaml:4; dev/.env:7 QUEUE_CONFIG=redpanda:9092"}
