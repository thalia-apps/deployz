id: new-182
repository: hcengineering/platform
commit: f292d165efa8603f2914f34f7c18e6f32fe15fcc
summary: >
  Huly Platform is a Rush monorepo (TypeScript, Svelte, Rust) for a project-management and collaboration suite. It runs
  as many separate services (pods): front, account, transactor, collaborator, fulltext, workspace, stats, datalake,
  hulylake, hulypulse, rekoni, print, sign, backup and more. Each pod has its own Dockerfile that copies a CI-built
  bundle. The dev stack needs CockroachDB (or PostgreSQL, or MongoDB), Redpanda (Kafka API), Elasticsearch,
  an S3-compatible object store (MinIO) and Redis. The README sends self-hosters to the separate huly-selfhost repository.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    Deployz runs one image as one web service. Huly needs more than ten distinct service images at runtime, plus Redpanda
    (Kafka) and Elasticsearch, which are outside the MVP. Every pod Dockerfile copies a pre-built bundle, so none builds
    from source. The pods are required parts of the product, not optional workers from one image.
dockerfile:
  accept: []
  reject:
    - {path: pods/server/Dockerfile, reason: "transactor pod: copies pre-built bundle/bundle.js onto hardcoreeng/base; one of many separate service images"}
    - {path: pods/front/Dockerfile, reason: "front pod: copies pre-built bundle.js and dist/ onto hardcoreeng/front-base"}
    - {path: dev/base-image/base.Dockerfile, reason: "base image for the pods, not an application"}
  target: null
  context: .
  evidence:
    - {path: pods/server/Dockerfile, line: 1, quote: "FROM hardcoreeng/base:v20250916"}
    - {path: pods/server/Dockerfile, line: 5, quote: "COPY bundle/bundle.js ./"}
    - {path: pods/front/Dockerfile, line: 6, quote: "COPY dist/ ./dist/"}
    - {path: README.md, line: 34, quote: "If you're primarily interested in self-hosting Huly without the intention to modify or contribute to its development, please use [huly-selfhost](https://github.com/hcengineering/huly-selfhost)."}
