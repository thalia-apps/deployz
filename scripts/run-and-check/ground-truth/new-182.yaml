blockers:
  expected:
    - "More than ten separate service images are required at runtime (front, transactor, account, collaborator, fulltext, workspace, stats, datalake and others); Deployz runs one image"
    - "Redpanda (Kafka API) is a required message broker (QUEUE_CONFIG=redpanda:9092); it stays in the minimal dev stack"
    - "Elasticsearch backs the fulltext pod (full-text search); the minimal dev stack drops it, so it is a search feature need, not the main blocker"
    - "CockroachDB (PostgreSQL wire protocol) is the default database at this commit; PostgreSQL 16 is an override (docker-compose.pg.yaml); MongoDB is stale README text only"
    - "No Dockerfile builds from source: every pod Dockerfile copies a CI-built bundle"
  mustNot:
    - "A single pod Dockerfile (pods/server or pods/front) must not be treated as the whole application"
    - "MinIO must not be the only reason for NOT_DEPLOYABLE: S3 would replace it"
    - "Redis alone must not be a blocker: docker-compose.min.yaml excludes it"
vendorQuestions:
  legitimate:
    - "Is there a single-image build of Huly? The repository ships one image per pod; huly-selfhost is a separate repository"
  unnecessary:
    - "Which port? (8080 in each pod)"
    - "Is Redis needed? (yes, in the dev stack)"
traps:
  - "pods/server/Dockerfile is the transactor, not the whole product, and it copies a CI-built bundle (pods/server/Dockerfile:5)"
  - "dev/docker-compose.yaml pulls hardcoreeng/* images from a registry, so it does not show how to build any of them"
  - "dev/docker-compose.min.yaml is a smaller dev stack but still lists several pods plus CockroachDB, Redpanda and MinIO"
  - "README mentions MongoDB, but the current dev compose file uses CockroachDB (dev/docker-compose.yaml:55)"
