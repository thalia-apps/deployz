    - {path: index.php, line: 119, quote: "$this->get('/login', '\\Shaarli\\Front\\Controller\\Visitor\\LoginController:index')->setName('login');"}
    - {path: application/front/ShaarliMiddleware.php, line: 49, quote: "return $response->withRedirect($this->container->basePath . '/install');"}
