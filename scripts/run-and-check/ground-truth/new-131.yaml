id: new-131
repository: shaarli/Shaarli
commit: 56fdb8e846ab9ba4256086e7d2fb0d5bd439c01a
summary: >
  Shaarli is a PHP bookmark manager with no SQL database: the bookmarks live in a flat PHP datastore file
  (data/datastore.php) and the settings and the hashed admin password in data/config.json.php, next to ban, log and
  thumbnail-cache files. The root Dockerfile builds from source (docs, Composer, Yarn build) and runs nginx and php-fpm as
  two supervised services under s6 (port 80). The data and cache directories are declared as VOLUMEs. The first request is
  redirected to /install, where the first visitor creates the admin account.
outcome:
  # Policy (docs/ai-analysis.md, fix classes): durable local state and an s6 multi-process image are CODE_CHANGE, so outcome 2 is also correct.
  accept: [NOT_DEPLOYABLE, DEPLOYABLE_WITH_CHANGES]
  reason: >
    The application stores all durable data in files under data/ and cache/ (no PostgreSQL or MySQL support), so every
    task restart on Fargate (ephemeral disk, no EFS) would delete the bookmarks, the admin account and the settings.
    The image also runs nginx and php-fpm as two long-running processes under s6, and the open /install page lets the
    first visitor claim the instance.
