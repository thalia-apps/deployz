blockers:
  expected:
    - "No database: bookmarks, users and settings are flat files in data/ (a persistent volume); Fargate disk is ephemeral and there is no EFS, so all data is lost on restart"
    - "The image runs nginx and php-fpm as two long-running services under s6 (several supervised processes)"
    - "The setup wizard at /install is open until the first admin is created, so the first visitor claims the instance"
  mustNot:
    - "Missing PostgreSQL or MySQL must not be a configuration gap that a setting can fix: the app has no SQL backend"
    - "Missing health path must not be a blocker by itself: /login is a public page"
    - "Missing environment variables must not be raised: the app has none"
    - "Redis, workers or queues must not be reported as needed"
vendorQuestions:
  legitimate: []
  unnecessary:
    - "Which port? (80)"
    - "Which database? (none: flat files)"
    - "Who runs migrations? (none)"
    - "Is a worker needed? (no)"
traps:
  - "Dockerfile builds the documentation, composer and yarn stages, so it looks like a clean source build, but the final image is nginx + php-fpm under s6 (Dockerfile:30-77)"
  - "VOLUME lines mark data and cache as volumes: that is the sign of required local state (Dockerfile:72-73)"
  - "docker-compose.yml adds a traefik reverse proxy with Let's Encrypt; Deployz does not need it (docker-compose.yml:36)"
  - "The repository contains empty data/, cache/, pagecache/ and tmp/ directories that look like placeholders but are runtime write targets"
  - "/ redirects to /install before setup, so a naive health check on / fails or follows the redirect (application/front/ShaarliMiddleware.php:46-49)"
openQuestions: []
crossReview:
  - {field: healthPath.accept, change: "[/login] -> [/login, /install, /]: before setup ShaarliMiddleware redirects every route except displayInstall and saveInstall to /install, so /login is a 302 then; /install answers 200 and / is the app root after setup", evidence: "application/front/ShaarliMiddleware.php:44-49 index.php:119"}
  - {field: outcome, change: "none: NOT_DEPLOYABLE (flat-file state, no SQL) and DEPLOYABLE_WITH_CHANGES (s6, nginx and php-fpm) are both already accepted", evidence: "Dockerfile:75 Dockerfile:77"}
  - {field: all, change: "verified", evidence: "26 citations checked"}
