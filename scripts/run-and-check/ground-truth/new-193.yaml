id: new-193
repository: apache/kafka
commit: 601492157a7e563b5cd4cdea8c9382302a1ea5f4
summary: >
  Apache Kafka is a distributed event streaming broker written in Java and Scala, built with Gradle. It is a datastore
  and message broker, not a web application. Clients talk to it over the Kafka binary protocol on TCP port 9092 (and a
  controller listener on 9093), not HTTP. A broker keeps its log segments in log.dirs on durable disk. The Dockerfiles
  in docker/ package an already-released kafka.tgz; none builds the broker from the repository source.
outcome:
  accept: [NOT_DEPLOYABLE]
  reason: >
    Kafka is a message broker server. Its clients use the Kafka binary protocol on 9092 (not HTTP), which the ALB cannot
    route, and the broker needs a durable data directory (log.dirs, /var/lib/kafka/data in the image) that Fargate does
    not give a task. Kafka is also named as unsupported in the Deployz MVP. No Dockerfile builds the broker from source:
    docker/jvm/Dockerfile copies or downloads a release kafka.tgz.
dockerfile:
  accept: []
  reject:
    - {path: docker/jvm/Dockerfile, reason: "packages a released kafka.tgz (COPY *kafka.tgz or wget of kafka_url); does not build from repository source"}
    - {path: docker/native/Dockerfile, reason: "builds a GraalVM native image from a released kafka.tgz, not from repository source"}
    - {path: docker/docker_official_images/3.7.0/jvm/Dockerfile, reason: "frozen Docker Official Image recipe for release 3.7.0; downloads kafka.tgz"}
    - {path: tests/docker/Dockerfile, reason: "ducktape system-test node image (ssh server, test tools), not a production image"}
  target: null
  context: docker/jvm
  evidence:
    - {path: docker/jvm/Dockerfile, line: 31, quote: "COPY *kafka.tgz kafka.tgz"}
    - {path: docker/jvm/Dockerfile, line: 58, quote: "EXPOSE 9092"}
    - {path: docker/jvm/Dockerfile, line: 111, quote: "VOLUME [\"/etc/kafka/secrets\", \"/var/lib/kafka/data\", \"/mnt/shared/config\"]"}
runtime: {accept: [java]}
