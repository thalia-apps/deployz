blockers:
  expected:
    - "Kafka is a message broker; clients use the Kafka binary protocol on TCP 9092, not HTTP, so an ALB cannot serve it"
    - "The broker needs a durable log directory (log.dirs); Fargate task storage is ephemeral"
    - "No Dockerfile builds the broker from repository source; docker/jvm/Dockerfile needs a released kafka.tgz"
  mustNot:
    - "Port 9092 must not be treated as a web port to expose on the ALB"
    - "A database or Redis must not be reported as required: Kafka is the datastore"
    - "tests/docker/Dockerfile must not be treated as the application image"
vendorQuestions:
  legitimate:
    - "Is Kafka the message backbone for another application? A Kafka cluster is better run as a managed service (for example Amazon MSK), outside this deployment"
  unnecessary:
    - "Which port? (9092)"
    - "Is a database needed? (no)"
    - "Which Dockerfile? (none builds from source)"
traps:
  - "docker/jvm/Dockerfile looks like a production Dockerfile but needs a kafka.tgz release archive or a kafka_url build argument (docker/jvm/Dockerfile:31)"
  - "config/server.properties advertises localhost:9092, which is unreachable from other hosts (config/server.properties:44)"
  - "The default log.dirs is under /tmp, which is lost when the task stops (config/server.properties:73)"
  - "tests/docker/Dockerfile is a ducktape test image with sshd, not a broker image"
openQuestions:
  - "The KAFKA_* environment names of the official image were not read in detail"
