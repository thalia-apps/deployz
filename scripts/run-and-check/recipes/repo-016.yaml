notes:
  - Root Dockerfile. It starts from the floating image outlinewiki/outline-base (ARG BASE_IMAGE), so the built code can differ from the pinned commit. Dockerfile.base builds that base image but is not used here.
  - SECRET_KEY must be 64 hex characters, and UTILS_SECRET must not be empty (server/env.ts:67-81).
  - URL is required (server/env.ts:225-240). Deployz does not derive a plain URL variable (OWN_URL_NAME_REGEX in packages/analysis/src/detectors.ts), so the vendor gives the app URL (deploymentUrl).
  - "Vendor inputs URL, FORCE_HTTPS, FILE_STORAGE, WEB_CONCURRENCY: taken from docs/testing/repository-deployment/deploy-config.yaml (the values the vendor set on the real-AWS run; ${DEPLOYZ_APP_URL} becomes deploymentUrl)."
