  - deploy-config.yaml also sets DB_CLIENT=pg, DB_SSL and ADMIN_EMAILS. They are not given here, because the app starts without them (server/env.js defaults to better-sqlite3).
  - "Vendor inputs DB_CLIENT, DB_SSL, ADMIN_EMAILS: taken from docs/testing/repository-deployment/deploy-config.yaml (the values the vendor set on the real-AWS run; ${DEPLOYZ_APP_URL} becomes deploymentUrl)."
