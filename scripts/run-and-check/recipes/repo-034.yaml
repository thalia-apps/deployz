databaseEngine: mysql
notes:
  - Root Dockerfile. docker-entrypoint.sh pings the database, runs flask db upgrade, then starts gunicorn on port 8000.
  - The image has only the PyMySQL driver (requirements.txt), and CTFd/config.py defaults the driver to mysql+pymysql. So MySQL is given. SECRET_KEY is created by the app when it is not set (CTFd/config.py gen_secret_key).
