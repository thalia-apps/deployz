# Runs the Docker run-and-check exam (scripts/run-and-check) on x86_64
# runners: one matrix job per recipe, so a full exam takes about as long as
# its slowest repository. It starts only by hand (workflow_dispatch) and
# uploads one small JSON result per recipe. Fetch the results with
# `pnpm runcheck:fetch --run <run id>`. Only the analyse-ai job reads secrets
# (the AI gateway); it reads repository files as data and runs no repository
# code. The jobs that build and run repository code get no secrets.
name: runcheck-exam

on:
  workflow_dispatch:
    inputs:
      mode:
        description: observe (write observations), full (run the analysed settings twice) or analyse-ai (the AI engine Analysis)
        required: true
        type: choice
        options: [observe, full, analyse-ai]
      repos:
        description: Recipe ids separated by spaces, or "all"
        required: true
        default: all
        type: string
      analysis:
        description: Folder under scripts/run-and-check/analyses to read (full) or to write (analyse-ai), for example rules@0fc073b8
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select recipes
        id: ids
        env:
          MODE: ${{ inputs.mode }}
          REPOS: ${{ inputs.repos }}
          ANALYSIS: ${{ inputs.analysis }}
        run: |
          cd scripts/run-and-check
          if [[ "$MODE" == full ]]; then
            [[ "$ANALYSIS" =~ ^[A-Za-z0-9_.@-]+$ && -d "analyses/$ANALYSIS" ]] || { echo "invalid analysis folder"; exit 1; }
          fi
          if [[ "$MODE" == analyse-ai ]]; then
            [[ "$ANALYSIS" =~ ^ai@[A-Za-z0-9_.@-]+$ ]] || { echo "analyse-ai needs an output folder named ai@..."; exit 1; }
          fi
          if [[ "$REPOS" == all ]]; then
            ids=$(ls recipes/*.yaml | xargs -n1 basename | sed 's/\.yaml$//')
          else
            ids=$REPOS
          fi
          for id in $ids; do
            [[ "$id" =~ ^(repo-[0-9]{3}|new-[0-9]+|F[0-9]{1,2})$ ]] || { echo "invalid id $id"; exit 1; }
          done
          echo "ids=$(printf '%s\n' $ids | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  analyse:
    needs: plan
    if: inputs.mode == 'analyse-ai'
    runs-on: ubuntu-latest
    # An uncached snapshot reads its files from raw.githubusercontent.com; an API fallback can wait for the rate limit reset.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=./packages/* --filter=@deployz/api

      # The pinned commit never changes, so its GitHub tree and files are
      # cached: later runs make no GitHub API calls (the job token allows
      # 1000 requests per hour, which one full exam can use up). A branch
      # restores the newest snapshot of its own runs or of main (the prefix
      # matches every run's key). A run that fetched new files saves them under
      # its own key.
      - name: Restore the GitHub snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/run-and-check/.runs/snapshot-cache
          key: runcheck-snapshot-${{ matrix.id }}-${{ hashFiles(format('scripts/run-and-check/recipes/{0}.yaml', matrix.id)) }}-${{ github.run_id }}
          restore-keys: runcheck-snapshot-${{ matrix.id }}-${{ hashFiles(format('scripts/run-and-check/recipes/{0}.yaml', matrix.id)) }}

      - name: Count the cached snapshot files
        id: cached
        run: echo "files=$(find scripts/run-and-check/.runs/snapshot-cache -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: AI engine Analysis
        env:
          ID: ${{ matrix.id }}
          ANALYSIS: ${{ inputs.analysis }}
          GITHUB_TOKEN: ${{ github.token }}
          AI_GATEWAY_BASE_URL: ${{ secrets.AI_GATEWAY_BASE_URL }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm runcheck:analyse --engine ai --repo "$ID" --out "scripts/run-and-check/analyses/$ANALYSIS"

      - name: Check for newly fetched snapshot files
        id: fetched
        if: always()
        env:
          BEFORE: ${{ steps.cached.outputs.files }}
        run: |
          after=$(find scripts/run-and-check/.runs/snapshot-cache -type f 2>/dev/null | wc -l)
          echo "new=$([[ "$after" -gt "${BEFORE:-0}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save the GitHub snapshot
        if: always() && steps.fetched.outputs.new == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/run-and-check/.runs/snapshot-cache
          key: runcheck-snapshot-${{ matrix.id }}-${{ hashFiles(format('scripts/run-and-check/recipes/{0}.yaml', matrix.id)) }}-${{ github.run_id }}

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runcheck-analysis-${{ inputs.analysis }}-${{ matrix.id }}
          path: scripts/run-and-check/analyses/${{ inputs.analysis }}/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 14

  run:
    needs: plan
    if: inputs.mode != 'analyse-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # The shared runner IPs exceed the ECR Public anonymous data limit.
      RUNCHECK_LIBRARY_REGISTRY: docker.io/library
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=./packages/* --filter=@deployz/api

      - name: Preflight
        run: pnpm runcheck:preflight

      - name: Observe
        if: inputs.mode == 'observe'
        env:
          ID: ${{ matrix.id }}
        run: pnpm runcheck:observe --repo "$ID" --force

      - name: Full run
        if: inputs.mode == 'full'
        env:
          ID: ${{ matrix.id }}
          ANALYSIS: ${{ inputs.analysis }}
        run: pnpm runcheck:full --repo "$ID" --analysis "scripts/run-and-check/analyses/$ANALYSIS" --force

      - name: Upload observation
        if: always() && inputs.mode == 'observe'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runcheck-observe-${{ matrix.id }}
          path: scripts/run-and-check/observations/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full run
        if: always() && inputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runcheck-full-${{ inputs.analysis }}-${{ matrix.id }}
          path: scripts/run-and-check/.runs/full/${{ inputs.analysis }}/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 14
